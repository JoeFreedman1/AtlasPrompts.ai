he current limits in Depop's help pages. Free cheat sheet in bio.\" | On screen: \"Free cheat sheet: link in bio\"", "onscreen": "Denim jacket for Depop, start to finish\nExample brief (invented item)\nFirst line = your title\nMeasurements. Flaws named. Postage.\n5 hashtags, all relevant\nExample output only\nFree cheat sheet: link in bio", "caption": "Vintage denim jacket for Depop, with five hashtags and not one more.\n\nExample output from our Depop prompt (invented item):\n\n\"Levi's mid-wash denim trucker jacket, men's M, relaxed boxy fit.\nPit to pit 58cm, length 64cm.\nGood vintage condition: light fraying on both cuffs (photo 4), no rips or stains.\nPosted within 2 working days.\n#levis #denimjacket #truckerjacket #vintagedenim #90sdenim\"\n\nWhy it works: the first line does the job of a title, measurements answer the question buyers ask most, and the flaw is named with its photo. \"Vintage\" and \"90s\" are earned: the brief says the care label is dated 1996.\n\nDepop's help pages say you can use up to five hashtags and to keep them relevant. Check the current rule before you list. Save this, and get the free UK Listing Cheat Sheet from the link in bio.", "hashtags": "#depopseller #depoptips #vintagedenim #resellinguk", "visuals": "Screen recording of a free AI chat tool on a phone (screen mirrored or recorded natively), cropped to the chat. Paste the invented brief, then the Depop description prompt, then hold on the output. Label Yellow #F2C84B highlight on the first line, the measurements, the flaw line and the five hashtags in turn. Blur the account name, avatar, chat history and status bar notifications. Stock cutaways (Pexels): \"denim jacket flat lay\", \"denim jacket on hanger\", \"frayed denim close up\", \"tape measure denim\". Hands-only at most. No Levi's logo or red tab close-ups. Only use \"vintage\" and \"90s\" in the real post if the seller's brief gives a date or evidence for the era. Text overlays in Archivo 800, Ink #1F2A44 on Cream #FAF6EF cards with a kraft #C9A27E border. Corner tag: \"Example item\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P48": {"id": "P48", "title": "A handmade candle holder for Etsy", "format": "Walkthrough (carousel)", "best": "Instagram carousel, Pinterest, TikTok photo mode", "length": "8 slides", "cta": "Soft (free cheat sheet)", "hook": "\"One tealight holder, 13 Etsy tags, every one counted. The longest is exactly 20.\"", "script": "1. Slide 1: \"One tealight holder, 13 Etsy tags, every one counted. The longest is exactly 20.\"\n2. Slide 2: \"The example brief (invented): handmade stoneware tealight holder, speckled cream glaze, wheel thrown, 8cm wide, 6cm tall, fits a standard tealight.\"\n3. Slide 3: \"The title (111 of 140 characters): Handmade Ceramic Tealight Holder, Speckled Cream Glaze, Small Wheel Thrown Pottery Candle Holder, Gift for Home\"\n4. Slide 4: \"Readable first, keywords second. The first few words say exactly what it is.\"\n5. Slide 5: \"Tags 1 to 7: ceramic tealight, tealight holder, candle holder, pottery gift, speckled glaze, wheel thrown pottery, handmade ceramics\"\n6. Slide 6: \"Tags 8 to 13: neutral decor, small pottery, housewarming gift, minimalist decor, stoneware, mantelpiece decor\"\n7. Slide 7: \"In the description: size, what fits, care, and a safety line. 'Never leave a lit candle unattended.' No 'fireproof' claims you have not tested.\"\n8. Slide 8: \"Etsy's limits can change: check the help pages. Save this, and get the free cheat sheet in bio.\"", "onscreen": "13 tags. 20 characters. No duplicates\nExample brief (invented item)\nTitle: 111 of 140 characters\nReadable first, keywords second\nTags 1 to 7\nTags 8 to 13\nSize, care, safety line. No untested claims\nSave this. Free cheat sheet in bio", "caption": "One handmade tealight holder, 13 Etsy tags, every one counted. No repeats, and the longest is exactly 20 characters.\n\nThis is an invented example to show what our Etsy prompts produce. The brief goes in (size, glaze, how it is made, what fits), and out come a readable title and 13 tags that each add something new.\n\nTwo things we always check:\n1. Every tag is 20 characters or fewer. \"wheel thrown pottery\" is exactly 20.\n2. Nothing claims what you have not tested. A safety line (\"never leave a lit candle unattended\") is fine. \"Fireproof\" is not, unless you can prove it.\n\nEtsy's title and tag limits are widely reported as 140 characters and 13 tags, so check the current rule in Etsy's help pages. Save this, and the free UK Listing Cheat Sheet is in our bio.", "hashtags": "#etsysellertips #etsyseo #etsyukseller #handmadeceramics #smallbusinessuk", "visuals": "Canva carousel, 1080 x 1350. Slide 1: parcel label card on Cream #FAF6EF, \"13\" in Label Yellow #F2C84B highlight. Slides 2 to 7: tags shown as kraft #C9A27E pill shapes with Ink #1F2A44 text and a small character count in Sold Green #1E7F55 beside each. Background photo on slides 1 and 7 from Pexels or Canva free: \"ceramic tealight holder\", \"handmade pottery candle\", \"speckled glaze pottery\" (item only, no people, no recognisable maker's mark). Slide 3: the title in JetBrains Mono inside a code-style box with \"111 / 140\". Label every example slide \"Example item\" in small Ink text top right. No Etsy logo.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P49": {"id": "P49", "title": "Pricing a boxed LEGO set from pasted sold comps", "format": "Walkthrough (screen recording plus AI voiceover)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "35 to 40 seconds", "cta": "Kit", "hook": "\"Sealed, opened or loose. Mix them up and your LEGO price is wrong before you start.\"", "script": "1. (0 to 3s) VO: \"Sealed, opened or loose. Mix them up and your LEGO price is wrong before you start.\" | On screen: \"Sealed. Opened. Loose. Not the same set.\"\n2. (3 to 9s) VO: \"AI chat tools do not know what sold last week. Ask with nothing to go on and you get a confident guess.\" | On screen: \"AI doesn't know last week's sold prices\"\n3. (9 to 16s) VO: \"So you do the looking. On eBay, search the set and turn on the sold items filter. Copy five to ten matches into your notes.\" | On screen: \"You find the sold prices\"\n4. (16 to 23s) VO: \"Paste them in. The first prompt tidies them into a table and marks each one good, partial or poor. Sealed sets out, loose sets out.\" | On screen: \"Tidy. Match. Drop the poor ones.\"\n5. (23 to 31s) VO: \"The second prompt uses only the good matches: a range, the middle price, a list price and your floor. With the sums shown.\" | On screen: \"Range. Median. List. Floor.\"\n6. (31 to 38s) VO: \"Example figures only, and no promise it sells at that price. Both prompts are in The Well Listed Kit. Link in bio.\" | On screen: \"Example figures. Kit: link in bio\"", "onscreen": "Sealed. Opened. Loose. Not the same set.\nAI doesn't know last week's sold prices\nYou find the sold prices\nTidy. Match. Drop the poor ones\nRange. Median. List. Floor\nExample figures only\nThe Well Listed Kit: link in bio", "caption": "Sealed, opened or loose: the same LEGO set sells at different prices in each state. Let AI do the maths on matching prices you found yourself.\n\nThe method (example item: a boxed, complete, opened LEGO City set with instructions):\n1. Search the set on eBay and turn on the \"Sold items\" filter.\n2. Copy 5 to 10 matching sold listings into your notes, with postage.\n3. Paste them into our \"tidy my comps\" prompt. It marks each as a good, partial or poor match. Sealed and loose sets get dropped.\n4. Paste the good matches into the pricing prompt for a range, median, list price and floor, with the working shown.\n\nNo scraping tools, no guesses, and no promise that it sells at that price.\n\nBoth prompts are in The Well Listed Kit (link in bio). Figures in the video are invented for illustration.", "hashtags": "#legoforsale #ebayuk #resellinguk #ebaysellertips #chatgptprompts", "visuals": "Screen recording of a free AI chat tool, cropped to the chat. Paste a block of invented, messy sold comps (typed by us, never copied from real listings) and run the tidy prompt, then the pricing prompt. Hold on the table output. Label Yellow #F2C84B boxes over the \"Match\" column and over the final \"List / expect / floor\" line. Returns Red #C4453B strike-through on a dropped \"sealed\" comp. Blur account name, avatar, history sidebar and browser tabs. For the \"search sold items\" step, show a simple Canva mock of a search filter toggle, not a real eBay screen with other sellers' listings. Stock cutaways (Pexels): \"lego bricks close up\", \"toy building blocks box\" (no faces, no LEGO logo shown large). Corner tag throughout: \"Example figures only\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P50": {"id": "P50", "title": "A week of typical buyer messages with 4 prompts", "format": "Walkthrough (slideshow with AI voiceover)", "best": "TikTok, Instagram Reels", "length": "35 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"Monday: 'Is this still available?' Tuesday: '£5?' A typical week of buyer messages, sorted with 4 prompts.\"", "script": "1. (0 to 4s) VO: \"Monday: is this still available? Tuesday: five pounds? A typical week of buyer messages, sorted with four prompts.\" | On screen: \"Mon: 'Still available?' Tue: '£5?'\"\n2. (4 to 10s) VO: \"Monday. The availability reply. Yes, it is, plus the one detail they probably want next: size, measurements or postage.\" | On screen: \"Mon: Yes, plus the useful detail\"\n3. (10 to 16s) VO: \"Tuesday. The lowball. A polite counter at a price you decided in advance, never below your floor.\" | On screen: \"Tue: Polite counter, above your floor\"\n4. (16 to 22s) VO: \"Thursday. The bundle. Every item named, one price, and the postage saving as the reason.\" | On screen: \"Thu: One bundle price, one reason\"\n5. (22 to 29s) VO: \"Saturday. Where is my parcel? A calm update with the tracking status, no blame, and what happens next.\" | On screen: \"Sat: Calm parcel update\"\n6. (29 to 35s) VO: \"Four prompts, one week. Remove the buyer's name before you paste. Free cheat sheet in bio.\" | On screen: \"Remove their details. Free cheat sheet in bio\"", "onscreen": "Mon: \"Still available?\" Tue: \"£5?\"\nMon: Yes, plus the useful detail\nTue: Polite counter, above your floor\nThu: One bundle price, one reason\nSat: Calm parcel update\nRemove their details first\nFree cheat sheet in bio", "caption": "Monday: \"Is this still available?\" Tuesday: \"£5?\" A typical week of buyer messages, sorted with four prompts.\n\nThese are invented messages, but you will recognise every one.\n\nMonday, availability: answer yes and add the detail they will ask next.\nTuesday, lowball: counter politely at a figure you set in advance. Never below your floor.\nThursday, bundle: name the items, give one price, explain the postage saving.\nSaturday, late parcel: share the tracking status, stay calm, say what happens next.\n\nBefore you paste any buyer message into an AI tool, swap their name and details for [BUYER]. And keep every conversation and payment on the platform.\n\nSave this for the week ahead. Our free UK Listing Cheat Sheet is in the bio.", "hashtags": "#vintedtips #vintedsellertips #resellertok #vintedsellinguk #resellercommunityuk", "visuals": "Vertical slideshow in CapCut. Each day is a mock phone chat built in Canva (invented messages from \"Buyer\" with a grey circle avatar, never real screenshots), with a day label on a kraft #C9A27E tape strip across the top. Then a quick cut to a free AI chat tool screen recording showing the reply being generated (cropped to the chat, account details, avatar and history blurred). Label Yellow #F2C84B highlight on the key phrase of each reply. Stock cutaways (Pexels): \"phone notification on desk\", \"calendar on desk\", \"parcel on doormat\" (no faces, no house numbers). Ink #1F2A44 day cards with Cream #FAF6EF text.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P51": {"id": "P51", "title": "The rule checker catching problems in a TikTok Shop listing", "format": "Walkthrough (screen recording, \"spot the problem\" style)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "35 to 40 seconds", "cta": "Soft (save this)", "hook": "\"This TikTok Shop description has 5 problems. Can you spot them before the checker does?\"", "script": "1. (0 to 4s) VO: \"This TikTok Shop description has five problems. Can you spot them before the checker does?\" | On screen: \"5 problems. Spot them?\"\n2. (4 to 9s) VO: \"Our invented example: a microfibre hair towel wrap. Pause and have a look.\" | On screen: the full risky description (held 3 seconds)\n3. (9 to 15s) VO: \"One. Anti-bacterial. That is a claim you would need evidence for. Out, unless you can prove it.\" | On screen: \"1. 'Anti-bacterial'\"\n4. (15 to 20s) VO: \"Two. Dermatologist approved. Can you prove it? No? Then it goes.\" | On screen: \"2. 'Dermatologist approved'\"\n5. (20 to 25s) VO: \"Three. Best on TikTok. 'Best' needs proof, and TikTok Shop UK's title rules say no mentioning TikTok.\" | On screen: \"3. 'Best on TikTok'\"\n6. (25 to 30s) VO: \"Four. Only three left, when there are forty in the drawer. That is fake urgency.\" | On screen: \"4. 'Only 3 left!!!'\"\n7. (30 to 35s) VO: \"Five. Stops frizz forever. A result you cannot promise.\" | On screen: \"5. 'Stops frizz forever'\"\n8. (35 to 40s) VO: \"The checker rewrites it using only facts you can back up. Check TikTok Shop's current rules in Seller Center. Save this.\" | On screen: \"Only facts you can back up. Save this\"", "onscreen": "5 problems. Spot them?\n1. \"Anti-bacterial\"\n2. \"Dermatologist approved\"\n3. \"Best on TikTok\"\n4. \"Only 3 left!!!\"\n5. \"Stops frizz forever\"\nRewritten with facts you can back up\nSave this", "caption": "This TikTok Shop description has 5 problems. How many did you spot?\n\nInvented example, a microfibre hair towel wrap:\n\"The best hair towel on TikTok! Anti-bacterial, dermatologist approved, stops frizz forever. Only 3 left!!!\"\n\nWhat the rule checker flagged:\n1. \"Anti-bacterial\": needs evidence.\n2. \"Dermatologist approved\": needs proof.\n3. \"Best\" and a platform name.\n4. \"Only 3 left\" when that is not true: fake urgency.\n5. \"Stops frizz forever\": a result nobody can promise.\n\nThe rewrite: \"Microfibre hair towel wrap with a button loop. 65 x 25 cm, grey. Machine washable at 30 degrees.\"\n\nTikTok Shop UK's policies say listings must be accurate, and its title rules say no mentioning TikTok or other platforms. Check the current rules in Seller Center before you list. Save this for your next product.", "hashtags": "#tiktokshopuk #tiktokshopseller #smallbusinessuk #ecommerceuk #listingtips", "visuals": "Start on a mock TikTok Shop style product description built in Canva (not a real shop, no TikTok logo), invented text as in the caption, on a white phone-shaped card over Cream #FAF6EF. Hold for 3 seconds with a small timer graphic \"Spot them?\". Then highlight each problem phrase in Label Yellow #F2C84B and strike it through in Returns Red #C4453B as it is named. Then cut to a screen recording of a free AI chat tool running the claims check prompt: the table (original, why it is a problem, safer rewrite) scrolls, then the clean version appears with a Sold Green #1E7F55 tick. Crop to chat, blur account name, avatar, history and tabs. Stock cutaway (Pexels): \"grey towel folded\", \"microfibre towel close up\" (item only). Corner tag: \"Example item\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P52": {"id": "P52", "title": "10 items batched into a spreadsheet", "format": "Walkthrough (screen recording, sped up)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "30 to 35 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"One spreadsheet column shows which of ten listings still need a measurement.\"", "script": "1. (0 to 3s) VO: \"One spreadsheet column shows which of ten listings still need a measurement.\" | On screen: \"10 items. 1 CHECK column.\"\n2. (3 to 9s) VO: \"First, give the chat the rules once: UK English, which platform, title limit, and write check wherever a fact is missing.\" | On screen: \"Set the rules once\"\n3. (9 to 15s) VO: \"Then paste your ten item notes, one per line, numbered. Short is fine. Brand, size, colour, flaws.\" | On screen: \"Paste 10 short briefs\"\n4. (15 to 22s) VO: \"Ask for one row per item: title, description, condition, price, and a check column for anything missing.\" | On screen: \"One row per item\"\n5. (22 to 28s) VO: \"Ask for it as comma-separated text. Paste into Google Sheets or Excel, split into columns, done.\" | On screen: \"Copy into Sheets or Excel\"\n6. (28 to 33s) VO: \"Then read every row before it goes live. Free cheat sheet in bio.\" | On screen: \"Read every row. Free cheat sheet in bio\"", "onscreen": "10 items. 1 CHECK column.\nSet the rules once\nPaste 10 short briefs\nOne row per item\nCopy into Sheets or Excel\nRead every row before it goes live\nFree cheat sheet in bio", "caption": "One column shows which of ten listings still need a measurement or a photo. This is the spreadsheet version of the batch method.\n\n1. Start the chat with the rules: UK English, the platform, the title limit, and \"write [CHECK] if a fact is missing\".\n2. Paste ten short item notes, numbered, one per line.\n3. Ask for one row per item with columns for title, description, condition, price and CHECK.\n4. Ask for comma-separated text, paste it into Google Sheets or Excel and split it into columns.\n\nThe check column is the useful bit. You can see at a glance which items still need a measurement or a photo before they go live.\n\nRead every row yourself before listing. The AI drafts, you decide.\n\nSave this for your next listing session. Our free UK Listing Cheat Sheet is in the bio.", "hashtags": "#resellinguk #ebayseller #vintedseller #chatgptprompts #resellertok", "visuals": "Screen recording on a laptop: a free AI chat tool (cropped, account name, avatar, history and tabs blurred) receiving the rules and ten invented item notes (for example \"1. Hunter tall wellies green UK5, scuff on left toe\"), then producing comma-separated rows. Speed typing to 6x, hold 2 seconds on the output. Then cut to Google Sheets (a fresh, untitled sheet: blur the account avatar and file list) showing Data then Split text to columns. Label Yellow #F2C84B highlight on the CHECK column. Zoom so text is readable on a phone. Stock intro shot (Pexels): \"clothes rail second hand\", \"stack of folded clothes\" (no people). Title card in Archivo 800 Ink #1F2A44 on Cream #FAF6EF.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P53": {"id": "P53", "title": "What is inside The Well Listed Kit (product tour)", "format": "Walkthrough (product tour, screen recording plus AI voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "45 seconds", "cta": "Kit", "hook": "\"The Well Listed Kit, opened file by file. No sales promises, just what is in it.\"", "script": "1. (0 to 3s) VO: \"The Well Listed Kit, opened file by file. No sales promises, just what is in it.\" | On screen: \"What's inside, file by file\"\n2. (3 to 9s) VO: \"The guide. A PDF that starts with the Listing Brief: the facts you give AI before it writes anything.\" | On screen: \"1. The guide (PDF)\"\n3. (9 to 16s) VO: \"Then modules for titles, descriptions and condition, tags, photos, pricing, buyer messages, video and TikTok Shop, and a rule checker.\" | On screen: \"Titles. Descriptions. Tags. Photos. Pricing. Messages.\"\n4. (16 to 22s) VO: \"Every prompt shows an example output for an invented item, and a short list of things to check before you post.\" | On screen: \"Example output + checks, every prompt\"\n5. (22 to 28s) VO: \"The prompt library. Searchable, with copy buttons, and it works offline. There is a plain text version too.\" | On screen: \"2. Prompt library (copy and paste)\"\n6. (28 to 34s) VO: \"Templates. A Listing Brief, a stock and pricing tracker, message snippets and photo shot lists.\" | On screen: \"3. Templates and trackers\"\n7. (34 to 40s) VO: \"It works with the free versions of ChatGPT, Claude, Gemini or Copilot. It will not make anything sell. It helps you write clear, accurate listings faster.\" | On screen: \"Free AI tools. Clear, accurate listings.\"\n8. (40 to 45s) VO: \"Launch price twelve pounds, full price nineteen. Link in bio.\" | On screen: \"£12 launch price (full price £19). Link in bio\"", "onscreen": "What's inside, file by file\n1. The guide (PDF)\nTitles. Descriptions. Tags. Photos. Pricing. Messages. Video. Rule checker.\nExample output + checks, every prompt\n2. Prompt library (copy and paste)\n3. Templates and trackers\nWorks with free AI tools\nNo promises of sales. Clearer listings, faster.\n£12 launch price (full price £19). Link in bio", "caption": "The Well Listed Kit, opened file by file.\n\nThe guide (PDF): starts with the Listing Brief method, then modules for titles, descriptions and condition, tags and item specifics, photos, pricing, buyer messages, video and TikTok Shop, a rule checker, batch listing, worked examples and a platform cheat sheet.\n\nThe prompt library: searchable, copy buttons, works offline. Plus a plain text file of every prompt.\n\nTemplates: Listing Brief, stock and pricing tracker, message snippets, photo shot lists.\n\nIt is written for UK sellers on eBay, Vinted, Depop, Etsy, Amazon and TikTok Shop, and works in the free versions of ChatGPT, Claude, Gemini or Copilot. It will not make anything sell. It helps you write clear, accurate listings faster.\n\n£12 at launch, £19 full price. Link in bio. Not affiliated with any marketplace.", "hashtags": "#resellinguk #ebaysellertips #vintedtips #chatgptprompts #ukseller", "visuals": "Price line: this post is scheduled for day 7 of the launch window. If it is published or reposted after the launch price ends, change the last slide, VO and caption to \"£19\" only. Record only once the real built files exist (product/dist/Well-Listed-Kit.pdf, prompt-library.html, all-prompts.txt and product/templates/). Screen record a laptop: open the PDF and scroll slowly through the contents page and one module page (the Listing Brief template); open prompt-library.html and use the search box (type \"lowball\"), then click a copy button; open all-prompts.txt briefly; open the stock-and-pricing-tracker.csv in Google Sheets or Excel. If any file name or module has changed, show and say what is actually in the build, not this script. Crop tightly to the document, blur the desktop, file path bar, account names, dock and browser tabs. Label Yellow #F2C84B highlighter box on each part as it is named. Intro and end cards: parcel label card, \"The Well Listed Kit\" in Archivo 800 Ink #1F2A44 on Cream #FAF6EF, Sold Green #1E7F55 tick after \"Kit\". Optional stock (Pexels): \"laptop on desk with parcel\", \"packing parcels table\" (hands only). No marketplace logos, no fake reviews, no sales figures, no countdown timers.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P54": {"id": "P54", "title": "Things nobody tells you when you start selling on Vinted", "format": "Wish we knew (carousel)", "best": "Instagram carousel, TikTok photo mode", "length": "8 slides", "cta": "Soft (free cheat sheet)", "hook": "\"Things nobody tells you when you start on Vinted. Starting with who actually pays the fee.\"", "script": "1. Slide 1: \"Things nobody tells you when you start on Vinted. Starting with who pays the fee.\"\n2. Slide 2: \"The buyer pays the Buyer Protection fee at checkout, not you. Vinted says it varies by item, so check the current price list.\"\n3. Slide 3: \"Your first photo should show the whole item. Vinted's help pages also say: your own photos, no stock images, no collages.\"\n4. Slide 4: \"You can add up to 20 photos. Use them for labels, measurements and every flaw.\"\n5. Slide 5: \"Measurements save you messages. Pit to pit and length in cm answers the question you would get anyway.\"\n6. Slide 6: \"Lowball offers are not personal. Decide your lowest price before you list, and reply calmly.\"\n7. Slide 7: \"Buying to resell as a business? Vinted says traders should use Vinted Pro, which has its own rules on returns.\"\n8. Slide 8: \"Rules change: check Vinted's help pages. Our free cheat sheet has a table of platform limits. Link in bio.\"", "onscreen": "Things nobody tells you on Vinted\nThe buyer pays the protection fee\nFirst photo: the whole item\nUp to 20 photos. Use them\nMeasurements save messages\nLowballs are not personal\nTrading? Vinted Pro has its own rules\nCheck the help pages. Free cheat sheet in bio", "caption": "Things nobody tells you when you start selling on Vinted, starting with who pays the fee.\n\n1. The Buyer Protection fee is added at checkout and paid by the buyer. Vinted says the amount varies.\n2. Your first photo should show the whole item. Use your own photos, no stock images.\n3. You can add up to 20 photos, so use them for labels and flaws.\n4. Measurements in cm answer the most common question before it is asked.\n5. Lowball offers are part of the app. Know your lowest price before you list.\n6. If you sell as a business, Vinted says to use Vinted Pro, which comes with its own returns rules.\n\nFacts from Vinted's help pages at the time of writing. Rules change, so check the current rule in the app. Free UK Listing Cheat Sheet: link in bio.", "hashtags": "#vintedtips #vintedsellinguk #vintedseller #resellercommunityuk #preloved", "visuals": "Canva carousel, 1080 x 1350, Cream #FAF6EF background, each tip on a parcel label card with a kraft #C9A27E border and dashed cut line. Slide 1 in Ink #1F2A44 with \"who pays the fee\" highlighted in Label Yellow #F2C84B. Small simple icons (camera, tape measure, parcel, chat bubble) drawn in Ink line style. Background photos from Pexels or Canva free: \"clothes on hanger plain wall\", \"folded jumper flat lay\", \"tape measure clothing\". No Vinted logo or app screenshots of other people's listings. Tiny footer on every slide: \"Checked Sept 2026. Check Vinted's help pages.\"", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P55": {"id": "P55", "title": "Things nobody tells you about eBay titles", "format": "Wish we knew (AI voiceover plus text on screen)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "30 seconds", "cta": "Soft (save this)", "hook": "\"eBay counts the spaces. 'Nikon D3200 18-55mm' is 19 characters, not 17.\"", "script": "1. (0 to 3s) VO: \"eBay counts the spaces. Nikon D3200, eighteen to fifty-five millimetre, is nineteen characters, not seventeen.\" | On screen: \"'Nikon D3200 18-55mm' = 19, not 17\"\n2. (3 to 9s) VO: \"Buyers type what it is, not how it feels. 'Great camera' matches nobody's search. 'Nikon D3200 DSLR camera with 18-55mm lens' does.\" | On screen: \"'Great camera' vs what buyers type\"\n3. (9 to 15s) VO: \"The first words matter most, especially on a phone. Put the brand and model first.\" | On screen: \"Brand + model first\"\n4. (15 to 21s) VO: \"L, at, at, K, and exclamation marks use up characters and tell the buyer nothing.\" | On screen: \"L@@K!!! wastes characters\"\n5. (21 to 26s) VO: \"Item specifics do quiet work. Fill them in, because they help your item show up in filtered searches.\" | On screen: \"Fill in item specifics\"\n6. (26 to 30s) VO: \"Check the current rules in eBay's help pages. Save this for your next title.\" | On screen: \"Save this for your next title\"", "onscreen": "\"Nikon D3200 18-55mm\" = 19, not 17\n\"Great camera\" vs what buyers type\nBrand + model first\nL@@K!!! wastes characters\nFill in item specifics\nSave this", "caption": "eBay counts the spaces: \"Nikon D3200 18-55mm\" is 19 characters, not 17. A few more things nobody mentions about eBay titles:\n\nBuyers search for what an item is, not how it feels. \"Great camera\" matches nobody's search.\nThe first words matter most on a phone screen. Brand and model go first.\n\"L@@K!!!\" uses up characters and adds nothing.\nOther brands (\"like Canon\") do not belong in your title.\nItem specifics help your listing appear when buyers use search filters, so fill them in.\n\nBefore (79 characters): Camera L@@K!!! nikon dslr great condition works perfect like canon sony bargain\nAfter (75 characters): Nikon D3200 DSLR Camera with 18-55mm VR Lens Battery and Charger Black 24MP\n\nInvented example. eBay's title limit is 80 characters at the time of writing: check the current rule in eBay's help pages.", "hashtags": "#ebayuk #ebaysellertips #ebayseller #resellinguk #listingtips", "visuals": "Vertical video. Background: stock footage from Pexels \"dslr camera on table\" or \"camera lens close up\" (item only, no people; blur any brand logo on the stock camera). Overlay a mock eBay-style title field built in Canva (no eBay logo) with a live character counter. Type out the \"before\" title in grey with Returns Red #C4453B strike-throughs on \"L@@K!!!\", \"works perfect\" (untested claim) and \"like canon sony\", counter at 79/80. Then the \"after\" title typed in Ink #1F2A44 with a Sold Green #1E7F55 counter \"75/80\". Point 5: a simple mock \"Item specifics\" form with Brand, Model, Type, Colour fields filling in. Archivo 800 captions, Cream #FAF6EF band. Calm British AI voice. Corner tag: \"Example listing\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P56": {"id": "P56", "title": "Things new sellers wish they had known about postage", "format": "Wish we knew (stock footage plus AI voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 to 35 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"Weigh the parcel, not the item. Postage lessons new sellers tend to learn the hard way.\"", "script": "1. (0 to 3s) VO: \"Weigh the parcel, not the item. Postage lessons new sellers tend to learn the hard way.\" | On screen: \"Weigh the parcel, not the item\"\n2. (3 to 9s) VO: \"Box, bubble wrap and tape all count. A few grams can push you into the next price band.\" | On screen: \"Packaging counts\"\n3. (9 to 15s) VO: \"Size matters as much as weight. Measure the finished parcel and check the carrier's current size limits.\" | On screen: \"Measure the finished parcel\"\n4. (15 to 21s) VO: \"Always get proof of postage. A receipt or a scan at the drop-off point is your evidence if a parcel goes missing.\" | On screen: \"Always get proof of postage\"\n5. (21 to 27s) VO: \"Packaging costs money too. Add it to your sums before you accept an offer.\" | On screen: \"Count packaging in your price\"\n6. (27 to 33s) VO: \"Only promise the dispatch time you can keep. Our free cheat sheet has a postage and fees prompt. Link in bio.\" | On screen: \"Promise what you can keep. Free cheat sheet in bio\"", "onscreen": "Weigh the parcel, not the item\nPackaging counts\nMeasure the finished parcel\nAlways get proof of postage\nCount packaging in your price\nPromise the dispatch time you can keep\nFree cheat sheet in bio", "caption": "Weigh the parcel, not the item. Postage lessons new sellers tend to learn the hard way.\n\n1. Weigh it packed. Box, bubble wrap and tape all add grams.\n2. Measure the finished parcel. Size bands matter as much as weight, so check the carrier's current limits.\n3. Get proof of postage every time. It is your evidence if something goes missing.\n4. Packaging costs money. Include it before you agree a price or accept an offer.\n5. Only promise a dispatch time you can keep.\n\nMany apps have their own postage options and prepaid labels, and the rules differ. Check the current postage options in each platform's help pages.\n\nSave this, and grab our free UK Listing Cheat Sheet from the link in bio.", "hashtags": "#resellinguk #vintedtips #ebaysellertips #smallbusinessuk #resellercommunityuk", "visuals": "Stock footage only, hands or objects, no faces (Pexels or Canva free searches): \"parcel on kitchen scale\", \"packing box tape gun\", \"bubble wrap packing hands\", \"tape measure cardboard box\", \"receipt paper close up\", \"stack of parcels\". Avoid any shot showing a real address label, house number or carrier branding in close-up; if a label is visible, blur it. Text overlays on Ink #1F2A44 bands with Cream #FAF6EF Archivo 800 text, one key word per line in Label Yellow #F2C84B (\"parcel\", \"proof\", \"packaging\"). Kraft #C9A27E tape strip graphic across the top of each card. Calm British AI voice, burned-in captions.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P57": {"id": "P57", "title": "Things you only learn after your first \"not as described\" claim", "format": "Wish we knew (carousel)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "8 slides", "cta": "Soft (save this)", "hook": "\"The first 'not as described' claim tends to teach the same five lessons. Here they are, early.\"", "script": "1. Slide 1: \"The first 'not as described' claim tends to teach the same five lessons. Here they are, early.\"\n2. Slide 2: \"1. 'Good condition' is not a description. Buyers compare the parcel with your exact words.\"\n3. Slide 3: \"2. A flaw in the text but not in the photos is still a surprise. Show it, and say which photo.\"\n4. Slide 4: \"3. Say what is not included. No box, no charger, one strap missing. Silence reads as 'everything'.\"\n5. Slide 5: \"4. Keep your evidence: listing photos, proof of postage, and a photo of the item packed, taken before you seal the parcel.\"\n6. Slide 6: \"5. Reply calmly and use the platform's own process. Arguing in messages rarely helps anyone.\"\n7. Slide 7: \"Private sale or not, what arrives should match the description. Check each platform's help pages for how claims work.\"\n8. Slide 8: \"Save this and read it before your next listing, not after your first claim.\"", "onscreen": "5 lessons from a \"not as described\" claim\n\"Good condition\" is not a description\nFlaw in the text AND the photos\nSay what is not included\nKeep your evidence\nCalm reply, platform process\nIt should match the description\nSave this before your first claim", "caption": "The first \"not as described\" claim tends to teach the same five lessons. Here they are before you need them.\n\n1. Buyers compare the parcel with your exact words, so be specific.\n2. Put every flaw in the text and in a photo, and say which photo.\n3. Say what is not included (no box, no charger). Buyers tend to read silence as \"everything\".\n4. Keep evidence: listing photos, proof of postage and a photo of the item packed.\n5. Stay calm and use the platform's own resolution process.\n\nWhether you sell privately or as a business, what arrives should match what you described. Platforms such as Vinted cover buyers when an item is significantly not as described, and each has its own process. Check the current rules in the help pages. This is general information, not legal advice.\n\nSave this now, not after your first claim.", "hashtags": "#ebaysellertips #vintedsellertips #resellinguk #resellercommunityuk #listingtips", "visuals": "Canva carousel, 1080 x 1350. Slide 1: Ink #1F2A44 background, Cream #FAF6EF text, \"not as described\" highlighted in Label Yellow #F2C84B. Slides 2 to 6: before and after mini examples: grey \"before\" line with Returns Red #C4453B strike-through (\"Good condition\"), Ink \"after\" line with Sold Green #1E7F55 tick (\"Two pulled threads on the back, see photo 6\"). Slide 5 photo from Pexels: \"packed parcel on table\", \"sealing cardboard box hands\". Slide 4 photo: \"empty cardboard box\" (to show \"no box\"). No real buyer messages, no real claim screens, no marketplace logos. Invented examples only, labelled \"Example\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P58": {"id": "P58", "title": "Things nobody tells you about using ChatGPT for listings", "format": "Wish we knew (AI voiceover plus screen recording)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "35 seconds", "cta": "Kit", "hook": "\"Ask an AI chat tool the Amazon UK title limit. It may still say 200.\"", "script": "1. (0 to 3s) VO: \"Ask an AI chat tool the Amazon UK title limit. It may still say two hundred.\" | On screen: \"Amazon UK title limit? 'About 200.'\"\n2. (3 to 9s) VO: \"Amazon announced seventy-five characters for most categories from twenty-seven July twenty twenty-six. AI tools learn from older text, so the rules they know can be out of date.\" | On screen: \"Most categories: 75 from 27 July 2026\"\n3. (9 to 14s) VO: \"So tell it the limit. Never ask it what the limit is.\" | On screen: \"Tell it the limit. Don't ask it.\"\n4. (14 to 19s) VO: \"It miscounts characters too. Ask it to show the count, then check it yourself.\" | On screen: \"It miscounts. Check the count.\"\n5. (19 to 24s) VO: \"It softens flaws if you let it. 'Stain' turns into 'character'. Tell it to keep every flaw as serious as you wrote it.\" | On screen: \"'Stain' is not 'character'\"\n6. (24 to 29s) VO: \"And anything you paste may be stored by the tool. Swap a buyer's name and address for BUYER first.\" | On screen: \"No buyer names or addresses\"\n7. (29 to 35s) VO: \"Every prompt in The Well Listed Kit gives the AI the rules, instead of asking it for them. Link in bio.\" | On screen: \"The Well Listed Kit: link in bio\"", "onscreen": "Amazon UK title limit? \"About 200.\"\nMost categories: 75 from 27 July 2026\nTell it the limit. Don't ask it.\nIt miscounts. Check the count.\n\"Stain\" is not \"character\"\nNo buyer names or addresses\nThe Well Listed Kit: link in bio", "caption": "Ask an AI chat tool for the Amazon UK title limit and it may still say 200. Amazon announced that from 27 July 2026, titles in most categories (media excepted) must be 75 characters or fewer. AI tools learn from older text, so the platform rules they \"know\" can be out of date.\n\nThings nobody mentions:\n1. Tell it the limit. Never ask it.\n2. It miscounts characters, so ask for the count and check it.\n3. It softens flaws unless told not to (\"stain\" becomes \"character\").\n4. Anything you paste may be stored by the tool, so swap buyers' names and addresses for [BUYER].\n\nEvery prompt in The Well Listed Kit gives the AI the rules instead of asking for them. Link in bio. Rules change: check the current rule in each platform's help pages.", "hashtags": "#chatgpt #chatgptprompts #amazonseller #ebaysellertips #resellinguk", "visuals": "Screen recording of a free AI chat tool, cropped to the chat, account name, avatar, history sidebar and browser tabs blurred. Shot A: type \"What is the maximum length of an Amazon UK product title?\" and show only what the tool really answers. If it gives the current 75-character rule on the day, do not fake an old answer: use a Canva card labelled \"Example of an out-of-date answer\" for the hook instead. Shot B: paste a Kit prompt that states the limit, and highlight \"75 characters\" and the character count in Label Yellow #F2C84B. Shot C: a mock condition note with \"stain\" in Ink and \"character\" struck through in Returns Red #C4453B. Source for the Amazon change: research/platform-rules-uk.md (Amazon UK section, official Seller Forums announcement). End card: parcel label, \"The Well Listed Kit\" in Archivo 800 Ink #1F2A44 on Cream #FAF6EF. Do not show the ChatGPT logo large; the brand name can appear in text only.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P59": {"id": "P59", "title": "Things nobody tells you about selling on TikTok Shop UK", "format": "Wish we knew (carousel)", "best": "TikTok photo mode, Instagram carousel", "length": "8 slides", "cta": "Soft (save this)", "hook": "\"'50% OFF' in a TikTok Shop UK title breaks the title rules. So does your shop name.\"", "script": "1. Slide 1: \"'50% OFF' in a TikTok Shop UK title breaks the title rules. So does your shop name.\"\n2. Slide 2: \"Titles: no promo wording, no shop name or URL, no mentioning TikTok or other marketplaces, no symbols.\"\n3. Slide 3: \"Health claims are off the table. No 'cures', 'treats', 'prevents' or 'relieves', in the title, description or video.\"\n4. Slide 4: \"Images: square, at least 800 x 800 pixels, at least 3 per product, main image showing the front. No added text or watermarks.\"\n5. Slide 5: \"Your video counts as part of the listing. If you would not write it, do not say it on camera.\"\n6. Slide 6: \"TikTok Shop UK's AI content policy: label realistic AI images, and never make a product look different from what arrives.\"\n7. Slide 7: \"Affiliate creators are paid a commission you set, on top of the platform's own commission. Check the current rates in Seller Center.\"\n8. Slide 8: \"Rules change fast. Check TikTok Shop UK's current policies in Seller Center. Save this.\"", "onscreen": "No \"50% off\" in product titles\nTitles: no promos, URLs, platform names or symbols\nNo health claims, anywhere\nImages: square, 800 x 800+, at least 3\nYour video is part of the listing\nAI images: label them, keep them accurate\nAffiliate commission is on top\nCheck Seller Center. Save this", "caption": "\"50% OFF\" in a TikTok Shop UK product title breaks the title rules, and so does your shop name. A few more things nobody mentions:\n\nTitles cannot include promo wording, your shop name or URL, other platform names or symbols.\nNo claims that a product cures, treats, prevents or relieves anything, in any part of the listing or the video.\nProduct images should be square, at least 800 x 800 pixels, with at least 3 per product.\nRealistic AI images need labelling and must show the product as it really is.\nIf you use affiliate creators, their commission is set by you and sits on top of the platform's commission.\n\nAll of this comes from TikTok Shop UK's policy pages at the time of writing. Rules change often, so check the current rules in Seller Center before you list. Save this for your first listing.", "hashtags": "#tiktokshopuk #tiktokshopseller #smallbusinessuk #ecommerceuk #ukseller", "visuals": "Canva carousel, 1080 x 1350 (or 1080 x 1920 for TikTok photo mode). Slide 1: a mock product title bar reading \"Stoneware Mug Set 50% OFF!!!\" with \"50% OFF!!!\" struck through in Returns Red #C4453B, then the clean version \"Stoneware Mug Set of 4, Speckled White, 350 ml\" with a Sold Green #1E7F55 tick (invented product). Slides use Cream #FAF6EF backgrounds, Ink #1F2A44 Archivo 800 text, Label Yellow #F2C84B for one key word per slide. Slide 4: a square frame graphic labelled \"800 x 800\". Stock images from Pexels or Canva free: \"stoneware mugs white background\", \"product flat lay white background\", \"phone on tripod filming product\" (no people). No TikTok logo or app screenshots. Footer on each slide: \"From TikTok Shop UK policy pages, Sept 2026. Check Seller Center.\"", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P60": {"id": "P60", "title": "What to set up before your 50th listing", "format": "Wish we knew (AI voiceover plus screen recording of templates)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "35 to 40 seconds", "cta": "Kit", "hook": "\"Somewhere around listing 50, the notes app stops coping. Set these up before you get there.\"", "script": "1. (0 to 3s) VO: \"Somewhere around listing fifty, the notes app stops coping. Set these up before you get there.\" | On screen: \"Before listing 50, set up these\"\n2. (3 to 9s) VO: \"One. A Listing Brief template. The same fields every time, so nothing gets forgotten.\" | On screen: \"1. One brief template\"\n3. (9 to 16s) VO: \"Two. A stock tracker. Item code, where it is stored, what you paid, where it is listed, price, floor, and date sold.\" | On screen: \"2. A stock and pricing tracker\"\n4. (16 to 22s) VO: \"Three. Message snippets for the questions you answer every week.\" | On screen: \"3. Saved message snippets\"\n5. (22 to 27s) VO: \"Four. A photo spot. Same light, same plain background, same shot list.\" | On screen: \"4. One photo spot, one shot list\"\n6. (27 to 33s) VO: \"Five. Read the government's guidance on selling online, so you know where you stand.\" | On screen: \"5. Read gov.uk on selling online\"\n7. (33 to 39s) VO: \"The Well Listed Kit includes the brief, tracker, snippets and shot lists as templates. Link in bio.\" | On screen: \"Templates in The Well Listed Kit. Link in bio\"", "onscreen": "Before listing 50, set up these\n1. One brief template\n2. A stock and pricing tracker\n3. Saved message snippets\n4. One photo spot, one shot list\n5. Read gov.uk on selling online\nTemplates in The Well Listed Kit: link in bio", "caption": "Somewhere around listing 50, the notes app stops coping. Set these up before you get there.\n\n1. A Listing Brief template, so every item gets the same facts.\n2. A stock and pricing tracker: item code, storage spot, cost, where it is listed, price, floor and date sold.\n3. Message snippets for the questions you answer every week.\n4. One photo spot with the same light, the same background and a shot list.\n5. Half an hour reading gov.uk's guidance on selling online and tax, so you know your position. We cannot give tax advice, but gov.uk is the place to start.\n\nNone of this needs paid software. A spreadsheet and a notes app will do.\n\nThe Well Listed Kit includes the brief, tracker, snippets and shot lists as ready-made templates. Link in bio.", "hashtags": "#resellinguk #resellercommunityuk #ebayseller #vintedseller #reseller", "visuals": "Screen recording on a laptop of the kit's real template files once built (product/templates/listing-brief-template.txt, stock-and-pricing-tracker.csv opened in Google Sheets or Excel, message-snippets.txt, photo-shot-lists.md). If a template has changed, show what is actually there. Fill in 3 rows of the tracker with invented items (for example \"WL-014, Hunter wellies green UK5, box 2, £3.00, Vinted, £27, £20\"). Blur account avatars, file paths, desktop and browser tabs. For point 4, stock footage from Pexels: \"white background product photography setup\", \"phone on tripod clothes flat lay\" (no people). For point 5, a simple Canva card reading \"gov.uk: selling online\" (no government crest or logo). Label Yellow #F2C84B highlight on each column header as it is named. End card: parcel label, Archivo 800 Ink #1F2A44 on Cream #FAF6EF with a Sold Green #1E7F55 tick.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}}, "pins": {"PIN01": {"id": "PIN01", "title": "eBay Title Formula for UK Sellers: Brand, Item, Size, Colour (80 Characters)", "description": "A simple eBay title formula for UK sellers: brand, item type, key detail, size, colour. Use the words buyers type into search, skip \"L@@K\" and \"stunning\", and keep within eBay's 80 character limit. Check the current rule in eBay's help pages.", "board": "eBay Selling Tips UK", "link": "/blog/how-to-write-an-ebay-title-uk.html", "design": "1000 x 1500, Cream background. Headline on a parcel-label card (Kraft border, dashed cut line): \"The eBay title formula\". Below, five stacked Ink blocks: Brand / Item / Detail / Size / Colour, \"Size\" highlighted in Label Yellow. Example title in JetBrains Mono at the bottom with \"(76)\" count and \"Example\" label."}, "PIN02": {"id": "PIN02", "title": "5 eBay Title Mistakes That Make Your Listing Hard to Find (UK)", "description": "Five common eBay title mistakes: hype words, missing brand, US sizes, flaws in the title and wasted characters. See a before and after example title for a UK clothing listing and a quick fix for each mistake, written for UK eBay sellers.", "board": "eBay Selling Tips UK", "link": "/blog/how-to-write-an-ebay-title-uk.html", "design": "1000 x 1500, Ink background. Headline in Cream Archivo 800: \"5 eBay title mistakes\". Numbered list on Cream cards, each mistake struck through in Returns Red. Bottom: a small before and after title pair with a Sold Green tick on the after. \"Example\" label."}, "PIN03": {"id": "PIN03", "title": "Vinted Description Template: Copy, Paste, Fill In the Gaps", "description": "A copy and paste Vinted description template for UK sellers: brand, size and fit, measurements, material, honest condition notes and a bundle line. It answers the questions buyers usually message about, so you spend less time replying and more time listing.", "board": "Vinted Selling Tips", "link": "/blog/vinted-description-template.html", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Vinted description template\". Below, the template as a fill-in form in JetBrains Mono with square-bracket gaps highlighted in Label Yellow. Kraft tape strip at the top."}, "PIN04": {"id": "PIN04", "title": "What to Put in a Vinted Description: 6 Things Buyers Always Ask", "description": "Not sure what to write in a Vinted description? Cover these six things buyers always ask about: size and fit, measurements, material, condition, flaws and postage. A short checklist for selling second hand clothes on Vinted in the UK.", "board": "Listing Templates and Prompts", "link": "/blog/vinted-description-template.html", "design": "1000 x 1500, Cream background. Headline: \"6 things every Vinted description needs\". Six checklist rows with Sold Green ticks, \"measurements\" in Label Yellow. A folded jumper icon (simple flat graphic, no photo of a person)."}, "PIN05": {"id": "PIN05", "title": "eBay Condition Description Examples: Honest Wording for Used Items", "description": "Honest eBay condition description examples for used clothes, electronics and homeware. Say what the flaw is, where it is and how big, and show it in a photo. Clear condition notes help set expectations and head off \"not as described\" messages.", "board": "eBay Selling Tips UK", "link": "/blog/ebay-condition-description-examples.html", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Condition notes that say it straight\". Three example cards (clothing, electronics, homeware), each with an Ink example sentence and \"Example\" label. Magnifying glass icon in Kraft."}, "PIN06": {"id": "PIN06", "title": "How to Describe Flaws in a Listing: What, Where and How Big", "description": "A simple way to describe flaws in any eBay, Vinted or Depop listing: what the flaw is, where it is, how big it is, and which photo shows it. Swap vague words like \"minor wear\" for clear, specific condition notes buyers can trust.", "board": "Listing Templates and Prompts", "link": "/blog/ebay-condition-description-examples.html", "design": "1000 x 1500, split layout. Top: \"minor wear\" in grey with a Returns Red strike-through, labelled \"Before\". Bottom: \"Pulled thread on the hem, about 2 cm, see photo 6\" in Ink with a Sold Green tick, labelled \"After\". Headline: \"Describe flaws like this\". \"Example\" label."}, "PIN07": {"id": "PIN07", "title": "eBay Item Specifics Explained for UK Sellers: Which Ones to Fill In", "description": "A plain English guide to eBay item specifics for UK sellers. Filling in brand, size, colour, material and style helps your listing show up when buyers use search filters. See which item specifics matter most for clothing, electronics and homeware.", "board": "eBay Selling Tips UK", "link": "/blog/ebay-item-specifics-uk.html", "design": "1000 x 1500, Cream background. Headline: \"eBay item specifics: fill these in\". A mock filter panel graphic (drawn, not a screenshot) with Brand, Size, Colour, Material, Style ticked in Sold Green. No eBay logo."}, "PIN08": {"id": "PIN08", "title": "Item Specifics Checklist for Clothing Listings on eBay UK", "description": "A quick item specifics checklist for clothing on eBay UK: brand, size type, size, colour, material, style, fit, sleeve length and pattern. Fill them in from the label, not from memory, and leave out anything you cannot confirm.", "board": "eBay Selling Tips UK", "link": "/blog/ebay-item-specifics-uk.html", "design": "1000 x 1500, Ink background. Headline in Cream: \"Clothing item specifics checklist\". Cream checklist card with nine rows and empty tick boxes, printable style. Small line: \"Take it from the label\"."}, "PIN09": {"id": "PIN09", "title": "ChatGPT Prompts for eBay Listings That Write in UK English", "description": "ChatGPT prompts for eBay listings that use UK English and UK sizes, keep titles within the character limit and never invent details. Give the AI your facts first, then ask for the title and description. Works with free ChatGPT, Claude or Gemini.", "board": "Listing Templates and Prompts", "link": "/blog/chatgpt-prompts-for-ebay-listings.html", "design": "1000 x 1500, Cream background. Headline: \"ChatGPT prompts for eBay listings\". A drawn phone outline with a chat bubble containing a short prompt in JetBrains Mono, and a Label Yellow highlight on \"Use only my facts\". No real account names."}, "PIN10": {"id": "PIN10", "title": "How to Stop ChatGPT Making Things Up in Your Listings", "description": "AI tools guess when you leave gaps. Give ChatGPT a short list of facts about your item and tell it to write [CHECK] where anything is missing instead of guessing. A simple fix for accurate, honest eBay and Vinted listings in UK English.", "board": "Listing Templates and Prompts", "link": "/blog/chatgpt-prompts-for-ebay-listings.html", "design": "1000 x 1500, split. Top: an AI-written line \"100% cashmere\" struck through in Returns Red, labelled \"Guessed\". Bottom: \"[CHECK: material from label]\" in Ink with a Sold Green tick. Headline on parcel-label card: \"Stop AI guessing\". \"Example\" label."}, "PIN11": {"id": "PIN11", "title": "ChatGPT Etsy Listing Prompt for Handmade Products (UK English)", "description": "A ChatGPT prompt for Etsy product descriptions that sound like you, not a robot. Give it the materials, size, making process and care notes, and ask for a readable title and description in UK English with no hype words or invented details.", "board": "Listing Templates and Prompts", "link": "/blog/chatgpt-etsy-listing-prompt.html", "design": "1000 x 1500, Cream background. Headline: \"An Etsy listing prompt that sounds human\". A simple flat illustration of a candle holder (no photo), with the prompt in a JetBrains Mono box. Kraft tape strip."}, "PIN12": {"id": "PIN12", "title": "Etsy Tags Planner: How to Fill All 13 Tags Without Repeats", "description": "Plan your 13 Etsy tags in five groups: what it is, style, material, who it is for and occasion, so you use every slot without repeating your title. Use phrases buyers type. Check the current tag limit in Etsy's help pages.", "board": "Listing Templates and Prompts", "link": "/blog/chatgpt-etsy-listing-prompt.html", "design": "1000 x 1500, Cream background. Headline: \"Fill all 13 Etsy tags\". A 13-slot grid, colour-coded by group (Ink, Kraft, Sold Green, Label Yellow). Example tags for a candle holder, \"Example\" label. Small limit line at the bottom."}, "PIN13": {"id": "PIN13", "title": "How to Price Items on Vinted UK Using Sold Listings", "description": "How to price items on Vinted in the UK: look at sold items that match yours, not active ones, adjust for condition, then set your list price and your lowest price before offers arrive. A calm, simple Vinted pricing guide for second hand clothes.", "board": "Vinted Selling Tips", "link": "/blog/how-to-price-items-on-vinted-uk.html", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Price it from what sold\". Four numbered steps with icons (search, compare, adjust, decide). Price tag graphic in Kraft with \"£ Example\"."}, "PIN14": {"id": "PIN14", "title": "Sold Comps Pricing Worksheet for eBay and Vinted Sellers", "description": "Price from evidence, not memory. On this sold comps worksheet, note five to ten matching sold listings, their condition and what was included, drop the odd ones out, then set a price range. Keeps pricing on eBay and Vinted calm and consistent. Printable reseller organisation idea.", "board": "Reseller Organisation", "link": "/blog/how-to-price-items-on-vinted-uk.html", "design": "1000 x 1500, Cream background. Headline: \"Sold comps worksheet\". A printable table graphic with columns Item / Condition / Included / Sold price, filled with three example rows in Ink and \"Example figures\" label. Sold Green total row."}, "PIN15": {"id": "PIN15", "title": "How to Respond to Lowball Offers on Vinted (Polite Replies)", "description": "How to respond to lowball offers on Vinted without being rude: a friendly counter-offer and a polite decline you can copy. Decide your lowest price first, keep it short, and send any counter through the offer button so everything stays on the app.", "board": "Vinted Selling Tips", "link": "/blog/how-to-respond-to-lowball-offers-vinted.html", "design": "1000 x 1500, Ink background. Headline in Cream: \"Lowball offer? Reply like this\". Two chat bubbles on Cream: \"Counter\" and \"Decline\", each with a short example reply. \"£5 on a £25 coat\" in Label Yellow. \"Example\" label."}, "PIN16": {"id": "PIN16", "title": "Counter Offer Message Templates for Vinted and eBay Resellers", "description": "Short counter offer message templates for Vinted and eBay: meet in the middle, offer a bundle deal or hold your price politely. Friendly, calm wording for UK resellers that keeps the deal on the platform and never pressures the buyer.", "board": "Vinted Selling Tips", "link": "/blog/how-to-respond-to-lowball-offers-vinted.html", "design": "1000 x 1500, Cream background. Headline: \"3 counter offer replies\". Three stacked parcel-label cards, each with one reply in Inter and a label (Meet in the middle / Bundle / Hold price). Sold Green ticks."}, "PIN17": {"id": "PIN17", "title": "Vinted Message Templates: Replies for Every Buyer Question", "description": "Vinted message templates for sellers: replies for \"is this still available?\", measurements, bundles, postage questions, delays and returns. Polite, short UK English replies you can save in your phone and adapt, so the same questions take seconds to answer.", "board": "Vinted Selling Tips", "link": "/blog/vinted-message-templates.html", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Vinted message templates\". Six small chat bubble icons with labels (Available? / Measurements / Bundle / Postage / Delay / Return). Kraft tape strip."}, "PIN18": {"id": "PIN18", "title": "A Better Reply to \"Is This Still Available?\" on Vinted and eBay", "description": "One saved reply for \"is this still available?\" that answers and moves things on: yes, happy to answer questions, and you can buy or make an offer through the app. Save it in your phone's text replacement settings for quick replies.", "board": "Listing Templates and Prompts", "link": "/blog/vinted-message-templates.html", "design": "1000 x 1500, Ink background. Big Cream headline: \"Is this still available?\" with a Label Yellow underline. Below, a Cream chat bubble with the example reply in Inter. Small tip line: \"Save it as a text shortcut\"."}, "PIN19": {"id": "PIN19", "title": "TikTok Shop Product Title Tips for UK Sellers: What to Include", "description": "TikTok Shop UK product title tips: say what the product is, the material, key features, quantity and size. Keep it accurate and concise, with no promotions or symbols. Check the current title rules in TikTok Shop's UK seller help pages.", "board": "Listing Templates and Prompts", "link": "/blog/tiktok-shop-product-title-uk.html", "design": "1000 x 1500, Cream background. Headline: \"TikTok Shop titles: what goes in\". Five building blocks (Product / Material / Feature / Quantity / Size) with an example title in JetBrains Mono. No TikTok logo. Small rule-check line."}, "PIN20": {"id": "PIN20", "title": "Words to Keep Out of Your TikTok Shop Product Title (UK)", "description": "Keep these out of TikTok Shop UK product titles: discount wording like \"50% off\", your shop name or a web address, other platform names, and decorative symbols. An accurate, plain title is easier to trust. Check TikTok Shop's current UK rules.", "board": "Listing Templates and Prompts", "link": "/blog/tiktok-shop-product-title-uk.html", "design": "1000 x 1500, Ink background. Headline in Cream: \"Keep these out of your title\". Four Cream tiles, each crossed out in Returns Red: \"50% OFF\", \"shop name\", \"web address\", \"symbols\". Sold Green tick on a plain example title at the bottom."}, "PIN21": {"id": "PIN21", "title": "Free UK Listing Cheat Sheet: 10 Prompts and a Character Limit Table", "description": "Get The UK Listing Cheat Sheet free: 10 copy and paste AI prompts for listings plus a character limit table for eBay, Vinted, Depop, Etsy, Amazon and TikTok Shop. Made for UK sellers who use free ChatGPT, Claude or Gemini.", "board": "Listing Templates and Prompts", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Large parcel-label card: \"The UK Listing Cheat Sheet\" in Archivo 800, \"Free\" in Label Yellow. Underneath: \"10 prompts + character limit table\". Mock-up of a single cream page with rows. Sold Green \"Get it free\" button shape."}, "PIN22": {"id": "PIN22", "title": "Listing Character Limits by Platform: eBay, Vinted, Depop, Etsy and More", "description": "Keep every title within the limit: a one-page character limit table for eBay, Vinted, Depop, Etsy, Amazon and TikTok Shop, for UK sellers. Limits change, so each one shows when it was last checked. Free in The UK Listing Cheat Sheet.", "board": "Reseller Organisation", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline: \"Character limits, one page\". A table graphic with platform names in plain text (no logos) and blurred-out numbers behind a Kraft \"In the free cheat sheet\" label. Small \"last checked\" line."}, "PIN23": {"id": "PIN23", "title": "7 Checks Before You Press List: A Reseller Pre-Post Checklist", "description": "A seven point checklist to run before you press list: title within the limit, no [CHECK] notes left in, every flaw written and photographed, measurements in cm, UK words and sizes, no other brand names in the title, and your lowest price kept private. Printable for UK resellers.", "board": "Reseller Organisation", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"7 checks before you list\". Printable checklist with empty tick boxes, one Sold Green tick filled in. Kraft border around the page."}, "PIN24": {"id": "PIN24", "title": "A Weekly Listing Routine for Part-Time Resellers", "description": "A calm weekly listing routine for part-time resellers: one session to photograph, one to write listings in a batch, one to answer messages and review prices. Fits around a busy week and keeps eBay and Vinted listing from taking over your evenings.", "board": "Reseller Organisation", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline: \"A weekly listing routine\". A simple week planner graphic with three highlighted blocks (Photos / Write / Messages and prices) in Kraft, Sold Green and Label Yellow. No clock or income wording."}, "PIN25": {"id": "PIN25", "title": "5 Americanisms AI Sneaks Into UK Listings (and the UK Word)", "description": "AI tools often write American: sweater, pants, color, shipping and US sizes. Five swaps for UK listings, such as jumper, trousers, colour and postage, plus one line to add to any prompt so ChatGPT writes in UK English for UK buyers.", "board": "eBay Selling Tips UK", "link": "/blog/chatgpt-prompts-for-ebay-listings.html", "design": "1000 x 1500, Cream background. Headline: \"AI wrote it American\". Two columns: US word in grey struck through in Returns Red, UK word in Ink with Sold Green tick (sweater / jumper, pants / trousers, color / colour, shipping / postage, US 8 / UK 12). Note: \"Size swaps vary by brand, check the label\"."}, "PIN26": {"id": "PIN26", "title": "How to Measure Clothes for Vinted and eBay: Pit to Pit, Length, Inside Leg", "description": "How to measure clothes for your listings: pit to pit, length and inside leg, laid flat, in centimetres. Measurements answer the \"will it fit?\" question before buyers ask it. A quick guide for selling second hand clothes online in the UK.", "board": "Vinted Selling Tips", "link": "/blog/vinted-description-template.html", "design": "1000 x 1500, Cream background. Headline: \"Measure it like this\". Flat line drawings of a jumper and trousers with dashed Kraft measurement lines labelled \"pit to pit\", \"length\", \"inside leg\". \"Laid flat, in cm\" in Label Yellow."}, "PIN27": {"id": "PIN27", "title": "Depop Description Outline: A Simple Structure That Covers Everything", "description": "Four parts for every Depop description: opening line with brand and item, size and measurements, condition and any wear, then relevant hashtags. Short, clear and honest, as Depop's own tips suggest. Check the current hashtag rules in Depop's help pages.", "board": "Listing Templates and Prompts", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Depop description outline\". Four stacked sections with numbered Kraft circles. Example text in Inter with \"Example\" label. No Depop logo."}, "PIN28": {"id": "PIN28", "title": "Listing Photo Checklist: The Shots Every Listing Needs", "description": "A listing photo checklist for eBay, Vinted and Depop: the whole item first, front and back, labels, close ups, every flaw and what is included. Use your own photos of the actual item, in daylight, on a plain background. Printable reseller checklist.", "board": "Reseller Organisation", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline: \"The photo checklist\". A 3 x 3 grid of simple camera-frame outlines, each labelled (Whole item / Front / Back / Label / Close up / Flaw / Included / Scale / Detail). Sold Green ticks. No real photos of people or homes."}, "PIN29": {"id": "PIN29", "title": "Bundle Offer Message Template for Vinted and Depop Sellers", "description": "A friendly bundle offer message for Vinted and Depop: thank the buyer, name the items, give one clear bundle price and a postage note, and invite them to send it through the app. Helps buyers say yes without a long back and forth.", "board": "Vinted Selling Tips", "link": "/blog/vinted-message-templates.html", "design": "1000 x 1500, Ink background. Headline in Cream: \"Bundle offer? Send this\". A Cream chat bubble with the example message, the bundle price highlighted in Label Yellow and \"Example\" label. Three small stacked parcel icons in Kraft."}, "PIN30": {"id": "PIN30", "title": "Declutter and Sell: Start Every Listing With a 2-Minute Listing Brief", "description": "Clearing the loft and ready to sell? Start each item with a short listing brief: what it is, brand, size, condition, flaws, what is included and your lowest price. It makes writing titles and descriptions faster, by hand or with AI. Free UK cheat sheet.", "board": "Reseller Organisation", "link": "/#free-cheat-sheet", "design": "1000 x 1500, Cream background. Headline on parcel-label card: \"Declutter and sell: start here\". A fill-in brief card with seven labelled lines in JetBrains Mono, Kraft tape strip, and a simple box icon. \"2 minutes\" in Label Yellow."}}, "blog": {"B01": {"id": "B01", "title": "How to Write an eBay Title (UK): Formula and Examples", "slug": "how-to-write-an-ebay-title-uk", "file": "launch-kit/marketing/d-blog/B01-how-to-write-an-ebay-title-uk.md"}, "B02": {"id": "B02", "title": "Vinted Description Template (Free, Copy and Paste)", "slug": "vinted-description-template", "file": "launch-kit/marketing/d-blog/B02-vinted-description-template.md"}, "B03": {"id": "B03", "title": "eBay Condition Description Examples (UK Sellers)", "slug": "ebay-condition-description-examples", "file": "launch-kit/marketing/d-blog/B03-ebay-condition-description-examples.md"}, "B04": {"id": "B04", "title": "eBay Item Specifics UK: How to Fill Them In Properly", "slug": "ebay-item-specifics-uk", "file": "launch-kit/marketing/d-blog/B04-ebay-item-specifics-uk.md"}, "B05": {"id": "B05", "title": "ChatGPT Prompts for eBay Listings (UK, Copy and Paste)", "slug": "chatgpt-prompts-for-ebay-listings", "file": "launch-kit/marketing/d-blog/B05-chatgpt-prompts-for-ebay-listings.md"}, "B06": {"id": "B06", "title": "ChatGPT Etsy Listing Prompt: Titles and Descriptions", "slug": "chatgpt-etsy-listing-prompt", "file": "launch-kit/marketing/d-blog/B06-chatgpt-etsy-listing-prompt.md"}, "B07": {"id": "B07", "title": "How to Price Items on Vinted UK: A Calm Method", "slug": "how-to-price-items-on-vinted-uk", "file": "launch-kit/marketing/d-blog/B07-how-to-price-items-on-vinted-uk.md"}, "B08": {"id": "B08", "title": "How to Respond to Lowball Offers on Vinted", "slug": "how-to-respond-to-lowball-offers-vinted", "file": "launch-kit/marketing/d-blog/B08-how-to-respond-to-lowball-offers-vinted.md"}, "B09": {"id": "B09", "title": "Vinted Message Templates: 14 Polite Replies to Copy", "slug": "vinted-message-templates", "file": "launch-kit/marketing/d-blog/B09-vinted-message-templates.md"}, "B10": {"id": "B10", "title": "TikTok Shop Product Title UK: Rules and Examples", "slug": "tiktok-shop-product-title-uk", "file": "launch-kit/marketing/d-blog/B10-tiktok-shop-product-title-uk.md"}}, "launch": [{"n": 1, "title": "Check the name is free", "mins": 5, "part": "Part 1: Brand identity (22 minutes)", "detail": "<p>Search \"Well Listed\" on the UK IPO trade mark search (search \"UK IPO trade mark search\" on Google) in classes 9, 35 and 41, and search the handle <code>welllisted.uk<\/code> / <code>welllisteduk<\/code> / <code>well.listed.uk<\/code> on TikTok, Instagram, YouTube and Pinterest. If something very similar exists in the same field, pick an alternative from <code>01-brief/BRIEF.md<\/code> and tell Claude to rename everything (it can do it in one go).<\/p>"}, {"n": 2, "title": "Create the brand email", "mins": 5, "part": "Part 1: Brand identity (22 minutes)", "detail": "<p>Make a new free Gmail or Outlook address such as <code>hello.welllisted@gmail.com<\/code> (use the brand name, not yours; birthday and phone number are only for account recovery and are not shown publicly). This email is used for every account below.<\/p>"}, {"n": 3, "title": "Decide the legal identity", "mins": 5, "part": "Part 1: Brand identity (22 minutes)", "detail": "<p>Read point 12 of <code>ASSUMPTIONS.md<\/code>. Either (a) sole trader: your legal name goes only in the legal notice at the bottom of the sales page and in the privacy notice, or (b) limited company: the company name goes there instead, but it has to exist first, so launch once it is set up (adds cost, see MONEY.md). Tell Claude your choice and it will write it in STATE.md. <strong>If unsure, choose (a) for launch and switch later.<\/strong><\/p>"}, {"n": 4, "title": "Make the logo files", "mins": 7, "part": "Part 1: Brand identity (22 minutes)", "detail": "<p>In Canva (free, sign up with the brand email): create a 1080 x 1080 design, cream background <code>#FAF6EF<\/code>, the letters \"WL\" in Archivo or Montserrat ExtraBold, colour <code>#1F2A44<\/code>, and a green tick <code>#1E7F55<\/code>. Download as PNG. This is your profile picture everywhere. Details: <code>01-brief/BRAND-GUIDE.md<\/code>.<\/p>"}, {"n": 5, "title": "TikTok", "mins": 7, "part": "Part 2: Social accounts (26 minutes)", "detail": "<p>Sign up, set name \"Well Listed\", handle as close to <code>welllisted.uk<\/code> as possible. Settings: switch to a Business account (category: Education or Business services). Add the bio. The website link field may only appear later; add it when it does. Until then, put \"Link in Instagram bio\" in the bio.<\/p>"}, {"n": 6, "title": "Instagram", "mins": 6, "part": "Part 2: Social accounts (26 minutes)", "detail": "<p>Sign up with the brand email (not \"continue with Facebook\" from your personal Facebook). Switch to a Professional account, Business. Add the bio. The sales page link comes in step 12; you add it in step 13.<\/p>"}, {"n": 7, "title": "YouTube", "mins": 6, "part": "Part 2: Social accounts (26 minutes)", "detail": "<p>Using the brand Gmail, create a YouTube <strong>channel<\/strong> named \"Well Listed\" (choose \"use a custom name\", which creates a brand account separate from your personal name). Add the logo and bio.<\/p>"}, {"n": 8, "title": "Pinterest", "mins": 7, "part": "Part 2: Social accounts (26 minutes)", "detail": "<p>Create a <strong>business<\/strong> account with the brand email. Create 4 boards: \"eBay Selling Tips UK\", \"Vinted Selling Tips\", \"Listing Templates and Prompts\", \"Reseller Organisation\". Claim your website once it is live (step 12, optional today).<\/p>"}, {"n": 9, "title": "Gumroad product", "mins": 13, "part": "Part 3: Shop, website and email (51 minutes)", "detail": "<p>Sign up at Gumroad with the brand email. Pick the username <code>welllisted<\/code> (or close to it), never your own name: it appears in the product link. In Settings, set the profile name to \"Well Listed\". Create a product:<\/p>\n<ul>\n<li>Name: <strong>The Well Listed Kit<\/strong>. Price: <strong>£12<\/strong> (set currency to GBP in settings first).<\/li>\n<li>Upload the file <code>product/dist/Well-Listed-Kit.zip<\/code> (download it from GitHub: open the file, tap \"Download raw\").<\/li>\n<li>Description, summary and tags: copy from <code>marketing/i-marketplace-listings/listings.md<\/code> (Gumroad section).<\/li>\n<li>Cover image: use the Canva cover described in the same file (5 minutes to make).<\/li>\n<li>Turn on \"Allow customers to pay what they want\"? <strong>No.<\/strong> Keep it simple.<\/li>\n<li>Refund policy: set to match the sales page guarantee (30 days, no questions).<\/li>\n<li>Make sure the description includes \"Instant download. By buying you agree to immediate access.\" (it is in the copy in <code>listings.md<\/code>; the terms page relies on it).<\/li>\n<li>Connect your bank account for payouts (Gumroad asks for this; this is the only place payment details go).<\/li>\n<li>Copy the product link (it looks like <code>https://welllisted.gumroad.com/l/...<\/code>).<\/li>\n<\/ul>"}, {"n": 10, "title": "Email tool", "mins": 15, "part": "Part 3: Shop, website and email (51 minutes)", "detail": "<p>Sign up to MailerLite free with the brand email. It will ask for a physical address for the footer of emails (the law requires one): use your business address, or a PO box or registered office service if you prefer not to use home (see ASSUMPTIONS.md point 12).<\/p>\n<ul>\n<li>Create a group called \"Cheat sheet\".<\/li>\n<li>Create an embedded form with just an email field (and optional first name). Copy its embed code.<\/li>\n<li>Create an automation: trigger \"joins group Cheat sheet\". Add the 7 welcome emails from <code>marketing/e-email/welcome-sequence.md<\/code> with the delays written there. Leave the cheat sheet link in email 1 as <code>[CHEAT_SHEET_LINK]<\/code> for now: you fill it in at step 13.<\/li>\n<li>Turn on double opt-in (recommended, keeps the list clean).<\/li>\n<\/ul>"}, {"n": 11, "title": "Put the links into the sales page", "mins": 5, "part": "Part 3: Shop, website and email (51 minutes)", "detail": "<p>Start a Claude session and paste: the Gumroad link, the brand email, your legal name and address (or company details), the launch end date and the MailerLite form embed code. The launch end date is day 14, which is launch day plus 13 days: launch on Monday 5 October 2026 and the end date is Sunday 18 October 2026. Say \"fill in the sales site placeholders, rebuild and push\". Claude puts the values in <code>sales-site/placeholders.json<\/code>, runs <code>python3 launch-kit/tools/build_site.py<\/code> (which rebuilds the <code>sales-site/netlify-site/<\/code> folder) and pushes the change to GitHub. Never paste passwords. (Details: <code>sales-site/README.md<\/code>.)<\/p>"}, {"n": 12, "title": "Go live on Netlify", "mins": 12, "part": "Part 3: Shop, website and email (51 minutes)", "detail": "<p>On a computer (drag and drop does not work on a phone), download a fresh ZIP from GitHub (see \"Where the files are\" above), unzip it and find <code>launch-kit/sales-site/netlify-site<\/code>. Sign up to Netlify with the brand email. Choose \"Add new site\", then \"Deploy manually\", and drag the whole <code>netlify-site<\/code> folder onto the page. Netlify gives you a web address like <code>random-name-123.netlify.app<\/code>: change it to something like <code>well-listed<\/code> in Site configuration, \"Change site name\". Tell Claude the address and say \"put this in site_url, rebuild and push\" (this fills in the cheat sheet link and share previews). Download a fresh ZIP again and, in Netlify, open Deploys and drag the new <code>netlify-site<\/code> folder onto the drag and drop box.<\/p>"}, {"n": 13, "title": "Add the link everywhere and test", "mins": 6, "part": "Part 3: Shop, website and email (51 minutes)", "detail": "<p>In MailerLite, open welcome email 1 and put in the cheat sheet link: your Netlify address followed by <code>/free/uk-listing-cheat-sheet.pdf<\/code>. Put the Netlify address in the Instagram, TikTok (when available), YouTube and Pinterest bios. Then test on your phone: open the site, press the buy button (it should open Gumroad at £12), and sign up with a spare email address to check welcome email 1 arrives with a working cheat sheet link.<\/p>"}, {"n": 14, "title": "Make and post Day 1 Slot A", "mins": 10, "part": "Part 4: First posts (20 minutes)", "detail": "<p>Open the dashboard, find Day 1, and follow the 10-minute method in <code>marketing/j-tools/free-tools-and-10-minute-workflow.md<\/code>. The reusable templates are not set up yet, so keep this first one simple (text over a screen recording is fine). Post to TikTok, Instagram Reels and YouTube Shorts.<\/p>"}, {"n": 15, "title": "Make and schedule Day 1 Slot B and the first pin", "mins": 7, "part": "Part 4: First posts (20 minutes)", "detail": "<p>Slot B for 19:30, PIN01 for 12:00 (or now, if it is already past 12:00).<\/p>"}, {"n": 16, "title": "Tell Claude you have launched", "mins": 3, "part": "Part 4: First posts (20 minutes)", "detail": "<p>Start a session and say: \"We launched today. Launch date is [today's date]. Gumroad link is [link]. Netlify address is [address].\" It will fill in the Key facts in STATE.md (launch date, launch price end date, links) and rebuild the dashboard, so the daily operator knows today is day 1. From tomorrow morning, follow <code>ROUTINE.md<\/code>: add yesterday's numbers, then type \"Run OPERATOR.md\".<\/p>"}], "metrics": [], "plan": null, "default_tasks": ["Add yesterday's numbers to metrics (5 min)", "Type \"Run OPERATOR.md\" in Claude Code and read the plan (3 min)", "Make and post Slot A to TikTok, Reels and Shorts (10 min)", "Schedule Slot B for 19:30 and today's pin for 12:00 (5 min)", "Reply to every comment and message on the brand accounts (5 min)", "Tick off today and note any good questions for future posts (2 min)"]};
const store={get(k,d){try{const v=localStorage.getItem('wl:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('wl:'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const COPY=[];
function copyBtn(label,text){if(!text)return'';COPY.push(text);return `<button class="btn alt" data-copy="${COPY.length-1}">Copy ${esc(label)}</button>`}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
