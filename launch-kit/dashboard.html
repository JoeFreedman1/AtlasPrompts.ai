 label.\" | On screen: \"AFTER: 'Microwaveable wheat bag with dried lavender. Cotton cover. Heating instructions on the label.'\"\n7. (22 to 25s) VO: \"Describe what it is, not what it does to the body. Check the current policy in Seller Center.\" | On screen: \"Say what it is, not what it cures\"", "onscreen": "3 problems in one description\nBEFORE: \"Relieves back pain... 100% natural... Only 3 left!\"\n1. Health claim\n2. Vague safety claim\n3. Urgency that isn't true\nAFTER: what it is, what it's made of\nSay what it is, not what it cures", "caption": "Three problems in one TikTok Shop description, and none of them are spelling. \"Relieves back pain\" is a health claim: TikTok Shop UK's own policies say products must not claim to cure, treat, prevent or relieve a disease or medical condition, in the listing or the video. \"100% natural and totally safe\" is a claim you cannot back up with a checkable fact. \"Only 3 left\" is fake urgency unless it is actually true. The fix is plain: say what it is and what it is made from, and let the label handle the instructions. Rules change, so check the current policy in TikTok Shop Seller Center before you list. Our free UK Listing Cheat Sheet has a list of words to keep out, link in bio.", "hashtags": "#tiktokshopuk #smallbusinessuk #listingtips #tiktokshopseller", "visuals": "Text-only build in CapCut, 9:16, Cream background. The \"before\" paragraph types on in grey Inter. Then three Label Yellow highlighter swipes animate across \"relieves back pain\", \"100% natural and totally safe\" and \"Only 3 left\", each followed by a Returns Red strike-through and a numbered label. The \"after\" paragraph slides in underneath in Ink with a Sold Green tick. B-roll behind slides 1 and 7: Pexels search \"lavender wheat bag\" or \"dried lavender flat lay\" (no people). Do not show any real shop, brand or TikTok Shop interface; do not use the TikTok logo.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P24": {"id": "P24", "title": "Guessing a price vs pricing from sold comps", "format": "Before/after (split screen, voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 to 30 seconds", "cta": "Soft (save)", "hook": "\"Guessed £45. The last five matching pairs sold for £18 to £30.\"", "script": "1. (0 to 2s) VO: \"Guessed forty-five pounds. The last five matching pairs sold for eighteen to thirty.\" | On screen: \"Guess: £45. Sold: £18 to £30.\"\n2. (2 to 6s) VO: \"Before. Hunter tall wellies, green, UK 5. Priced from memory, because they cost a lot new.\" | On screen: \"BEFORE: priced from memory\"\n3. (6 to 10s) VO: \"A price from memory feels safe. It is still a guess, and buyers can look up sold prices too.\" | On screen: \"Buyers can see sold prices too\"\n4. (10 to 16s) VO: \"After. Turn on the sold filter and copy five pairs: same boot, same size. Write down the postage each one charged.\" | On screen: \"AFTER: 5 sold pairs, with postage\"\n5. (16 to 22s) VO: \"Now compare like with like. Two pairs had splits at the ankle and sold low. Ours has no splits, so those two come out.\" | On screen: \"Match the condition, not just the name\"\n6. (22 to 27s) VO: \"The three good matches ran from twenty-two to thirty. List at twenty-seven, floor twenty.\" | On screen: \"List £27. Floor £20. (Example figures)\"\n7. (27 to 30s) VO: \"The answer was on the sold page all along. Save this.\" | On screen: \"The answer was on the sold page.\"", "onscreen": "Guess: £45. Sold: £18 to £30.\nBEFORE: priced from memory\nBuyers can see sold prices too\nAFTER: 5 sold pairs, with postage\nMatch the condition, not just the name\nList £27. Floor £20.\nExample figures only\nThe answer was on the sold page.", "caption": "Guessed £45, but the last five matching pairs sold for £18 to £30. A price from memory (\"they cost a lot new\") is still a guess.\n\nThe fix takes about ten minutes:\n1. Turn on the Sold items filter on eBay and copy five pairs that match: same boot, same size.\n2. Note the postage each one charged.\n3. Compare like with like. In our example, two pairs had splits at the ankle and sold low, so they are not fair comparisons for a pair without splits.\n\nWhat is left gives you a range, a list price and a floor. Paste the good matches into any free AI tool and ask it to show the sums if you want the maths done for you.\n\nEvery figure here is invented for illustration. Save this for the next thing you are not sure how to price.", "hashtags": "#ebaysellertips #vintedpricing #resellinguk #resellercommunityuk", "visuals": "Split screen, top and bottom. Top (BEFORE): grey card with a big \"£45?\" and a Returns Red question mark. Bottom (AFTER): screen recording of a notes app with five invented comps typed out by us (e.g. \"Hunter tall wellies green UK5, light scuffs, sold £26 + £4.50 post\"); the two \"split at ankle\" lines get a Returns Red strike-through as poor matches, and the floor line gets a Label Yellow box. Put a small persistent tag \"Example figures only\" in Inter at the top of slides 5 and 6. Do not screen-record real eBay search results or real sellers' listings. B-roll: Pexels search \"green rubber boots\" (no people, no feet; blur any visible logo). Blur account names in any AI tool shown.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P25": {"id": "P25", "title": "Myth: longer descriptions always sell better", "format": "Myth (carousel, 6 slides)", "best": "Instagram carousel, TikTok photo mode", "length": "6 slides", "cta": "Soft (save)", "hook": "\"Myth: a longer description sells better. Nobody reads 300 words about a pair of chinos.\"", "script": "1. Slide 1 (Myth stamp, Returns Red): \"Myth: a longer description sells better. Nobody reads 300 words about a pair of chinos.\"\n2. Slide 2: \"What buyers actually want: their questions answered before they ask. That's complete, not long.\"\n3. Slide 3 (BEFORE, grey): \"'These gorgeous chinos are perfect for smart-casual days and will become a staple in your wardrobe, pairing beautifully with a crisp shirt...' (four more lines like this)\"\n4. Slide 4 (AFTER, Ink, 5 lines): \"M&S navy slim-fit chinos, W34 L31. Cotton blend (check label for %). Waist 44 cm flat, inside leg 79 cm. Good condition: light fading on both back pockets (photo 5). Posted within 2 days.\"\n5. Slide 5: \"The five-line test: what is it, what size really, what's it made of, what's wrong with it, when does it post. If a line doesn't answer one of those, cut it.\"\n6. Slide 6 (parcel label): \"Short, true, complete. Save this and use the five-line test tonight.\"", "onscreen": "Myth: longer sells better\nBuyers want answers, not adjectives\nBEFORE: 60 words of \"gorgeous\"\nAFTER: 5 lines, every one useful\nThe five-line test\nShort, true, complete", "caption": "Myth: longer descriptions sell better. What buyers want is their questions answered before they have to message you, and that is about being complete, not long. Our five-line test for a clothing description: what it is, the size on the label plus real measurements laid flat, what it is made of (from the care label), the condition with every flaw and where it is, and when it will be posted. Anything that does not answer one of those, like \"perfect for smart-casual days\", can go. On a phone, five clear lines beat a paragraph of adjectives every time you scroll. The example here is invented. Save this and try the five-line test on your next listing.", "hashtags": "#vintedtips #howtowritevinteddescription #resellercommunityuk #listingtips", "visuals": "Canva carousel, 1080 x 1350. Slide 1: a Returns Red rubber-stamp graphic reading \"MYTH\" over the text, Cream background. Slide 3: a long block of grey text with a Returns Red strike-through across all of it (make the text deliberately long and small). Slide 4: five short lines, each with a Sold Green tick, and the words \"44 cm\" and \"fading\" highlighted in Label Yellow. Slide 5: a simple 5-row checklist graphic. Optional background photo on slide 6: Pexels search \"navy chinos folded\" (no people). Invented item only.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P26": {"id": "P26", "title": "Myth: using AI for listings gets you banned", "format": "Myth (voiceover over screen recording and stock)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "30 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"eBay and Depop have their own AI listing tools. So no, AI isn't the problem.\"", "script": "1. (0 to 2s) VO: \"eBay and Depop have their own AI listing tools. So no, AI isn't the problem.\" | On screen: \"Myth: AI listings get you banned\"\n2. (2 to 8s) VO: \"eBay's app can draft a listing from a photo. Depop's Generate Description drafts one too, and Amazon offers AI listing tools to UK sellers.\" | On screen: \"The platforms build AI tools themselves\"\n3. (8 to 14s) VO: \"What gets sellers into trouble is what the words say. Invented details. Claims you can't back up. Keyword spam.\" | On screen: \"The problem: what the words say\"\n4. (14 to 19s) VO: \"And photos. An AI edit that hides a stain or changes the colour misrepresents the item.\" | On screen: \"And photos that aren't the real item\"\n5. (19 to 25s) VO: \"Our three checks on any AI draft. Is every fact from my item? Is every claim provable? Would the buyer get exactly this?\" | On screen: \"1. Every fact mine? 2. Every claim provable? 3. Exactly what they get?\"\n6. (25 to 30s) VO: \"Rules differ by platform, and Etsy has its own AI disclosure rules for items. Check the current help pages. Free cheat sheet, link in bio.\" | On screen: \"Check each platform's current rules\"", "onscreen": "Myth: AI listings get you banned\nThe platforms build AI tools themselves\nThe problem: what the words say\nAnd photos that aren't the real item\n1. Every fact mine? 2. Every claim provable? 3. Exactly what they get?\nCheck each platform's current rules", "caption": "Myth: using AI to write listings gets you banned. eBay, Depop and Amazon all offer their own AI listing tools, so AI help in itself is not the issue. What causes problems is the content: invented details, claims you cannot support (\"rare\", \"genuine\", \"fully working\"), keyword spam, and photos edited so they no longer show the real item. Our three checks for any AI draft: is every fact from my actual item, is every claim provable, and is this exactly what the buyer will get? Etsy has specific rules for AI-generated or AI-assisted items and how to disclose them, so read those if you sell there. Rules change, so check the current rules in each platform's help pages. Free UK Listing Cheat Sheet, link in bio.", "hashtags": "#ebayseller #depopseller #chatgpttips #resellertok #listingtips", "visuals": "Do not show eBay, Depop or Amazon logos or app screens. Slides 1 to 2: text on Ink background with Cream text, platform names in plain type only. Slides 3 to 4: screen recording of a free AI chat tool producing a listing draft for an invented item (e.g. \"Pyrex glass mixing bowl\"), then Returns Red highlighter over an invented detail the AI added (\"rare 1970s\") with a caption \"not in my notes\". Slide 4 b-roll: Pexels search \"hands holding phone photographing clothes\" (hands only, no face, no reflections). Slide 5: three-line checklist graphic with Sold Green ticks. Blur account name and chat sidebar.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P27": {"id": "P27", "title": "Myth: stuff every keyword into the title", "format": "Myth (before/after with character counter)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "20 to 25 seconds", "cta": "Soft (save)", "hook": "\"'Zara, Mango style, Topshop vibes.' Three brands in the title. The dress is from Warehouse.\"", "script": "1. (0 to 2s) VO: \"Zara, Mango style, Topshop vibes. Three brands in the title. The dress is from Warehouse.\" | On screen: \"3 brands. None of them are the item.\"\n2. (2 to 7s) VO: \"Before. Zara Mango Topshop style dress midi dress summer dress boho Y2K stunning.\" | On screen: \"BEFORE: 'Zara Mango Topshop Style Dress Midi Dress Summer Dress Boho Y2K Stunning'\"\n3. (7 to 12s) VO: \"Other brands as keywords is keyword spam. It can break platform rules, and buyers searching Mango feel misled.\" | On screen: \"Other brands = keyword spam\"\n4. (12 to 15s) VO: \"Dress three times adds nothing. On Amazon, repeating a word more than twice breaks the title rules.\" | On screen: \"Repeats waste space\"\n5. (15 to 21s) VO: \"After. Warehouse women's green satin midi slip dress, size 10, bias cut, adjustable straps. Seventy-nine characters. Every word is true and searchable.\" | On screen: \"AFTER: 'Warehouse Womens Green Satin Midi Slip Dress Size 10 Bias Cut Adjustable Straps' (79/80)\"\n6. (21 to 25s) VO: \"The words a buyer would type, in the order they'd type them. Save this.\" | On screen: \"Words buyers type. Nothing untrue.\"", "onscreen": "3 brands. None of them are the item.\nBEFORE: Zara Mango Topshop Style Dress...\nOther brands = keyword spam\nRepeats waste space\nAFTER: Warehouse Womens Green Satin Midi Slip Dress Size 10 Bias Cut Adjustable Straps\n79 of 80 characters (eBay UK)\nWords buyers type. Nothing untrue.", "caption": "Stuffing every keyword into a title does not help, and some of it can break the rules. Naming brands you are not selling (\"Zara\", \"Mango style\" on a Warehouse dress) is keyword spam: eBay has a search and browse manipulation policy, and buyers who searched for Mango just feel misled. Repeating \"dress\" three times wastes space, and on Amazon UK the same word may not appear more than twice. A good title is the words a buyer would type, in the order they would type them: brand, who it is for, item type, style, colour, material, size, then a useful detail. Our after example is 79 characters, inside eBay UK's 80. Check the current title rules in your platform's help pages. Save this for your next dress.", "hashtags": "#ebaysellertips #ebaytitle #vintedseller #resellercommunityuk #ebayuk", "visuals": "CapCut, 9:16, Cream background. The BEFORE title types on in grey with a live character counter in the corner (JetBrains Mono). Then Returns Red strike-through animates across \"Zara\", \"Mango\", \"Topshop\", \"Style\", the two extra \"Dress\" and \"Stunning\". AFTER title types on in Ink with the counter ticking to \"79/80\" in Sold Green; highlight \"Warehouse\" in Label Yellow. B-roll behind hook: Pexels search \"green satin dress on hanger\" (no model, no face). Do not show brand logos; brand names appear only as plain text in the example title.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P28": {"id": "P28", "title": "Myth: private sellers must accept every return", "format": "Myth (carousel, 8 slides)", "best": "Instagram carousel, TikTok photo mode, Facebook", "length": "8 slides", "cta": "Soft (save / free cheat sheet)", "hook": "\"Selling your old coat on Vinted? You're not a shop, and the returns rules know it.\"", "script": "1. Slide 1 (hook, Myth stamp): \"Selling your old coat on Vinted? You're not a shop, and the returns rules know it.\"\n2. Slide 2: \"Myth: every seller has to accept returns. Truth: it depends on whether you're a private seller or a trader.\"\n3. Slide 3 (Private sellers): \"Private seller (selling your own things): the 14-day 'change of mind' right to cancel applies when a business sells online. It does not apply to a private sale, so you can say 'no returns'.\"\n4. Slide 4 (the catch): \"But 'no returns' doesn't cover everything. The item still has to be as described. If it isn't, the buyer can use the platform's buyer protection or claim process.\"\n5. Slide 5 (Traders): \"Trader (buying to resell, making things to sell, or selling as a business): UK consumers generally get 14 days from delivery to cancel most online purchases, plus rights if goods are faulty or not as described. On Vinted, traders sell through Vinted Pro, where returns within 14 days apply.\"\n6. Slide 6 (worked example): \"Example. Private seller, no returns, coat listed as 'no marks'. Buyer finds a stain on the lining. That's a not-as-described problem, not change of mind. Honest listing = the best protection.\"\n7. Slide 7: \"How to protect yourself: describe every flaw, photograph it, state your policy once, calmly. This is general information, not legal or tax advice.\"\n8. Slide 8 (parcel label): \"Check the current rules on gov.uk and in your platform's help pages. Save this.\"", "onscreen": "You're not a shop. The rules know it.\nPrivate seller or trader?\nPrivate: no legal \"change of mind\" right\nBut: it must be as described\nTrader: 14 days to cancel, plus faulty-goods rights\nExample: stain not in the listing = not as described\nDescribe every flaw. Photograph it.\nGeneral information, not tax or legal advice", "caption": "Do private sellers have to accept every return? No, but \"no returns\" is not a free pass either. The 14-day right to cancel online purchases is a consumer rule for traders, so if you are selling your own unwanted things, you can say no to change-of-mind returns. The item still has to match its description, and platforms run their own buyer protection for items that are significantly not as described. If you are buying to resell or selling as a business, you are likely a trader, and your buyers have more rights (on Vinted that means Vinted Pro, where 14-day returns apply). The safest policy is an honest listing with every flaw photographed. This is general information, not tax or legal advice: check gov.uk and your platform's current help pages.", "hashtags": "#vintedsellertips #ebayseller #resellercommunityuk #vintedsellinguk #ukseller", "visuals": "Canva carousel, 1080 x 1350. Slide 1: parcel-label card over Pexels stock \"coat on hanger wooden rail\" (no people). Slides 3 and 5 as a two-column comparison: left column \"Private seller\" with a kraft tape strip header, right column \"Trader\" with an Ink header; keep 12 words or fewer of large text per slide and put the detail in smaller Inter underneath. Slide 6: a mock listing card in grey (\"Wool coat, size 12, no marks\") with a Returns Red circle around \"no marks\" and a small inset photo of a stain (stage it with a coffee drop on a scrap of fabric, never a buyer's photo). Slide 7: the disclaimer \"This is general information, not tax or legal advice\" in Ink on a Label Yellow band (Ink text, never white). Slide 8: parcel label with \"gov.uk\" and \"platform help pages\" in plain text. No platform logos.\n\nFact notes for the scheduler (not for the post): private vs trader distinction and the 14-day cancellation right come from the Consumer Contracts Regulations 2013 (applies to traders); Vinted Pro 14-day returns is VERIFIED in `research/platform-rules-uk.md`. The UK law points are marked NOT VERIFIED this session because gov.uk could not be opened; recheck https://www.gov.uk/accepting-returns-and-giving-refunds before posting.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P29": {"id": "P29", "title": "Myth: ChatGPT makes things up, so it's useless for listings", "format": "Myth (screen recording plus voiceover)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "30 seconds", "cta": "Kit", "hook": "\"The notes said one battery. The AI listing said two.\"", "script": "1. (0 to 2s) VO: \"The notes said one battery. The AI listing said two.\" | On screen: \"Notes: 1 battery. Listing: 2.\"\n2. (2 to 6s) VO: \"That's the fair complaint about AI. Leave a gap and it fills it with a guess that sounds right.\" | On screen: \"Myth: AI makes things up, so it's useless\"\n3. (6 to 10s) VO: \"The notes were: Bosch cordless drill, eighteen volt, one battery, charger, case, used, works.\" | On screen: \"Notes: 'bosch drill 18v, 1 battery, charger, case, used, works'\"\n4. (10 to 16s) VO: \"So change the instruction. Use only facts in my notes. If something's missing, write CHECK and tell me what to find out.\" | On screen: \"'Use ONLY facts in my notes. Write [CHECK: ...] for anything missing.'\"\n5. (16 to 23s) VO: \"Now look. Included: one battery, charger, case. Battery capacity: CHECK the label. Tested: CHECK, what did you actually try?\" | On screen: \"Battery: 1 [CHECK: Ah on label] / Tested: [CHECK: what you tried]\"\n6. (23 to 27s) VO: \"No second battery. Just a to-do list you fill in with the drill in front of you.\" | On screen: \"No guesses. Just a to-do list.\"\n7. (27 to 30s) VO: \"That's the Listing Brief method in The Well Listed Kit. Link in bio.\" | On screen: \"The Listing Brief method\"", "onscreen": "Notes: 1 battery. Listing: 2.\nMyth: AI makes things up, so it's useless\nNotes: bosch drill 18v, 1 battery, charger, case\n\"Use ONLY facts in my notes. Write [CHECK] for gaps.\"\nBattery: 1 [CHECK: Ah on label]\nNo guesses. Just a to-do list.", "caption": "AI tools do make things up, mostly when you leave gaps. Give a free AI chat tool \"bosch drill 18v, 1 battery, charger, case, used, works\" and ask for a listing, and it may helpfully add a second battery or \"barely used\". On a drill, that is a \"not as described\" claim waiting to happen.\n\nThe fix is one instruction: use only the facts in my notes, and write [CHECK: ...] wherever something is missing.\n\nNow you get a short to-do list instead: read the battery label, say what you tested, pick a condition word. You fill those in with real facts and the listing is accurate.\n\nWe call it the Listing Brief method, and every prompt in The Well Listed Kit is built on it (link in bio). Or copy the instruction from this video and use it today. Example item.", "hashtags": "#chatgptprompts #ebaysellertips #resellinguk #chatgpt #ukseller", "visuals": "Screen recording of a free AI chat tool on a laptop, cropped to the chat. First run: prompt \"Write an eBay listing: bosch drill 18v, 1 battery, charger, case, used, works\". Highlight any invented wording in Returns Red (if the tool does not invent anything on the day, show a mock-up clearly labelled \"example of a typical guess\"; do not fake a real tool's output). Second run: the B1 prompt from Module 01 with the same notes; zoom on the [CHECK] lines and highlight them in Label Yellow. B-roll: Pexels search \"cordless drill on workbench\" (no people; blur any brand logo). Blur account name, profile picture and chat history sidebar.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P30": {"id": "P30", "title": "Myth: price high and wait for offers", "format": "Myth (slideshow with voiceover)", "best": "TikTok, Instagram Reels", "length": "25 to 30 seconds", "cta": "Soft (save)", "hook": "\"Listed at £90, 'waiting for offers'. Four months later it's still in the loft.\"", "script": "1. (0 to 2s) VO: \"Listed at ninety pounds, waiting for offers. Four months later it's still in the loft.\" | On screen: \"£90. 'Waiting for offers.' Still in the loft.\"\n2. (2 to 6s) VO: \"The myth: price high, let buyers haggle you down. The problem: a price far above what things sell for just gets scrolled past.\" | On screen: \"Myth: price high and wait\"\n3. (6 to 12s) VO: \"Do it the other way round. Find sold comps. In our example, a Dualit four-slice toaster: list forty-five, floor thirty-two.\" | On screen: \"Example: list £45, floor £32\"\n4. (12 to 18s) VO: \"Decide your offer plan before the offers arrive. Accept forty or more. Counter anything from thirty-two to thirty-nine at thirty-eight. Decline below thirty-two.\" | On screen: \"Accept £40+ / Counter £32 to £39 at £38 / Decline under £32\"\n5. (18 to 24s) VO: \"Not moving? Check the photos and title first, then drop in planned steps. Stop at your floor.\" | On screen: \"Fix the listing first. Then planned drops. Stop at floor.\"\n6. (24 to 28s) VO: \"Room for offers, yes. Wishful thinking, no. Save this for your next price.\" | On screen: \"Room for offers. Not wishful thinking.\"", "onscreen": "£90. \"Waiting for offers.\" Still in the loft.\nMyth: price high and wait\nExample: list £45, floor £32\nAccept £40+ / Counter at £38 / Decline under £32\nFix the listing first. Then planned drops.\nExample figures only\nRoom for offers. Not wishful thinking.", "caption": "Pricing high and \"waiting for offers\" often means waiting. A price well above what similar items actually sold for tends to get scrolled past before anyone makes an offer. We work the other way round: look up sold comps, set a list price a little above the middle so there is room to negotiate, and write down a floor. Then decide the offer plan before the messages start: what you accept straight away, what you counter and at what price, and what you politely decline. If it is not moving after a few weeks, fix the photos, title and measurements first, then drop in planned steps and stop at the floor. Figures shown are an invented example. Save this for the next thing sitting in the loft.", "hashtags": "#vintedpricingguide #ebaysellertips #resellinguk #resellercommunityuk #vintedtips", "visuals": "Slideshow in CapCut, 9:16. Hook slide: Pexels stock \"cardboard boxes in attic\" or \"loft storage boxes\" (no people) with a parcel-label card reading \"£90, waiting for offers\". Slides 3 to 4: a simple three-band graphic, Sold Green band \"Accept £40+\", Label Yellow band \"Counter £32 to £39 at £38\" (Ink text), Returns Red band \"Decline under £32\" (Cream text). Slide 5: a step chart drawn as stairs down to a kraft \"floor\" line. B-roll: Pexels \"retro chrome toaster\" (no brand logo visible; blur it if there is one). Small \"Example figures only\" tag on slides 3 to 5.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P31": {"id": "P31", "title": "Myth: HMRC now taxes every Vinted sale", "format": "Myth (carousel, 8 slides)", "best": "Instagram carousel, TikTok photo mode, Facebook", "length": "8 slides", "cta": "Soft (save / free cheat sheet)", "hook": "\"Reported to HMRC is not the same as taxed by HMRC.\"", "script": "1. Slide 1 (hook, parcel label): \"Reported to HMRC is not the same as taxed by HMRC.\"\n2. Slide 2 (Myth stamp): \"Myth: 'HMRC now takes tax on every Vinted sale.' Truth: there's a reporting rule, not a new tax.\"\n3. Slide 3 (what changed): \"Since 1 January 2024, selling platforms (Vinted, eBay, Etsy and others) collect sellers' details and report what sellers received from sales to HMRC. First reports went in by 31 January 2025.\"\n4. Slide 4 (who gets reported): \"A platform doesn't have to report you if, in a calendar year, you make fewer than 30 sales AND receive less than about £1,700 (2,000 euros) in total. Make 30 sales, or go over that amount, and your details will usually be reported.\"\n5. Slide 5 (reported is not taxed): \"Being reported doesn't mean you owe tax. Clearing out your own unwanted things is usually not trading, and usually not taxed.\"\n6. Slide 6 (when tax can come in): \"Buying things to resell, or making things to sell? That can be trading. There's a £1,000 trading allowance each tax year (6 April to 5 April), counted on money in before costs. Above that, you'll usually need to register for Self Assessment.\"\n7. Slide 7 (worked example): \"Example. 40 sales of your own old clothes, each for less than you paid: likely reported, likely no tax. 40 sales of charity-shop finds bought to resell: could be trading. Keep records either way.\"\n8. Slide 8: \"This is general information, not legal or tax advice. Thresholds can change: check your own situation on gov.uk. Save this.\"", "onscreen": "Reported is not taxed\nMyth: tax on every sale. Truth: a reporting rule\nSince 1 Jan 2024, platforms report to HMRC\nNot reported: under 30 sales AND under about £1,700\nYour own unwanted things: usually not trading\nTrading allowance: £1,000 a tax year, before costs\nExample: clearing out vs buying to resell\nGeneral information, not tax or legal advice", "caption": "No, HMRC does not tax every Vinted sale. Since 1 January 2024, selling platforms have to collect sellers' details and report what they received from sales to HMRC. A platform does not have to report you if you make fewer than 30 sales and receive less than about £1,700 (2,000 euros) in a calendar year. But being reported is not the same as owing tax. Selling your own unwanted things is usually not trading. Buying items to resell, or making things to sell, can be, and there is a £1,000 trading allowance each tax year (counted on sales before costs) before you usually need to register for Self Assessment. Keep simple records of what you sold and what you paid. This is general information, not legal or tax advice, and thresholds can change: check your situation on gov.uk. Save this and share it with the friend who is worried.", "hashtags": "#vintedsellinguk #ebayuk #resellercommunityuk #ukseller #vintedtips", "visuals": "Canva carousel, 1080 x 1350, Cream background, Ink text. Slide 1: parcel-label card with \"Reported\" in Sold Green and \"taxed\" in Returns Red. Slide 4: a simple two-box graphic \"under 30 sales\" AND \"under about £1,700\", joined by a big Label Yellow \"AND\" (Ink text). Slide 7: two side-by-side cards with kraft tape strips: \"Clearing out\" (a stock photo, Pexels search \"clothes rail wardrobe clear out\", no people) and \"Buying to resell\" (Pexels \"charity shop rail\" or \"second hand clothes shop rail\", no recognisable faces; if a person is in shot, crop or blur). Slide 8: disclaimer on a Label Yellow band with Ink text. Do not use the HMRC crest, gov.uk logo or any platform logo; write \"gov.uk\" in plain text only.\n\nFact notes for the scheduler (not for the post): reporting start date, 31 January 2025 first report, 30 sales / 2,000 euros threshold, £1,000 trading allowance and badges of trade are in `research/platform-rules-uk.md` (UK law section), which marks them NOT VERIFIED this session because gov.uk could not be opened. These are long-standing published HMRC positions, but open https://www.gov.uk/government/publications/reporting-rules-for-digital-platforms and https://www.gov.uk/guidance/tax-free-allowances-on-property-and-trading-income and confirm the figures before scheduling. The trading allowance and thresholds can change at a Budget.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P32": {"id": "P32", "title": "Myth: more hashtags means more views on Vinted and Depop", "format": "Myth (text overlay, quick cuts)", "best": "TikTok, Instagram Reels", "length": "20 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"Depop gives you 5 hashtags. #fyp should not be one of them.\"", "script": "1. (0 to 2s) VO: \"Depop gives you five hashtags. F Y P should not be one of them.\" | On screen: \"#fyp #aesthetic #trendy #cute #musthave\"\n2. (2 to 6s) VO: \"The myth: more hashtags, more views. Depop allows up to five, and its own tips say keep them relevant.\" | On screen: \"Depop: up to 5 hashtags. Relevant ones.\"\n3. (6 to 11s) VO: \"These are cherry red Dr. Martens 1460 boots, UK 7. So spend the five on that: brand, model, colour, material, size.\" | On screen: \"#drmartens #1460 #cherryred #leatherboots #uk7\"\n4. (11 to 15s) VO: \"Cute and trendy describe a feeling. Buyers rarely type them to find a boot.\" | On screen: \"Vibes are not search words\"\n5. (15 to 18s) VO: \"On Vinted, the effort goes into the fields instead: brand, size, category, condition, colour.\" | On screen: \"Vinted: fill every field properly\"\n6. (18 to 20s) VO: \"Check the current rules in the app. Free cheat sheet, link in bio.\" | On screen: \"Relevant beats more\"", "onscreen": "#fyp #aesthetic #trendy #cute #musthave\nDepop: up to 5 hashtags. Relevant ones.\n#drmartens #1460 #cherryred #leatherboots #uk7\nVibes are not search words\nVinted: fill every field properly\nRelevant beats more", "caption": "More hashtags does not mean more views. Depop lets you add up to five, and Depop's own tips say to keep them to relevant words, brands and tags.\n\nSo \"#fyp\", \"#aesthetic\" and \"#cute\" are slots spent on a feeling. Spend them on what a buyer types instead: brand, model, colour, material, size. For an example pair of cherry red Dr. Martens 1460s in a UK 7, that is #drmartens #1460 #cherryred #leatherboots #uk7.\n\nOn Vinted, the listing form is built around fields like brand, size, category, condition and colour, so fill every one accurately and write a clear title.\n\nLimits do change, so check the current rules in each app before you list. Our free UK Listing Cheat Sheet has the character and tag limits in one table, link in bio.", "hashtags": "#depoptips #depopseller #vintedtips #resellercommunityuk", "visuals": "CapCut, 9:16. Hook: the five vague hashtags pop on one by one in grey over a flat lay of red leather boots (Pexels search \"red leather boots\", no people, no feet; blur any heel loop or logo), then all five get a Returns Red strike-through. Slide 3: five specific hashtags pop on in Ink with Sold Green ticks, \"#1460\" highlighted in Label Yellow. Slide 5: a simple mock form graphic (drawn in Canva, not a screenshot of Vinted) with fields \"Brand / Size / Category / Condition / Colour\" and ticks. No platform logos or real app screenshots. Corner tag: \"Example item\".\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P33": {"id": "P33", "title": "Myth: you need paid software to list faster", "format": "Myth (screen recording, voiceover)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "25 to 30 seconds", "cta": "Kit", "hook": "\"A notes app, a free AI chat tool and a tape measure. That's the whole setup.\"", "script": "1. (0 to 2s) VO: \"A notes app, a free AI chat tool and a tape measure. That's the whole setup.\" | On screen: \"Notes app + free AI + tape measure\"\n2. (2 to 6s) VO: \"The myth: listing faster means paying for software. Useful at volume, maybe. Needed to start? No.\" | On screen: \"Myth: you need paid software\"\n3. (6 to 12s) VO: \"Step one. A brief template saved in your notes app. Brand, size, measurements, fabric, flaws, postage, price.\" | On screen: \"1. Brief template in your notes app\"\n4. (12 to 18s) VO: \"Step two. Fill it in with the item in front of you. Two minutes, tape measure in hand.\" | On screen: \"2. Fill it in: about 2 minutes\"\n5. (18 to 24s) VO: \"Step three. Paste it into ChatGPT, Claude, Gemini or Copilot, free versions, with a prompt that says: UK English, only my facts, eighty characters for the eBay title.\" | On screen: \"3. Paste into any free AI tool\"\n6. (24 to 30s) VO: \"Our Well Listed Kit is built for exactly this: prompts and templates for the free tools. Or start with the free cheat sheet. Both in bio.\" | On screen: \"Kit or free cheat sheet: link in bio\"", "onscreen": "Notes app + free AI + tape measure\nMyth: you need paid software\n1. Brief template in your notes app\n2. Fill it in: about 2 minutes\n3. Paste into any free AI tool\nKit or free cheat sheet: link in bio", "caption": "You do not need paid software to write listings faster. Cross-listing apps and tools can be handy once you are listing lots every week, but to start you need three things: a notes app, a free AI chat tool (ChatGPT, Claude, Gemini or Copilot all have free versions) and a tape measure. Save a brief template in your notes (brand, size, measurements, fabric, flaws, postage, price), fill it in with the item in front of you, then paste it in with a prompt that says UK English, only use my facts, and keep the eBay title to 80 characters. The Well Listed Kit is a set of prompts and templates built for exactly that setup, and the free UK Listing Cheat Sheet is a good place to start. Both are in bio.", "hashtags": "#resellertok #chatgptprompts #ebaysellertips #vintedtips #resellinguk", "visuals": "Opening shot: top-down stock of a phone, tape measure and folded clothes on a table, Pexels search \"tape measure phone desk flat lay\" (no people; hands only if any). Steps 1 and 2: screen recording of a phone notes app with a blank then filled-in brief (invented item: \"Joules navy wool jumper, size 14\"), zoom on \"Pit to pit: 55 cm\". Step 3: screen recording pasting it into a free AI chat tool, zoom on the title and a Label Yellow box around the character count. Name the four tools in plain text only; no logos. Blur account names, phone status bar notifications, and the notes app's other note titles.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P34": {"id": "P34", "title": "5 words that make a listing look like spam", "format": "Listicle (fast text overlay, voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 seconds", "cta": "Soft (save)", "hook": "\"If your title has 'L@@K' in it, we need to talk.\"", "script": "1. (0 to 2s) VO: \"If your title has 'look' spelled with two at signs, we need to talk.\" | On screen: \"L@@K\"\n2. (2 to 6s) VO: \"Five words that make a listing look like spam. One. L at at K. Nobody searches for it, and it eats your characters.\" | On screen: \"1. L@@K: nobody searches it\"\n3. (6 to 10s) VO: \"Two. Stunning, with three exclamation marks. Hype, not information. Say the colour and the fabric instead.\" | On screen: \"2. 'Stunning!!!' Say colour and fabric instead\"\n4. (10 to 14s) VO: \"Three. Rare. Only if the item or box says limited, or you can prove it. Collectors check.\" | On screen: \"3. 'Rare': only if you can prove it\"\n5. (14 to 18s) VO: \"Four. Must have. Buyers decide that. Use the space for size or measurements.\" | On screen: \"4. 'Must have': use the space for size\"\n6. (18 to 22s) VO: \"Five. One hundred percent genuine, with no proof. Show the labels, codes and receipt instead, if you have them.\" | On screen: \"5. '100% genuine': show labels instead\"\n7. (22 to 25s) VO: \"Plain words read as trustworthy. Save this.\" | On screen: \"Plain words look trustworthy\"", "onscreen": "L@@K\n1. L@@K: nobody searches it\n2. \"Stunning!!!\": say colour and fabric\n3. \"Rare\": only if you can prove it\n4. \"Must have\": use the space for size\n5. \"100% genuine\": show labels instead\nPlain words look trustworthy", "caption": "Five words that make a listing look like spam, and what to write instead. L@@K: nobody types it into search, and it wastes title space. \"Stunning!!!\": hype, not information, so give the colour and the fabric. \"Rare\": only if the item or box says so, or you can genuinely prove it, because an unsupported claim is misleading. \"Must have\": the buyer decides that, so use the space for size or measurements. \"100% genuine\" with no proof: show the brand labels, codes and receipt if you have them, and let the photos do the talking. Plain, specific words read as trustworthy to buyers scrolling on a phone. Save this and check your last five titles.", "hashtags": "#ebaysellertips #vintedtips #listingtips #resellertok #ebayuk", "visuals": "CapCut, 9:16, Ink background with Cream text for the hook (\"L@@K\" huge, Label Yellow highlight behind it). Each numbered word appears in grey, gets a Returns Red strike-through, then the replacement advice appears in Ink on a Cream card with a Sold Green tick. Between items, 1-second b-roll: Pexels searches \"clothes rail second hand\", \"vinyl records crate\", \"trainers box\" (no people). For item 5, a close-up of a generic (unbranded or blurred) care label. Quick 3 to 4 second pacing.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P35": {"id": "P35", "title": "7 things every clothing listing needs", "format": "Listicle (carousel, 9 slides)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "9 slides", "cta": "Soft (save / free cheat sheet)", "hook": "\"'Cotton' is not a fabric description. '98% cotton, 2% elastane' is.\"", "script": "1. Slide 1 (hook): \"'Cotton' is not a fabric description. '98% cotton, 2% elastane' is.\"\n2. Slide 2: \"7 things every clothing listing needs. Screenshot this before your next one.\"\n3. Slide 3: \"1. Brand, exactly as on the label. 'Boden', not 'Boden-ish'.\"\n4. Slide 4: \"2. Size as printed on the label. 'UK 12', and say if it's EU or US.\"\n5. Slide 5: \"3. Measurements, laid flat, in cm. 'Waist 36 cm. Length 58 cm.' Say how you measured.\"\n6. Slide 6: \"4. Fabric, copied from the care label. '98% cotton, 2% elastane', not 'cotton'.\"\n7. Slide 7: \"5. Condition in one word. 6. Every flaw: where, what, how big. 'Faded edge on front pocket, about 2 cm.'\"\n8. Slide 8: \"7. Postage: when it goes and how. 'Posted within 2 days, tracked.'\"\n9. Slide 9 (worked example, parcel label): \"Boden green corduroy skirt. UK 12. Waist 36 cm, length 58 cm, laid flat. 98% cotton, 2% elastane. Good: faded edge on front pocket, about 2 cm (photo 4). Posted within 2 days. Save this.\"", "onscreen": "\"Cotton\" is not a fabric description\n7 things every clothing listing needs\n1. Brand, as on the label\n2. Size as printed\n3. Measurements laid flat, in cm\n4. Fabric from the care label\n5. Condition in one word 6. Every flaw: where, what, how big\n7. Postage: when and how\nWorked example", "caption": "\"Cotton\" is not a fabric description. \"98% cotton, 2% elastane\" is, and it tells a buyer whether the skirt has any stretch. That kind of detail is what every clothing listing needs, across seven things: the brand as printed on the label, the size as printed (and whether it is UK, EU or US), measurements laid flat in centimetres (pit to pit and length at least), the fabric copied from the care label, a one-word condition, every flaw with where it is, what it is and how big, and when and how it will be posted. Slide 9 shows all seven in five short lines for an invented skirt. Save this, and the free UK Listing Cheat Sheet is in our bio.", "hashtags": "#vintedtips #vintedseller #depoptips #secondhandfashion #resellercommunityuk", "visuals": "Canva carousel, 1080 x 1350, Cream background, one numbered item per slide in Archivo 800 with the key word in Label Yellow. Slide 5: stock of a tape measure across a flat-laid skirt, Pexels search \"measuring tape clothes flat lay\" (hands only). Slide 6: close-up of a care label (Pexels \"clothing care label close up\"; blur any brand name that is not ours to show). Slide 7: stage a faded patch on a scrap of corduroy with a coin for scale. Slide 9: parcel-label card with the full worked example, \"98% cotton, 2% elastane\" and \"2 cm\" highlighted. Pinterest version: stack slides 3 to 8 into one long 1000 x 1500 pin titled \"Vinted description checklist\".\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P36": {"id": "P36", "title": "5 buyer messages one prompt can answer", "format": "Listicle (screen recording, voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Kit", "hook": "\"'Is this still available?' 'Would you take £5?' 'Measurements?' One prompt. All three.\"", "script": "1. (0 to 3s) VO: \"Is this still available? Would you take five pounds? Measurements? One prompt. All three.\" | On screen: \"3 messages. 1 prompt.\"\n2. (3 to 9s) VO: \"The prompt. Here's my Listing Brief and a buyer message. Write a short, polite reply in UK English using only facts from the brief. Never reveal my lowest price.\" | On screen: \"'Reply using only facts from my brief. Never reveal my lowest price.'\"\n3. (9 to 13s) VO: \"One. Is this still available? Yes, it is. Happy to answer any questions.\" | On screen: \"1. 'Still available?'\"\n4. (13 to 17s) VO: \"Two. Would you take five pounds, on a fourteen pound rain jacket? Thanks for the offer. The lowest I can do is eleven.\" | On screen: \"2. Lowball offer (example: £5 on £14)\"\n5. (17 to 21s) VO: \"Three. Measurements? Pit to pit fifty-four centimetres, length seventy, laid flat.\" | On screen: \"3. 'Measurements?'\"\n6. (21 to 24s) VO: \"Four. When will it post? Five. Can you do a bundle? Both answered from the same brief.\" | On screen: \"4. Postage 5. Bundle\"\n7. (24 to 30s) VO: \"Swap the buyer's name for BUYER before you paste. The Well Listed Kit has the full set of message prompts. Link in bio.\" | On screen: \"Replace names with [BUYER] first\"", "onscreen": "3 messages. 1 prompt.\n\"Reply using only facts from my brief. Never reveal my lowest price.\"\n1. \"Still available?\"\n2. Lowball offer (example: £5 on £14)\n3. \"Measurements?\"\n4. Postage 5. Bundle\nReplace names with [BUYER] first", "caption": "Five buyer messages, one prompt. Keep your Listing Brief in your notes app, then paste it with the buyer's message and this instruction: write a short, polite reply in UK English, using only facts from the brief, and never reveal my lowest price. It handles \"is this still available?\", lowball offers, \"measurements?\", \"when will it post?\" and bundle requests, because the answers are already in your brief. Two habits: replace the buyer's name with [BUYER] before pasting (never paste buyers' personal details into an AI tool), and read the reply before sending. The prices shown are an invented example. The Well Listed Kit has the full set of message prompts, including offers and returns, link in bio.", "hashtags": "#vintedsellertips #lowballoffers #resellertok #ebayseller #chatgptprompts", "visuals": "Screen recording of a free AI chat tool on a phone, cropped to the chat. Paste the brief (invented: \"Regatta navy rain jacket, UK 12, £14, lowest £11 (private)\") and run five buyer messages one after another, each with \"[BUYER]\" in place of a name. Zoom on each reply for 2 to 3 seconds, Label Yellow box around the key fact. Put a Returns Red \"PRIVATE\" label next to the lowest-price line in the brief to show it stays out of the reply. Mock buyer messages as grey chat bubbles drawn in Canva (never screenshots of real conversations). Blur account name, profile picture and history.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P37": {"id": "P37", "title": "6 photos every electronics listing needs", "format": "Listicle (hands-only video with text)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 seconds", "cta": "Soft (save)", "hook": "\"A photo of the screen switched off tells a buyer nothing.\"", "script": "1. (0 to 2s) VO: \"A photo of the screen switched off tells a buyer nothing.\" | On screen: \"Screen off = no information\"\n2. (2 to 6s) VO: \"Six photos every electronics listing needs. One. The front, switched on, showing it works.\" | On screen: \"1. Front, switched ON\"\n3. (6 to 9s) VO: \"Two. The back, and every corner. That's where the dents hide.\" | On screen: \"2. Back and corners\"\n4. (9 to 12s) VO: \"Three. All the ports, close up. Buyers check for bent pins and fluff.\" | On screen: \"3. Every port, close up\"\n5. (12 to 16s) VO: \"Four. The model label or settings screen. It proves the exact model and spec.\" | On screen: \"4. Model label or settings screen\"\n6. (16 to 19s) VO: \"Five. Everything included, laid out together. Charger, cable, box.\" | On screen: \"5. Everything included, laid out\"\n7. (19 to 22s) VO: \"Six. Every scratch, close up, with a coin for scale.\" | On screen: \"6. Every scratch, with scale\"\n8. (22 to 25s) VO: \"And say what you tested, and what you didn't. Save this.\" | On screen: \"Say what you tested. And what you didn't.\"", "onscreen": "Screen off = no information\n1. Front, switched ON\n2. Back and corners\n3. Every port, close up\n4. Model label or settings screen\n5. Everything included, laid out\n6. Every scratch, with scale\nSay what you tested", "caption": "A photo of a screen switched off tells a buyer nothing. For electronics, these six photos answer most questions before they are asked: the front switched on, the back and all four corners, every port close up, the model label or settings screen showing the exact model, everything included laid out together, and every scratch with a coin for scale. Then say in the description exactly what you tested and how (\"powers on, connects to Wi-Fi, played video for 10 minutes; Bluetooth not tested\"). Avoid \"fully working\" unless you have tested every function. Before photographing a settings screen, check it does not show your name, account or location. Save this for your next gadget.", "hashtags": "#ebaysellertips #ebayuk #resellertok #ebayseller #listingtips", "visuals": "Film our own hands-only footage of an unbranded or generic device (an old tablet or games controller) on a cream sheet by a window. Shot list: tablet switched on showing a plain home screen (no apps with account names, no notifications, no wallpaper photo of people), back and corners, ports close up, settings \"About\" screen with the name field blurred, all accessories laid out, a small scratch with a 1p coin beside it. If using stock instead, Pexels search \"tablet on white table\", \"usb port close up\", \"phone charger cable flat lay\" (no people). Text cards in Ink on Cream with Sold Green ticks. Blur any serial number, account name, device name or Wi-Fi network name. No brand logos visible; cover or blur them.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P38": {"id": "P38", "title": "5 Americanisms AI sneaks into UK listings", "format": "Listicle (before/after word swaps)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "20 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"UK buyers search 'trousers'. Your AI wrote 'pants'.\"", "script": "1. (0 to 2s) VO: \"UK buyers search trousers. Your AI wrote pants.\" | On screen: \"Pants? You mean trousers.\"\n2. (2 to 5s) VO: \"Five Americanisms AI sneaks into UK listings. One. Pants. It's trousers. In the UK, pants are underwear.\" | On screen: \"1. pants to trousers\"\n3. (5 to 8s) VO: \"Two. Sweater. It's jumper.\" | On screen: \"2. sweater to jumper\"\n4. (8 to 11s) VO: \"Three. Sneakers. It's trainers.\" | On screen: \"3. sneakers to trainers\"\n5. (11 to 14s) VO: \"Four. Purse, when you mean a handbag.\" | On screen: \"4. purse to handbag\"\n6. (14 to 17s) VO: \"Five. Shipping. It's postage. And color with no U.\" | On screen: \"5. shipping to postage (and colour)\"\n7. (17 to 20s) VO: \"Fix it in one line: UK English, UK sizes, UK words. Free cheat sheet in bio.\" | On screen: \"Add: 'UK English, UK sizes, UK words.'\"", "onscreen": "Pants? You mean trousers.\n1. pants to trousers\n2. sweater to jumper\n3. sneakers to trainers\n4. purse to handbag\n5. shipping to postage (and colour)\nAdd: \"UK English, UK sizes, UK words.\"", "caption": "UK buyers search for \"trousers\". Your AI wrote \"pants\", which in the UK are underwear. Free AI chat tools often default to American English, so five words to watch for: pants (trousers), sweater (jumper), sneakers (trainers), purse when you mean a handbag, and shipping (postage), plus \"color\" and \"gray\" spellings. Sizes too: shoes should say \"UK 6\", not just \"6\". The fix is one line at the top of every prompt: \"Use UK English spelling, UK sizes and UK words (jumper, trousers, trainers, postage).\" Then read the result once before you post. Our free UK Listing Cheat Sheet has 10 prompts with this line already built in, link in bio.", "hashtags": "#chatgpttips #vintedtips #ebayuk #resellercommunityuk #ukseller", "visuals": "CapCut, 9:16, Cream background. Each swap: the American word in grey with a Returns Red strike-through on the left, the UK word in Ink with a Sold Green tick on the right, UK word highlighted in Label Yellow. Use the word \"to\" or an arrow graphic (a drawn arrow shape, not a typed dash) between the pair. 2-second b-roll per word: Pexels searches \"folded trousers\", \"knitted jumper\", \"trainers on floor\", \"leather handbag\", \"parcel with postage label\" (no people, no visible brand logos). Final slide: the one-line prompt in a JetBrains Mono box.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P39": {"id": "P39", "title": "4 prompts for when you're too tired to list", "format": "Listicle (slideshow with prompt boxes, voiceover)", "best": "TikTok, Instagram Reels", "length": "30 seconds", "cta": "Kit", "hook": "\"It's 10pm, there are 12 things on the bed, and you can't face typing one title.\"", "script": "1. (0 to 3s) VO: \"It's ten p.m., there are twelve things on the bed, and you can't face typing one title.\" | On screen: \"10pm. 12 items. Zero energy.\"\n2. (3 to 9s) VO: \"Prompt one. Talk, don't type. Record a voice note about each item, paste the transcript, and ask: turn this into a Listing Brief. Where I corrected myself, use the correction.\" | On screen: \"1. Voice note to brief\"\n3. (9 to 15s) VO: \"Prompt two. Titles only. Here are three briefs. Give me an eighty-character eBay title for each, and nothing else.\" | On screen: \"2. Titles only, for 3 items\"\n4. (15 to 21s) VO: \"Prompt three. Draft now, check tomorrow. Write the descriptions, and mark anything you're unsure of with CHECK so I can fix it in daylight.\" | On screen: \"3. Draft now, [CHECK] tomorrow\"\n5. (21 to 26s) VO: \"Prompt four. Just tell me what to photograph. One shot list per item, so tomorrow's photos take ten minutes.\" | On screen: \"4. Tomorrow's shot list\"\n6. (26 to 30s) VO: \"All four are in The Well Listed Kit, in full. Or save this and use the short versions tonight.\" | On screen: \"Save this for tonight\"", "onscreen": "10pm. 12 items. Zero energy.\n1. Voice note to brief\n2. Titles only, for 3 items\n3. Draft now, [CHECK] tomorrow\n4. Tomorrow's shot list\nSave this for tonight", "caption": "For the evenings when there is a pile on the bed and no energy left. Four prompts that do the tiring bit. One: record a voice note about each item, paste the transcript and ask for a Listing Brief, using your corrections only. Two: titles only, three items at a time, 80 characters each for eBay. Three: draft the descriptions tonight and mark anything uncertain with [CHECK] so you fix it in daylight, with the item in your hands. Four: a shot list per item, so tomorrow's photos are quick. Nothing gets posted until you have checked it. The full versions are in The Well Listed Kit (link in bio), or save this and use the short versions tonight.", "hashtags": "#resellertok #resellinguk #chatgptprompts #vintedtips #resellercommunityuk", "visuals": "Hook: stock of a bed or sofa covered in folded clothes in low lamp light, Pexels search \"pile of clothes on bed\" or \"folded clothes stack evening\" (no people, no personal items in shot). Each prompt: a JetBrains Mono prompt box on a Cream card with a kraft tape strip, the key word (\"voice note\", \"titles only\", \"[CHECK]\", \"shot list\") highlighted in Label Yellow. Optional 3-second screen recording per prompt of a free AI chat tool producing the output for an invented item (blur account details). For prompt 1, show a phone voice recorder app screen with the recording title blurred; never use a real voice, use a text transcript only. End card: parcel label.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P40": {"id": "P40", "title": "Free AI tools that work for listings", "format": "Listicle (carousel, 7 slides)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "7 slides", "cta": "Soft (free cheat sheet)", "hook": "\"ChatGPT, Claude, Gemini, Copilot: all free to start. eBay and Depop have AI drafting built in.\"", "script": "1. Slide 1 (hook): \"ChatGPT, Claude, Gemini, Copilot: all free to start. eBay and Depop have AI drafting built in.\"\n2. Slide 2: \"General AI chat tools with free versions: ChatGPT, Claude, Gemini, Microsoft Copilot. Any of them can turn a Listing Brief into a title and description.\"\n3. Slide 3: \"Built into the platforms: the eBay app can draft a listing from a photo. Depop's 'Generate Description' drafts one from a photo too.\"\n4. Slide 4: \"Amazon offers generative AI listing tools to UK sellers: a few words or an image, and it drafts the title, bullets and description.\"\n5. Slide 5: \"Whichever you use, the same three checks apply. Every fact from your item? UK English? Within the character limit?\"\n6. Slide 6 (worked example): \"Brief: 'Denby milk jug, blue glaze, 12 cm tall, base stamp \"Made in England\", tiny chip on rim by spout.' Prompt: 'eBay UK title, max 80 characters, only my facts.' Output: 'Denby Blue Glaze Ceramic Milk Jug 12 cm Made in England Small Rim Chip' (70 characters).\"\n7. Slide 7 (parcel label): \"Free plans and features change. Check what each one includes today. Free cheat sheet with 10 prompts: link in bio.\"", "onscreen": "Good listings, no paid AI plan\nFree versions: ChatGPT, Claude, Gemini, Copilot\nBuilt in: eBay app and Depop drafts from a photo\nAmazon: AI listing tools for UK sellers\nSame 3 checks, whatever the tool\nWorked example: 70 of 80 characters\nFree plans change. Check today.", "caption": "You do not need a paid AI plan to write good listings. ChatGPT, Claude, Gemini and Microsoft Copilot all have free versions, and any of them can turn a proper Listing Brief into a UK title and description. Some platforms also build it in: the eBay app can draft a listing from a photo, Depop has a Generate Description option, and Amazon offers AI listing tools to UK sellers. Whichever you use, check three things before posting: every fact is from your actual item, it is in UK English, and it fits the character limit. Free plans and features change, so check what each tool includes today and check the current rules in each platform's help pages. Our free UK Listing Cheat Sheet has 10 prompts that work in all four, link in bio.", "hashtags": "#chatgptprompts #aiprompts #resellertok #ebaysellertips #depopseller", "visuals": "Canva carousel, 1080 x 1350. Tool and platform names in plain Archivo text only: no logos, no screenshots of the eBay, Depop or Amazon apps. Slide 2: four plain Ink cards with the tool names and a small \"free version\" Sold Green tag. Slides 3 and 4: a simple drawn phone outline with a camera icon turning into a text block (illustrates \"photo to draft\" without showing any real interface). Slide 6: a JetBrains Mono box with the brief and the title output, \"70 characters\" highlighted in Label Yellow; optional background photo, Pexels search \"blue ceramic jug\" (no brand marks visible). Slide 7: parcel label. Pinterest version: 1000 x 1500 pin titled \"Free AI tools for resellers\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P41": {"id": "P41", "title": "7 checks before you press \"list\"", "format": "Listicle (carousel)", "best": "Instagram carousel, TikTok photo mode", "length": "9 slides", "cta": "Soft (save this)", "hook": "\"'[CHECK: size]' went live in the listing. Seven checks so yours never does.\"", "script": "1. Slide 1: \"'[CHECK: size]' went live in the listing. Seven checks so yours never does.\" (parcel label card)\n2. Slide 2: \"1. Title fits the limit. eBay UK gives you 80 characters, and spaces count. Check the current limit for your platform.\"\n3. Slide 3: \"2. No [CHECK] left behind. If your AI draft says [CHECK: size], fill it in or delete the line.\"\n4. Slide 4: \"3. Every flaw is in the text AND in a photo. 'Pulled thread on the hem, see photo 6.'\"\n5. Slide 5: \"4. Measurements in cm. Pit to pit and length for tops. Inside leg for trousers.\"\n6. Slide 6: \"5. UK words. Jumper, not sweater. Trousers, not pants. UK size, not US.\"\n7. Slide 7: \"6. No other brands in your title. 'Joules coat, like Barbour' invites trouble. Name only what it is.\"\n8. Slide 8: \"7. Your price floor is nowhere in the listing. That number is for you, not the buyer.\"\n9. Slide 9: \"Save this and run it on your next listing. Free UK Listing Cheat Sheet: link in bio.\"", "onscreen": "\"[CHECK: size]\" went live. 7 checks so yours never does\n1. Title fits the limit\n2. No [CHECK] left behind\n3. Flaw in text AND photo\n4. Measurements in cm\n5. UK words and sizes\n6. No other brands in the title\n7. Price floor stays private\nSave this. Free cheat sheet in bio", "caption": "A \"[CHECK: size]\" left in a live listing is an easy mistake to make. These 7 checks catch it.\n\nWe run the same quick list before anything goes live. It catches the small stuff that turns into big messages later: a title one character over, a [CHECK] the AI left for you, a flaw mentioned in the text but missing from the photos.\n\nNumber 6 is the one people argue with. Putting another brand name in your title (\"like Barbour\") can break search rules on some platforms and it muddles the listing anyway. Say what the item is and stop there.\n\nLimits and rules change, so check the current rule in the platform's help pages.\n\nSave this and run it on whatever is waiting to go live tonight. Our free UK Listing Cheat Sheet has the character limits for each platform in one table: link in bio.", "hashtags": "#ebaysellertips #vintedtips #listingtips #resellinguk #ukseller", "visuals": "Canva carousel, 1080 x 1350. Slide 1: cream #FAF6EF background with the parcel label card (kraft #C9A27E border, dashed cut line), hook in Archivo 800, Ink #1F2A44, \"7 checks\" highlighted in Label Yellow #F2C84B. Slides 2 to 8: big number in Sold Green #1E7F55 top left, check text in Ink, one small mock-up each (a title bar with a character counter showing 80/80, a [CHECK: size] tag with a yellow highlighter box, a hem close-up from Pexels search \"knitwear hem close up\" or \"knitwear detail\", a tape measure on a jumper from Pexels \"tape measure clothing\"). Slide 7 shows a mock title with \"like Barbour\" crossed out in Returns Red #C4453B. No faces, no real listings. Build all mock listings ourselves in Canva.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P42": {"id": "P42", "title": "5 honest ways to describe condition", "format": "Listicle (slideshow with AI voiceover)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 to 35 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"'Good used condition' could mean worn once or worn to bits. Five ways to say which.\"", "script": "1. (0 to 3s) VO: \"Good used condition could mean worn once or worn to bits. Five ways to say which.\" | On screen: \"'Good used condition': worn once, or worn to bits?\"\n2. (3 to 9s) VO: \"One. Say where, what and how big. Faded patch on the right shoulder, about three centimetres.\" | On screen: \"1. Where, what, how big\"\n3. (9 to 15s) VO: \"Two. Point to the photo. See photo six for the mark. Now the text and the picture back each other up.\" | On screen: \"2. 'See photo 6'\"\n4. (15 to 21s) VO: \"Three. For electronics, say what you tested and what you did not. Tested: power, screen, Wi-Fi. Not tested: Bluetooth.\" | On screen: \"3. Tested / not tested\"\n5. (21 to 26s) VO: \"Four. Describe normal wear plainly. Light bobbling under the arms, no holes, no stains.\" | On screen: \"4. Name the wear, then the good news\"\n6. (26 to 31s) VO: \"Five. Pick the platform's condition option that matches your words, not the one you hope for.\" | On screen: \"5. Condition box matches the text\"\n7. (31 to 35s) VO: \"Save this. Our free cheat sheet has the condition prompts. Link in bio.\" | On screen: \"Save this. Free cheat sheet in bio\"", "onscreen": "\"Good used condition\": worn once, or worn to bits?\n1. Where, what, how big\n2. \"See photo 6\"\n3. Tested / not tested\n4. Name the wear, then the good news\n5. Condition box matches the text\nSave this. Free cheat sheet in bio", "caption": "\"Good used condition\" could mean worn once or worn to bits. These five habits tell the buyer which.\n\n1. Where, what, how big: \"faded patch on right shoulder, about 3 cm\".\n2. Point to the photo: \"see photo 6\".\n3. Tested and not tested, for anything with a plug or a battery.\n4. Name the wear, then the good news: \"light bobbling under arms, no holes or stains\".\n5. Choose the condition option that matches your words.\n\nHonest condition notes are not about talking the item down. They set the buyer's expectations so the parcel matches the listing, and that is what cuts down on awkward messages and returns.\n\nWorth a save. The condition prompts are in our free UK Listing Cheat Sheet, link in bio.", "hashtags": "#ebaysellertips #vintedsellertips #resellercommunityuk #listingtips #preloved", "visuals": "Vertical 1080 x 1920 slideshow in CapCut. Each point is a split screen: top half a close-up stock shot, bottom half an Ink #1F2A44 text panel with Cream #FAF6EF text and one Label Yellow #F2C84B word. Stock searches (Pexels or Canva free): \"jumper shoulder close up\", \"knit texture macro\", \"game controller on table\" (item only), \"folded jumper flat lay\", \"phone photo of clothing\". Point 1: add a thin yellow circle around a spot on the shoulder (use a stock image of fabric and draw the circle, do not fake a real flaw on a real listing photo). Point 3: mock checklist graphic with Sold Green #1E7F55 ticks and a grey \"not tested\" line. Calm British AI voice, burned-in captions centred above the bottom UI. Hands-only footage at most, no faces.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P43": {"id": "P43", "title": "Phrases to keep out of your listings", "format": "Listicle (carousel)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "8 slides", "cta": "Soft (save this)", "hook": "\"Six phrases that can get a listing removed. 'Replica' is only the first.\"", "script": "1. Slide 1: \"Six phrases that can get a listing removed. 'Replica' is only the first.\"\n2. Slide 2: \"'Replica', 'dupe', '1:1', 'inspired by [brand]'. Counterfeit and lookalike wording breaks marketplace rules. If it is not the real brand, do not list it as that brand.\"\n3. Slide 3: \"'100% genuine' when you cannot show it. Say what you actually know instead: 'Bought new from the brand's shop in 2023, receipt included.'\"\n4. Slide 4: \"'Cures', 'relieves', 'heals', 'detox'. Health claims are not allowed on TikTok Shop UK and are risky everywhere. Describe the item, not a medical result.\"\n5. Slide 5: \"'Fully working' on something you only switched on. Write exactly what you tested.\"\n6. Slide 6: \"'Not Nike' or 'like Zara' in the title. Other brand names in your title muddle search and can break the rules. Name only what it is.\"\n7. Slide 7: \"'Non-toxic', '100% safe', 'eco-friendly' with no proof. Only say it if you can show the specific fact behind it.\"\n8. Slide 8: \"Rules differ by platform, so check the current rule in the help pages. Save this list for your next draft.\"", "onscreen": "Six phrases that can get a listing removed\nReplica, dupe, 1:1, \"inspired by\"\n\"100% genuine\" with no proof\nCures, relieves, heals, detox\n\"Fully working\" (untested)\n\"Not Nike\", \"like Zara\"\nNon-toxic, 100% safe, eco-friendly\nCheck the rules. Save this", "caption": "Six phrases that can get a listing removed, and what to write instead.\n\nCounterfeit wording is the obvious one, but the quieter problems are claims you cannot back up. \"100% genuine\" with nothing to show for it. \"Relieves back pain\" on a wheat bag. \"Fully working\" on a console you only switched on.\n\nThe fix is the same every time: describe what you know. Where you bought it, what is included, what you tested, what the label says.\n\nTikTok Shop UK's own policies say claims must be accurate and must not suggest a product cures, treats or relieves a condition. Other platforms have their own rules on counterfeits and claims, so check the current rule in each platform's help pages.\n\nSave this and read it once before your next listing goes live.", "hashtags": "#vintedtips #ebayseller #tiktokshopuk #resellinguk #listingtips", "visuals": "Canva carousel, 1080 x 1350, cream #FAF6EF background. Each slide shows the risky phrase on a grey \"sticky note\" with a Returns Red #C4453B strike-through, and the safer wording underneath on a parcel label card (kraft #C9A27E border) with a Sold Green #1E7F55 tick. Slide 1: the word \"Replica\" in large Archivo 800 Ink #1F2A44 text, struck through in red. No brand logos anywhere (write brand names as plain text only on slide 6, never logos). Optional background textures from Canva free: \"brown paper texture\", \"kraft paper\". Do not show any real listing or any real product that could be counterfeit.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P44": {"id": "P44", "title": "What to include in a bundle offer", "format": "Listicle (screen recording plus AI voiceover)", "best": "TikTok, Instagram Reels", "length": "25 to 30 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"A bundle reply without the postage in it is only half an answer.\"", "script": "1. (0 to 3s) VO: \"A bundle reply without the postage in it is only half an answer. Four things make it whole.\" | On screen: \"Bundle request? One message, done.\"\n2. (3 to 8s) VO: \"First, list the items so nobody is confused later. Three children's paperback picture books.\" | On screen: \"1. Name every item\"\n3. (8 to 13s) VO: \"Second, the bundle price, and the reason: one parcel, so postage is paid once, not three times.\" | On screen: \"2. Price plus the honest reason\"\n4. (13 to 18s) VO: \"Third, what postage is included, and when it goes out.\" | On screen: \"3. Postage and dispatch day\"\n5. (18 to 23s) VO: \"Fourth, a one-line condition reminder, so the buyer knows what they are getting.\" | On screen: \"4. Condition reminder\"\n6. (23 to 28s) VO: \"And no pressure. No 'today only'. Just a friendly offer they can take or leave. Free cheat sheet in bio.\" | On screen: \"5. No pressure. Free cheat sheet in bio\"", "onscreen": "Bundle request? One message, done\n1. Name every item\n2. Price plus the honest reason\n3. Postage and dispatch day\n4. Condition reminder\n5. No pressure\nFree cheat sheet in bio", "caption": "A bundle reply without the postage in it is only half an answer. One tidy message covers everything.\n\nWhat we put in every bundle reply:\n1. Every item named, so there is no confusion later.\n2. The bundle price and the real reason for it (one parcel, less postage).\n3. What postage is included and when it will go out.\n4. A one-line condition reminder.\n5. No pressure. No \"today only\" unless it is actually true.\n\nExample (invented): \"I can do all three books for £10. They fit in one parcel, so you pay postage once instead of three times. All clean with no torn pages, posted within 2 working days.\"\n\nWork out your floors first so the bundle price never goes below them. Save this. The bundle prompt is in our free UK Listing Cheat Sheet (link in bio).", "hashtags": "#vintedsellertips #resellercommunityuk #vintedtips #resellinguk", "visuals": "Screen recording of a laptop or phone AI chat (ChatGPT, Claude, Gemini or Copilot free version) with the bundle pricing prompt pasted in and the answer appearing: invented example bundle (three children's paperback picture books, listed at £4, £4 and £5, floors £3 each, bundle £10). Keep it different from the clothing bundle in P19. Crop to the chat window only. Blur or crop out the account name, profile picture, sidebar chat history, email and browser tabs. Add Label Yellow #F2C84B highlighter boxes over the five parts of the reply as each is spoken. Cutaway stock (Pexels): \"stack of children's books\" (no readable cover art), \"parcel packing hands\". Captions in Archivo 800, Cream #FAF6EF on an Ink #1F2A44 band. Tiny corner note: \"Example figures only\".", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P45": {"id": "P45", "title": "3 prompts for staying calm with difficult buyers", "format": "Listicle (POV text on screen plus screen recording)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Soft (save this)", "hook": "\"Fourth message. All capitals. And your draft reply is not one you want on record.\"", "script": "1. (0 to 3s) VO: \"Fourth message, all in capitals. And your draft reply is not one you want on record.\" | On screen: \"Fourth message. ALL CAPS.\"\n2. (3 to 5s) VO: \"Do not reply yet. Use one of these three prompts.\" | On screen: \"Don't reply yet\"\n3. (5 to 13s) VO: \"One. The cool-down. Paste your angry draft and ask: make this polite, short and firm, keep every fact, remove anything sarcastic.\" | On screen: \"1. The cool-down rewrite\"\n4. (13 to 21s) VO: \"Two. Facts only. Ask: summarise what this buyer is actually asking for, and list what I can offer under the platform's rules.\" | On screen: \"2. What are they actually asking?\"\n5. (21 to 27s) VO: \"Three. The boundary. Ask for a friendly reply that says no, keeps the conversation on the platform, and does not argue.\" | On screen: \"3. The polite no\"\n6. (27 to 30s) VO: \"Swap their name for 'buyer' before you paste anything. Save this for the next one.\" | On screen: \"Remove their details first. Save this\"", "onscreen": "Fourth message. ALL CAPS.\nDon't reply yet\n1. The cool-down rewrite\n2. What are they actually asking?\n3. The polite no\nRemove their details first\nSave this", "caption": "Fourth message, all capitals, and your draft reply is not one you want on record. Three prompts that keep you calm.\n\n1. The cool-down: \"Rewrite my reply below so it is polite, short and firm. Keep every fact. Remove anything sarcastic. UK English.\"\n2. Facts only: \"Summarise what this buyer is asking for in one line, then list what I can offer under the platform's rules.\"\n3. The polite no: \"Write a friendly reply that declines, keeps everything on the platform and does not argue.\"\n\nOne rule first: replace the buyer's name, address and order details with [BUYER] before you paste their message into any AI tool.\n\nIf it turns into a dispute, use the platform's own help and resolution process. Save this for the next shouty one.", "hashtags": "#vintedtips #ebayseller #chatgptprompts #resellertok #resellercommunityuk", "visuals": "Open on a mock phone message screen built in Canva (never a real buyer's message): an invented message in capitals, \"IS THIS STILL AVAILABLE?? WHY HAVE YOU NOT REPLIED\", from \"Buyer\" with a grey circle avatar. Then a screen recording of a free AI chat tool with each of the three prompts pasted in, using an invented draft reply. Crop to the chat, blur account name, avatar, history sidebar and browser tabs. Label Yellow #F2C84B box around \"[BUYER]\" on the last shot. Stock cutaways (Pexels): \"phone on bedside table night\", \"cup of tea on desk\" (no people). Dark Ink #1F2A44 background for the hook slide with Cream #FAF6EF text, softer Cream background for the prompts.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P46": {"id": "P46", "title": "A used games console from notes to full eBay listing", "format": "Walkthrough (screen recording plus text overlay and AI voiceover)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "40 to 45 seconds", "cta": "Kit", "hook": "\"Four lines of scribbled notes about a PS4. Watch them turn into a full eBay listing.\"", "script": "1. (0 to 3s) VO: \"Four lines of scribbled notes about a PS4. Watch them turn into a full eBay listing.\" | On screen: \"Scribbled notes to full eBay listing\"\n2. (3 to 9s) VO: \"Our example notes: PS4 slim, 500 gig, black, one pad, cables, works, scratch on top, reset.\" | On screen: \"Example notes (invented item)\"\n3. (9 to 16s) VO: \"Step one. The messy notes prompt turns them into a Listing Brief, and flags what is missing: model number, what was tested, is the account signed out.\" | On screen: \"Step 1: Brief + [CHECK] list\"\n4. (16 to 22s) VO: \"We fill the gaps. Then the title prompt writes this. Seventy-seven characters, under eBay's eighty.\" | On screen: \"77 / 80 characters\"\n5. (22 to 30s) VO: \"Step three. The description. What is included, what was tested, what was not, and the scratch, with its photo number.\" | On screen: \"Tested. Not tested. Flaw + photo\"\n6. (30 to 36s) VO: \"Step four. Item specifics, ready to copy into the form. Brand, model, storage, colour.\" | On screen: \"Item specifics, ready to paste\"\n7. (36 to 42s) VO: \"This is what the prompts produce for an example item. Every fact still gets checked by you. All the prompts are in The Well Listed Kit, link in bio.\" | On screen: \"Example output. You check the facts. Kit: link in bio\"", "onscreen": "Scribbled notes to full eBay listing\nExample notes (invented item)\nStep 1: Brief + [CHECK] list\nStep 2: Title, 77 / 80 characters\nStep 3: Tested. Not tested. Flaw + photo\nStep 4: Item specifics, ready to paste\nExample output. You check the facts\nThe Well Listed Kit: link in bio", "caption": "Four lines of scribbled notes about a PS4, turned into a full eBay listing. Example item, start to finish.\n\nNotes in: \"PS4 slim 500gb black, 1 pad, cables, works, scratch on top, reset\".\n\nWhat came out:\nTitle (77 characters): Sony PS4 Slim 500GB Console Black with Controller HDMI and Power Cable Tested\nDescription: what is included, exactly what was tested (power, disc drive, controller pairing, a game played), what was not, and \"light scratch on top panel, see photo 5\".\nItem specifics ready to copy.\n\nThe prompts flagged three gaps before writing anything: model number, test details, account signed out. That is the point. No guessing.\n\nThis is an invented example to show the output, not a sale. The full set of prompts is in The Well Listed Kit (link in bio). Check the current rules in eBay's help pages.", "hashtags": "#ebayuk #ebaysellertips #chatgptprompts #resellinguk #retrogaming", "visuals": "Screen recording of a free AI chat tool on a laptop, zoomed and cropped to the chat. Paste the invented notes, then the brief prompt, then the title, description and item specifics prompts in turn. Speed up the typing (4x) but hold for 2 seconds on each output. Label Yellow #F2C84B boxes over each [CHECK: ...] line and over the character count. Add a mock character counter graphic \"77 / 80\" in Sold Green #1E7F55. Blur the account name, profile picture, chat history sidebar, browser tabs and bookmarks bar. Stock cutaways (Pexels or Canva free): \"game console on desk\", \"game controller close up\", \"hdmi cable\" (no faces, no TV screens showing copyrighted games). Do not show the PlayStation logo large or as a brand mark. Corner label on every output shot: \"Example item. Example output.\" End card: parcel label with \"The Well Listed Kit\" in Archivo 800 Ink #1F2A44 on Cream #FAF6EF.", "file": "launch-kit/marketing/b-short-form-posts/posts-P41-P60.md"}, "P47": {"id": "P47", "title": "A vintage denim jacket for Depop", "format": "Walkthrough (screen recording plus text overlay)", "best": "TikTok, Instagram Reels", "length": "30 to 35 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"Levi's trucker, frayed cuffs, five hashtags. On Depop, line one does the title's job.\"", "script": "1. (0 to 3s) VO: \"Levi's trucker, frayed cuffs, five hashtags. On Depop, line one does the title's job.\" | On screen: \"Denim jacket for Depop, start to finish\"\n2. (3 to 9s) VO: \"Our example brief: Levi's trucker jacket, mid-wash, men's medium, care label dated 1996, pit to pit fifty-eight centimetres, fraying on both cuffs.\" | On screen: \"Example brief (invented item)\"\n3. (9 to 16s) VO: \"The opening line matters most on Depop, because it acts like the title. So it leads with brand, item and fit.\" | On screen: \"First line = your title\"\n4. (16 to 22s) VO: \"Then short lines. Size and measurements. Condition, with the cuff fraying named, not hidden. Postage.\" | On screen: \"Measurements. Flaws named. Postage.\"\n5. (22 to 28s) VO: \"Then five relevant hashtags. Depop's own help pages say up to five, so every one has to earn its place.\" | On screen: \"5 hashtags, all relevant\"\n6. (28 to 33s) VO: \"Example output only. Check t
