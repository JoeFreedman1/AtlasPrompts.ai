<style>
:root{--ink:#1F2A44;--cream:#FAF6EF;--kraft:#C9A27E;--green:#1E7F55;--yellow:#F2C84B;--red:#C4453B;--card:#fff;--muted:#5b6478;--line:#e6dccd;--bg:#FAF6EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3EEE6;--cream:#1F2A44;--card:#27334f;--muted:#b7bfd1;--line:#3a4764;--bg:#172036;--kraft:#b08a66}}
:root[data-theme="dark"]{--ink:#F3EEE6;--cream:#1F2A44;--card:#27334f;--muted:#b7bfd1;--line:#3a4764;--bg:#172036;--kraft:#b08a66}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0}
header{background:#1F2A44;color:#FAF6EF;padding:14px 16px 0;position:sticky;top:0;z-index:10}
.brand{font:800 1.1rem Archivo,sans-serif}.brand b{color:#F2C84B}
.sub{font-size:.85rem;opacity:.85;margin:2px 0 10px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:none;background:none;border:none;color:#FAF6EF;opacity:.7;font:600 .9rem Inter,sans-serif;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-color:#F2C84B}
main{max-width:760px;margin:0 auto;padding:14px 16px 80px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.label{border:2px solid var(--kraft);outline:1px dashed var(--kraft);outline-offset:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;background:var(--yellow);color:#1F2A44;border-radius:6px;padding:0 7px;font:700 .78rem 'JetBrains Mono',monospace}
.muted{color:var(--muted);font-size:.85rem}
.btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 12px;font:600 .85rem Inter,sans-serif;cursor:pointer;min-height:40px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--kraft)}
.btn.done{background:#1F2A44;color:#fff}
.copies{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;padding:6px 0}
pre{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 'JetBrains Mono',monospace;margin:6px 0}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:none}.task input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#1E7F55}
.task.ticked span{text-decoration:line-through;opacity:.6}
.daynav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.82rem}
.day.today{border:2px solid var(--green)}.day h3{font-size:.95rem;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font:800 1.5rem Archivo,sans-serif}.kpi .k{font-size:.8rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
.det p{margin:4px 0}.det ul{margin:4px 0;padding-left:18px}.det code{font-size:.8em}
.plan h1{font-size:1.2rem}.plan h2{font-size:1rem;margin-top:14px}.plan ul{padding-left:18px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
input[type=date]{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1E7F55;color:#fff;padding:10px 16px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style></head>

oad natively to each app (no watermarks)."}, {"day": 30, "slot": "B", "time": "19:30", "platforms": "Instagram carousel; TikTok photo mode (or second video)", "item": "P33", "notes": "Carousel version if the post has slides; otherwise post as a second TikTok video."}, {"day": 30, "slot": "Pin", "time": "12:00", "platforms": "Pinterest", "item": "PIN30", "notes": "Schedule in Pinterest's free scheduler."}], "posts": {"P01": {"id": "P01", "title": "Messy notes to an 80-character eBay title", "format": "Tutorial (screen recording plus text overlay)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 to 30 seconds", "cta": "Soft (free cheat sheet)", "hook": "On screen: \"These scribbles became an 80-character eBay title.\" VO: \"These scribbles became a full eBay title in one prompt.\"", "script": "1. (0 to 2s) VO: \"These scribbles became a full eBay title in one prompt.\" | On screen: \"These scribbles became an 80-character eBay title.\"\n2. (2 to 6s) VO: \"Here are the notes. Typed on a phone, no capitals, no order.\" | On screen: \"tnf nuptse 700 mens M black, down fill, hood stows in collar, small mark left sleeve\"\n3. (6 to 11s) VO: \"Paste them into any free AI chat with three rules. Use only my facts. Brand first. Never go over 80 characters, spaces included.\" | On screen: \"Only my facts. Brand first. 80 characters max.\"\n4. (11 to 17s) VO: \"Then ask it to show the character count after every title, because AI tools often miscount.\" | On screen: \"Ask for the count. Then check it.\"\n5. (17 to 23s) VO: \"The North Face Nuptse 700, mens, black, down puffer jacket, size M, stowable hood. Seventy-six characters. Every word came from the notes.\" | On screen: \"The North Face Nuptse 700 Mens Black Down Puffer Jacket Size M Stowable Hood (76)\"\n6. (23 to 27s) VO: \"And the mark on the sleeve? That goes in the description, not the title.\" | On screen: \"Flaws go in the description.\"\n7. (27 to 30s) VO: \"Our free UK Listing Cheat Sheet has this prompt. Link in bio.\" | On screen: \"Free cheat sheet: link in bio\"", "onscreen": "These scribbles became an 80-character eBay title.\ntnf nuptse 700 mens M black, down fill, hood stows in collar, small mark left sleeve\nOnly my facts. Brand first. 80 characters max.\nAsk for the count. Then check it.\nThe North Face Nuptse 700 Mens Black Down Puffer Jacket Size M Stowable Hood (76)\nFlaws go in the description.\nFree cheat sheet: link in bio\nCheck the current rule in eBay's help pages.", "caption": "Scrappy notes to a full eBay UK title in one prompt.\n\nThe trick is not a clever prompt. It is three plain rules:\n1. Use only the facts in my notes. Do not add anything.\n2. Brand first, then item type, then model, size and colour.\n3. Never go over 80 characters, spaces included, and show the count.\n\nThen count it yourself or paste it into the eBay form, because AI tools miscount. Flaws (like the small mark on this sleeve) belong in the description and condition notes, not the title.\n\nThe full prompt is in our free UK Listing Cheat Sheet. Link in bio.\n\nExample item. eBay's title limit is 80 characters at the time of writing: check the current rule in eBay's help pages.", "hashtags": "#ebayuk #ebaysellertips #resellertok #chatgptprompts #resellercommunityuk", "visuals": "- Open on a phone notes app mock-up (build it in Canva: white note on Cream background) showing the scrappy notes in a system-style font. No real notes app account visible.\n- Screen-record a laptop browser with a free AI chat tool. Type the prompt (rules from Kit prompt T1: \"Aim for 70 to 80 characters. Never go over 80 characters including spaces. After each title, show the exact character count.\"). Crop to the chat pane only. Blur the sidebar history, account name and avatar.\n- Zoom (CapCut keyframe) onto the finished title and put a Label Yellow highlighter box over \"(76)\".\n- Final title shown on a parcel-label card: cream card, kraft `#C9A27E` border, dashed cut line, title in Ink, count in Sold Green.\n- Cutaway stock (1 to 2 seconds behind slide 6): Pexels search \"black puffer jacket flat lay\" (item only, no person). Blur any visible logo if the stock clip shows a different brand from the example.\n- Music: calm lo-fi from the platform's commercial music library, low volume under the VO.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P02": {"id": "P02", "title": "The Listing Brief: what to tell AI before it writes a word", "format": "Tutorial (carousel, 7 slides)", "best": "Instagram carousel, TikTok photo mode", "length": "7 slides", "cta": "Kit", "hook": "Slide 1: \"'Blue jumper, good condition.' That is all the AI got. So it invented cashmere.\" (Photo mode VO, optional: \"Four words in, one made-up fabric out.\")", "script": "1. Slide 1: \"'Blue jumper, good condition.' That is all the AI got. So it invented cashmere.\" Small text: \"The fix fits in one note.\"\n2. Slide 2: \"Type 'blue jumper, good condition' and AI fills every gap with guesses. Cashmere. Vintage. Flawless. None of it true.\"\n3. Slide 3: \"The fix: a Listing Brief. A short block of facts you fill in once, then paste before every prompt.\"\n4. Slide 4 (the template, in a code-style box): \"What it is / Brand / Size on label / Measurements (cm) / Colour / Material (from the label) / Condition / Flaws: where, what, how big / Included / Postage / Price\"\n5. Slide 5: \"Then one rule in every prompt: 'Use ONLY the facts in my brief. Write [CHECK: ...] where something is missing.'\"\n6. Slide 6: \"Blank is better than wrong. A blank line becomes a [CHECK]. A wrong line becomes a return.\"\n7. Slide 7: \"The Well Listed Kit has category briefs for clothing, electronics, books, homeware, toys and handmade. Launch price £12. Or grab the free cheat sheet first.\"", "onscreen": "\"Blue jumper, good condition.\" So the AI invented cashmere.\n\"Blue jumper, good condition\" = guesses.\nThe fix: a Listing Brief.\nFacts only. Filled in once. Pasted every time.\n\"Use ONLY my facts. Write [CHECK] if missing.\"\nBlank is better than wrong.\nThe Well Listed Kit: £12 at launch. Free cheat sheet too.", "caption": "Four words in, and the AI invented cashmere. It was not guessing badly: it had nothing else to go on.\n\nBefore you ask any AI tool to write a listing, give it a Listing Brief: a short block of facts about the item. Brand, size on the label, measurements in cm, colour, material from the care label, condition, and flaws written as where, what and how big.\n\nThen add one line to every prompt: \"Use ONLY the facts in my brief. Write [CHECK: ...] wherever something is missing.\"\n\nYou fill in the checks yourself. No invented cashmere, no surprise \"vintage\".\n\nSave this, and copy the template from slide 4 into your notes app.\n\nThe Well Listed Kit has brief templates for six categories and prompts that turn messy notes or a voice note into a brief. £12 at launch. The free cheat sheet is in our bio too.", "hashtags": "#chatgptprompts #listingtips #vintedtips #ebayseller #ukseller", "visuals": "- Canva, 1080 x 1350 portrait, Cream background.\n- Slide 1: parcel-label card (kraft border, dashed cut line), \"cashmere\" highlighted in Label Yellow.\n- Slide 2: a mock AI reply in a grey chat bubble with the invented words \"Cashmere\", \"Vintage\", \"Flawless\" struck through in Returns Red.\n- Slide 4: JetBrains Mono inside an Ink box with Cream text, like a code block. This is the slide people save, so keep it readable (minimum 28 pt).\n- Slide 5: \"[CHECK: ...]\" in Label Yellow.\n- Slide 7: small flat product mock-up of the Kit cover (text-only cover in brand colours, no marketplace logos). Price in Sold Green.\n- Optional background photo for slides 2 and 6: Canva free library search \"folded knit jumper flat lay\" (no people).\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P03": {"id": "P03", "title": "A Vinted description that answers the questions before they are asked", "format": "Tutorial (screen recording plus text overlay)", "best": "TikTok, Instagram Reels", "length": "30 seconds", "cta": "Soft (save)", "hook": "On screen: \"Is it true to size? Any flaws? Can you measure it?\" VO: \"Three messages you can stop getting.\"", "script": "1. (0 to 2s) VO: \"Three messages you can stop getting.\" | On screen: \"Is it true to size? Any flaws? Can you measure it?\"\n2. (2 to 6s) VO: \"Buyers on Vinted ask the same things, so answer them in the description.\" | On screen: \"Answer them before they ask.\"\n3. (6 to 12s) VO: \"Ask the AI for five short lines, in this order: what it is, measurements, fit, condition, postage.\" | On screen: \"What / Measurements / Fit / Condition / Postage\"\n4. (12 to 20s) VO: \"Here is the result for a pair of Levi's 501s. Waist measured flat, inside leg, rise. Fit, only because it was tried on. Fading at both knees, shown in photo four.\" | On screen: \"Levi's 501 black jeans, W30 L32. Waist 38 cm flat, inside leg 81 cm, rise 28 cm. Straight fit, sits on the waist. Fading at both knees (photo 4). Posted within 2 days.\"\n5. (20 to 25s) VO: \"Tell it no hype words and no emoji walls. Short lines read better on a phone.\" | On screen: \"No 'stunning'. No emoji walls.\"\n6. (25 to 30s) VO: \"Save this for your next listing.\" | On screen: \"Save this for your next listing.\"", "onscreen": "Is it true to size? Any flaws? Can you measure it?\nAnswer them before they ask.\nWhat / Measurements / Fit / Condition / Postage\nLevi's 501 black jeans, W30 L32.\nWaist 38 cm flat, inside leg 81 cm, rise 28 cm.\nStraight fit, sits on the waist.\nFading at both knees (photo 4).\nPosted within 2 days.\nNo \"stunning\". No emoji walls.\nSave this for your next listing.", "caption": "Is it true to size? Any flaws? Can you measure it? Answer all three in the description and the messages get quieter.\n\nAsk your AI tool for five short lines, in this order:\n1. What it is (brand, item, size on label)\n2. Measurements, laid flat, in cm\n3. Fit (only if you have tried it on or compared it)\n4. Condition and flaws, with where they are and which photo shows them\n5. Postage\n\nAdd \"UK English, no hype words, no emoji, use only my facts\" and you get something a buyer can read in ten seconds.\n\nExample item: invented Levi's 501s. Save this for the next pair of jeans you list.", "hashtags": "#vintedtips #vintedsellinguk #vintedtok #resellertok #chatgptprompts", "visuals": "- Open on three mock message bubbles (build in Canva, generic grey bubbles, no app branding) stacking one after another with a soft pop.\n- Screen-record the AI chat tool producing the five-line description. Prompt to type: \"Write a Vinted description for my Listing Brief in 5 short lines: what it is, measurements (cm, laid flat), fit, condition and flaws with photo numbers, postage. UK English. No hype words, no emoji. Use only my facts.\" Crop to the chat. Blur account details.\n- Highlight \"photo 4\" and \"38 cm flat\" with Label Yellow boxes.\n- B-roll: Pexels search \"black jeans folded\" and \"tape measure jeans\" (hands only or item only).\n- Final slide: parcel-label card, Ink on Cream.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P04": {"id": "P04", "title": "Fill all 13 Etsy tags without repeating your title", "format": "Tutorial (carousel, 6 slides)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "6 slides", "cta": "Soft (free cheat sheet)", "hook": "Slide 1: \"13 Etsy tags. Write 'tea towel' three ways and two of them are wasted.\"", "script": "1. Slide 1: \"13 Etsy tags. Write 'tea towel' three ways and two of them are wasted.\" Small text: \"Up to 20 characters each. Limits at the time of writing: check Etsy's help pages.\"\n2. Slide 2: \"Common waste: the same phrase 3 ways. 'tea towel', 'tea towels', 'linen tea towels'.\"\n3. Slide 3: \"Better: each tag is a different way a buyer might search. Material. Style. Use. Occasion. Room.\"\n4. Slide 4 (prompt box): \"Write 13 Etsy tags for my Listing Brief. Each 20 characters or fewer, with the count. No two tags the same idea. Only facts from my brief. No other brand names.\"\n5. Slide 5 (worked example, hand block printed linen tea towel, yellow lemon print on natural linen): \"linen tea towel / lemon print / natural linen / block printed towel / yellow kitchen decor / citrus kitchen / cottage kitchen / drying cloth / summer table linen / kitchen textiles / housewarming gift / gift for baker / mothers day gift\"\n6. Slide 6: \"Check every tag is true for your item. Free cheat sheet with the character table: link in bio.\"", "onscreen": "13 Etsy tags. \"Tea towel\" three ways wastes two.\nSame phrase 3 ways = 2 tags wasted.\nOne tag per search idea.\nMaterial. Style. Use. Occasion. Room.\n13 tags, 20 characters or fewer, with the count.\nExample: block printed linen tea towel\nEvery tag must be true.\nFree cheat sheet: link in bio", "caption": "13 Etsy tags, up to 20 characters each (at the time of writing: check the current rule in Etsy's help pages). Make every one count.\n\nDo not repeat one phrase three ways. Give each tag a different way a buyer might search: material, style, use, occasion, room.\n\nAsk your AI tool for 13 tags from your Listing Brief, each 20 characters or fewer with the count shown, no two tags covering the same idea, and no other brand names.\n\nSlide 5 is a full worked set for an example block printed linen tea towel. Count them yourself before pasting.\n\nFree UK Listing Cheat Sheet (with the character-limit table): link in bio.", "hashtags": "#etsysellertips #etsyseo #etsyukseller #chatgptprompts #smallbusinessuk", "visuals": "- Canva, 1080 x 1350, Cream background.\n- Slide 2: three tag \"pills\" in grey, two struck through in Returns Red.\n- Slide 5: 13 tag pills in Ink outline on Cream, each with its character count in small Sold Green text (15, 11, 13, 19, 20, 14, 15, 12, 18, 16, 17, 14, 16).\n- Slide 5 background photo: Canva free library search \"linen tea towel\" or Pexels \"folded tea towel kitchen\" (item only). If the stock towel does not have a lemon print, use a cream background instead, so the photo does not contradict the example.\n- Only use \"block printed\" if the maker really block printed it: every tag must be true.\n- No Etsy logo. Write \"Etsy\" as plain text only.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P05": {"id": "P05", "title": "Price from sold listings you paste in", "format": "Tutorial (screen recording plus text overlay)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Soft (save)", "hook": "On screen: \"Stop asking AI 'what is this worth?'\" VO: \"Stop asking AI what your item is worth. It does not know.\"", "script": "1. (0 to 2s) VO: \"Stop asking AI what your item is worth. It does not know.\" | On screen: \"Stop asking AI 'what is this worth?'\"\n2. (2 to 7s) VO: \"It has not seen last week's sold prices. So you find them. On eBay, search the item and turn on the sold items filter.\" | On screen: \"You find the sold prices.\"\n3. (7 to 12s) VO: \"Copy five to ten close matches into your notes: title, sold price, postage, condition. Asking prices do not count.\" | On screen: \"5 to 10 matches. Sold, not asking.\"\n4. (12 to 18s) VO: \"Paste them in and tell the AI to use only your numbers, show its working, and say if the evidence is thin.\" | On screen: \"Use only my numbers. Show the sums.\"\n5. (18 to 25s) VO: \"Example: Clarks Chelsea boots, UK 6. Good matches sold for twenty to thirty-two pounds. Median twenty-five. List at twenty-eight, floor eighteen.\" | On screen: \"Sold £20 to £32. Median £25. List £28. Floor £18. (Example figures)\"\n6. (25 to 30s) VO: \"You find the prices. The AI does the maths. Save this.\" | On screen: \"You find the prices. AI does the maths.\"", "onscreen": "Stop asking AI \"what is this worth?\"\nYou find the sold prices.\n5 to 10 matches. Sold, not asking.\nUse only my numbers. Show the sums.\nSold £20 to £32. Median £25.\nList £28. Floor £18.\nExample figures only.\nYou find the prices. AI does the maths.", "caption": "Stop asking AI what your item is worth. It has not seen last week's sold prices, so it guesses, confidently.\n\nDo this instead:\n1. Look up sold listings yourself (on eBay, turn on the \"Sold items\" filter).\n2. Copy 5 to 10 close matches: title, sold price, postage, condition. Asking prices are not sold prices.\n3. Paste them in with your item details and say: use only my numbers, show your working, tell me if the evidence is thin.\n\nYou get a range, a median, a list price and a floor you can explain to yourself later.\n\nNo scraping tools needed. Ten minutes of looking gives better matches anyway. Example figures in the video. Save this.", "hashtags": "#vintedtips #ebaysellertips #resellertok #resellinguk #chatgpttips", "visuals": "- Screen-record a mock \"sold comps\" note (build in a plain text editor or Canva, invented listings only, never a screenshot of someone's real listing).\n- Screen-record the AI chat running Kit prompt R2 (\"Suggest a price for my item using only the sold listings I have found... Use only the numbers I pasted. Do not use outside knowledge of prices.\"). Crop to chat, blur history and account.\n- Show the result table with a Label Yellow box over \"Median £25\".\n- Slide 5: price ladder graphic in Canva: Floor £18 (Returns Red), Median £25 (Ink), List £28 (Sold Green). Small grey line \"Example figures only\".\n- B-roll: Pexels \"black leather chelsea boots\" (no feet, no person).\n- Do not show any real eBay search results page.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P06": {"id": "P06", "title": "Reply to a lowball offer without losing your temper", "format": "Tutorial (text-message style video)", "best": "TikTok, Instagram Reels", "length": "20 to 25 seconds", "cta": "Soft (free cheat sheet)", "hook": "On screen: \"Listed at £65. Offer: £25.\" VO: \"Listed at sixty-five pounds. They offer twenty-five.\"", "script": "1. (0 to 2s) VO: \"Listed at sixty-five pounds. They offer twenty-five.\" | On screen: \"Listed at £65. Offer: £25.\"\n2. (2 to 5s) VO: \"You have three bad options: ignore it, snap at them, or cave.\" | On screen: \"Ignore. Snap. Cave.\"\n3. (5 to 10s) VO: \"Better: decide your floor before the offer arrives. Then the reply writes itself.\" | On screen: \"Decide your floor first.\"\n4. (10 to 16s) VO: \"Ask the AI for a short, friendly counter that never goes below your floor and gives one true reason.\" | On screen: \"Friendly. Short. One true reason.\"\n5. (16 to 21s) VO: \"Thanks for the offer. The lowest I can do is fifty-six pounds, as it is heavy to post. Happy to hold it if that works.\" | On screen: \"Thanks for the offer. The lowest I can do is £56, as it is heavy to post.\"\n6. (21 to 25s) VO: \"No 'someone else is interested' unless it is true. Free prompts in our cheat sheet, link in bio.\" | On screen: \"No fake pressure. Free cheat sheet: link in bio\"", "onscreen": "Listed at £65. Offer: £25.\nIgnore. Snap. Cave.\nDecide your floor first.\nFriendly. Short. One true reason.\nThanks for the offer. The lowest I can do is £56, as it is heavy to post.\nExample figures only.\nNo fake pressure.\nFree cheat sheet: link in bio", "caption": "Listed at £65, offered £25. Here is a reply that keeps it friendly and keeps your price.\n\nDecide your floor before any offer lands. Then ask your AI tool for a short counter that:\n1. Thanks them\n2. Gives one price, never below your floor\n3. Gives one reason, and only a true one (heavy to post, near-new condition)\n4. Leaves the door open\n\nLeave out \"someone else is interested\" unless it is true. Fake pressure is a bad look, and buyers can usually tell.\n\nExample: \"Thanks for the offer. The lowest I can do is £56, as it is heavy to post.\"\n\nMore free prompts in the UK Listing Cheat Sheet. Link in bio.", "hashtags": "#lowballoffers #vintedtips #ebayseller #resellercommunityuk #resellertok", "visuals": "- Build a generic chat mock-up in Canva (grey and Ink bubbles, no app logo, no usernames, buyer shown as \"[BUYER]\").\n- Bubble 1 (buyer, grey): \"would you take £25\". Let it sit for a beat with a small \"...\" typing indicator.\n- Slide 3: three option cards, \"Ignore\" and \"Snap\" struck through in Returns Red, \"Cave\" struck through too.\n- Short screen recording of an AI chat producing the reply from Kit prompt R5 wording (\"Never go below my floor. Do not suggest fake scarcity or pressure\"). Crop and blur account details.\n- Final reply bubble in Ink with a Sold Green tick.\n- B-roll: Pexels \"cast iron casserole dish\" (item only).\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P07": {"id": "P07", "title": "Condition notes that head off \"not as described\"", "format": "Tutorial (carousel, 7 slides)", "best": "Instagram carousel, TikTok photo mode, Facebook", "length": "7 slides", "cta": "Soft (save)", "hook": "Slide 1: \"'Minor signs of wear' is not a condition note. It is an argument waiting to happen.\"", "script": "1. Slide 1: \"'Minor signs of wear' is not a condition note. It is an argument waiting to happen.\"\n2. Slide 2: \"Minor to you. Major to the buyer. Vague words let each side picture something different.\"\n3. Slide 3: \"The formula: WHERE + WHAT + HOW BIG + WHICH PHOTO.\"\n4. Slide 4 (example 1): \"Before: 'Some marks.' After: 'Pale mark on front, left of the buttons, about 5 mm (photo 5).'\"\n5. Slide 5 (example 2): \"Before: 'Works fine.' After: 'Tested: powers on, Wi-Fi connects, all buttons respond. Bluetooth not tested.'\"\n6. Slide 6 (prompt box): \"Rewrite my flaws using where, what, how big and which photo. Keep every flaw as serious as I wrote it. Do not soften anything.\"\n7. Slide 7: \"Honest detail protects you and the buyer. Save this for your next listing.\"", "onscreen": "\"Minor signs of wear\" is an argument waiting to happen.\nMinor to you. Major to them.\nWHERE + WHAT + HOW BIG + WHICH PHOTO\nPale mark on front, left of the buttons, about 5 mm (photo 5).\nTested: power, Wi-Fi, buttons. Bluetooth not tested.\nDo not soften anything.\nSave this for your next listing.", "caption": "\"Minor signs of wear\" means something different to every buyer. That gap is where \"not as described\" starts.\n\nWrite each flaw as where, what, how big, and which photo shows it:\n\"Pale mark on front, left of the buttons, about 5 mm (photo 5).\"\n\nFor electronics, list what you tested and what you did not:\n\"Tested: powers on, Wi-Fi connects, all buttons respond. Bluetooth not tested.\"\n\nIf you use AI to tidy your notes, add: \"Keep every flaw as serious as I wrote it. Do not soften anything.\" Otherwise it may quietly turn \"hole\" into \"tiny imperfection\".\n\nSave this, then reread your last three condition notes.", "hashtags": "#ebaysellertips #vintedsellertips #resellingtips #listingtips #ukseller", "visuals": "- Canva, 1080 x 1350.\n- Slide 1: parcel-label card with \"Minor signs of wear\" in grey inside quotation marks, struck through in Returns Red.\n- Slide 3: the formula as four kraft-coloured tape strips, one word on each.\n- Slides 4 and 5: before on top (grey, Returns Red strike), after below (Ink, Sold Green tick).\n- Slide 4 background inset: Pexels \"shirt button close up\" (item only). Add a small circle drawn in Label Yellow round a spot to show \"where\".\n- Slide 6: JetBrains Mono prompt in an Ink box.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P08": {"id": "P08", "title": "One listing, three platforms: eBay, Vinted and Depop", "format": "Tutorial (split-screen screen recording)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Kit", "hook": "On screen: \"Same jacket. Three platforms. Three different listings.\" VO: \"Same jacket, three platforms. Do not paste the same text everywhere.\"", "script": "1. (0 to 2s) VO: \"Same jacket, three platforms. Do not paste the same text everywhere.\" | On screen: \"Same jacket. Three platforms. Three different listings.\"\n2. (2 to 7s) VO: \"Each one reads differently. eBay search leans on the title, so use the space. Vinted buyers want short and clear. Depop reads like a caption.\" | On screen: \"eBay: use the title. Vinted: short. Depop: caption-style.\"\n3. (7 to 12s) VO: \"Write one Listing Brief. Then ask for all three versions in one go, from the same facts.\" | On screen: \"One brief. Three versions. Same facts.\"\n4. (12 to 18s) VO: \"eBay: Topshop Womens Brown Suede Jacket, size 10, button front, 90s style.\" | On screen: \"eBay: Topshop Womens Brown Suede Jacket Size 10 Button Front 90s Style\"\n5. (18 to 22s) VO: \"Vinted: Topshop brown suede jacket, size 10.\" | On screen: \"Vinted: Topshop brown suede jacket, size 10\"\n6. (22 to 26s) VO: \"Depop: Brown suede Topshop jacket, UK 10, boxy fit, with up to five relevant hashtags.\" | On screen: \"Depop: Brown suede Topshop jacket, UK 10, boxy fit #topshop #suedejacket\"\n7. (26 to 30s) VO: \"The Well Listed Kit has the prompt that does all three from one brief. Twelve pounds at launch.\" | On screen: \"The Well Listed Kit. £12 at launch.\"", "onscreen": "Same jacket. Three platforms. Three different listings.\neBay: use the title. Vinted: short. Depop: caption-style.\nOne brief. Three versions. Same facts.\neBay: Topshop Womens Brown Suede Jacket Size 10 Button Front 90s Style\nVinted: Topshop brown suede jacket, size 10\nDepop: Brown suede Topshop jacket, UK 10, boxy fit\n\"90s style\" because the era is not confirmed.\nThe Well Listed Kit. £12 at launch.", "caption": "Same jacket, three platforms, three different listings. Pasting identical text everywhere wastes what each platform is good at.\n\neBay UK: the title does the heavy lifting, so use the space (up to 80 characters at the time of writing).\nVinted: short, clear title and fill in the brand, size and colour fields.\nDepop: the opening line works like a title, then up to 5 relevant hashtags (Depop's help pages say 5).\n\nThe shortcut: write one Listing Brief, then ask for all three versions from the same facts, so nothing changes between them except the style.\n\nNote the \"90s style\" wording. The era is not confirmed, so it is not claimed.\n\nThe Well Listed Kit has the three-in-one prompt. £12 at launch. Check current limits in each platform's help pages.", "hashtags": "#crosslisting #resellertok #vintedseller #depopseller #ebayuk", "visuals": "- Open on a flat lay of a brown suede jacket: Pexels search \"brown suede jacket flat lay\" (item only, no model).\n- Split screen in CapCut: three columns labelled in plain text \"eBay\", \"Vinted\", \"Depop\" (no platform logos). Each column shows a generic listing card built in Canva with the example text.\n- Screen-record the AI chat producing all three versions from one brief. Crop to chat, blur the account.\n- Put a Label Yellow box round \"90s Style\" and show the small line \"Era not confirmed, so 'style'\".\n- End card: Kit cover mock-up on Cream, price in Sold Green. No marketplace logos anywhere.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P09": {"id": "P09", "title": "List 10 items in one chat: the batch method", "format": "Tutorial (screen recording plus text overlay)", "best": "TikTok, YouTube Shorts, Instagram Reels", "length": "30 seconds", "cta": "Soft (free cheat sheet)", "hook": "On screen: \"Ten items. One chat. Stop starting from scratch.\" VO: \"If you open a new chat for every item, try this.\"", "script": "1. (0 to 2s) VO: \"If you open a new chat for every item, try this.\" | On screen: \"Ten items. One chat. Stop starting from scratch.\"\n2. (2 to 7s) VO: \"Message one sets the rules, once. Platform, UK English, only use my facts, flag gaps with CHECK, title limit, description format.\" | On screen: \"Message 1: the rules. Once.\"\n3. (7 to 11s) VO: \"End it with: reply 'ready' and wait for my first item.\" | On screen: \"'Reply READY and wait.'\"\n4. (11 to 17s) VO: \"Then paste item one's brief. Get the listing. Paste item two. Same rules, no retyping.\" | On screen: \"Item 1. Item 2. Item 3...\"\n5. (17 to 23s) VO: \"Every few items, paste the rules again. Long chats can drift, and a quick reminder keeps it on track.\" | On screen: \"Every 5 items: paste the rules again.\"\n6. (23 to 27s) VO: \"Check each one before posting. Batching saves typing, not checking.\" | On screen: \"Batch the typing. Not the checking.\"\n7. (27 to 30s) VO: \"The rules message is in our free cheat sheet. Link in bio.\" | On screen: \"Free cheat sheet: link in bio\"", "onscreen": "Ten items. One chat. Stop starting from scratch.\nMessage 1: the rules. Once.\n\"Reply READY and wait for my first item.\"\nItem 1. Item 2. Item 3...\nEvery 5 items: paste the rules again.\nBatch the typing. Not the checking.\nFree cheat sheet: link in bio", "caption": "Ten items, one chat. Stop retyping the same instructions for every listing.\n\n1. First message: your rules, once. Platform, UK English, use only my facts, write [CHECK] for anything missing, title limit, description format. End with \"Reply READY and wait for my first item.\"\n2. Paste one Listing Brief at a time. Get the listing, then paste the next.\n3. Every five items or so, paste the rules again. Long chats can drift.\n4. Read every listing before it goes live. Batching saves typing, not checking.\n\nWorks in the free versions of the common AI chat tools. The rules message is in our free UK Listing Cheat Sheet. Link in bio.", "hashtags": "#resellertok #listingtips #chatgptprompts #resellinguk #ebayseller", "visuals": "- Screen-record a free AI chat tool: type the rules message (show it fully for 2 seconds, then speed-ramp), the reply \"READY\", then three brief pastes with quick results. Speed up the middle to 4x with a small \"4x\" label.\n- Crop to the chat. Blur chat history sidebar, account name and avatar.\n- Overlay a simple counter in the corner (Label Yellow circle): \"1/10\", \"2/10\", \"3/10\".\n- B-roll behind slide 1: Pexels \"clothes rail\" or \"pile of folded clothes\" (no people).\n- Slide 6 on a parcel-label card.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P10": {"id": "P10", "title": "Pit to pit, length, inside leg: which measurement matters when", "format": "Tutorial (hands-only demo video)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Soft (save)", "hook": "On screen: \"Size 12 today is not size 12 in 1985.\" VO: \"A size 12 from 1985 is not a size 12 today. Measure instead.\"", "script": "1. (0 to 2s) VO: \"A size 12 from 1985 is not a size 12 today. Measure instead.\" | On screen: \"Size 12 today is not size 12 in 1985.\"\n2. (2 to 8s) VO: \"Tops: pit to pit. Lay it flat, buttoned, and measure straight across from one armpit seam to the other.\" | On screen: \"Tops: pit to pit. Armpit seam to armpit seam.\"\n3. (8 to 12s) VO: \"Then length: top of the shoulder by the collar, down to the hem.\" | On screen: \"Length: shoulder by the collar to hem.\"\n4. (12 to 17s) VO: \"Trousers and jeans: waist straight across, then inside leg, crotch seam to hem.\" | On screen: \"Trousers: waist flat. Inside leg: crotch seam to hem.\"\n5. (17 to 22s) VO: \"Rise matters for high-waisted jeans. Sleeve matters for coats and anyone tall.\" | On screen: \"Rise: high-waisted. Sleeve: coats.\"\n6. (22 to 26s) VO: \"If you double a flat measurement, say you doubled it.\" | On screen: \"Doubled? Say so.\"\n7. (26 to 30s) VO: \"Centimetres, laid flat, and say how you measured. Save this.\" | On screen: \"Cm. Laid flat. Say how. Save this.\"", "onscreen": "Size 12 today is not size 12 in 1985.\nTops: pit to pit. Armpit seam to armpit seam.\nLength: shoulder by the collar to hem.\nTrousers: waist flat. Inside leg: crotch seam to hem.\nRise: high-waisted. Sleeve: coats.\nDoubled? Say so.\nCm. Laid flat. Say how. Save this.", "caption": "A size 12 from 1985 is not a size 12 today, and vintage sizing often runs small. Measurements settle it.\n\nTops: pit to pit (lay flat, buttoned, armpit seam to armpit seam) and length (top of shoulder by the collar to hem).\nTrousers and jeans: waist straight across, inside leg (crotch seam to hem), and rise for high-waisted styles.\nCoats: add sleeve (shoulder seam to cuff).\n\nAlways centimetres, always laid flat, and say how you measured. If you doubled a flat measurement to get a full chest or waist, say you doubled it.\n\nSave this, and keep a tape measure where you take your photos.", "hashtags": "#vintedtips #resellingtips #secondhandfashion #vintedsellinguk #preloved", "visuals": "- Film it yourself, hands only, top-down: a jumper and a pair of jeans on a plain cream sheet, with a fabric tape measure. Film in daylight. Keep rings, tattoos, nails that could identify you and any home background out of shot (use a plain sheet that fills the frame).\n- If you cannot film, use Pexels \"tape measure clothes flat lay\" and \"measuring jeans\" (hands only).\n- Overlay a Sold Green dotted line along each measurement path, with the measurement name in a small Ink label.\n- Slide 1: two parcel-label cards side by side, \"Size 12 (1985)\" and \"Size 12 (today)\", slightly different widths.\n- No voice of your own: AI voiceover only.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P11": {"id": "P11", "title": "Check an Amazon UK title against the rules before you publish", "format": "Tutorial (screen recording plus text overlay)", "best": "TikTok, YouTube Shorts, LinkedIn video", "length": "30 seconds", "cta": "Soft (free cheat sheet)", "hook": "On screen: \"This Amazon title has 4 problems. Spot them?\" VO: \"This Amazon title has four problems. Can you spot them?\"", "script": "1. (0 to 2s) VO: \"This Amazon title has four problems. Can you spot them?\" | On screen: \"Bamboo Drawer Organiser!!! Best Bamboo Drawer Organiser Bamboo Kitchen Storage Set 6 Pack for Cutlery Utensils Office Desk Makeup Bathroom\"\n2. (2 to 7s) VO: \"One. Amazon UK cut titles to seventy-five characters for most categories from twenty-seven July twenty twenty-six. This one is a hundred and thirty-eight.\" | On screen: \"1. 138 characters. Most categories: 75 max.\"\n3. (7 to 11s) VO: \"Two. Exclamation marks. Amazon restricts characters like that unless they are part of the brand name.\" | On screen: \"2. '!' is a restricted character.\"\n4. (11 to 15s) VO: \"Three. 'Bamboo' appears three times. The same word more than twice is not allowed.\" | On screen: \"3. Same word more than twice.\"\n5. (15 to 19s) VO: \"Four. 'Best' is a claim you would need to back up. Leave it out.\" | On screen: \"4. 'Best' is an unsupported claim.\"\n6. (19 to 25s) VO: \"Fixed: Tidy Nook Bamboo Drawer Organiser, set of six boxes in three sizes, natural. Sixty-seven characters.\" | On screen: \"Tidy Nook Bamboo Drawer Organiser Set of 6 Boxes in 3 Sizes Natural (67)\"\n7. (25 to 30s) VO: \"Paste your title in and ask the AI to check it against these rules. Then check Seller Central for your category. Free cheat sheet in bio.\" | On screen: \"Check your category in Seller Central. Free cheat sheet: link in bio\"", "onscreen": "This Amazon title has 4 problems. Spot them?\n1. 138 characters. Most categories: 75 max.\n2. \"!\" is a restricted character.\n3. Same word more than twice.\n4. \"Best\" is an unsupported claim.\nTidy Nook Bamboo Drawer Organiser Set of 6 Boxes in 3 Sizes Natural (67)\nInvented brand, example only.\nCheck your category in Seller Central.\nFree cheat sheet: link in bio", "caption": "This Amazon title has four problems. Did you spot them all?\n\n1. Length. Amazon announced that from 27 July 2026, titles in most categories (media excepted) must be 75 characters or fewer. This one is 138.\n2. Special characters. \"!\" is on Amazon's restricted list unless it is part of the brand name.\n3. Repeats. The same word may not appear more than twice. \"Bamboo\" appears three times.\n4. \"Best\". An unsupported claim, and it wastes space.\n\nFixed version, 67 characters, invented brand for the example. Ask your AI tool to check your title against these rules, then confirm the style guide for your category in Seller Central, as rules change.\n\nFree UK Listing Cheat Sheet: link in bio.", "hashtags": "#amazonseller #smallbusinessuk #ukseller #chatgpttips", "visuals": "- Slide 1: the bad title (138 characters, counted) on a grey generic listing card (built in Canva, no Amazon logo). Hold for 2 seconds so viewers can try to spot the problems.\n- Slides 2 to 5: highlight each problem in turn with a Returns Red underline: the character count badge \"138\", the \"!!!\", each \"Bamboo\", then \"Best\".\n- Screen-record the AI chat checking the title. Suggested prompt: \"Check this Amazon UK title: 75 characters max including spaces for my category, no ! $ ? _ { } ^ ¬ ¦ unless part of the brand, no word more than twice, no unsupported claims like best. List each problem, then give a fixed version with the character count. Use only facts from my brief.\" Crop and blur the account.\n- Fixed title on a parcel-label card with a Sold Green tick and \"(67)\".\n- B-roll: Pexels \"bamboo drawer organiser\" or \"kitchen drawer bamboo\" (no people).\n- Source for the 75 character and title rules: research/platform-rules-uk.md (Amazon UK section, official Seller Forums announcements).\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P12": {"id": "P12", "title": "A 15-second faceless product video script for TikTok Shop", "format": "Tutorial (the video demonstrates itself)", "best": "TikTok, Instagram Reels", "length": "25 to 30 seconds", "cta": "Kit", "hook": "On screen: \"Five shots. Fifteen seconds. Hands only.\" VO: \"Five hands-only shots. That is the whole product video.\"", "script": "1. (0 to 2s) VO: \"Five hands-only shots. That is the whole product video.\" | On screen: \"Five shots. Fifteen seconds. Hands only.\"\n2. (2 to 5s) VO: \"Five shots, hands only, fifteen seconds. Shot one: say what it is.\" | On screen: \"Shot 1 (0 to 3s): What it is.\"\n3. (5 to 8s) VO: \"Shot two: the key detail, up close.\" | On screen: \"Shot 2 (3 to 6s): Key detail, close up.\"\n4. (8 to 11s) VO: \"Shot three: size, next to something everyone knows.\" | On screen: \"Shot 3 (6 to 9s): Size, for scale.\"\n5. (11 to 14s) VO: \"Shot four: an honest limit. What it does not do, or a flaw.\" | On screen: \"Shot 4 (9 to 12s): The honest bit.\"\n6. (14 to 17s) VO: \"Shot five: calm call to action. Details in the listing.\" | On screen: \"Shot 5 (12 to 15s): Details in the listing.\"\n7. (17 to 23s) VO: \"Keep claims plain. TikTok Shop UK's policies ban health and medical claims, and the listing has to be accurate.\" | On screen: \"No 'cures'. No 'best'. No fake countdowns.\"\n8. (23 to 28s) VO: \"The Well Listed Kit has the prompt that writes this from your item's details. Link in bio.\" | On screen: \"The Well Listed Kit. Link in bio.\"", "onscreen": "Five shots. Fifteen seconds. Hands only.\nShot 1 (0 to 3s): What it is.\nShot 2 (3 to 6s): Key detail, close up.\nShot 3 (6 to 9s): Size, for scale.\nShot 4 (9 to 12s): The honest bit.\nShot 5 (12 to 15s): Details in the listing.\nNo \"cures\". No \"best\". No fake countdowns.\nThe Well Listed Kit. Link in bio.", "caption": "Five shots, fifteen seconds, hands only. A product video with no face and no studio.\n\n1. What it is (0 to 3s)\n2. Key detail, close up (3 to 6s)\n3. Size next to something familiar (6 to 9s)\n4. The honest bit: a limit or a flaw (9 to 12s)\n5. Calm call to action: details in the listing (12 to 15s)\n\nUse a text-to-speech voice and on-screen text of 8 words or fewer. Keep claims plain: TikTok Shop UK's policies ban claims that a product cures, treats, prevents or relieves anything, and listings must be accurate. Check the current policies in Seller Center.\n\nThe Well Listed Kit includes the prompt that turns your item's details into this script. Link in bio.", "hashtags": "#tiktokshopuk #smallbusinessuk #chatgptprompts #ukseller", "visuals": "- The post shows its own method: film five hands-only shots of one simple product (for example a bamboo drawer organiser or a mug) on a cream sheet, each 3 seconds, and play them in the corner as a picture-in-picture while the shot list runs on screen.\n- If not filming, Canva free library: search \"hands unboxing product white background\" and \"hands holding mug close up\" (hands only, no faces, no reflections).\n- Each shot label on a kraft tape strip at the top, timings in Label Yellow.\n- Slide 7: the three phrases in grey with Returns Red strike-throughs.\n- End card: Kit cover mock-up on Cream, price in Sold Green. No TikTok logo. Write \"TikTok Shop\" as plain text only.\n- Reminder in the production notes: the Kit itself is not sold on TikTok Shop UK (digital downloads are reported as unsupported). Point to our own shop only.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P13": {"id": "P13", "title": "\"Nice jumper\" to a search-ready eBay title", "format": "Before/after (carousel, 5 slides)", "best": "Instagram carousel, TikTok photo mode, Pinterest", "length": "5 slides", "cta": "Soft (save)", "hook": "Slide 1: \"Title: 'Nice jumper'. Nobody has ever searched that.\"", "script": "1. Slide 1: \"Title: 'Nice jumper'. Nobody has ever searched that.\"\n2. Slide 2: \"Buyers type brand, item, size, colour. So the title should too.\"\n3. Slide 3: \"Before: 'Nice jumper' (11 characters, 69 unused).\"\n4. Slide 4: \"After: 'Seasalt Womens Navy Striped Cotton Breton Jumper Size 14 Crew Neck Long Sleeve' (78).\" Small text: \"Every word from the care label and the item.\"\n5. Slide 5: \"Brand. Who. Colour. Pattern. Fabric. Style. Item. Size. Detail. Save this formula.\"", "onscreen": "Title: \"Nice jumper\". Nobody has ever searched that.\nBuyers type brand, item, size, colour.\nBefore: Nice jumper (11 characters)\nAfter: Seasalt Womens Navy Striped Cotton Breton Jumper Size 14 Crew Neck Long Sleeve (78)\nEvery word must be true.\nSave this formula.", "caption": "\"Nice jumper\" is a title nobody has ever typed into a search bar.\n\neBay UK gives you 80 characters (at the time of writing). Use them for the words a buyer would actually type:\nBrand, who it is for, colour, pattern, fabric, style, item type, size, one detail.\n\nBefore: Nice jumper (11)\nAfter: Seasalt Womens Navy Striped Cotton Breton Jumper Size 14 Crew Neck Long Sleeve (78)\n\nEvery word has to be true: fabric from the care label, size from the label, \"crew neck\" only if it is one. Leave \"nice\", \"stunning\" and \"L@@K\" out. Buyers do not search for them.\n\nExample item. Save this formula, and check the current limit in eBay's help pages.", "hashtags": "#ebaysellertips #ebayuk #resellertok #listingtips", "visuals": "- Canva, 1080 x 1350, Cream.\n- Slide 1: generic grey search bar mock-up with \"Nice jumper\" typed in, then a Returns Red strike.\n- Slide 3: a bar showing 80 character slots, 11 filled in grey, 69 empty.\n- Slide 4: the same bar with 78 filled in Sold Green, title above it in Ink.\n- Background photo slide 4: Pexels \"navy striped jumper flat lay\" (item only). If the stock top is not striped navy, use no photo.\n- Slide 5: formula words on kraft tape strips.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P14": {"id": "P14", "title": "A vague Vinted description, fixed", "format": "Before/after (screen recording plus text overlay)", "best": "TikTok, Instagram Reels", "length": "20 to 25 seconds", "cta": "Soft (free cheat sheet)", "hook": "On screen: \"'Good condition, fits true to size, open to offers.' Tells a buyer almost nothing.\" VO: \"This description is three phrases and zero facts.\"", "script": "1. (0 to 2s) VO: \"This description is three phrases and zero facts.\" | On screen: \"'Good condition, fits true to size, open to offers.'\"\n2. (2 to 6s) VO: \"Good condition compared to what? True to which size? And 'open to offers' invites twenty-five pounds on a sixty-pound coat.\" | On screen: \"Compared to what? Which size?\"\n3. (6 to 10s) VO: \"Paste your brief and ask for facts in short lines. Here is the after.\" | On screen: \"After:\"\n4. (10 to 17s) VO: \"Whistles wool-blend coat, size 12 on label. Pit to pit 54 centimetres, length 98. Very good: light bobbling on the pocket edges, photo six. Lining intact.\" | On screen: \"Whistles wool-blend coat, size 12 on label. Pit to pit 54 cm, length 98 cm. Very good: light bobbling on pocket edges (photo 6). Lining intact.\"\n5. (17 to 21s) VO: \"Same coat, but now a buyer can decide without messaging you first.\" | On screen: \"Facts, not adjectives.\"\n6. (21 to 25s) VO: \"Free description prompts in our cheat sheet. Link in bio.\" | On screen: \"Free cheat sheet: link in bio\"", "onscreen": "\"Good condition, fits true to size, open to offers.\"\nCompared to what? Which size?\nAfter:\nWhistles wool-blend coat, size 12 on label.\nPit to pit 54 cm, length 98 cm.\nVery good: light bobbling on pocket edges (photo 6).\nLining intact.\nFacts, not adjectives.\nFree cheat sheet: link in bio", "caption": "\"Good condition, fits true to size, open to offers.\" Three phrases, zero facts.\n\nGood compared to what? True to which size? And \"open to offers\" on its own tends to invite the lowest possible number.\n\nThe fix is facts in short lines:\nWhistles wool-blend coat, size 12 on label.\nPit to pit 54 cm, length 98 cm, laid flat.\nVery good: light bobbling on pocket edges (photo 6). Lining intact.\n\nSame coat. Now a buyer can decide without sending you a message first.\n\nExample item, invented for the video. Free description prompts in the UK Listing Cheat Sheet. Link in bio.", "hashtags": "#vintedtips #vintedsellertips #vinteddescription #resellercommunityuk #vintedtok", "visuals": "- Build a generic listing card in Canva (no Vinted logo, no usernames) with the \"before\" text. Screen-record scrolling it on a phone mock-up.\n- Wipe transition (left to right) to the \"after\" card.\n- Label Yellow boxes over \"54 cm\", \"photo 6\" and \"Lining intact\".\n- B-roll: Pexels \"wool coat on hanger\" or \"camel coat flat lay\" (no people). Keep colour neutral, since the example does not state a colour.\n- Short screen recording of the AI chat generating the after text. Crop and blur account details.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P15": {"id": "P15", "title": "Replying to \"is this still available?\"", "format": "Before/after (text-message style video)", "best": "TikTok, Instagram Reels, Facebook", "length": "15 to 20 seconds", "cta": "Soft (save)", "hook": "On screen: \"'Is this still available?' Your reply: 'Yes.' Then silence.\" VO: \"They ask if it is still available. You say yes. Then nothing.\"", "script": "1. (0 to 2s) VO: \"They ask if it is still available. You say yes. Then nothing.\" | On screen: \"'Is this still available?' 'Yes.' ...silence.\"\n2. (2 to 6s) VO: \"'Yes' answers the question but gives them nothing to reply to.\" | On screen: \"'Yes' is a dead end.\"\n3. (6 to 12s) VO: \"Try: Yes, it is still available. It is a size 12, pit to pit 52 centimetres, and I can post it within two days of purchase. Any questions, just ask.\" | On screen: \"Yes, still available. Size 12, pit to pit 52 cm. Posted within 2 days. Any questions, just ask.\"\n4. (12 to 16s) VO: \"One useful fact, one postage line, one open door. No pressure.\" | On screen: \"1 fact. 1 postage line. 1 open door.\"\n5. (16 to 20s) VO: \"Save it as a quick reply. Save this post too.\" | On screen: \"Save it as a quick reply.\"", "onscreen": "\"Is this still available?\" \"Yes.\" ...silence.\n\"Yes\" is a dead end.\nYes, still available. Size 12, pit to pit 52 cm.\nPosted within 2 days. Any questions, just ask.\n1 fact. 1 postage line. 1 open door.\nSave it as a quick reply.", "caption": "\"Is this still available?\" \"Yes.\" Then nothing. Sound familiar?\n\nA plain \"yes\" answers the question but gives the buyer nothing to reply to. Try three parts instead:\n1. Yes, still available.\n2. One useful fact (size, measurement, or the thing buyers usually ask about this item).\n3. When it will be posted, plus \"any questions, just ask\".\n\n\"Yes, it is still available. It is a size 12, pit to pit 52 cm, and I can post it within 2 days of purchase. Any questions, just ask.\"\n\nNo \"someone else is interested\", no rushing. Only promise a dispatch time you can keep. Save it as a quick reply.", "hashtags": "#vintedtips #resellertok #vintedseller #resellingtips", "visuals": "- Generic chat mock-up in Canva (no app logo, buyer shown as \"[BUYER]\").\n- Before: grey bubble \"is this still available?\", Ink bubble \"Yes.\", then a long pause with a ticking \"Seen\" style grey label (write it as \"Read\", generic).\n- Rewind effect (CapCut \"rewind\" transition), then the better reply types out bubble by bubble.\n- Label Yellow highlight on \"52 cm\" and \"within 2 days\".\n- Background for the end card: Pexels \"phone on desk with parcel\" (no people, no visible screen content).\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P16": {"id": "P16", "title": "Keyword-soup Etsy title to one a person can read", "format": "Before/after (carousel, 6 slides)", "best": "Instagram carousel, Pinterest, TikTok photo mode", "length": "6 slides", "cta": "Kit", "hook": "Slide 1: \"'Macrame Plant Hanger Boho Macrame Plant Hanger Handmade Macrame...' Read that out loud.\"", "script": "1. Slide 1: \"'Macrame Plant Hanger Boho Macrame Plant Hanger Handmade Macrame Wall Hanging...' Read that out loud.\"\n2. Slide 2: \"Keyword soup. 'Macrame' four times, 'boho' twice, 131 characters. It reads like spam, and it never says how long it is.\"\n3. Slide 3: \"Write a title a person can read. The extra search phrases go in your 13 tags. That is what tags are for.\"\n4. Slide 4: \"After: 'Handmade Macrame Plant Hanger, Natural Cotton Rope, 90 cm Long, Fits Pots up to 15 cm' (85).\"\n5. Slide 5: \"What it is. Material. Size. What it fits. Everything else goes in the tags.\"\n6. Slide 6: \"The Well Listed Kit writes the title and the 13 tags together, from one brief. Link in bio.\"", "onscreen": "Read that out loud.\nKeyword soup: 131 characters, \"macrame\" x4.\nReadable title. Extra keywords in the tags.\nHandmade Macrame Plant Hanger, Natural Cotton Rope, 90 cm Long, Fits Pots up to 15 cm (85)\nWhat it is. Material. Size. What it fits.\nThe Well Listed Kit: title and tags, one brief. Link in bio.", "caption": "\"Macrame Plant Hanger Boho Macrame Plant Hanger Handmade Macrame...\" Read that out loud and you can hear the problem.\n\nBefore (131 characters): Macrame Plant Hanger Boho Macrame Plant Hanger Handmade Macrame Wall Hanging Plant Pot Holder Gift For Her Boho Gift Indoor Macrame\n\nAfter (85 characters): Handmade Macrame Plant Hanger, Natural Cotton Rope, 90 cm Long, Fits Pots up to 15 cm\n\nThe after says what it is, what it is made of, how long it is and what pot it takes. \"Boho decor\", \"plant lover gift\" and \"housewarming gift\" move into your 13 tags, where they still help search. Etsy titles can be up to 140 characters at the time of writing, but you do not have to fill them.\n\nThe Well Listed Kit writes the title and tags together from one brief. Link in bio. Example item. Check current limits in Etsy's help pages.", "hashtags": "#etsysellertips #etsyseo #etsyukseller #handmadeuk #macrame", "visuals": "- Canva, 1080 x 1350.\n- Slide 1: the soup title in grey on a parcel-label card, overflowing the card edge slightly.\n- Slide 2: each \"Macrame\" circled in Returns Red, and a count badge \"131\".\n- Slide 4: clean title in Ink with a Sold Green tick and \"(85)\".\n- Photo: Pexels search \"macrame plant hanger\" or \"hanging plant white wall\" (item only, no people, no maker's label visible). Use a neutral background if the stock hanger is not natural cotton.\n- Slide 6: Kit cover mock-up, price in Sold Green only if the post goes out during the launch window (see production notes). No Etsy logo.\n- Note for the team: the Kit itself must not be listed on Etsy (Etsy does not allow selling prompt bundles, see research/platform-rules-uk.md). This post only teaches Etsy sellers.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P17": {"id": "P17", "title": "Hiding a flaw vs disclosing it well", "format": "Before/after (voiceover video with split screen)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 seconds", "cta": "Soft (save)", "hook": "On screen: \"Two listings. Same scuffed boots. One ends in a return.\" VO: \"Same boots, same scuff. One listing ends in a return request.\"", "script": "1. (0 to 2s) VO: \"Same boots, same scuff. One listing ends in a return request.\" | On screen: \"Two listings. Same scuffed boots.\"\n2. (2 to 7s) VO: \"Listing A: great condition, photos taken from the good side. The buyer finds the scuff when they open the box.\" | On screen: \"A: 'Great condition.' Scuff not shown.\"\n3. (7 to 13s) VO: \"Listing B: good condition. Small scuff on the outer left heel, about one centimetre, photo five. Light creasing across both toes.\" | On screen: \"B: Small scuff, outer left heel, about 1 cm (photo 5). Light toe creasing.\"\n4. (13 to 18s) VO: \"B might get a question. A is more likely to get a 'not as described'. And the buyer is right.\" | On screen: \"A buyer who knows is a buyer who stays.\"\n5. (18 to 22s) VO: \"Close-up in daylight, with a coin or ruler for scale.\" | On screen: \"Close-up. Daylight. Coin for scale.\"\n6. (22 to 25s) VO: \"Disclose it, show it, move on. Save this.\" | On screen: \"Disclose it. Show it. Save this.\"", "onscreen": "Two listings. Same scuffed boots.\nA: \"Great condition.\" Scuff not shown.\nB: Small scuff, outer left heel, about 1 cm (photo 5).\nLight toe creasing.\nA buyer who knows is a buyer who stays.\nClose-up. Daylight. Coin for scale.\nDisclose it. Show it. Save this.", "caption": "Same boots, same scuff, two listings. One is far more likely to end in a return.\n\nListing A says \"great condition\" and every photo is from the good side. The buyer finds the scuff when they open the box, and they have a point.\n\nListing B says: \"Good condition. Small scuff on the outer left heel, about 1 cm (photo 5). Light creasing across both toes.\"\n\nB might get a question. A risks a \"not as described\" claim. Platforms' buyer protection generally covers items that are significantly not as described, so hiding a flaw rarely ends well.\n\nPhotograph it close up in daylight with a coin for scale. Save this.", "hashtags": "#ebaysellertips #vintedsellertips #resellingtips #resellercommunityuk #ukseller", "visuals": "- Split screen: left column labelled \"A\" (grey card, Returns Red cross), right column \"B\" (Ink card, Sold Green tick). Generic listing cards built in Canva.\n- Stock: Pexels \"black leather ankle boots\" (no feet, no person). For the scuff close-up either film your own boot heel (hands only, plain background) or use Pexels \"scuffed leather shoe close up\".\n- Slide 5: close-up with a 1p coin next to the scuff (film yourself, or use a Canva graphic of a ruler over the photo).\n- Keep the claim general: \"platforms' buyer protection generally covers\" (Vinted's official page says its Buyer Protection covers items significantly not as described). Do not state specific policy outcomes.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P18": {"id": "P18", "title": "Generic ChatGPT output vs a Listing Brief: the Americanism problem", "format": "Before/after (screen recording plus text overlay)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "30 seconds", "cta": "Kit", "hook": "On screen: \"Sweater. Pants. Fall. Ships fast. This is a UK listing?\" VO: \"Sweater. Pants. Fall wardrobe. Ships fast. Spot the problem.\"", "script": "1. (0 to 2s) VO: \"Sweater. Pants. Fall wardrobe. Ships fast. Spot the problem.\" | On screen: \"Sweater. Pants. Fall. Ships fast.\"\n2. (2 to 7s) VO: \"Ask a free AI tool to 'write a listing for a grey jumper' and you often get this. American words, American sizes, and details nobody gave it.\" | On screen: \"'Gorgeous merino sweater! Perfect for fall! Size 8 US. Ships fast!'\"\n3. (7 to 11s) VO: \"Merino? The label says wool blend. US 8? The label says 12.\" | On screen: \"Merino? Label says wool blend. US 8? Label says 12.\"\n4. (11 to 17s) VO: \"Fix one: say UK English and UK sizes. Jumper, trousers, trainers, postage.\" | On screen: \"UK English. Jumper, trousers, trainers, postage.\"\n5. (17 to 22s) VO: \"Fix two: give it a Listing Brief and say 'use only these facts'.\" | On screen: \"Use ONLY the facts in my brief.\"\n6. (22 to 26s) VO: \"After: Next grey wool-blend jumper, size 12. Light bobbling under both arms. Posted within two days.\" | On screen: \"Next grey wool-blend jumper, size 12. Light bobbling under both arms.\"\n7. (26 to 30s) VO: \"Every prompt in The Well Listed Kit has these rules built in. Twelve pounds at launch.\" | On screen: \"The Well Listed Kit. £12 at launch.\"", "onscreen": "Sweater. Pants. Fall. Ships fast.\n\"Gorgeous merino sweater! Perfect for fall! Size 8 US.\"\nMerino? Label says wool blend.\nUK English. Jumper, trousers, trainers, postage.\nUse ONLY the facts in my brief.\nNext grey wool-blend jumper, size 12. Light bobbling under both arms.\nThe Well Listed Kit. £12 at launch.", "caption": "Sweater, pants, fall, ships fast. If your AI-written listing sounds like this, UK buyers can tell.\n\nFree AI tools often default to American English, and when they are short of facts they fill the gaps: \"merino\" instead of wool blend, a US size instead of the label size, \"gorgeous\" instead of anything useful.\n\nTwo fixes:\n1. Say \"UK English and UK sizes\" in every prompt (jumper, trousers, trainers, postage).\n2. Give it a Listing Brief and say \"use only these facts. Write [CHECK] if something is missing.\"\n\nThe Well Listed Kit has these rules built into every prompt, plus brief templates for six categories. £12 at launch. Example item in the video.", "hashtags": "#chatgptprompts #vintedtips #ebayseller #resellertok #ukseller", "visuals": "- Screen-record the AI chat twice. First with a lazy prompt (\"write a listing for a grey jumper\"). Whatever the tool actually outputs, show only what it really produced; if it does not produce Americanisms on the day, show the mock \"before\" text on a Canva card clearly labelled \"Typical generic output (example)\" instead of presenting it as a live result.\n- Second recording: paste the Listing Brief from Kit Module 01 (the grey Next jumper example) plus \"UK English. Use ONLY the facts in my brief.\"\n- Returns Red strike-throughs on \"sweater\", \"fall\", \"merino\", \"US 8\", \"Ships fast!\". Sold Green ticks on \"jumper\", \"wool-blend\", \"size 12\".\n- Crop to chat only, blur account name, avatar and history.\n- B-roll: Pexels \"grey knit jumper folded\" (item only).\n- End card: Kit cover mock-up, price in Sold Green.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P19": {"id": "P19", "title": "The bundle offer message", "format": "Before/after (carousel, 6 slides)", "best": "Instagram carousel, TikTok photo mode, Facebook", "length": "6 slides", "cta": "Soft (free cheat sheet)", "hook": "Slide 1: \"'Would you do all 3 for £10?' Answer with a number, not a sigh.\"", "script": "1. Slide 1: \"'Would you do all 3 for £10?' Answer with a number, not a sigh.\"\n2. Slide 2: \"Before: 'No sorry.' Conversation over.\"\n3. Slide 3: \"Do the sums first. 3 tops listed at £8, £8 and £7 = £23. Your floors: £6, £6 and £5 = £17.\"\n4. Slide 4: \"Postage: £3.20 as one parcel, £8.40 separately. They save £5.20 by bundling. (Example figures)\"\n5. Slide 5: \"After: 'Thanks for asking. I can do all three for £19. They go in one parcel, so it saves on postage for both of us.'\"\n6. Slide 6: \"Never below your floors added together. Free bundle prompt in our cheat sheet: link in bio.\"", "onscreen": "\"Would you do all 3 for £10?\"\nBefore: \"No sorry.\"\nList £23. Floors £17.\nOne parcel saves £5.20 on postage.\nExample figures only.\n\"I can do all three for £19. One parcel saves on postage.\"\nNever below your floors added together.\nFree cheat sheet: link in bio", "caption": "\"Would you do all 3 for £10?\" Answer with a number, not a sigh.\n\nBefore you reply, do two sums:\n1. Your list prices added up, and your floors (the lowest you would take for each) added up.\n2. The postage saving from sending one parcel instead of three.\n\nThen counter at a price between the two, never below the floors added together, and give the postage saving as the reason. It is true, it is friendly, and it gives the buyer something to say yes to.\n\n\"Thanks for asking. I can do all three for £19. They go in one parcel, so it saves on postage for both of us.\"\n\nExample figures. Free bundle prompt in the UK Listing Cheat Sheet: link in bio.", "hashtags": "#vintedtips #bundledeal #resellingtips #vintedsellinguk #resellercommunityuk", "visuals": "- Canva, 1080 x 1350.\n- Slide 1: a grey chat bubble on Cream, \"[BUYER]\" as the name, no app branding.\n- Slide 2: Ink bubble \"No sorry.\" with a Returns Red cross.\n- Slides 3 and 4: simple sum cards in JetBrains Mono, totals in Label Yellow. Small grey \"Example figures only\".\n- Slide 5: reply bubble in Ink with a Sold Green tick.\n- Background photo slides 3 to 4: Pexels \"children's clothes folded stack\" (item only). Use the source in Kit prompt R4 (bundle pricing) for the figures.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P20": {"id": "P20", "title": "Depop description and hashtags that are actually relevant", "format": "Before/after (screen recording plus text overlay)", "best": "TikTok, Instagram Reels", "length": "25 seconds", "cta": "Soft (save)", "hook": "On screen: \"#vintage #y2k #nike #zara #aesthetic on a plain Primark top. Please don't.\" VO: \"Five hashtags. Four of them are not true.\"", "script": "1. (0 to 2s) VO: \"Five hashtags. Four of them are not true.\" | On screen: \"#vintage #y2k #nike #zara #aesthetic\"\n2. (2 to 7s) VO: \"Depop's help pages say you can use up to five hashtags, and to keep them to relevant words, brands and tags.\" | On screen: \"Up to 5. Relevant only.\"\n3. (7 to 11s) VO: \"Other brands' names on your item are keyword spam. And 'vintage' on last year's top is simply wrong.\" | On screen: \"Not your brand? Not your hashtag.\"\n4. (11 to 18s) VO: \"After: Primark white cotton babydoll top, UK 10. Pit to pit 46 centimetres, length 52. Worn twice, no marks. Hashtags: primark, babydoll top, white top, cotton top, summer top.\" | On screen: \"Primark white cotton babydoll top, UK 10. Pit to pit 46 cm, length 52 cm. Worn twice, no marks. #primark #babydolltop #whitetop #cottontop #summertop\"\n5. (18 to 22s) VO: \"Brand, item, colour, fabric, style. Every one true.\" | On screen: \"Brand. Item. Colour. Fabric. Style.\"\n6. (22 to 25s) VO: \"Save this for your next Depop listing.\" | On screen: \"Save this for your next listing.\"", "onscreen": "#vintage #y2k #nike #zara #aesthetic\nUp to 5. Relevant only.\nNot your brand? Not your hashtag.\nPrimark white cotton babydoll top, UK 10.\nPit to pit 46 cm, length 52 cm. Worn twice, no marks.\n#primark #babydolltop #whitetop #cottontop #summertop\nBrand. Item. Colour. Fabric. Style.\nSave this for your next listing.", "caption": "Five hashtags on a plain high street top, and four of them are not true.\n\nDepop's help pages say you can use up to 5 hashtags, and to keep them to relevant words, brands and tags (check the current guidance in Depop's help pages).\n\nSo:\nYour brand only. Other brands' names on your item are keyword spam.\nNo \"vintage\" or \"y2k\" unless the item really is, or clearly says \"style\".\nUse the five on what a buyer would search: brand, item, colour, fabric, style.\n\nExample: Primark white cotton babydoll top, UK 10. Pit to pit 46 cm, length 52 cm. Worn twice, no marks.\n#primark #babydolltop #whitetop #cottontop #summertop\n\nSave this for your next Depop listing.", "hashtags": "#depopseller #depoptips #resellertok #secondhandfashion", "visuals": "- Open on a generic listing card (Canva, no Depop logo) with the bad hashtags in grey; strike \"#vintage\", \"#y2k\", \"#nike\", \"#zara\" in Returns Red one by one, synced to the VO.\n- Screen-record the AI chat producing the after version. Suggested prompt: \"Write a Depop description for my Listing Brief: opening line with brand, item, colour and size, then measurements, then condition. Then up to 5 hashtags, only words that are true for this item. No other brand names. No era words unless my brief supports them.\" Crop to chat, blur account details.\n- Sold Green ticks next to each of the five after hashtags.\n- B-roll: Pexels \"white cotton top flat lay\" (item only, no model). Do not show any Primark logo from stock; blur it if visible.\n- Source for the 5 hashtag guidance: research/platform-rules-uk.md (Depop section, official help page).", "file": "launch-kit/marketing/b-short-form-posts/posts-P01-P20.md"}, "P21": {"id": "P21", "title": "Three photos vs a proper shot list", "format": "Before/after (carousel, 7 slides)", "best": "Instagram carousel, TikTok photo mode", "length": "7 slides", "cta": "Soft (save / free cheat sheet)", "hook": "\"3 photos: front, box, sole. The buyer's first question? 'Any scuffs?'\"", "script": "1. Slide 1 (hook, parcel label card): \"3 photos: front, box, sole. The buyer's first question? 'Any scuffs?'\"\n2. Slide 2 (BEFORE, grey, Returns Red crosses): \"Before. Black Chelsea boots, UK 6. Photo 1: side on. Photo 2: the box. Photo 3: one sole. No inside, no heels, no flaw close-up.\"\n3. Slide 3: \"Every missing photo becomes a message. 'What size is stamped inside?' 'Any wear on the heels?' 'Can I see the other sole?'\"\n4. Slide 4 (AFTER, Sold Green ticks): \"After. An 8-shot list. 1 Cover: pair side on, at boot height. 2 Front: both toes. 3 Back: both heels. 4 Soles: both, top down.\"\n5. Slide 5 (AFTER, continued): \"5 Inside: size and brand stamp. 6 Flaw: left heel scuff, coin for scale. 7 Flaw: toe creasing, daylight. 8 Detail: elastic side panel.\"\n6. Slide 6 (prompt box, JetBrains Mono): \"The rule we use: every flaw gets its own photo. Prompt: 'Write a numbered shot list for this exact item. Give every flaw in my brief its own shot. Never drop a flaw shot.'\"\n7. Slide 7 (parcel label card): \"Photo limits differ. At the time of writing Vinted allows up to 20, Depop up to 8. Check the app. Save this for your next pair.\"", "onscreen": "3 photos. First question? \"Any scuffs?\"\nBefore: side, box, one sole\nEvery gap = a buyer message\nAfter: an 8-shot list\nEvery flaw gets its own photo\nCheck your app's photo limit\nSave this", "caption": "Three photos is not a listing, it is a question waiting to happen. For a pair of boots, buyers want both soles, both heels, the size stamp inside and a close-up of every scuff. We plan the shots before picking up the phone: cover, front, back, soles, inside, one photo per flaw, then details. The prompt on slide 6 turns your item notes into a numbered shot list in about a minute, using any free AI chat tool. Photo limits vary by app (at the time of writing Vinted allows up to 20 and Depop up to 8), so check the current limit in the app when you list. Save this for your next pair, and grab the free UK Listing Cheat Sheet from the link in bio.", "hashtags": "#vintedtips #ebaysellertips #resellercommunityuk #listingtips #depopseller", "visuals": "Canva carousel, 1080 x 1350, Cream background. Slide 1: parcel-label card (cream card, kraft `#C9A27E` border, dashed cut line) over a blurred stock photo, Pexels search \"black leather chelsea boots floor\" (no feet, no people). Slide 2: three small photo tiles in grey with Returns Red crosses under the missing shots (draw empty tiles labelled \"inside?\", \"heels?\", \"flaw?\"). Slides 4 and 5: an 8-tile grid, each tile a simple line icon (boot outline) with the shot number and label, Sold Green tick in the corner. Slide 6: prompt in a JetBrains Mono box, Ink on Cream, \"every flaw\" highlighted in Label Yellow. Slide 7: parcel label card. Only use our own staged photos or licence-free stock of boots, never a screenshot of a real listing.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P22": {"id": "P22", "title": "Replying to a return request without making it worse", "format": "Before/after (screen recording plus text overlay)", "best": "TikTok, Instagram Reels, YouTube Shorts", "length": "25 to 30 seconds", "cta": "Kit", "hook": "\"'Read the description.' Four words that turn a return request into a dispute.\"", "script": "1. (0 to 2s) VO: \"Read the description. Four words that turn a return request into a dispute.\" | On screen: \"'Read the description.' 4 words that start a dispute\"\n2. (2 to 6s) VO: \"Here's the message. The jumper arrived, it doesn't fit, can I send it back?\" | On screen: \"Buyer: 'Doesn't fit, can I return it?'\"\n3. (6 to 10s) VO: \"Before. 'No returns. It says so in the listing. Read the description.' Accurate. Also a bit spiky.\" | On screen: \"BEFORE: 'No returns. Read the description.'\"\n4. (10 to 18s) VO: \"After. Thanks for letting me know, and sorry it's not right. As a private seller I don't take returns for change of mind, as the listing says. If there's a problem with the item itself, please open a request through the app so it's handled properly.\" | On screen: \"AFTER: polite, clear, points to the app\"\n5. (18 to 23s) VO: \"Same answer. Calmer tone. And it doesn't refuse a genuine not-as-described claim, which the platform's own process covers.\" | On screen: \"Same answer. Calmer. Leaves the proper route open\"\n6. (23 to 28s) VO: \"Selling as a business? Different rules: online buyers usually get fourteen days to cancel. The Well Listed Kit has reply prompts for both. General information, not legal advice.\" | On screen: \"Traders: different rules. General information, not legal advice\"\n7. (28 to 30s) VO: \"Save this for the next one.\" | On screen: \"Save this\"", "onscreen": "\"Read the description.\" 4 words that start a dispute\nBuyer: \"Doesn't fit, can I return it?\"\nBEFORE: \"No returns. Read the description.\"\nAFTER: polite, clear, points to the app\nSame answer. Calmer.\nTraders: different rules\nGeneral information, not legal advice\nSave this", "caption": "\"Read the description\" is technically fine and practically a bad idea. When a buyer asks to return something because it does not fit, a private seller can usually say no to a change-of-mind return if the listing says no returns. But the tone matters, and so does leaving the proper route open: if the buyer thinks the item is faulty or not as described, the platform's own claim process is where that belongs. Our reply: thank them, say sorry it is not right, state the policy once, point them to the app for any item problem. If you sell as a business, the rules are different: online buyers usually have 14 days to cancel, plus rights if an item is faulty. The Well Listed Kit has reply prompts for both, link in bio. This is general information, not legal advice: check gov.uk and your platform's current returns rules.", "hashtags": "#vintedsellertips #ebayseller #resellercommunityuk #vintedsellinguk #ebayuk", "visuals": "Screen recording of a free AI chat tool on a phone (crop to the chat area only; blur account name and avatar). Type: \"Write a polite, short reply to a buyer who wants to return a jumper because it doesn't fit. I'm a private UK seller, my listing says no returns. Don't refuse any claim about faults or not as described, point them to the app's process instead. UK English. Buyer name: [BUYER].\" Zoom on the output and add Label Yellow highlighter boxes on \"private seller\" and \"open a request through the app\". Before message: shown as a grey chat bubble with Returns Red strike-through. After: Ink chat bubble, Sold Green tick. B-roll between cuts: Pexels search \"folded knitted jumper flat lay\" and \"hands taping parcel\" (hands only). Use \"[BUYER]\" in every mock message, never a real name.\n\n---", "file": "launch-kit/marketing/b-short-form-posts/posts-P21-P40.md"}, "P23": {"id": "P23", "title": "A TikTok Shop description with the risky claims taken out", "format": "Before/after (text overlay, highlighter reveal)", "best": "TikTok, Instagram Reels", "length": "25 seconds", "cta": "Soft (free cheat sheet)", "hook": "\"This wheat bag description has 3 problems. The first one is 'relieves back pain'.\"", "script": "1. (0 to 2s) VO: \"This wheat bag description has three problems. The first one is 'relieves back pain'.\" | On screen: \"3 problems in one description\"\n2. (2 to 7s) VO: \"Here it is. Relieves back pain and helps you sleep. One hundred percent natural and totally safe. Only three left.\" | On screen: \"BEFORE: 'Relieves back pain and helps you sleep! 100% natural and totally safe! Only 3 left!'\"\n3. (7 to 11s) VO: \"Problem one. A health claim. TikTok Shop UK's policies say products must not claim to cure, treat, prevent or relieve a medical condition.\" | On screen: \"1. Health claim: 'relieves back pain'\"\n4. (11 to 14s) VO: \"Problem two. 'Totally safe' and 'one hundred percent natural' aren't facts you can check.\" | On screen: \"2. Vague safety claim\"\n5. (14 to 17s) VO: \"Problem three. 'Only three left', unless it's true, is fake urgency.\" | On screen: \"3. Urgency that isn't true\"\n6. (17 to 22s) VO: \"After. Microwaveable wheat bag with dried lavender. Cotton cover. Warm it up for a cosy feel. Heating instructions on the
