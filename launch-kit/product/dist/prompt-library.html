<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Well Listed Prompt Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
:root{--ink:#1F2A44;--cream:#FAF6EF;--kraft:#C9A27E;--green:#1E7F55;--yellow:#F2C84B;--red:#C4453B;--card:#fff;--muted:#5b6478;--line:#e6dccd}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:Archivo,Inter,sans-serif;line-height:1.2;color:var(--ink)}
h1{font-weight:800;font-size:2rem}h2{font-weight:800;font-size:1.5rem;margin-top:2.2rem;padding-bottom:.3rem;border-bottom:3px solid var(--kraft)}
h3{font-weight:700;font-size:1.15rem;margin-top:1.8rem}
a{color:var(--green)}
code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:#f1eadf;padding:.1em .3em;border-radius:4px}
pre{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:8px;padding:14px;overflow-x:auto;white-space:pre-wrap;word-wrap:break-word}
pre code{background:none;padding:0;font-size:.85rem;line-height:1.5}
blockquote{margin:1rem 0;padding:.6rem 1rem;background:#fff8e1;border-left:5px solid var(--yellow);border-radius:6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:1rem 0;background:#fff;font-size:.9rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--ink);color:var(--cream)}
hr{border:none;border-top:2px dashed var(--kraft);margin:2rem 0}

header{position:sticky;top:0;background:var(--ink);color:var(--cream);padding:12px 16px;z-index:5}
header h1{color:var(--cream);font-size:1.15rem;margin:0 0 8px}
header .tick{color:var(--yellow)}
#q{width:100%;padding:10px 12px;border-radius:8px;border:none;font-size:16px}
#mods{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#efe6d8}
#mods button{flex:none;border:1px solid var(--kraft);background:#fff;border-radius:20px;padding:6px 12px;font:600 .8rem Inter;color:var(--ink)}
#mods button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:820px;margin:0 auto;padding:12px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:1.02rem}.id{display:inline-block;background:var(--yellow);border-radius:5px;padding:0 6px;margin-right:6px;font:700 .8rem 'JetBrains Mono'}
.use{color:var(--muted);font-size:.9rem;margin:0 0 8px}.mod{font-size:.75rem;color:var(--muted)}
.copy{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 14px;font:600 .9rem Inter;cursor:pointer}
.copy.done{background:var(--ink)}
.count{font-size:.85rem;color:var(--muted)}
.card pre{max-height:9.5em;overflow:hidden;position:relative;margin-bottom:8px}
.card.open pre{max-height:none}
.more{background:none;border:1px solid var(--kraft);border-radius:8px;padding:8px 12px;font:600 .85rem Inter;color:var(--ink);margin-left:6px;cursor:pointer}
</style></head>
<body><header><h1>Well Listed<span class="tick"> &#10003;</span> Prompt Library</h1>
<input id="q" type="search" placeholder="Search prompts, e.g. lowball, eBay title, bundle" aria-label="Search prompts"></header>
<nav id="mods"><button class="on" data-m="">All</button><button data-m="Module 00: Start here">Start here</button><button data-m="Module 01: The Listing Brief">The Listing Brief</button><button data-m="Module 02: Titles">Titles</button><button data-m="Module 03: Descriptions and condition">Descriptions and condition</button><button data-m="Module 04: Keywords, tags and item specifics">Keywords, tags and item specifics</button><button data-m="Module 05: Photos">Photos</button><button data-m="Module 06: Pricing">Pricing</button><button data-m="Module 07: Buyer messages">Buyer messages</button><button data-m="Module 08: Video and TikTok Shop">Video and TikTok Shop</button><button data-m="Module 09: Rule checker">Rule checker</button><button data-m="Module 10: Batch workflow">Batch workflow</button></nav>
<main><p class="count" id="cnt"></p><div id="list"></div>
<p class="use">Tip: fill in the [SQUARE BRACKETS] before you send a prompt. Never paste a buyer's name, address or order details into an AI tool. Not affiliated with or endorsed by any marketplace. Version 1.0.</p></main>
<script>
const P=[{"id": "A01", "name": "All-in-one Vinted listing", "use": "You want a Vinted title, description and field values in one go.", "prompt": "Write a Vinted listing in UK English using ONLY these facts.\n\nWhat it is: [E.G. JUMPER]\nBrand: [BRAND OR \"UNBRANDED\"]\nSize on label: [E.G. 12, OR KIDS: AGE 5 TO 6 YEARS, 116 CM]\nMeasurements, laid flat (cm): [E.G. PIT TO PIT 51, LENGTH 63]\nColour: [COLOUR]\nMaterial (from the label): [MATERIAL OR \"NOT SURE\"]\nCondition: [NEW WITH TAGS / NEW WITHOUT TAGS / VERY GOOD / GOOD / SATISFACTORY]\nFlaws (where, what, how big): [FLAWS OR \"NONE FOUND\"]\nWhat I checked and found fine: [E.G. \"NO HOLES, ZIP WORKS\" OR \"NOTHING CHECKED\"]\nAnything else true: [E.G. \"SMOKE-FREE HOME\" OR \"NONE\"]\n\nGive me:\n1. A title of 60 characters or fewer: brand, item, colour, size. No padding.\n2. A description of 50 to 120 words: what it is, size and measurements, condition with every flaw, material. End with one line inviting questions.\n3. Values for Vinted's fields: category, brand, size, condition, colour, material.\n\nRules:\n- If a fact is missing, write [CHECK: what is missing]. Never guess.\n- Keep every flaw exactly as serious as I wrote it.\n- No hype words, emoji or exclamation marks.\n- Do not say rare, vintage, genuine or new unless I did. No other brand names.\n- No payment, returns or contact details.", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "A02", "name": "All-in-one eBay UK listing", "use": "You want an eBay UK title, item specifics and description in one go.", "prompt": "Write an eBay UK listing in UK English using ONLY these facts.\n\nWhat it is: [ITEM]\nBrand: [BRAND OR \"UNBRANDED\"]\nModel, style or product number: [MODEL OR \"NOT SURE\"]\nSize on label: [SIZE OR \"NOT APPLICABLE\"]\nMeasurements or dimensions (cm): [MEASUREMENTS]\nColour: [COLOUR]\nMaterial: [MATERIAL OR \"NOT SURE\"]\nCondition: [E.G. NEW WITH TAGS / PRE-OWNED: GOOD]\nFlaws (where, what, how big): [FLAWS OR \"NONE FOUND\"]\nTested (electricals only): [WHAT YOU TESTED, OR \"NOT TESTED\"]\nIncluded / not included: [LIST]\nPostage: [SERVICE]\n\nGive me:\n1. Two titles, 80 characters or fewer including spaces, with the count. Brand and item type first, then the details a buyer would search. Only true words, no padding.\n2. Item specifics as a two-column table. Leave any I have not given as [CHECK].\n3. A description under 200 words: what it is, measurements, condition with every flaw on its own line, what is included, postage.\n\nRules:\n- Missing facts become [CHECK: what is missing]. Never guess.\n- Keep every flaw. Do not soften any.\n- No hype words, emoji or exclamation marks. No other brand names.\n- Do not say rare, vintage, genuine, new or fully working unless I did.\n- Nothing about returns or buyers' rights (I set those in eBay).", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "A03", "name": "All-in-one Depop listing", "use": "You want a Depop description (first line doing the job of a title) plus hashtags in one go.", "prompt": "Write a Depop listing in UK English using ONLY these facts.\n\nWhat it is: [ITEM]\nBrand: [BRAND OR \"UNBRANDED\"]\nSize on label: [SIZE]\nMeasurements, laid flat (cm): [MEASUREMENTS]\nColour: [COLOUR]\nMaterial: [MATERIAL OR \"NOT SURE\"]\nFit or style (only if true): [E.G. BOXY, CROPPED, 90S STYLE]\nEra (only if you can back it up): [E.G. \"1996 DATE ON LABEL\" OR \"UNKNOWN\"]\nCondition: [CONDITION]\nFlaws (where, what, how big): [FLAWS OR \"NONE FOUND\"]\n\nGive me one description under 800 characters, with the count:\n1. First line: brand, item, colour, size and one honest style word. This acts as the title.\n2. Two short lines on fit and details.\n3. Measurements.\n4. Condition with every flaw.\n5. A last line of up to 5 relevant hashtags.\n\nRules:\n- Missing facts become [CHECK: what is missing]. Never guess.\n- Era words (90s, y2k, vintage) only if my era line supports them. Otherwise use \"style\" or leave them out.\n- No hype, emoji strings or exclamation marks. No other brands in the text or hashtags.\n- No payment or contact details.", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "A04", "name": "All-in-one Etsy listing", "use": "You make or sell handmade, vintage or craft supply items and want a title, tags and description in one go.", "prompt": "Write an Etsy listing in UK English using ONLY these facts.\n\nWhat it is: [ITEM]\nHandmade, vintage or craft supply: [TYPE]\nWho made it and how: [E.G. \"I THROW AND GLAZE EACH ONE\"]\nAI used in the design or photos? [NO / YES, HOW]\nVintage only, age, proof and flaws: [E.G. \"1970S, DATED BACKSTAMP, 2 MM RIM CHIP\"]\nMaterials, all of them: [MATERIALS]\nSize and weight: [DIMENSIONS]\nOptions and personalisation: [OPTIONS OR \"NONE\"]\nMade to order or ready, dispatch time: [DETAILS]\nCare: [CARE]\nSafety text, copied exactly (see C11): [TEXT OR \"NONE\"]\n\nGive me:\n1. Two titles under 140 characters, with the count: readable phrases, not keyword lists.\n2. 13 tags of 20 characters or fewer, with counts, then all 13 on one comma-separated line.\n3. A description: two opening lines, then details, who made it, personalisation, dispatch, care, safety.\n\nRules:\n- Missing facts become [CHECK: what is missing]. Never guess.\n- Materials and safety text exactly as I wrote them (never \"silver\" for silver-plated).\n- Hand words (handmade, hand-poured) only for steps I do by hand.\n- If I used AI, one plain sentence saying how.\n- No health claims (calming, healing, hypoallergenic), hype or exclamation marks.\n- No other brands or characters. \"Vintage\" only for 20 years or more.\n- No returns, refund or guarantee wording.", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "A05", "name": "All-in-one Amazon UK listing", "use": "You are a brand owner or seller of new stock creating an Amazon UK product listing.", "prompt": "Write an Amazon UK product listing in UK English using ONLY these facts.\n\nBrand: [BRAND]\nProduct type: [PRODUCT]\nKey features (only ones I can prove): [FEATURES]\nSize, quantity or capacity: [DETAILS]\nColour: [COLOUR]\nMaterials: [MATERIALS]\nWhat is in the box: [CONTENTS]\nCare or use instructions: [DETAILS]\nIs this a media product (books, music, video)? [YES / NO]\n\nGive me:\n1. A title of 75 characters or fewer including spaces (the rule for non-media categories from 27 July 2026), with the count. If it is a media product, write [CHECK: title limit for media in Seller Central] instead of guessing.\n2. An Item Highlights line of 125 characters or fewer, with the count, adding details not in the title.\n3. Up to 5 bullet points, each a short label and one or two plain sentences.\n4. A product description of 100 to 200 words.\n5. Backend search terms: lower case, spaces only, no words already used above, under 240 bytes.\n\nRules:\n- Missing facts become [CHECK: what is missing]. Never guess.\n- Title: no ! $ ? _ { } ^ ¬ ¦ unless in the brand name, and no word more than twice (small words excepted).\n- No promotional or subjective words (best, sale, free delivery, guaranteed), no emoji.\n- No health, medical or eco claims. No other brand names anywhere.", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "A06", "name": "All-in-one TikTok Shop UK listing", "use": "You sell new stock or your own products on TikTok Shop UK and want a title, description and claims check in one go.", "prompt": "Write a TikTok Shop UK product listing in UK English using ONLY these facts.\n\nBrand (mine, or one I am authorised to sell): [BRAND]\nProduct type: [PRODUCT]\nMaterial: [MATERIAL]\nKey features (only ones I can prove): [FEATURES]\nSize, quantity or capacity: [DETAILS]\nColour or variant: [COLOUR]\nWhat is included: [CONTENTS]\nCare instructions: [CARE OR \"NONE\"]\n\nGive me:\n1. Three titles: brand, product type, material, key feature, then size, colour or quantity. At least 15 characters. Show the count.\n2. A description of at least 30 words: one opening line, 4 short feature lines, \"What's included\", \"Size and specs\", \"Care\".\n3. A list of any words I should double-check because they could count as a claim.\n\nRules:\n- Missing facts become [CHECK: what is missing]. Never guess.\n- Titles: no symbols, emoji, promotions (sale, x% off), shop name, web address, or mention of TikTok or other platforms.\n- No claims that it cures, treats, prevents or relieves anything. No weight loss claims.\n- No \"best\", no comparisons with other brands, no fake urgency, no vague green claims.\n- No other platforms, and nothing sending buyers elsewhere to pay.", "module": "Module 00: Start here", "file": "00-start-here.md"}, {"id": "B01", "name": "Messy notes to Listing Brief", "use": "You have jotted a few scrappy notes about an item and want a tidy brief.", "prompt": "Turn my notes below into a Listing Brief for a UK second-hand seller, using these headings:\nPlatform(s), What it is, Brand, Model or style, Size, Measurements (cm), Colour, Material, Condition, Flaws, Included, Not included, Age or era, Postage, Price.\n\nRules:\n- UK English.\n- Use ONLY facts in my notes. Do not add, assume or improve anything.\n- If a heading has no information, write [CHECK: what I need to find out], e.g. [CHECK: measure pit to pit in cm].\n- Keep every flaw exactly as serious as I wrote it.\n- If I gave inches, show both (e.g. 21 in / 53 cm).\n- No sales language. This is a fact sheet.\n- At the end, list the 3 most important [CHECK] items a buyer would ask about.\n\nMy notes:\n[PASTE YOUR NOTES HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B02", "name": "Voice note transcript to Listing Brief", "use": "You talked about the item into your phone (quicker than typing) and have the transcript.", "prompt": "Below is a transcript of me talking about an item I am selling in the UK. It will ramble. Turn it into a Listing Brief with these headings:\nWhat it is, Brand, Model or style, Size, Measurements (cm), Colour, Material, Condition, Flaws, Included, Not included, Tested (how), Postage, Price.\n\nRules:\n- UK English.\n- Where I corrected myself (\"no wait, it's a 14\"), use the correction only.\n- Use ONLY facts I said. Do not fill gaps with typical details.\n- Missing or unclear facts become [CHECK: ...].\n- Transcription often mishears brands and numbers. If one looks odd, keep it and add [CHECK: transcript said \"X\", confirm spelling].\n- Keep every flaw at the same level of seriousness. No sales language.\n\nTranscript:\n[PASTE TRANSCRIPT HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B03", "name": "Photo description to Listing Brief", "use": "You want to describe what you can see, photo by photo, and turn it into a brief. The AI does not need to see images, so it works in any free tool.", "prompt": "I will describe my item photo by photo. Build a UK Listing Brief from my descriptions only, with these headings:\nWhat it is, Brand, Model or style, Size, Measurements (cm), Colour, Material, Condition, Flaws (with location), Labels and markings (exact wording), Included, Postage, Price.\n\nRules:\n- UK English. No sales language.\n- Use only what I describe. Do not guess brand, age, material or value.\n- For each flaw, record where and how big. If I gave no size, add [CHECK: size of flaw].\n- After the brief, list extra photos a buyer would expect that I have not described (care label, base stamp, flaw close-up).\n\nPhoto 1: [DESCRIBE]\nPhoto 2: [DESCRIBE]\nPhoto 3: [DESCRIBE]\nPrice: [PRICE]\nPostage: [POSTAGE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B04", "name": "Gap finder: what a buyer will ask", "use": "You have a brief and want to catch the questions buyers will message you about.", "prompt": "Here is a Listing Brief for an item I am selling on [PLATFORM] in the UK. Act as a fussy buyer in this category.\n\n1. List up to 8 questions a serious buyer would ask, most important first.\n2. For each, say whether my brief answers it: Yes, No or Partly.\n3. For every No or Partly, tell me what to check or measure and how, in plain words.\n\nDo not write the listing. Do not invent answers. UK English, short lines.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B05", "name": "Build my own category brief", "use": "You sell a lot of one thing (bikes, prams, golf clubs, board games) and want a brief template made for it.", "prompt": "I sell second-hand [CATEGORY] in the UK on [PLATFORM(S)]. Create a reusable Listing Brief template for this category, as a plain text block I can copy into my notes app.\n\nInclude:\n1. The general fields: platform, what it is, brand, model, size or dimensions, colour, material, condition, flaws, included, postage, price, lowest I will accept (private).\n2. Up to 10 extra fields buyers of this category care about, each with a hint on where to find the fact, e.g. \"frame size (printed on the seat tube)\".\n3. A short \"safety and legal\" list of things I should check before selling this category in the UK, written as questions for me to check in the platform's help pages. Do not state rules as fact.\n\nUK English, plain words, no sales language.", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B06", "name": "Label or box text to Listing Brief", "use": "You have a new or boxed item, or a clear product label, and want the facts copied off it accurately.", "prompt": "Below is text I copied from the box, label or manual of an item I am selling in the UK. Extract a Listing Brief with these headings:\nWhat it is, Brand, Model / product number, Specification, Colour, Material, Dimensions, In the box, Safety or age warnings, Condition, Flaws, Postage, Price.\n\nRules:\n- UK English.\n- Copy specifications exactly. Do not round, convert or tidy numbers.\n- Copy safety warnings and age guidance word for word.\n- Leave marketing claims (e.g. \"clinically proven\") out of the brief. List them separately under \"Box claims left out\" so I can decide.\n- Condition, flaws, postage and price are not on the box: write [CHECK: ...] unless I give them below.\n\nBox or label text:\n[PASTE TEXT HERE]\n\nMy extra details (condition, flaws, whether opened, postage, price):\n[ADD DETAILS]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B07", "name": "Brief tidy-up and consistency check", "use": "Your brief is filled in and you want a sanity check before running the title and description prompts.", "prompt": "Check my Listing Brief for a UK [PLATFORM] listing. Do not rewrite it into a listing.\n\nReport, in this order:\n1. Contradictions (e.g. condition \"Excellent\" but flaws that sound like \"Good\").\n2. Vague wording a buyer could dispute (e.g. \"small mark\" with no location or size), with a clearer version using only my facts.\n3. Missing facts buyers in this category expect, as [CHECK: ...] lines.\n4. Risky claims (\"rare\", \"genuine\", \"fully working\", \"vintage\" without an era, health claims), one line each on why.\n5. US spellings or sizes to change.\n\nUK English, short bullet points. Do not invent facts to fix problems. Ask me instead.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "T01", "name": "eBay UK title", "use": "You are listing on eBay UK and want a title that uses the 80 characters well without padding.", "prompt": "Write 3 eBay UK titles for the item in my Listing Brief below.\n\n- Put the words a UK buyer would search first: brand, item type, then the most useful details (model, style, colour, material, size).\n- 80 characters or fewer including spaces. Show the count after each.\n- Use the space for true, searchable details from the brief. If you run out of true details, stop. Do not pad.\n\nRules:\n- UK English and UK sizes (\"UK 8\" for shoes, \"trousers\" not \"pants\").\n- Use ONLY facts in my brief. If a key search word is missing (e.g. model number), write [CHECK: model number] and tell me.\n- No hype words, exclamation marks, emoji or whole words in capitals.\n- No rare, vintage, genuine, new or limited edition unless the brief supports it. No other brand names. No repeated words.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T02", "name": "Vinted title", "use": "You are listing clothes, shoes, accessories or homeware on Vinted.", "prompt": "Write 3 Vinted titles for the item in my Listing Brief below.\n\n- Short and clear: brand, item type, colour, size, plus one style word buyers use if it is true (e.g. oversized, cropped, wide leg).\n- 60 characters or fewer, so it reads well in the app. Show the count after each.\n\nRules:\n- UK English and UK sizes.\n- Use ONLY facts in my brief. Write [CHECK: ...] if something important is missing.\n- No hype words, emoji, exclamation marks, or price words (\"bundle deal\").\n- No rare, vintage, genuine or new unless the brief supports it. No other brand names.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T03", "name": "Depop opening line (acts as the title)", "use": "You are listing on Depop, where the first words of the description do the job of a title.", "prompt": "Write 3 options for the opening line of a Depop listing for the item in my Listing Brief below. It works as the title, so it must say what the item is straight away.\n\n- Brand and item type first, then colour, size and one or two style words buyers search (e.g. y2k, 90s, grunge) ONLY if they honestly fit my brief.\n- One line each, under about 60 characters. Show the count. No hashtags in this line.\n\nRules:\n- UK English and UK sizes.\n- Use ONLY facts in my brief. Write [CHECK: ...] for missing key facts.\n- An era word (90s, y2k) must be backed by the brief. If not, use \"90s style\" or leave it out, and tell me.\n- No hype, emoji or exclamation marks. No other brand names.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T04", "name": "Etsy title", "use": "You are listing a handmade, vintage or craft supply item on Etsy.", "prompt": "Write 3 Etsy titles for the item in my Listing Brief below.\n\n- Start with a clear phrase saying what the item is, as a person would say it. Then the key details: main material, key feature, size, colour, personalisation if offered.\n- Under 140 characters including spaces, ideally under 15 words. Show the character and word count.\n- Each phrase adds a new detail. Do not repeat the same idea in different words.\n\nRules:\n- UK English (personalised, colour, jewellery).\n- Use ONLY facts in my brief. Write [CHECK: ...] for anything missing.\n- No hype, no \"best\", no \"perfect gift\" unless the brief says who it is for.\n- \"Vintage\" only if the brief says at least 20 years old (check Etsy's current rule).\n- No health or wellbeing claims. No other brands or trademarked characters.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T05", "name": "Amazon UK title and Item Highlights", "use": "You are a brand owner or seller of new stock creating an Amazon UK product listing. Skip this if you only sell second-hand.", "prompt": "Write an Amazon UK product title and an Item Highlights line for the product in my Listing Brief below.\n\nTitle:\n- Brand, product type, key feature, size or quantity, colour (unless my category style guide says otherwise).\n- 75 characters or fewer including spaces (the rule for all categories except media from 27 July 2026). Show the count.\n- Capitalise each word except short ones (and, or, for, the, with). Numbers as digits.\n\nItem Highlights: up to 125 characters of useful details that did not fit in the title, no repeats. Show the count.\n\nRules:\n- UK English. Use ONLY facts in my brief. Write [CHECK: ...] for anything missing.\n- No ! $ ? _ { } ^ ¬ ¦ unless in the brand name. No emoji. No word more than twice (small words excepted).\n- No promotional or subjective words (best, top quality, free delivery, sale).\n- No health, medical or eco claims unless the brief gives evidence. No other brands.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T06", "name": "TikTok Shop UK product title", "use": "You are listing a product in TikTok Shop UK. Skip this if you only sell second-hand on the resale apps.", "prompt": "Write 3 TikTok Shop UK product titles for the product in my Listing Brief below.\n\n- Brand, product type, material, the one or two features that matter most, then size, colour or quantity.\n- Clear at a glance on a phone. At least 15 characters, aim for 60 to 100. Show the count. I will check the current maximum in Seller Center.\n\nRules:\n- UK English. Use ONLY facts in my brief. Write [CHECK: ...] for anything missing.\n- No hype or trend words (viral, best seller, must have), emoji, symbols, exclamation marks or whole words in capitals.\n- Do not mention TikTok or any other platform, my shop name or a web address.\n- No price, discount or urgency words (sale, 20% off, only 2 left).\n- No claims that it cures, treats, prevents or relieves anything, and no weight loss claims.\n- Use the brand only if it is mine or I am authorised to sell it. No other brands.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T07", "name": "Title tester: which version is clearest?", "use": "You have 2 to 5 title ideas and want an honest, buyer's-eye comparison.", "prompt": "I am choosing a title for a [PLATFORM] UK listing. Here are my options and my Listing Brief.\n\nFor each title:\n1. Count the characters including spaces. Say if it is over [LIMIT].\n2. Give 3 short searches a UK buyer would likely type for this item, and say which ones each title matches.\n3. Flag anything not in the brief, any hype, repeated words, or US spellings or sizes.\n4. Say whether the first 40 characters (roughly what shows on a phone) make it clear what the item is.\n\nThen recommend one in two lines. If you suggest a better version, use only facts from the brief. UK English.\n\nTitles:\n[PASTE TITLE 1]\n[PASTE TITLE 2]\n[PASTE TITLE 3]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T08", "name": "Title fixer: too long, too vague or too spammy", "use": "You already have a title (from an old listing or a generic AI tool) and it needs fixing.", "prompt": "Fix this [PLATFORM] UK listing title. The limit is [LIMIT] characters.\n\nMy current title:\n[PASTE TITLE]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\n1. List what is wrong: over the limit, hype, repeated words, US spellings or sizes, unsupported claims, other brand names, wasted words.\n2. Write 2 fixed versions within the limit, with character counts.\n3. Use only facts from the brief. If the old title claims something the brief does not support, remove it and tell me what and why.\n\nUK English. No hype, emoji or exclamation marks.", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "D01", "name": "eBay UK description", "use": "You have a title and want a clear, complete eBay UK description.", "prompt": "Write an eBay UK item description for the item in my Listing Brief below.\n\nOrder:\n1. One opening line: brand, item, key detail.\n2. Size and measurements in cm (\"measured flat\" for clothing).\n3. Condition: the grade, then every flaw on its own line with location, size and photo number if given.\n4. Details: material, features, what is included and not included.\n5. Postage: only what is in my brief.\n\nRules:\n- UK English. Short lines. Under 200 words.\n- Use ONLY facts in my brief. Missing facts become [CHECK: ...]. Never invent measurements, materials, dates or test results.\n- Include every flaw. Do not soften or leave any out.\n- No hype words, exclamation marks or emoji.\n- No rare, vintage, genuine, fully working, new or smoke-free unless the brief says so.\n- Do not reveal my lowest price. Nothing about returns (I set those in eBay).\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D02", "name": "Vinted description", "use": "You are listing on Vinted and want a short, friendly, accurate description.", "prompt": "Write a Vinted description for the item in my Listing Brief below.\n\nStyle: short, friendly and plain, like someone selling from their own wardrobe. Use \"I\" or neutral wording. 50 to 120 words.\n\nOrder:\n1. What it is, in one line.\n2. Label size and measurements in cm (measured flat).\n3. Condition, then every flaw with location and size.\n4. Material and useful details (fit, pockets, lining).\n5. One line inviting questions.\n\nRules:\n- UK English. Use ONLY facts in my brief. Missing facts become [CHECK: ...].\n- Every flaw included, at the same level of seriousness.\n- No hype words, exclamation marks or emoji strings.\n- No payment, contact details or \"no returns\" lines. No other brand names.\n- Do not reveal my lowest price.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D03", "name": "Depop description", "use": "You are listing on Depop and want a description that works as both title and details.", "prompt": "Write a Depop description for the item in my Listing Brief below.\n\nOrder:\n1. First line: brand, item type, colour, size and one honest style word. This acts as the title.\n2. Two or three short lines on fit and style, from my brief only.\n3. Measurements in cm (measured flat).\n4. Condition with every flaw, location and size.\n5. A last line of up to 5 relevant hashtags.\n\nKeep it under 800 characters (Depop's limit is commonly quoted as 1,000; I will check the app). Show the count.\n\nRules:\n- UK English. Use ONLY facts in my brief. Missing facts become [CHECK: ...].\n- Era words (y2k, 90s, vintage) only if the brief supports them. Otherwise \"90s style\" or leave them out.\n- No hype, emoji spam or exclamation marks. No other brands in the text or hashtags.\n- No payment or contact details.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D04", "name": "Etsy description (handmade or vintage)", "use": "You sell handmade or vintage items on Etsy and need a description that is warm but factual.", "prompt": "Write an Etsy listing description for the item in my Listing Brief below.\n\nOrder:\n1. Two opening lines: what it is and what makes it distinctive, from the brief only.\n2. Details: every material, size and dimensions, colours, weight if relevant.\n3. Who made it and how, in one line. If AI was used in the design, pattern or photos, one plain sentence saying so.\n4. Personalisation: what can change and how to request it (skip if not offered).\n5. Made to order or ready to post, and making time.\n6. Care instructions, then my safety text word for word.\n7. Vintage items only: era (as supported by the brief) and every flaw.\n\nRules:\n- UK English. Warm, plain tone. Short paragraphs.\n- Use ONLY facts in my brief. Missing facts become [CHECK: ...].\n- Materials exactly as written. Do not upgrade \"silver-plated\" to \"silver\" or \"cotton blend\" to \"cotton\".\n- Hand words (handmade, hand-poured, hand-thrown) only for steps my brief says I do by hand.\n- No health, wellbeing or medical claims (calming, healing, detox, hypoallergenic) unless I give supplier evidence.\n- No hype, no \"perfect gift for everyone\", no exclamation marks. No returns or refund wording.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D05", "name": "Amazon UK bullet points and description", "use": "You are a brand owner or seller of new stock writing Amazon UK bullets and a product description. Skip this if you only sell second-hand.", "prompt": "Write Amazon UK bullet points and a product description for the product in my Listing Brief below.\n\nBullets:\n- Up to 5. Each starts with a short capitalised label and a colon (e.g. \"MATERIAL:\"), then one or two plain sentences.\n- Order: what it is and size, material, key feature, use or care, what is included.\n- Each under about 250 characters. I will check my category style guide.\n\nDescription: 100 to 200 words, plain paragraphs, no HTML.\n\nRules:\n- UK English. Use ONLY facts in my brief. Missing facts become [CHECK: ...].\n- No promotional or subjective claims (best, top rated), prices, delivery or offer details, reviews, or refund and guarantee phrases.\n- No health, medical or eco claims unless my brief gives the evidence.\n- No special characters, emoji or other brands. Do not repeat the title word for word.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D06", "name": "Condition grader", "use": "You are not sure which condition grade to choose, or which platform option matches.", "prompt": "Help me choose an honest condition grade for an item I am selling on [PLATFORM] in the UK.\n\nScale: New with tags, New without tags, Excellent, Very good, Good, Fair.\n- If the item sits between two grades, choose the lower one.\n- Base the grade only on what I list. Do not assume or ignore any flaw.\n\nThen:\n1. Give the grade and a one-line reason.\n2. Name the closest option in [PLATFORM]'s condition list, and remind me to read the platform's own definition first.\n3. Write a one or two line condition summary listing each flaw with location and size.\n4. List anything I should check or photograph to be sure.\n\nUK English. No softening words (barely, hardly, tiny) unless I used them, and never without a size.\n\nItem: [WHAT IT IS]\nFlaws and wear: [LIST EVERY FLAW]\nTags attached? [YES / NO]\nUsed or worn? [HOW OFTEN, IF KNOWN]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D07", "name": "Flaw disclosure rewriter", "use": "You wrote your flaws in a hurry and want them clear, specific and protective.", "prompt": "Rewrite the flaws below so they are clear and specific for a UK [PLATFORM] listing. A buyer should know exactly what to expect.\n\nFor each flaw, one line with: what it is, where it is (left and right as worn or used, and say so), how big (mm or cm), how visible (only if I said), and the photo number if I gave one.\n\nRules:\n- UK English.\n- Do not make any flaw sound smaller than I described it. Do not remove any.\n- Missing size, location or visibility becomes [CHECK: ...].\n- Add one line of what I checked and found fine, only from my list below.\n- No reassurance words (\"perfect otherwise\"). Just facts.\n\nMy flaws, as I wrote them:\n[PASTE FLAWS]\n\nThings I checked and found fine:\n[E.G. NO HOLES, ZIP WORKS, NO ODOUR]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D08", "name": "Measurements block", "use": "You want a neat measurements section for clothing, bags or shoes, and a reminder of what to measure.", "prompt": "I am listing [ITEM TYPE] on [PLATFORM] in the UK.\n\nStep 1: Tell me the 4 to 6 measurements buyers most want for this item, with one short line each on how to measure it flat.\n\nStep 2: When I reply with my numbers, format them as:\n- Heading: \"Measurements (laid flat, in cm)\", with the label size at the top\n- One measurement per line\n- Inches converted to cm, rounded to the nearest 0.5 cm, inches in brackets\n- \"Doubled\" next to any doubled figure\n\nUK English. Never estimate or invent a measurement. If one is missing, write [CHECK: measure X]. No fit advice unless I give it.", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D09", "name": "Bundle and job lot description", "use": "You are selling several items together (kids' clothes, a box of books, a job lot of mugs).", "prompt": "Write a [PLATFORM] UK description for a bundle or job lot from my list below.\n\n1. Opening line: what the bundle is, how many items, key shared details (e.g. \"Bundle of 8 girls' tops, age 7 to 8 years\").\n2. A numbered list: one line per item with brand, item, size, condition and any flaw with location and size. Children's sizes as on the label, written \"age 7 to 8 years\", never a single guessed age.\n3. What the bundle does NOT include (only if I say).\n4. Parcel weight or size if I give it.\n\nRules:\n- UK English. Use ONLY facts in my list. A line missing brand, size or condition gets [CHECK: ...].\n- Flaws listed against the right item, never merged into \"some wear\".\n- If condition varies, say so: \"Condition varies from Very good to Fair, see each item\".\n- No hype, exclamation marks, \"bargain\" or price talk. Do not reveal my lowest price.\n\nMy list:\n[ITEM 1: BRAND, ITEM, SIZE, CONDITION, FLAWS]\n[ITEM 2: BRAND, ITEM, SIZE, CONDITION, FLAWS]\n[ITEM 3: BRAND, ITEM, SIZE, CONDITION, FLAWS]\nParcel weight or size: [IF KNOWN]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D10", "name": "De-hype and UK-ify an AI description", "use": "You have a description from a generic AI tool, a platform's AI helper or an old listing that sounds American, gushing or over-promising.", "prompt": "Rewrite this listing description for a UK [PLATFORM] buyer.\n\nFix:\n1. US spelling and words to UK (color to colour, pants to trousers, sweater to jumper, sneakers to trainers, zipper to zip).\n2. US sizes to UK where my brief gives the UK size. Otherwise keep it and label it \"US size\".\n3. Remove hype and filler (stunning, gorgeous, must have, timeless piece, exclamation marks, emoji).\n4. Remove or flag with [CHECK: ...] any claim not supported by my brief.\n5. Keep every flaw, with location and size. Keep it short.\n\nThen list what you removed or flagged and why, in short bullet points.\n\nOld description:\n[PASTE OLD DESCRIPTION]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "K01", "name": "eBay UK item specifics", "use": "You are listing on eBay UK and want every relevant item specific filled in accurately.", "prompt": "I am listing on eBay UK in the category [CATEGORY]. Below are the item specifics fields eBay shows me, and my Listing Brief. Fill in each field using ONLY facts from the brief.\n\nRules:\n- UK English and UK sizes.\n- If the brief does not give the answer, write [CHECK: ...] and say where to find it (care label, base, settings menu).\n- Never guess brand, material, model, year or country of manufacture.\n- Use the simple words buyers filter by (\"Grey\", not \"dove grey heather\").\n- Keep each value short (under 65 characters; I will check the form).\n- No other brand names, hype or keywords that do not describe the item.\n- Output a two-column table: Item specific | Value.\n\neBay's item specific fields for my category:\n[PASTE THE FIELD NAMES FROM THE EBAY FORM]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K02", "name": "Etsy 13 tags", "use": "You are listing on Etsy and want 13 honest, varied tags within the 20-character limit.", "prompt": "Write 13 Etsy tags for the item in my Listing Brief below.\n\n- Each tag 20 characters or fewer including spaces. Show the count for each.\n- Multi-word phrases a UK buyer would type (\"silver stacking ring\", not just \"ring\").\n- Cover different angles: what it is, material, style, colour, occasion or recipient (only if the brief supports it), personalisation if offered.\n- Vary the wording. UK spellings (personalised, jewellery); a US spelling in one tag at most.\n\nRules:\n- Use ONLY facts from my brief. No material, style or use the item does not have.\n- No other brands, characters or celebrity names. No health or wellbeing words. No hype.\n- \"Vintage\" only if the brief supports it and it meets Etsy's current rule.\n- Output a numbered list, then all 13 on one comma-separated line.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K03", "name": "Depop hashtags", "use": "You are listing on Depop and want up to 5 relevant hashtags.", "prompt": "Suggest 5 Depop hashtags for the item in my Listing Brief below, plus 3 spares, each with a one-line reason.\n\nRules:\n- Depop allows up to 5 and asks for relevant words, brands and tags only. I will check the current limit in the app.\n- Each hashtag honestly describes the item: type, its own brand, colour, material, fit or a style it really has.\n- Style or era tags (y2k, 90s, grunge, cottagecore) only if the brief supports them. If unsure, leave them out and tell me.\n- No other brands, trend tags that do not fit, or price tags.\n- Lower case, no spaces, UK spelling (e.g. #jumper).\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K04", "name": "Vinted fields and search words", "use": "You are listing on Vinted and want every field filled in and the right search words in your title and description.", "prompt": "I am listing on Vinted in the UK. Vinted uses structured fields, not free tags.\n\n1. From my brief, give the value for each field: Category (the most specific path you can see, e.g. Women > Clothing > Jumpers), Brand, Size, Condition, Colour (a second colour only if clearly true), Material.\n2. List 5 to 8 search words UK buyers would type for this item. Say which are already in my title or description, and where the missing ones could go naturally, once each.\n3. Flag any word in my title or description that is not in the brief, or is another brand.\n\nRules: UK English and UK sizes. Use ONLY facts in my brief; missing facts become [CHECK: ...]. No repeated words or keyword lists. Category paths change, so tell me to pick the closest match I can see.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy current title and description (if written):\n[PASTE HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K05", "name": "Amazon UK backend search terms", "use": "You are a brand owner or seller filling in the backend search terms field on Amazon UK. Skip this if you only sell second-hand.", "prompt": "Write backend search terms for my Amazon UK product listing.\n\nRules:\n- The field is commonly quoted as 250 bytes (not characters; accented letters use more). Stay under 240 bytes and show the count. I will check Seller Central.\n- Words separated by spaces. No commas or punctuation. Lower case.\n- No word already in my title, Item Highlights or bullets (below), and no repeats within the field.\n- Include synonyms, UK and US variants (e.g. jumper sweater), common misspellings, and uses only if my brief supports them.\n- No other brand names, ASINs, temporary words (new, sale), subjective words (best) or offensive terms.\n- Use ONLY facts from my brief. No materials, uses or features the product does not have.\n\nMy title, Item Highlights and bullets:\n[PASTE THEM HERE]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K06", "name": "Buyer search phrase finder (from what you see)", "use": "You want to know how buyers search for your item, using the suggestions the platform's own search bar shows you.", "prompt": "I am selling [ITEM] on [PLATFORM] in the UK. Below are the suggestions the platform's search bar showed me, and titles of a few sold listings I looked up myself.\n\nUsing ONLY these and my Listing Brief:\n1. Group the phrases: what it is, brand and model, size, colour and material, style, condition.\n2. Say which phrases honestly describe MY item. Ignore the rest.\n3. Say where each fitting phrase should go: title, fields, tags or hashtags, or description.\n4. Point out any US words and give the UK version.\n\nUK English. Do not invent search data or say how popular a phrase is. No other brands.\n\nSearch bar suggestions I saw:\n[PASTE SUGGESTIONS]\n\nSold listing titles I looked up:\n[PASTE TITLES]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K07", "name": "Keyword stuffing checker", "use": "You want a quick check that your title, tags, hashtags or search terms are honest and will not look like spam, on any platform.", "prompt": "Check my [PLATFORM] UK listing for keyword stuffing and misleading search words.\n\nLook for:\n1. Any brand, character or product name that is not the item's own (including \"style\", \"like\", \"similar to\", \"not X\", \"dupe\").\n2. Words repeated more than needed, in the title or across title and backend fields.\n3. Style, era or trend words the brief does not support (vintage, y2k, 90s, designer, luxury).\n4. Condition or authenticity words the brief does not support (new, unworn, genuine, rare).\n5. Tags, hashtags or specifics that describe other items, sizes or trends.\n6. Keyword lists or deliberate misspellings hidden in the description.\n\nFor each problem: quote it, give the risk in one line, and an honest replacement from my brief (or \"remove\"). Then give a verdict: \"Ready to post\" or \"Fix first\". Accurate words buyers really search are fine: the aim is relevance, not fewer words.\n\nUK English. Do not invent facts.\n\nMy listing (title, description, tags or hashtags, specifics):\n[PASTE YOUR LISTING HERE]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "PH01", "name": "Shot list for my item", "use": "You have written the Listing Brief and want a numbered shot list before you pick up your phone.", "prompt": "Help me plan listing photos for this exact item on [PLATFORM]. Most photos allowed (check the app): [NUMBER OR \"NOT SURE\"]\n\nWrite a numbered shot list. For each shot: what to photograph, the angle or distance, and why a buyer needs it (one short line).\n\nRules:\n- UK English, short enough to read on a phone.\n- Order: cover photo (whole item), back, labels, then one shot for every flaw in my brief, then details.\n- Base it only on my brief. If a shot depends on something the brief does not say (e.g. whether there is a box), write [CHECK: ...].\n- If there are more shots than the platform allows, say which to combine or drop, but never drop a flaw shot.\n- No filters or edits that change colour or hide wear.\n- Children's items: remind me to cover name tapes, names written on labels and school logos.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH02", "name": "Flaw photo checklist", "use": "Your item has any wear, marks or faults and you want to show them properly. This protects you as much as the buyer.", "prompt": "Help me photograph the flaws on my item honestly and clearly.\n\n1. List every flaw in my brief (and any extras below) as a checklist.\n2. For each, tell me how to photograph it: distance, angle, light, and what to put next to it for scale (coin, ruler, tape measure).\n3. Suggest a short caption for each flaw photo using the same words as my brief.\n4. List places flaws often hide on this type of item that my brief does not mention, as [CHECK: ...] questions. Do not assume they are flawed.\n\nUK English. Plain, factual wording. Never describe a flaw as smaller than my brief says.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nExtra flaws I have noticed since: [EXTRA FLAWS OR \"NONE\"]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH03", "name": "Phone lighting and background plan", "use": "You photograph at home with just a phone and want truer colour without buying kit.", "prompt": "I photograph listings on my phone at home. Help me set up for the item in my brief.\n\n- When I usually shoot: [E.G. WEEKDAY EVENINGS]\n- Space and window: [E.G. SMALL BEDROOM, WINDOW FACING NORTH]\n- Possible backgrounds I own: [E.G. WHITE DUVET COVER, GREY WALL, WOODEN FLOOR]\n\nGive me:\n1. The best place and time to shoot with my window light.\n2. Which background suits this item's colour, and why.\n3. Five phone tips (focus, exposure, clean lens, no zoom, no flash glare).\n4. How to check the colour on screen matches the real item.\n5. What to do if I must shoot after dark, with ordinary lamps.\n\nUK English, no jargon, short steps. Do not recommend buying anything or any edit that changes colour or hides wear.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH04", "name": "Photo set audit", "use": "You have taken your photos and want a second pair of eyes to spot gaps before you post.", "prompt": "Check my photo set against my Listing Brief before I post.\n\nMy photos, in order (a plain description of each):\n1. [DESCRIBE PHOTO 1, E.G. \"FRONT OF JUMPER, FLAT ON BED\"]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE LINES AS NEEDED]\n\n(If your AI tool accepts images you can upload the photos instead, but only photos of the item, never addresses, faces or documents.)\n\nTell me:\n1. Missing shots a buyer would expect.\n2. Mismatches with the brief (a flaw shown but not in the brief, or something in shot that is not included).\n3. The best order. The cover should show the whole item in true colour on a plain background, filling the frame and clear as a small square thumbnail. Major flaws go early in the set.\n4. Privacy: anything to crop out (post, family photos, house numbers, reflections).\n\nUK English. Only comment on what I describe or show. If you cannot tell, write [CHECK: ...].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH05", "name": "Photo captions", "use": "Your platform lets you add a caption to each photo, or you want matching lines for the description.", "prompt": "Write one short caption for each of my listing photos.\n\nMy photos, in order:\n1. [DESCRIBE PHOTO 1]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE AS NEEDED]\n\nRules:\n- UK English, 12 words or fewer each. Say what the photo shows, plainly.\n- Flaw captions use the same words as my brief and never play the flaw down.\n- Only facts from the brief. If a caption needs a fact I have not given, write [CHECK: ...].\n- No hype words, emoji or exclamation marks.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH06", "name": "Alt text for listing photos", "use": "Your platform or web shop has an alt text box (a short description of an image for people using screen readers). Etsy and most web shops have one.", "prompt": "Write alt text for each of my product photos.\n\nPhotos, in order:\n1. [DESCRIBE PHOTO 1]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE AS NEEDED]\n\nRules:\n- UK English. Describe plainly, for someone who cannot see it: item, colour, angle, any flaw shown.\n- Do not start with \"Image of\" or \"Photo of\".\n- No keyword stuffing or repeating the title. Alt text is for people, not search.\n- Only facts from my brief. Missing details become [CHECK: ...].\n- Under [CHARACTER LIMIT, OR 125] characters each.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "PH07", "name": "Is this edit OK?", "use": "You are tempted to use a background remover, a \"magic eraser\", an AI model or any AI photo tool, and want to check it will not misrepresent the item.", "prompt": "I want to edit a listing photo. Tell me whether the edit risks misrepresenting my item.\n\nPlatform: [PLATFORM]\nThe original photo shows: [DESCRIBE THE ORIGINAL]\nThe edit I want: [E.G. PLAIN WHITE BACKGROUND / REMOVE A HAIR / PUT THE JUMPER ON AN AI MODEL]\nThe tool: [TOOL NAME OR TYPE]\nRule text I copied from the platform's help pages (optional): [PASTE OR \"NONE\"]\n\nAnswer in three parts:\n1. Risk: low, medium or high that the edit changes how the item looks (colour, condition, size, shape, what is included), in one or two lines.\n2. A safer way to get a similar result without editing the item (e.g. reshoot on a plain sheet).\n3. A reminder to check the platform's current photo and AI rules. Do not state rules as fact unless I pasted them.\n\nUK English. Be honest, not reassuring. If the edit would hide or reduce any flaw in my brief, say plainly not to do it.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 05: Photos", "file": "05-photos.md"}, {"id": "R01", "name": "Tidy my sold comps", "use": "You have copied a messy pile of sold listings into your notes and want a clean table before pricing.", "prompt": "Put the sold listings I copied into a clean table so I can compare them with my item.\n\nColumns: Title (shortened), Sold £, Postage £ (or \"free\" or [CHECK]), Total £, Condition, Size or model, Date sold (or [CHECK]), Match to my item (Good, Partial, Poor) with a one-line reason.\n\nRules:\n- UK English, pounds.\n- Only use numbers in what I pasted. Never invent a price, date or condition. Missing details become [CHECK].\n- If something looks like an asking price, flag it [CHECK: sold or asking?].\n- Good matches first. Below the table, list comps to drop and why.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nSold listings I copied (messy is fine):\n[PASTE YOUR SOLD LISTINGS HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R02", "name": "Price from my sold comps", "use": "You have your tidied comps and want a list price, a realistic range and a floor.", "prompt": "Suggest a price for my item using only the sold listings I found.\n\nPlatform: [PLATFORM]\nBuyer pays postage on top, or included in my price? [ON TOP / INCLUDED]\n\nGive me:\n1. The sold range from Good matches only, lowest to highest, and the median.\n2. Whether my item is better, the same or worse than those matches, from my brief only.\n3. A list price, a likely accepted price, and my floor from the brief. If my floor is above what the comps support, say so.\n4. Two or three lines of reasoning I can save.\n\nRules:\n- UK English, pounds, show the sums. Write ranges as \"£10 to £14\".\n- Use only the numbers I pasted, no outside price knowledge.\n- Fewer than three Good matches: say the evidence is thin and what to search for.\n- Say \"based on these comps\", never \"this will sell for\".\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy sold comps (ideally the table from R01):\n[PASTE COMPS HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R03", "name": "Adjust for condition and extras", "use": "Your item is not quite like the comps (better or worse condition, no box, extra accessories) and you want a fair adjustment.", "prompt": "My item differs from the comps I found. Help me adjust the price fairly.\n\nHow my item differs (my own words):\n[E.G. \"NO ORIGINAL BOX, BUT COMES WITH A SPARE CHARGER\"]\n\n1. For each difference: up, down or no clear difference, with a one-line reason a buyer would recognise.\n2. If the comps show the effect (boxed sold higher than unboxed), use those numbers and show the sum. If not, say \"the comps do not show this\" and label your suggestion a judgement, not evidence.\n3. Give an adjusted list price and floor.\n\nUK English, pounds. Only numbers I pasted. Never guess a \"collector's value\". Never suggest describing the item as better than my brief.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy closest sold comps:\n[PASTE COMPS HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R04", "name": "Bundle pricing", "use": "You want to sell several items together, or a buyer asks for a bundle price.", "prompt": "Help me price a bundle.\n\nItems (one line each, with my list price and floor):\n[PASTE ITEMS HERE]\nPlatform: [PLATFORM]\nPostage as one parcel: £[AMOUNT OR \"NOT SURE\"]\nPostage if sent separately (total): £[AMOUNT OR \"NOT SURE\"]\nPlatform bundle discount switched on? [YES, WITH % / NO / NOT SURE]\n\nGive me:\n1. The total of list prices and the total of floors.\n2. The postage saving from one parcel, if I gave both figures.\n3. A bundle price and the lowest bundle price to accept, never below the total of my floors.\n4. One friendly line to send the buyer, based on the postage saving, with no pressure.\n\nUK English, pounds, show the sums. Use only my numbers; missing postage becomes [CHECK: postage]. No \"today only\" or \"last chance\".", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R05", "name": "Offer strategy", "use": "You want to decide in advance which offers to accept, counter or decline, so you are not deciding at 11pm with a lowballer waiting.", "prompt": "Help me set an offer plan for this listing.\n\nPlatform: [PLATFORM]\nList price: £[AMOUNT]\nMy reasoning from comps (optional): [PASTE OR \"NONE\"]\nCan the app auto-accept or auto-decline offers? [YES / NO / NOT SURE]\n\nGive me:\n1. Accept straight away at or above: £...\n2. Counter if between £... and £..., and the counter price to send.\n3. Decline below: my floor.\n4. If auto settings exist, the levels to set, with a reminder to check how they work in the app.\n5. One short, polite line for each case.\n\nUK English, pounds. Never accept or counter below my floor. No fake scarcity or pressure (\"someone else is interested\") unless I say it is true.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R06", "name": "Planned price drop schedule", "use": "An item has not sold and you want a calm plan for reducing it, rather than panic-dropping or leaving it forever.", "prompt": "Make a price drop plan for an item that has not sold.\n\nPlatform: [PLATFORM]\nCurrent price: £[AMOUNT]\nListed for: [NUMBER] days\nViews, likes or watchers (if shown): [NUMBERS OR \"NOT SURE\"]\n\nGive me:\n1. First, anything other than price that could be holding it back (cover photo, title, missing measurements, postage), from my brief only. [CHECK: ...] for anything you cannot see.\n2. A drop plan in weeks from today, with the price at each step, stopping at my floor.\n3. What to do if it has not sold at the floor (bundle, relist with new photos, sell elsewhere, donate).\n\nUK English, pounds, round numbers. Never below my floor. Do not say any step will make it sell. If the app lets me send offers to people who liked it, mention that as an option to check.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R07", "name": "Fee and postage maths", "use": "You want to know what you actually keep after fees, postage and packaging, before you set a price or accept an offer. Makers: put your materials (and time, if you want it counted) in the cost line.", "prompt": "Work out what I keep from a sale, using fees I copy from the platform myself.\n\nPlatform: [PLATFORM]\nSale price: £[AMOUNT]\nPostage the buyer pays: £[AMOUNT OR \"NONE, INCLUDED\"]\nMy actual postage cost: £[AMOUNT]\nPackaging: £[AMOUNT OR \"0\"]\nFees copied from the platform's fee page today (percentage, fixed fee, whether it applies to postage):\n[PASTE CURRENT FEE DETAILS HERE]\nWhat the item cost me (optional): £[PRICE PAID, OR FOR MAKERS: MATERIALS + SHARE OF KILN OR TOOLS + TIME AT A RATE I CHOOSE, EACH LISTED]\nAmount I want to keep: £[TARGET AMOUNT]\n\nShow a simple table: money in, each fee with its sum, postage and packaging out, what I keep, and what is left after cost if I gave one. Then the lowest sale price that still keeps my target amount.\n\nRules:\n- UK English, pounds, nearest penny.\n- Use ONLY the fees I pasted, never your own knowledge. Unclear fees become [CHECK: ...].\n- This is a sum, not advice. Only call it \"profit\" if I gave a cost. If I listed making costs, add them up and show each one.", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "R08", "name": "Is it worth listing on its own?", "use": "You have a low-value item and are not sure whether to list it alone, bundle it or let it go.", "prompt": "Help me decide whether this item is worth listing on its own.\n\nSold comps (optional): [PASTE OR \"NONE\"]\nWhat I keep at that price (from R07, optional): £[AMOUNT OR \"NOT SURE\"]\nMinutes it takes me to list, message and pack one item: [MINUTES]\nSimilar items I could put with it: [LIST OR \"NONE\"]\n\nCompare in a short table: list alone, bundle, job lot, donate or recycle. For each: effort, money kept (from my numbers only, otherwise [CHECK]) and when it makes sense. Then a one-line recommendation.\n\nUK English, pounds. Only my numbers. Do not promise anything will sell. Practical, not preachy.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 06: Pricing", "file": "06-pricing.md"}, {"id": "M01", "name": "Reply to any buyer message", "use": "You have a message that does not fit the other prompts, or just want a quick, polite reply.", "prompt": "Help me reply to a buyer on [PLATFORM]. I have removed their personal details.\n\nI sell as a: [PRIVATE SELLER / BUSINESS]\nBuyer's message:\n[PASTE MESSAGE, WITH NAMES REPLACED BY [BUYER]]\nWhat I want to say, rough is fine:\n[E.G. \"YES I CAN POST TOMORROW BUT NOT BEFORE\"]\n\nWrite one reply.\n\nRules:\n- UK English, friendly, under 60 words. No emoji unless I ask.\n- Only facts from my brief or notes. If they ask something I have not answered, write [CHECK: ...].\n- Keep everything on the platform. Do not promise delivery dates I have not given.\n- If it is about returns, refunds or a problem with the item, say so and suggest the specific prompt.\n- Do not mention feedback.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M02", "name": "\"Is this still available?\"", "use": "You get the classic question and want a reply that answers it and moves things along.", "prompt": "A buyer on [PLATFORM] asked if my item is still available. Write a short, friendly reply.\n\nStill available? [YES / NO, SOLD / ON HOLD]\nWhen I can post: [E.G. \"NEXT WORKING DAY\"]\nAnything useful to add: [E.G. \"HAPPY TO SEND MORE PHOTOS\" OR \"NONE\"]\n\nRules: UK English, under 40 words, answer the question in the first sentence. If available, add one useful fact and an easy next step using the platform's tools (buy, make an offer). No fake urgency (\"lots of interest\") unless I say it is true. Only facts from my brief.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M03", "name": "Lowball offer", "use": "Someone offers far below your price and you want to stay polite without giving the item away.", "prompt": "A buyer on [PLATFORM] offered much less than my price. Help me reply.\n\nList price: £[AMOUNT]\nTheir offer: £[AMOUNT]\nWhat I want to do: [COUNTER AT £... / DECLINE POLITELY / ASK WHAT THEY HAD IN MIND]\nA true reason for my price (optional): [E.G. \"SOLD COMPS AROUND £25\", \"HEAVY TO POST\"]\n\nWrite a friendly counter and a polite decline, each under 50 words.\n\nRules: UK English, warm and calm, never sarcastic or lecturing. Never below my floor. Only reasons I gave, no invented buyers or deadlines. Any counter goes through the platform's offer button.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M04", "name": "Bundle request", "use": "A buyer wants several of your items and asks for a deal.", "prompt": "A buyer on [PLATFORM] wants several of my items together. Help me reply with a bundle price.\n\nThe items (title, list price and floor for each):\n[PASTE ITEMS HERE]\nPostage as one parcel: £[AMOUNT OR \"NOT SURE\"]\nBundle price I am happy with (or work it out with R04 first): £[AMOUNT]\nHow the platform handles bundles: [E.G. \"BUYER ADDS ITEMS TO A BUNDLE AND I SEND AN OFFER\" / \"NOT SURE\"]\n\nWrite a reply under 60 words that confirms the items, gives the price and whether postage is included, and says how to buy with the platform's bundle or offer tool.\n\nRules: UK English, friendly, on the platform. Never below the total of my floors. If the process is \"NOT SURE\", write [CHECK: how bundles work on this app].", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M05", "name": "Postage questions", "use": "A buyer asks about postage cost, speed, tracking, collection or sending abroad.", "prompt": "A buyer on [PLATFORM] asked about postage. Help me reply in under 60 words.\n\nTheir question (personal details removed):\n[PASTE QUESTION]\n\nMy postage facts:\n- Service: [E.G. \"TRACKED 48\"]\n- Cost to buyer: £[AMOUNT OR \"SET BY THE APP\"]\n- How soon I post: [E.G. \"NEXT WORKING DAY\"]\n- Post outside the UK? [YES / NO]\n- Collection? [YES, AND HOW THE PLATFORM HANDLES IT / NO]\n\nRules: UK English. Only these facts; anything else becomes [CHECK: ...]. Never promise a delivery date: say when I post and the service's usual time (\"usually\", not \"guaranteed\"). Collection only if I said yes, with payment on the platform. Never suggest undervaluing or marking anything as a gift on customs forms.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M06", "name": "Delay: late dispatch or parcel stuck in transit", "use": "You are going to post late, or tracking has stalled and the buyer is asking where their parcel is.", "prompt": "Help me update a buyer on [PLATFORM] about a delay.\n\nType of delay: [I WILL POST LATE / STUCK IN TRANSIT / TRACKING SAYS DELIVERED BUT BUYER HAS NOT GOT IT]\nDate of sale: [DATE]\nDate posted: [DATE OR \"NOT YET\"]\nService, tracked or not: [E.G. \"TRACKED 48, YES\"]\nWhat tracking shows now: [STATUS, NO TRACKING NUMBER NEEDED]\nWhat I will do next: [E.G. \"POST TOMORROW MORNING\" / \"OPEN A CARRIER ENQUIRY\"]\nBuyer's message (details removed): [PASTE OR \"NONE, I AM MESSAGING FIRST\"]\n\nWrite a reply under 80 words: sorry once, plainly; the facts and what I am doing next; and that their purchase is still covered by the platform's buyer protection (no specific time limits).\n\nUK English. Do not blame the buyer. Do not promise a delivery date. No cancelling or refunding outside the platform. Missing facts become [CHECK: ...].", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M07", "name": "Return request", "use": "A buyer asks to return an item, for any reason.", "prompt": "A buyer on [PLATFORM] asked to return an item. Help me work out my position and reply.\n\nI sell as a: [PRIVATE SELLER / TRADER]\nMy listing's return policy: [E.G. \"NO RETURNS\" / \"30 DAY RETURNS\"]\nPlatform rules I checked today (paste, or \"NOT CHECKED\"): [PASTE RULE TEXT]\nDate delivered: [DATE]\nBuyer's reason (details removed): [PASTE MESSAGE]\n\nPart 1, my position, in short bullets:\n- Is this change of mind, or a claim that it is faulty, damaged or not as described?\n- If I am a trader: remind me of the 14-day right to cancel most online orders and the short-term right to reject faulty goods, which \"no returns\" cannot remove. Exceptions only as [CHECK: ...].\n- If I am a private seller: change-of-mind returns are up to me, but \"not as described\", faulty or damaged claims may be covered by platform protection whatever my policy says.\n- Platform rules only from the text I pasted. If I pasted nothing, tell me to check the help pages first.\n- One line saying this is not legal advice.\n\nPart 2: a polite reply under 80 words, using the platform's own return or refund process. Never tell the buyer they have no rights, argue about their reason, or refund off the platform.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M08", "name": "\"Item not as described\"", "use": "A buyer says the item is different from the listing, faulty, or has a flaw you did not mention.", "prompt": "A buyer on [PLATFORM] says my item is not as described. Help me respond fairly.\n\nI sell as a: [PRIVATE SELLER / TRADER]\nMy original listing (title and description):\n[PASTE LISTING TEXT]\nWhat my photos showed: [E.G. \"FLAW ON LEFT CUFF IN PHOTO 4\"]\nBuyer's complaint (details removed), and what their photos show:\n[PASTE MESSAGE]\n\n1. Compare the complaint with my listing, point by point: covered, not covered or unclear. Do not take my side automatically.\n2. Suggest fair options (ask for photos, return for a full refund through the platform, partial refund through the platform, or let the platform decide) and say which fits best.\n3. Write a calm reply under 90 words.\n\nUK English. If the listing did not mention the problem, say so plainly. Never accuse the buyer of lying; if I suspect a swapped or damaged return, tell me to keep records and use the platform's process. Never refund off the platform or link a refund to feedback. Not legal advice.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M09", "name": "Damaged in the post", "use": "The buyer says the item arrived broken, crushed or wet.", "prompt": "A buyer on [PLATFORM] says the item arrived damaged. Help me handle it.\n\nItem and how I packed it: [E.G. \"GLASS VASE, BUBBLE WRAP, DOUBLE-WALLED BOX\"]\nPostage: [E.G. \"PLATFORM LABEL\" / \"MY OWN TRACKED SERVICE\"]\nBuyer's message and what their photos show (details removed):\n[PASTE MESSAGE]\n\nGive me:\n1. What to ask the buyer for (photos of item, packaging and label) and what to keep myself (proof of postage, packing photos).\n2. Who likely handles the claim: the platform (e.g. if I used its label) or me with the carrier. If unsure, write [CHECK: ...] and tell me to check the help pages.\n3. A calm reply under 80 words asking for photos and explaining the next step through the platform.\n\nUK English. Do not blame the buyer or the carrier, refuse a refund, or settle off the platform. Not legal advice.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M10", "name": "Asking for feedback, without pressure", "use": "A sale has gone smoothly and you want to send a thank-you that mentions feedback, fairly.", "prompt": "Write a short thank-you message to a buyer on [PLATFORM] after delivery.\n\nItem: [SHORT NAME]\nAnything nice and true to mention: [E.G. \"HOPE IT FITS WELL\" OR \"NONE\"]\nMention feedback? [YES, ONE NEUTRAL LINE / NO]\n\nRules:\n- UK English, under 40 words, no emoji unless I ask.\n- Feedback, if mentioned, in one neutral line. Never ask for \"positive\" or \"5 star\".\n- Never offer or hint at a discount, refund or reward for feedback or a review. That is against platform rules and UK law on fake and incentivised reviews.\n- Nothing that discourages honest feedback.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M11", "name": "Difficult or abusive buyer", "use": "A buyer is rude, threatening, demanding things not in the listing, or threatening bad feedback to get a discount.", "prompt": "A buyer on [PLATFORM] is being difficult. Help me respond calmly and protect myself.\n\nWhat happened (details removed):\n[DESCRIBE OR PASTE MESSAGES]\nWhat the listing said on this point: [PASTE OR \"NOT RELEVANT\"]\nHas a sale happened? [YES / NO]\n\nGive me:\n1. A one-line read: a genuine problem said rudely, a demand for something not in the listing, a threat linked to feedback, or abuse?\n2. What to do: reply, reply once then stop, or do not reply; use the platform's report and block tools; keep all messages on the platform as a record.\n3. If a reply makes sense, one calm reply under 60 words.\n\nRules:\n- UK English. Calm and neutral. Never insult or threaten back.\n- A genuine complaint still gets the platform's proper return or refund route, however rude the buyer.\n- Threatening negative feedback to get something not in the listing is generally not allowed by platforms: tell me to report it, not give in.\n- Threats to my safety: stop replying, report to the platform, and contact the police if I feel at risk.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M12", "name": "Suspicious request or off-platform payment", "use": "A buyer asks to pay another way, wants your email or number, asks you to post to a different address, or something just feels off.", "prompt": "A buyer on [PLATFORM] sent a request that may be risky. Help me spot the risk and reply.\n\nThe request (details removed):\n[PASTE MESSAGE]\n\nGive me:\n1. The warning signs (e.g. paying outside the app, a link to click, \"my courier will collect\", asking for my email or phone, a different delivery address, overpaying and asking for money back).\n2. What to do: reply, decline, report or ignore.\n3. A short, polite reply that keeps everything on the platform.\n\nUK English. Do not help arrange payment, contact or delivery outside the platform. Do not tell me to click any link. Remind me that platform protection generally only covers sales paid through the platform.", "module": "Module 07: Buyer messages", "file": "07-buyer-messages.md"}, {"id": "V01", "name": "Faceless product video script (15 to 30 seconds)", "use": "You want a short, honest video of one item without showing your face or using your own voice.", "prompt": "Write a short faceless product video script in UK English for the item in my Listing Brief.\n\nPlatform: [TIKTOK / INSTAGRAM / TIKTOK SHOP / OTHER]\nLength: [15 / 20 / 30] seconds\nVoice: [TEXT-TO-SPEECH / ON-SCREEN TEXT ONLY]\n\nTable columns: Seconds, What we see (hands or item only), On-screen text (8 words or fewer), Voiceover line.\n\nRules:\n- Only facts from the brief. Missing facts become [CHECK: ...].\n- No faces, people or reflections. Every shot possible with a phone, a plain background and my hands.\n- Show every flaw in the brief clearly in at least one shot.\n- First 2 seconds say plainly what the item is. End with a calm line such as \"Details in the listing\".\n- No hype, \"best\", comparisons, health claims, fake urgency or other platform names.\n- After the table, a one-line caption and the list of [CHECK] items.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V02", "name": "Hands-only shot list and showcase ideas", "use": "You know what the item is but not how to film it without a face or a model.", "prompt": "I film products with my hands only, never faces. Give me 8 short shot ideas I can film in under 20 minutes for the item in my Listing Brief. UK English.\n\nMy kit: [PHONE ONLY / PHONE AND TRIPOD]\nWhere I can film: [E.G. KITCHEN TABLE BY A WINDOW, WHITE SHEET]\n\nFor each shot: name, how to set it up (one or two lines), what it proves to the buyer (size, texture, how it works, condition) and roughly how many seconds.\n\nRules:\n- Hands, flat lays, item on a surface, hanger or mannequin only. No mirrors.\n- At least one scale shot (common object or tape measure) and one clear flaw shot if the brief lists flaws.\n- Only facts from the brief. A shot that depends on something not in the brief gets [CHECK: ...].\n- Daylight or one steady light, no colour filters.\n- No props that could look included unless the brief says they are.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V03", "name": "Caption, on-screen text and hashtags for a product video", "use": "You have filmed the video and need the words to go with it.", "prompt": "Write the words for my product video in UK English.\n\nMy shots, in order: [E.G. \"1. FLAT LAY 2. CLOSE-UP OF LABEL 3. FLAW UNDER ARM\"]\nPlatform: [TIKTOK / INSTAGRAM / TIKTOK SHOP]\n\nGive me:\n1. On-screen text for each shot, 8 words or fewer, readable on a phone.\n2. One caption under 150 characters: what it is, size or key spec, and condition in plain words.\n3. 3 to 5 relevant hashtags (item type, its own brand, category).\n\nRules: only facts from my brief; [CHECK: ...] for anything missing; no hype, \"best\", health claims, fake urgency or emoji; no trending hashtags unrelated to the item, no platform names, no other brands.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V04", "name": "TikTok Shop UK product description", "use": "You need a TikTok Shop product description that is clear, scannable on a phone and free of risky claims.", "prompt": "Write a TikTok Shop UK product description in UK English for the product in my Listing Brief.\n\n1. One opening sentence: what it is and who it is for.\n2. 4 to 6 short feature lines: the feature, then the plain benefit. One
