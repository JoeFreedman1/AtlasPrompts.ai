und process). Do not refuse legal rights because the buyer is rude.\n- If the buyer is threatening negative feedback to get something not in the listing, tell me that platforms generally treat this as not allowed (eBay calls it feedback extortion) and to report it through the platform. Do not tell me to give in to it.\n- If there are threats to my safety, tell me to stop replying, report it to the platform, and contact the police if I feel at risk.\n- Never suggest sharing personal details or moving off the platform.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M12", "name": "Suspicious request or off-platform payment", "use": "a buyer asks to pay another way, wants your email or phone number, asks you to post to a different address, or something just feels off.", "prompt": "A buyer on [PLATFORM] has sent a request that may be risky. Help me spot the risk and reply.\n\nThe request (personal details removed):\n[PASTE MESSAGE]\n\nGive me:\n1. A plain list of warning signs in the message (for example: paying outside the app, a link to click, \"my courier will collect\", asking for my email or phone, posting to a different address from the one in the order, overpaying and asking for money back).\n2. What to do: reply, decline, report through the platform, or ignore.\n3. A short, polite reply that keeps everything on the platform.\n\nRules: UK English. Do not help me arrange payment, contact or delivery outside the platform. Do not tell me to click any link in the message. Remind me that platform protection generally only covers sales paid for through the platform, and to check the platform's help pages on scams.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "V01", "name": "Faceless product video script (15 to 30 seconds)", "use": "you want a short, honest video of one item without showing your face or using your own voice.", "prompt": "You are helping a UK seller make a short faceless product video for an item they are selling. Write in UK English.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nPlatform the video is for: [TIKTOK / INSTAGRAM / TIKTOK SHOP / OTHER]\nLength: [15 / 20 / 30] seconds\nVoice: [TEXT-TO-SPEECH VOICEOVER / ON-SCREEN TEXT ONLY]\n\nWrite a video script as a table with these columns: Seconds, What we see (hands-only or item-only shot), On-screen text (maximum 8 words), Voiceover line (if any).\n\nRules:\n- Only use facts from the Listing Brief. If something I would need is missing, write [CHECK: what is missing] instead of guessing.\n- No faces, no people, no reflections. Shots must be possible with a phone, a plain background and my hands.\n- Show the flaws listed in the brief on screen, clearly, in at least one shot.\n- No hype words (amazing, stunning, must-have, jaw-dropping), no \"best\", no invented comparisons, no health or medical claims, no fake urgency.\n- Open with a plain hook in the first 2 seconds that says what the item is.\n- End with a calm call to action that fits the platform (for example \"Link in the listing\" or \"Details in the description\"). Do not mention other platforms or ask buyers to pay outside the platform.\n- After the table, give me a one-line caption and a list of any [CHECK: ...] items.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V02", "name": "Hands-only shot list and showcase ideas", "use": "you know what the item is but not how to film it without a face or a model.", "prompt": "You are a UK product videographer who only films hands and products, never faces. Write in UK English.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nMy kit: [PHONE ONLY / PHONE AND TRIPOD / PHONE, TRIPOD AND RING LIGHT]\nWhere I can film: [E.G. KITCHEN TABLE BY A WINDOW, WHITE BEDSHEET, BLANK WALL]\n\nGive me 8 short shot ideas I can film in under 20 minutes. For each shot give: shot name, how to set it up (one or two lines), what it proves to the buyer (size, texture, how it works, condition), and roughly how many seconds to film.\n\nRules:\n- No faces, no people wearing the item from the neck up, no mirrors that could show me. Hands, flat lays, item on a surface, or item on a plain hanger or mannequin only.\n- Include at least one shot that shows scale (next to a common object or tape measure) and at least one clear flaw shot if the brief lists flaws.\n- Only use facts from the brief. Where a shot depends on something not in the brief (for example the item lights up), write [CHECK: ...].\n- Keep the colour true: tell me to use daylight or one consistent light and no colour filters.\n- No props that could be mistaken as included with the item unless the brief says they are included.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V03", "name": "Caption, on-screen text and hashtags for a product video", "use": "you have filmed the video and need the words to go with it.", "prompt": "Write in UK English for a UK audience.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nHere is a short description of my video, shot by shot:\n[DESCRIBE YOUR SHOTS, E.G. \"1. FLAT LAY 2. CLOSE-UP OF LABEL 3. FLAW UNDER ARM\"]\n\nPlatform: [TIKTOK / INSTAGRAM / TIKTOK SHOP]\n\nGive me:\n1. On-screen text for each shot (maximum 8 words each, plain and readable on a phone).\n2. One caption under 150 characters that says what the item is, the size or key spec, and the condition in plain words.\n3. 3 to 5 relevant hashtags (item type, brand if genuine, category). No trending hashtags that have nothing to do with the item, no platform names, no hashtags that suggest a brand the item is not.\n\nRules: only use facts from the brief; write [CHECK: ...] for anything missing; no hype, no \"best\", no health claims, no fake urgency, no emojis unless I ask for them.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V04", "name": "TikTok Shop UK product title", "use": "you are adding a product to TikTok Shop UK and want a clear, compliant title.", "prompt": "You are a UK e-commerce copywriter who knows TikTok Shop UK's product listing guidelines. Write in UK English.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nWrite 3 product title options for TikTok Shop UK.\n\nRules:\n- Structure: brand (if I own or am authorised to sell it) + product type + key feature or material + size, quantity or capacity + colour or variant.\n- Keep each title clear and readable, roughly 60 to 120 characters, and tell me the character count for each. [CHECK: the current maximum title length in TikTok Shop Seller Center]\n- Do NOT include: promotional wording (sale, x% off, free postage, limited offer), my shop name or URL, the word TikTok, other marketplace names, symbols or special characters (such as ! * ~ | and similar), emojis, or ALL CAPS words.\n- Do NOT include health, medical or results claims, \"best\", \"number one\" or comparisons with other brands.\n- Only use facts from the brief. If a key fact is missing (size, material, quantity), put [CHECK: ...] in its place.\n- After the titles, list any words I should double-check because they could be a claim.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V05", "name": "TikTok Shop UK product description", "use": "you need a TikTok Shop product description that is clear, scannable on a phone and free of risky claims.", "prompt": "You are a UK e-commerce copywriter who knows TikTok Shop UK's content rules. Write in UK English.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nWrite a TikTok Shop UK product description with:\n1. An opening line (one sentence) that says what the product is and who it is for.\n2. 4 to 6 short feature lines, each starting with the feature, then the plain benefit. One fact per line.\n3. A \"What's included\" line.\n4. A \"Size and specs\" section (dimensions, weight, capacity, materials) using only facts in the brief.\n5. A \"Care\" line if the brief gives care instructions.\n\nRules:\n- At least 30 words, and keep it concise (aim for under 500 characters for the main text if possible).\n- Only use facts from the brief. Write [CHECK: ...] where anything is missing. Never invent materials, certifications, dimensions or safety standards.\n- No health or medical claims (cure, heal, treat, prevent, relieve, detox, anti-bacterial unless certified and I say so), no \"clinically proven\", no \"best\", no comparisons with named brands, no guarantees, no fake urgency, no mention of other platforms or payment outside TikTok Shop.\n- Avoid vague green claims (\"eco-friendly\", \"sustainable\") unless the brief gives a specific, checkable fact (for example \"made from FSC-certified bamboo\" with the certificate details).\n- Plain, friendly UK tone. No hype words, no emojis unless I ask.\n- After the description, list every phrase you think could count as a claim so I can check it.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V06", "name": "TikTok Shop claims check and safe rewrite", "use": "you have written (or been sent) product copy or a video script and want to catch risky claims before TikTok Shop or a buyer does.", "prompt": "You are a careful UK compliance reviewer for TikTok Shop UK product listings and short videos. Write in UK English.\n\nHere is the copy or script to check:\n[PASTE TITLE, DESCRIPTION, CAPTION OR VIDEO SCRIPT]\n\nHere is my Listing Brief (the facts I can back up):\n[PASTE YOUR LISTING BRIEF]\n\nGo through the copy line by line. Make a table with: Original wording, Why it might be a problem, Safer rewrite.\n\nFlag anything that:\n- makes or implies a health or medical claim (cure, heal, treat, prevent, relieve, detox, boosts immunity, pain relief, anti-ageing results);\n- makes a result or performance claim not supported by the brief;\n- uses \"best\", \"number one\", \"better than\", or compares with a named brand;\n- uses fake urgency or scarcity, or a discount that is not real;\n- uses vague green or safety claims (eco-friendly, non-toxic, 100% safe, chemical-free) without a specific fact in the brief;\n- mentions TikTok or another platform in a product title, or points buyers to pay or order elsewhere;\n- uses symbols, promo wording or a shop URL in the product title;\n- states a fact that is not in the brief (mark these [CHECK: ...]).\n\nThen give me the full cleaned-up version. Only use facts from the brief. Do not add new claims while rewriting. This is a helpful check, not legal advice.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V07", "name": "Live-selling run-sheet", "use": "you are planning a TikTok Shop LIVE (or any live selling session) and want a calm, honest plan to follow, without showing your face.", "prompt": "You are helping a UK seller plan a faceless live selling session (hands and products only, voice or on-screen text). Write in UK English.\n\nSession length: [30 / 45 / 60] minutes\nPlatform: [TIKTOK SHOP LIVE / OTHER]\nProducts (paste a short Listing Brief for each, or name, price, key facts and flaws):\n[PASTE PRODUCTS]\nAny real offer I am running (only if genuine): [E.G. \"BUY 2 GET FREE POSTAGE\" OR \"NONE\"]\n\nCreate a run-sheet as a table with: Time, Segment, What is on camera (hands-only or product-only), What I say or show on screen, Notes.\n\nInclude:\n- A 2-minute welcome that says what we are showing today and how to buy (through the platform's own checkout only).\n- One segment per product: show it, give the key facts, show flaws or limits honestly, show size or scale, say the price.\n- A \"questions\" slot every 10 to 15 minutes.\n- A 2-minute wrap-up.\n\nAlso give me:\n- 6 short, honest answers to common live questions (size, postage time, returns, \"is it genuine\", \"can you do cheaper\", \"can I pay another way\"). Returns answers must respect UK consumer rights and the platform's return policy. The payment answer must say we only take payment through the platform.\n- A list of things NOT to say on the live: health or medical claims, \"best\", fake countdowns or fake stock levels, invented discounts, other platform names, asking viewers to pay or message off the platform.\n\nOnly use facts from what I pasted. Write [CHECK: ...] for anything missing.", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V08", "name": "Turn one listing into a week of short videos", "use": "you want a few different short videos for the same item or product without repeating yourself or stretching the truth.", "prompt": "Write in UK English.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nGive me 5 different faceless short video ideas for this item, each 10 to 20 seconds. Use these angles:\n1. \"What you get\" (unboxing or laying out contents).\n2. \"Size check\" (next to everyday objects or a tape measure).\n3. \"Details close-up\" (label, stitching, material, texture, ports, fixings).\n4. \"Honest condition\" (shows any flaws in the brief and explains them calmly).\n5. \"How it is packed\" (folded or wrapped, into the parcel).\n\nFor each idea give: a hook line (maximum 8 words), 3 to 4 shots (hands or item only), one line of on-screen text per shot, and a caption under 150 characters.\n\nRules: only facts from the brief; [CHECK: ...] for anything missing; no hype, no \"best\", no health claims, no fake urgency, no faces, no trending audio suggestions I would need rights for (tell me to use the platform's commercial-use music library if I add music).", "module": "08 Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "C01", "name": "Accuracy check: listing against brief", "use": "every time, on every platform, before you post.", "prompt": "Check my listing for accuracy against my Listing Brief. You are a careful proofreader, not a copywriter. Do not rewrite the listing unless I ask.\n\nMy Listing Brief (the facts):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, description, item specifics or tags, condition, price and postage):\n[PASTE YOUR LISTING HERE]\n\nCheck and report, as a short list:\n1. Added facts: anything in the listing that is NOT in the brief (for example a material, a size, a year, \"original box\", \"never worn\"). These are invented until I confirm them.\n2. Changed facts: anything that differs from the brief (size, colour, measurements, condition, what is included, price, postage).\n3. Missing flaws: every flaw in the brief must appear in the listing, worded no more mildly than in the brief. List any that are missing or softened.\n4. Missing essentials: anything a buyer would need that is in the brief but not the listing (measurements, what is included, postage).\n5. Misleading wording: anything that could give a false impression, even if technically true (for example \"like new\" for an item with wear in the brief).\n6. UK English: any American spellings or sizes (for example \"color\", \"pants\" for trousers, US sizes without the UK size).\n\nLabel each point Must fix, Should fix or Fine. Finish with a one-line verdict: \"Ready to post\" or \"Fix first\".\n\nRules: UK English. Only compare what I have pasted. If you are unsure, write [CHECK: ...]. Do not add new selling points.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C02", "name": "eBay UK pre-post check", "use": "you are about to post on eBay UK.", "prompt": "Check my eBay UK listing before I post. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, item specifics, condition, description, photos described in a line each, price, postage, returns):\n[PASTE YOUR LISTING HERE]\n\nI sell as a: [PRIVATE SELLER / BUSINESS SELLER]\n\nCurrent rule text I copied from eBay's help pages today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- Title is 80 characters or fewer, including spaces. Count it and show the count.\n- Title is plain words that describe the item: no ALL CAPS shouting, no \"L@@K\", no hype, no unrelated brand names, no keyword lists.\n- No brand comparisons or lookalike wording (\"style\", \"like\", \"inspired by\", \"dupe\") next to a brand the item is not made by. eBay's rules say \"dupe\" with a brand name is not allowed and comparisons with other products are not allowed.\n- Nothing suggests counterfeit, replica or fake items.\n- Item specifics match the brief and are not stuffed with extra keywords.\n- Condition chosen matches the brief, and the description describes every flaw.\n- Photos: of the actual item, no stock photos for used items, no added text, borders or watermarks.\n- No request to pay, message or buy outside eBay, and no contact details (email, phone, social handles, websites).\n- Returns wording: if I am a business seller, it must not say or imply buyers have no rights (for example \"no returns, no refunds under any circumstances\").\n\nOutput: a numbered list of issues labelled Must fix, Should fix or Fine, then the title character count, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If a rule is unclear or may have changed, write [CHECK: eBay help pages] rather than stating it as fact. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C03", "name": "Vinted pre-post check", "use": "you are about to post on Vinted.", "prompt": "Check my Vinted listing before I post. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, description, category, brand, size, condition, colour, material, photos described in a line each, price):\n[PASTE YOUR LISTING HERE]\n\nAm I selling my own second-hand things, or trading as a business? [OWN THINGS / BUSINESS]\n\nCurrent rule text I copied from Vinted's help pages or catalogue rules today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- The brand field and title show the real brand. No other brand names used to attract searches.\n- Nothing suggests replica, fake or counterfeit items.\n- Condition chosen matches the brief, and every flaw is described.\n- Photos: my own photos of this item in its current condition, whole item in the first photo, labels shown for branded items, every defect shown, no stock, watermarked or found-online images, no collages.\n- Size is given in UK sizing (or clearly labelled if it is a European or US size), with measurements where useful.\n- No request to pay or message outside Vinted, and no contact details.\n- If I said BUSINESS: remind me that Vinted says traders should use Vinted Pro, and that Pro sellers must accept returns within 14 days of receipt. Tell me to check the current Vinted Pro terms.\n\nOutput: numbered issues labelled Must fix, Should fix or Fine, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If unsure about a rule, write [CHECK: Vinted help pages]. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C04", "name": "Depop pre-post check", "use": "you are about to post on Depop.", "prompt": "Check my Depop listing before I post. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (description including any hashtags, category, brand, size, condition, colour, photos described in a line each, price, postage):\n[PASTE YOUR LISTING HERE]\n\nCurrent rule text I copied from Depop's help pages today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- The first line clearly says what the item is. Depop advises short, clear descriptions with measurements and signs of wear.\n- Hashtags: no more than 5, and each one relevant to this item (its brand, style or type). Flag unrelated brands or trend words used only to get views.\n- No other brand names used to attract searches, no \"dupe\", \"replica\", \"inspired by [BRAND]\" or similar.\n- Every flaw in the brief is described and photographed.\n- Photos: of the actual item, up to the app's current limit (8 at the time of writing).\n- Size in UK sizing or clearly labelled, with measurements.\n- No request to pay or message outside Depop, and no contact details or social handles.\n\nOutput: numbered issues labelled Must fix, Should fix or Fine, a count of hashtags, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If unsure about a rule, write [CHECK: Depop help pages]. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C05", "name": "Etsy pre-post check", "use": "you are about to post a handmade, vintage or craft supply listing on Etsy.", "prompt": "Check my Etsy listing before I post. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, the 13 tags, description, category, what type of item it is: handmade, vintage or craft supply, materials, photos described in a line each, price, postage, returns):\n[PASTE YOUR LISTING HERE]\n\nDid I use AI in making the item or its design? [NO / YES, HOW]\nDid I use AI to create or heavily edit the photos? [NO / YES, HOW]\n\nCurrent rule text I copied from Etsy's help pages or policies today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- Title is 140 characters or fewer. Count it. It reads as a clear description, not a list of repeated keywords.\n- 13 tags or fewer, each 20 characters or fewer. Count each. Flag repeated tags or tags that do not describe this item.\n- The item type (handmade, vintage, craft supply) fits the brief. Vintage on Etsy has an age requirement, so flag it as [CHECK: Etsy's current vintage rule] if the brief does not give an age.\n- If AI was used for the item or design, remind me that Etsy's rules expect this to be disclosed, and to check the current Creativity Standards for how.\n- Photos show what the buyer will actually receive. If photos are mockups or AI-assisted, flag that the listing must not mislead and to check Etsy's current rules.\n- No other brand names, characters or logos I do not have the right to use (for example a football club crest or a cartoon character on a handmade item).\n- Materials and any eco or health claims are backed by the brief.\n- Returns wording does not remove UK buyers' legal rights (see C11).\n\nOutput: numbered issues labelled Must fix, Should fix or Fine, the title character count, tag count and any tag over 20 characters, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If unsure about a rule, write [CHECK: Etsy help pages]. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C06", "name": "Amazon UK pre-post check", "use": "you are about to publish or update a product listing on Amazon UK.", "prompt": "Check my Amazon UK product listing before I publish. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief (product facts):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, Item Highlights if used, bullet points, description, backend search terms, main image described in a line, other images):\n[PASTE YOUR LISTING HERE]\n\nIs this a media product (books, music, video)? [YES / NO]\n\nCurrent rule text I copied from Seller Central today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- Title length: from 27 July 2026, Amazon announced titles of 75 characters or fewer including spaces for all categories except media. Count it and show the count. (Media titles have a longer limit, [CHECK: current limit].)\n- Item Highlights (if used): 125 characters or fewer.\n- Title: no special characters such as ! $ ? _ { } ^ ¬ ¦ unless part of the brand name. The same word no more than twice (little words like \"and\", \"for\", \"the\" do not count).\n- Title and bullets: no promotional phrases (\"best seller\", \"free delivery\", \"sale\", \"guaranteed\", \"top quality\"), no emojis, no refund or guarantee claims.\n- Nothing claimed that is not in the brief (materials, sizes, compatibility, certifications).\n- Backend search terms: do not repeat title words, no competitor brand names, not stuffed with irrelevant words. [CHECK: current byte limit in Seller Central.]\n- Main image: my description suggests a plain white background, product only, no text, logos or extra items not included.\n- Any health, safety or eco claim is flagged for C8.\n\nOutput: numbered issues labelled Must fix, Should fix or Fine, the title character count, repeated-word check, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If unsure about a rule, write [CHECK: Seller Central help]. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C07", "name": "TikTok Shop UK pre-post check", "use": "you are about to publish a product on TikTok Shop UK, or post a video that shows it.", "prompt": "Check my TikTok Shop UK product listing (and video script, if I include it) before I publish. Report problems, do not rewrite unless I ask.\n\nMy Listing Brief (product facts):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy product title, description, images described in a line each, and video script or captions (if any):\n[PASTE YOUR LISTING HERE]\n\nCurrent rule text I copied from TikTok Shop Seller University today (optional but best):\n[PASTE CURRENT RULE TEXT OR \"NONE\"]\n\nCheck against these points (our summary at the time of writing, September 2026; where my pasted rule text differs, follow the pasted text):\n- Title: at least 15 characters, accurate and concise (product type, material, key features, quantity, size). No promotions (\"x% off\"), no seller name or URL, no mention of TikTok or other platforms, no symbols or special characters.\n- No claims anywhere (title, description, images or video) that the product cures, treats, prevents or relieves any disease or condition.\n- No weight loss claims without diet and exercise, no before and after weight images, no \"easy\", \"guaranteed\" or \"permanent\" weight loss.\n- Images: square, the main image shows the front of the product, colour only, no text or watermarks other than product branding.\n- AI content: realistic AI images or video are labelled, and AI does not make the product look different from reality (texture, features, size).\n- Nothing claimed that is not in the brief. No fake urgency (\"only 2 left\" when untrue), no invented reviews or customer numbers.\n- The product itself is allowed. [CHECK: TikTok Shop UK's current prohibited and restricted products list.]\n\nOutput: numbered issues labelled Must fix, Should fix or Fine, the title character count, then a one-line verdict.\n\nRules: UK English. Only judge what I pasted. If unsure about a rule, write [CHECK: TikTok Shop Seller University]. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C08", "name": "Risky claims scan", "use": "your listing includes any claim about health, safety, the environment, quality, origin or popularity, on any platform.", "prompt": "Scan my listing for risky claims. List them, explain the risk in one line each, and suggest a safer, accurate alternative that uses only facts from my brief.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing:\n[PASTE YOUR LISTING HERE]\n\nPlatform: [PLATFORM]\nEvidence I actually hold (for example a certificate, a test report, a care label, a receipt): [LIST OR \"NONE\"]\n\nLook for these types of claim:\n1. Health and medical: cures, treats, prevents, heals, relieves, soothes a condition, boosts immunity, detox, weight loss, \"hypoallergenic\", \"antibacterial\", \"safe for babies\".\n2. Environmental: eco-friendly, sustainable, green, biodegradable, compostable, plastic-free, carbon neutral, \"natural\", \"non-toxic\". In the UK, environmental claims should be truthful, clear, specific and backed by evidence. Vague terms like \"eco-friendly\" are risky on their own.\n3. Authenticity and origin: genuine, authentic, 100% real, original, handmade (if not made by the seller), vintage (without an age), \"made in [COUNTRY]\", \"designer\".\n4. Quality and safety: waterproof, unbreakable, \"tested\", \"certified\", \"CE marked\", \"UKCA\", \"BPA-free\", \"fire resistant\".\n5. Popularity and urgency: best seller, most popular, \"everyone loves it\", \"only 1 left\" (if untrue), \"selling fast\", \"price going up\".\n6. Condition: \"like new\", \"perfect\", \"flawless\", \"as new\", \"mint\" (if the brief lists any wear).\n\nFor each claim found: quote it, name the type, rate it Must fix or Should fix, and suggest a replacement. If I have listed evidence that supports a claim, say it can stay, but tell me to keep the evidence and word it specifically (for example \"Cotton, 100%, per care label\" rather than \"natural\").\n\nRules: UK English. Do not invent evidence. Do not suggest a claim is fine just because it is common. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C09", "name": "Brands, authenticity and trademark wording", "use": "your item is branded, looks similar to a brand, or you are tempted to write \"genuine\", \"authentic\", \"style\", \"inspired by\" or \"dupe\".", "prompt": "Check the brand and authenticity wording in my listing.\n\nMy Listing Brief (including how I know the brand, for example label, receipt, serial number, where I bought it):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing:\n[PASTE YOUR LISTING HERE]\n\nPlatform: [PLATFORM]\n\nDo the following:\n1. List every brand, designer, character, team or trademark name in the listing.\n2. For each, say whether the brief shows the item is actually made by or officially licensed by that brand. If not, flag it Must fix.\n3. Flag any \"style\", \"inspired by\", \"look-alike\", \"dupe\", \"replica\", \"copy\", \"1:1\", \"mirror quality\" or \"same as [BRAND]\" wording. Explain that selling counterfeit or replica items is not allowed on any major platform and is illegal, and that using another brand's name to attract searches is against most platforms' rules even for a non-branded item. Suggest describing the item by its own features instead (for example \"black quilted crossbody bag with chain strap\").\n4. For \"genuine\" or \"authentic\": if the brief gives proof (receipt, authenticity card, serial number, bought from the brand), suggest stating the proof plainly instead (\"bought from [SHOP] in [YEAR], receipt included\"). If the brief gives no proof, suggest removing the word and relying on clear photos of labels and marks.\n5. If the item is handmade and uses a character, team crest or logo, flag that I may need permission from the rights holder. [CHECK: the platform's intellectual property rules.]\n\nRules: UK English. Never help word a listing so that a replica or counterfeit item appears genuine. If the brief suggests the item may be fake, tell me plainly not to list it as that brand. This is a checklist, not legal advice.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C10", "name": "Keyword stuffing check", "use": "your title, tags or description feel crammed, or you have pasted in a list of search words.", "prompt": "Check my listing for keyword stuffing and fix it with me.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, tags, hashtags, item specifics or search terms, description):\n[PASTE YOUR LISTING HERE]\n\nPlatform: [PLATFORM]\n\nFlag any of these, quoting the words:\n1. Words repeated in the title more than needed.\n2. Brand names, character names or product types that do not describe this item.\n3. Lists of search words at the end of the description (\"keywords: dress gown frock party wedding summer...\").\n4. Tags or hashtags that describe other items, trends or sizes this item is not.\n5. Misspellings added on purpose to catch searches.\n6. Size, colour or condition words that contradict the brief (for example \"S M L\" for a single size).\n\nThen suggest a cleaner version of the title and tags that uses only accurate words from the brief, within the platform's limits.\nPlatform limits I have checked today (optional): [PASTE OR \"NONE\"]\n\nRules: UK English. Only use facts from the brief. If you do not know the platform's current limit, write [CHECK: current limit]. Accurate words buyers actually search for are fine; the aim is relevance, not fewer words.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "C11", "name": "UK consumer law wording check", "use": "your listing or shop has returns, refunds or guarantee wording, or you are not sure whether you are selling as a private seller or a business.", "prompt": "Check the returns, refunds and guarantee wording in my listing or shop policy against UK consumer law basics. This is a practical check, not legal advice.\n\nI sell as a: [PRIVATE SELLER CLEARING MY OWN THINGS / I BUY TO RESELL / I MAKE ITEMS TO SELL / NOT SURE]\nPlatform: [PLATFORM]\nMy returns, refunds or guarantee wording:\n[PASTE WORDING]\nMy listing (for context):\n[PASTE YOUR LISTING HERE]\n\nDo the following:\n1. Seller status: if I said \"I buy to resell\" or \"I make items to sell\", explain that I am likely to be treated as a trader under consumer law, even on a personal account, and should check gov.uk guidance. If \"NOT SURE\", list the kind of factors HMRC and consumer law look at (such as buying to resell, regularity, profit motive) and tell me to check gov.uk. Do not decide for me.\n2. If I am a trader, flag any wording that tries to remove or limit buyers' legal rights, such as \"no refunds\", \"no returns under any circumstances\", \"sold as seen\" or \"buyer pays all return costs even if faulty\". Explain in plain words that UK buyers from traders generally have:\n   - a right to goods that are of satisfactory quality, fit for purpose and as described;\n   - a short-term right to reject faulty goods, generally within 30 days;\n   - for most online orders, a right to cancel within 14 days of delivery, with some exceptions (for example personalised or made-to-order items).\n3. If I am a private seller, explain that the item must still be as described, that a \"no returns\" policy covers change of mind only, and that platform buyer protection can still apply if the item is not as described, faulty or damaged.\n4. Flag any guarantee or warranty I offer that is vague (\"guaranteed quality\"), and suggest a clear version or removing it.\n5. Suggest fair, clear replacement wording for my status.\n\nRules: UK English. Never suggest wording that denies legal rights. Mark this clearly as not legal advice, and tell me to check gov.uk, Citizens Advice and the platform's current help pages.", "module": "09 Rule checker", "file": "09-rule-checker.md"}, {"id": "W01", "name": "Build your reusable \"shop style\" instruction", "use": "you are fed up of re-explaining your shop to the AI every time. Do this once, save the result, and paste it at the start of every session.", "prompt": "Help me write a short, reusable \"shop style instruction\" I can paste at the start of any AI chat before I list items. Write in UK English.\n\nHere are my answers:\n- Platforms I sell on: [E.G. VINTED AND EBAY UK]\n- What I mostly sell: [E.G. WOMEN'S CLOTHING SIZES 8 TO 18, SOME HOMEWARE]\n- Am I a private seller or a business? [PRIVATE / BUSINESS]\n- My tone: [E.G. FRIENDLY AND PLAIN, NO EMOJIS / A FEW EMOJIS OK ON DEPOP]\n- How I describe condition: [E.G. NEW WITH TAGS / NEW WITHOUT TAGS / VERY GOOD / GOOD / SATISFACTORY]\n- How I measure: [E.G. PIT TO PIT AND LENGTH IN CM, LAID FLAT]\n- My postage: [E.G. POSTED WITHIN 2 WORKING DAYS, SMOKE-FREE HOME, PET-FREE HOME, ONLY IF TRUE]\n- My returns line: [E.G. \"PRIVATE SELLER: I DON'T ACCEPT RETURNS FOR CHANGE OF MIND, BUT YOU'RE COVERED IF THE ITEM ISN'T AS DESCRIBED\" OR THE BUSINESS RETURNS POLICY]\n- Words or things I never want: [E.G. \"STUNNING\", \"RARE\" UNLESS IT IS, EMOJIS IN TITLES]\n- Anything else: [E.G. ALWAYS LIST FLAWS FIRST IN THE CONDITION SECTION]\n\nTurn this into a numbered instruction of no more than 15 lines that starts with \"You are my listing assistant for a UK shop.\" It must include these fixed rules:\n- Use UK English spelling, UK sizes and £.\n- Only use facts I give you in each Listing Brief. Never invent brand, size, material, measurements, age, condition or included items.\n- Where something is missing, write [CHECK: what is missing] instead of guessing.\n- Respect each platform's title and description limits. For eBay UK, keep titles to 80 characters or fewer.\n- No hype words, no keyword stuffing, no misleading claims, no health or medical claims, no fake urgency, no mentions of other platforms in a listing, and never suggest payment outside the platform.\n- Always state flaws clearly.\nKeep it short enough to fit in a phone note.", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W02", "name": "Start a batch session (list up to 10 items in one chat)", "use": "you have a pile of items photographed and noted, and want to list them in one sitting.", "prompt": "[PASTE YOUR SHOP STYLE INSTRUCTION FROM W1]\n\nWe are going to list [NUMBER, UP TO 10] items in this chat. Platform for this batch: [EBAY UK / VINTED / DEPOP / ETSY].\n\nHow this works:\n- I will paste one Listing Brief at a time, each starting with \"ITEM [NUMBER]\".\n- For each item, reply with: Title, Description, Condition line, [ITEM SPECIFICS FOR EBAY / TAGS FOR ETSY / HASHTAGS FOR DEPOP / NOTHING EXTRA FOR VINTED], and a list of any [CHECK: ...] items.\n- Keep the same layout for every item so I can copy quickly on my phone.\n- Do not carry facts from one item to another. Each item uses only its own brief.\n- Do not add a price unless I include one in the brief.\n- When I type \"DONE\", stop and wait for my next instruction.\n\nReply with \"Ready for ITEM 1\" and nothing else.", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W03", "name": "Turn messy notes for 10 items into Listing Briefs in one go", "use": "you have scribbled quick notes for a stack of items and want them turned into proper briefs before you start W2.", "prompt": "Write in UK English.\n\nBelow are my rough notes for [NUMBER] items, one line or short paragraph each. Turn each one into a Listing Brief using exactly these headings:\nItem number | What it is | Brand | Size | Measurements | Colour | Material | Condition and flaws | What's included | Platform | Postage | Price floor\n\nRules:\n- Only use what is in my notes. Do not guess brand, size, material, age or value.\n- Where a heading has no information, write [CHECK: ...] with a short prompt of what I need to find (for example [CHECK: look at care label for material]).\n- If a note mentions a flaw, it must appear in \"Condition and flaws\".\n- Keep each brief to one short block so I can check it on my phone.\n- At the end, give me one combined \"to find\" list grouped by item, so I can check everything in one trip to the pile.\n\nMy notes:\n[PASTE YOUR NOTES]", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W04", "name": "Batch output as a table or CSV for bulk upload tools", "use": "you have finished a batch and want it in a spreadsheet, or in a CSV to import into a bulk listing or cross-listing tool.", "prompt": "Take all the items we have written in this chat and put them into one table.\n\nColumns (in this order): [PASTE THE COLUMN HEADERS YOUR TOOL OR SPREADSHEET USES, OR USE: SKU, Title, Description, Condition, Brand, Size, Colour, Material, Category, Price, Quantity, Postage]\n\nRules:\n- One row per item. Use the exact facts already agreed in this chat. Do not add or change anything.\n- Leave a cell as [CHECK] if the fact is missing. Do not guess.\n- If I ask for CSV: output plain CSV in a single code block, comma-separated, with every cell wrapped in double quotes. Replace any line breaks inside descriptions with a space. Replace any double quote inside a cell with two double quotes.\n- Use UK English and £ with no currency symbol in the Price column (numbers only, for example 12.50).\n- After the table or CSV, list any rows that still contain [CHECK].\n\nOutput format: [TABLE / CSV]", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W05", "name": "Batch accuracy check before you post", "use": "you have a batch of listings ready and want a second pair of eyes to spot invented details, missing flaws and rule problems.", "prompt": "Act as a careful UK listings checker. Write in UK English.\n\nBelow are my Listing Briefs (the facts) and then the listings written from them. For each item, compare the listing with its brief and report:\n1. Any detail in the listing that is NOT in the brief (possible invention).\n2. Any flaw in the brief that is missing or softened in the listing.\n3. Title length problems (eBay UK: over 80 characters; other platforms: [CHECK: the platform's current limit]).\n4. Hype words, keyword stuffing (the same word repeated, lists of unrelated brands), misleading claims, health claims, fake urgency or other platform names.\n5. American spellings or US sizes where a UK one is needed.\n\nGive one short row per item: Item number | Problems found | Suggested fix. If an item is fine, write \"No problems found\".\nDo not rewrite whole listings unless I ask.\n\nBRIEFS:\n[PASTE BRIEFS]\n\nLISTINGS:\n[PASTE LISTINGS]", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W06", "name": "Weekly listing routine planner", "use": "you want a realistic weekly plan that fits your evenings and weekends, so listing does not pile up.", "prompt": "Help me plan a weekly listing routine. Write in UK English. Be realistic, not motivational.\n\nMy situation:\n- Time I have: [E.G. MONDAY AND WEDNESDAY EVENINGS 1 HOUR, SATURDAY MORNING 2 HOURS]\n- Roughly how many items I want to list each week: [NUMBER]\n- Platforms: [LIST]\n- Where I get stock: [E.G. OWN WARDROBE, CAR BOOTS, CHARITY SHOPS, MY OWN HANDMADE ITEMS]\n- What slows me down most: [E.G. PHOTOS, MEASURING, WRITING, POSTING PARCELS]\n- Post office or drop-off times near me: [E.G. LOCKER AVAILABLE 24 HOURS]\n\nGive me:\n1. A day-by-day plan in a table: Day, Time, Task, Roughly how many items, Tools or prompts to use (refer to prompt IDs like W2, W4, R prompts for pricing, M prompts for messages).\n2. Batch tasks together (all photos in one go, all measuring in one go, all writing in one AI session).\n3. A 10-minute daily check for messages and dispatch.\n4. A weekly 20-minute review: what sold, what has had no interest for a while, what to refresh or reprice.\nKeep it simple enough to follow on a phone. Do not promise any sales results.", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W07", "name": "Repurpose one listing across platforms", "use": "you have written a good listing for one platform and want versions for others without starting again.", "prompt": "[PASTE YOUR SHOP STYLE INSTRUCTION FROM W1, IF YOU HAVE ONE]\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF]\n\nHere is the listing I already wrote for [PLATFORM]:\n[PASTE THE LISTING]\n\nRewrite it for: [LIST TARGET PLATFORMS, E.G. VINTED, DEPOP, ETSY]\n\nFor each platform, give me what that platform needs:\n- eBay UK: title of 80 characters or fewer, description, item specifics list.\n- Vinted: short plain title, description with measurements and condition.\n- Depop: description that starts with the key details, plus up to 5 relevant hashtags.\n- Etsy: title (plain and readable, most important words first), description, and up to 13 tags of 20 characters or fewer. Only for handmade, vintage (20 years or older) or craft supplies items.\n- Amazon UK: title of 75 characters or fewer for most categories (Amazon's rule from 27 July 2026; media categories differ), an Item Highlights line of 125 characters or fewer, no banned symbols (! $ ? _ { } ^ ¬ ¦ unless part of the brand), no word more than twice, up to 5 bullet points, description.\n- TikTok Shop UK: title with no symbols, promo words or platform names, and a short description of at least 30 words.\n\nRules:\n- Only use facts from the brief. The facts must be the same on every platform. Change the format and tone, not the facts.\n- Write [CHECK: ...] for anything a platform needs that is not in the brief.\n- Do not mention any other platform inside a listing, and never suggest buying or paying elsewhere.\n- No hype, no keyword stuffing, no misleading or health claims.\n- Tell me if the item looks unsuitable for a platform (for example, not handmade or vintage for Etsy, or a used item for a new-only listing) instead of forcing it.", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W08", "name": "Refresh a batch of quiet listings", "use": "some listings have had little interest for a couple of weeks and you want to improve them honestly, without keyword stuffing or fake price tricks.", "prompt": "Write in UK English.\n\nBelow are [NUMBER] listings that have had little interest. For each one I have added the Listing Brief, the current title and description, how long it has been listed, and any views, likes or watchers I can see.\n\n[FOR EACH ITEM PASTE: BRIEF / CURRENT TITLE / CURRENT DESCRIPTION / DAYS LISTED / VIEWS, LIKES OR WATCHERS]\n\nFor each item, suggest:\n1. A clearer title (using words a buyer would actually search for, most important first, within the platform's limit).\n2. The top 1 or 2 fixes to the description (missing measurements, unclear condition, missing brand or size).\n3. Photo fixes to try (for example daylight, plain background, label close-up, flaw close-up).\n4. Whether a price check is worth doing, and what sold listings I should look up myself to compare (describe the search, do not invent prices).\n\nRules: only use facts from the brief; [CHECK: ...] for missing facts; no keyword stuffing, no \"rare\" or \"vintage\" unless the brief supports it, no fake discounts, no misleading claims. Do not promise it will sell.", "module": "10 Batch workflow", "file": "10-batch-workflow.md"}];let mod="";const q=document.getElementById('q'),list=document.getElementById('list'),cnt=document.getElementById('cnt');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){const t=q.value.toLowerCase().trim();const f=P.filter(p=>(!mod||p.module===mod)&&(!t||(p.id+' '+p.name+' '+p.use+' '+p.prompt).toLowerCase().includes(t)));
cnt.textContent=f.length+' prompt'+(f.length==1?'':'s');
list.innerHTML=f.map((p,i)=>`<div class="card"><div class="mod">${esc(p.module)}</div><h3><span class="id">${p.id}</span>${esc(p.name)}</h3>${p.use?`<p class="use">${esc(p.use)}</p>`:''}<pre><code>${esc(p.prompt)}</code></pre><button class="copy" data-i="${P.indexOf(p)}">Copy prompt</button></div>`).join('');}
list.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const txt=P[+b.dataset.i].prompt;
const ok=()=>{b.textContent='Copied';b.classList.add('done');setTimeout(()=>{b.textContent='Copy prompt';b.classList.remove('done')},1500)};
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt,ok))}else fallback(txt,ok)});
function fallback(txt,ok){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){alert('Press and hold the prompt text to copy it.')}a.remove()}
