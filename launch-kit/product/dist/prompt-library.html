fact per line.\n3. \"What's included\", then \"Size and specs\" (dimensions, weight, capacity, materials), then \"Care\" if the brief gives it.\n\nRules:\n- At least 30 words, aim for under 500 characters.\n- Only facts from the brief. Missing facts become [CHECK: ...]. Never invent materials, certifications, dimensions or safety standards.\n- No health or medical claims (cure, treat, prevent, relieve, detox, antibacterial), \"clinically proven\", \"best\", brand comparisons, guarantees or fake urgency.\n- No vague green claims (\"eco-friendly\") without a specific, checkable fact.\n- No other platforms or payment outside TikTok Shop. No emoji unless I ask.\n- Then list every phrase that could count as a claim, so I can check it.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V05", "name": "TikTok Shop claims check and safe rewrite", "use": "You have product copy or a video script and want to catch risky claims before TikTok Shop or a buyer does.", "prompt": "Check this TikTok Shop UK copy or video script line by line. UK English.\n\nTable columns: Original wording, Why it might be a problem, Safer rewrite.\n\nFlag anything that:\n- makes or implies a health or medical claim (cure, heal, treat, prevent, relieve, detox, pain relief, anti-ageing results);\n- makes a result or performance claim the brief does not support;\n- uses \"best\", \"number one\", \"better than\" or compares with a named brand;\n- uses fake urgency or a discount that is not real;\n- makes vague green or safety claims (eco-friendly, non-toxic, 100% safe) without a fact in the brief;\n- mentions TikTok or another platform in a title, or sends buyers elsewhere to pay;\n- states a fact not in the brief (mark [CHECK: ...]).\n\nThen give the full cleaned-up version, adding no new claims. This is a check, not legal advice.\n\nCopy or script to check:\n[PASTE TITLE, DESCRIPTION, CAPTION OR SCRIPT]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "V06", "name": "Live-selling run-sheet", "use": "You are planning a TikTok Shop LIVE, or any live selling session, and want a calm, honest plan without showing your face.", "prompt": "Plan a faceless live selling session (hands and products only, voice or on-screen text). UK English.\n\nLength: [30 / 45 / 60] minutes\nPlatform: [TIKTOK SHOP LIVE / OTHER]\nProducts (short brief for each: name, price, key facts, flaws):\n[PASTE PRODUCTS]\nA real offer I am running (only if genuine): [E.G. \"BUY 2 GET FREE POSTAGE\" OR \"NONE\"]\n\nRun-sheet table: Time, Segment, On camera, What I say or show, Notes. Include a 2-minute welcome (what we are showing and how to buy through the platform's checkout), one segment per product (facts, flaws, scale, price), a questions slot every 10 to 15 minutes, and a 2-minute wrap-up.\n\nAlso give me:\n- 6 short honest answers to common questions (size, postage time, returns, \"is it genuine\", \"can you do cheaper\", \"can I pay another way\"). Returns answers respect UK consumer rights and the platform's policy. Payment only through the platform.\n- A \"do not say\" list: health claims, \"best\", fake countdowns or stock levels, invented discounts, other platform names, paying or messaging off the platform.\n\nOnly use facts I pasted. [CHECK: ...] for anything missing.", "module": "Module 08: Video and TikTok Shop", "file": "08-video-and-tiktok-shop.md"}, {"id": "C01", "name": "Accuracy check: listing against brief", "use": "Every time, on every platform, before you post.", "prompt": "Check my listing for accuracy against my Listing Brief. You are a careful proofreader, not a copywriter. Do not rewrite unless I ask.\n\nReport, as a short list:\n1. Added facts: anything in the listing NOT in the brief (a material, size, year, \"original box\", \"never worn\").\n2. Changed facts: anything that differs from the brief.\n3. Missing or softened flaws: every flaw in the brief must appear, worded no more mildly.\n4. Missing essentials that are in the brief (measurements, what is included, postage).\n5. Misleading wording, even if technically true (\"like new\" for an item with wear).\n6. American spellings or US sizes.\n\nLabel each point Must fix, Should fix or Fine, then a verdict: \"Ready to post\" or \"Fix first\". UK English. If unsure, write [CHECK: ...].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, description, specifics or tags, condition, price, postage):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C02", "name": "eBay UK pre-post check", "use": "You are about to post on eBay UK.", "prompt": "Check my eBay UK listing before I post. Report problems, do not rewrite.\n\nI sell as a: [PRIVATE SELLER / BUSINESS SELLER]\neBay rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- Title 80 characters or fewer including spaces. Show the count.\n- Plain words: no shouting capitals, \"L@@K\", hype or keyword lists.\n- No other brand's name, and no \"style\", \"inspired by\" or \"dupe\" next to one. Nothing suggesting a replica.\n- Specifics and condition match the brief; every flaw is described.\n- Photos of the actual item, no added text, borders or watermarks.\n- No contact details or dealing outside eBay.\n- Business seller: nothing implying buyers have no rights.\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If a rule may have changed, write [CHECK: eBay help pages].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, specifics, condition, description, photos in a line each, price, postage, returns):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C03", "name": "Vinted pre-post check", "use": "You are about to post on Vinted.", "prompt": "Check my Vinted listing before I post. Report problems, do not rewrite.\n\nSelling my own things, or trading as a business? [OWN THINGS / BUSINESS]\nVinted rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- Brand field and title show the real brand only. Nothing suggesting a replica.\n- Condition matches the brief; every flaw is described.\n- Photos: my own, current condition, whole item first, labels on branded items, every defect. No stock, found-online or watermarked images, no collages.\n- UK size (or clearly labelled), with measurements where useful.\n- No contact details or paying or messaging outside Vinted.\n- If BUSINESS: remind me Vinted says traders should use Vinted Pro, whose sellers must accept returns within 14 days of receipt.\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If unsure, write [CHECK: Vinted help pages].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, description, fields, photos in a line each, price):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C04", "name": "Depop pre-post check", "use": "You are about to post on Depop.", "prompt": "Check my Depop listing before I post. Report problems, do not rewrite.\n\nDepop rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- The first line says clearly what the item is. Short, clear description with measurements and signs of wear.\n- 5 hashtags or fewer, each relevant. Show the count. Flag unrelated brands or trend words.\n- No other brand names, \"dupe\", \"replica\" or \"inspired by [BRAND]\".\n- Every flaw in the brief described in plain words.\n- Photos of the actual item, within the app's limit (8 when we checked).\n- UK size or clearly labelled, with measurements.\n- No contact details, social handles or paying outside Depop.\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If unsure, write [CHECK: Depop help pages].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (description with hashtags, fields, photos in a line each, price):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C05", "name": "Etsy pre-post check", "use": "You are about to post a handmade, vintage or craft supply listing on Etsy.", "prompt": "Check my Etsy listing before I post. Report problems, do not rewrite.\n\nWho made it and how: [E.G. \"I THROW AND GLAZE EACH ONE\"]\nDid I use AI in making the item, its design or the photos? [NO / YES, HOW]\nEtsy rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- Title 140 characters or fewer, readable. Show the count.\n- Up to 13 tags, each 20 characters or fewer. Count each. Flag repeats and tags that do not fit.\n- Item type fits the brief. Vintage with no age: [CHECK: Etsy's vintage rule].\n- AI used in the item, design or photos: the description says so (Creativity Standards).\n- Hand words (handmade, hand-poured) match who made it.\n- Photos show what the buyer receives; mockups must not mislead.\n- No brands, characters or crests I have no right to use.\n- Materials, eco and health claims backed by the brief. Returns wording keeps UK buyers' rights (see C10).\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If unsure, write [CHECK: Etsy help pages].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, tags, description, item type, photos in a line each, returns):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C06", "name": "Amazon UK pre-post check", "use": "You are about to publish or update an Amazon UK product listing. Skip this if you only sell second-hand.", "prompt": "Check my Amazon UK product listing before I publish. Report problems, do not rewrite.\n\nMedia product (books, music, video)? [YES / NO]\nSeller Central rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- Title 75 characters or fewer including spaces for non-media (from 27 July 2026). Show the count. Media: [CHECK: current limit].\n- Item Highlights 125 characters or fewer.\n- Title: no ! $ ? _ { } ^ ¬ ¦ unless in the brand, no word more than twice (small words excepted).\n- No promotional phrases, emoji, or refund and guarantee claims.\n- Nothing claimed that is not in the brief (materials, sizes, compatibility, certifications).\n- Search terms: no title words, competitor brands or irrelevant words. [CHECK: byte limit.]\n- Main image: plain white background, product only.\n- Flag any health, safety or eco claim for C08.\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If unsure, write [CHECK: Seller Central help].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing (title, Item Highlights, bullets, description, search terms, images in a line each):\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C07", "name": "TikTok Shop UK pre-post check", "use": "You are about to publish a product on TikTok Shop UK, or a video that shows it. Skip this if you only sell second-hand on the resale apps.", "prompt": "Check my TikTok Shop UK listing (and video script, if included) before I publish. Report problems, do not rewrite.\n\nSeller Center rule text I copied today (optional): [PASTE OR \"NONE\"]\n\nCheck (pasted rule text wins if different):\n- Title at least 15 characters, accurate. No promotions, seller name, web address, platform names or symbols.\n- No claim anywhere that it cures, treats, prevents or relieves any condition. No weight loss claims or before and after images.\n- Images: square, front of product first, colour, no text or watermarks beyond product branding.\n- Realistic AI images or video labelled, and not changing how the product looks.\n- Nothing claimed that is not in the brief. No fake urgency or invented reviews.\n- The product is allowed: [CHECK: prohibited and restricted products lists].\n\nLabel issues Must fix, Should fix or Fine, then a verdict. UK English. If unsure, write [CHECK: Seller Center].\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy title, description, images in a line each, and any video script:\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C08", "name": "Risky claims scan", "use": "Your listing claims anything about health, safety, the environment, quality, origin or popularity, on any platform.", "prompt": "Scan my listing for risky claims. For each: quote it, name the type, rate it Must fix or Should fix, and suggest an accurate alternative from my brief.\n\nPlatform: [PLATFORM]\nEvidence I hold (certificate, test report, care label, receipt): [LIST OR \"NONE\"]\n\nTypes:\n1. Health: cures, heals, relieves, soothes, detox, hypoallergenic, antibacterial, \"safe for babies\".\n2. Environmental: eco-friendly, sustainable, biodegradable, plastic-free, natural, non-toxic. UK green claims must be clear, specific and backed by evidence.\n3. Authenticity and origin: genuine, authentic, handmade (if not by me), vintage (no age), \"made in [COUNTRY]\", designer.\n4. Quality and safety: waterproof, unbreakable, tested, certified, CE or UKCA, BPA-free.\n5. Popularity and urgency: best seller, \"only 1 left\" (if untrue), selling fast.\n6. Condition: like new, perfect, flawless, mint (if the brief lists wear).\n\nIf my evidence supports a claim, it can stay, worded specifically (\"100% cotton, per care label\", not \"natural\"). UK English. Do not invent evidence or approve a claim because it is common. Not legal advice.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing:\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C09", "name": "Brands, authenticity and trademark wording", "use": "Your item is branded, looks like a brand, or you are tempted to write \"genuine\", \"authentic\", \"style\", \"inspired by\" or \"dupe\".", "prompt": "Check the brand and authenticity wording in my [PLATFORM] listing.\n\n1. List every brand, designer, character, team or trademark name in it.\n2. For each, say whether the brief shows the item is made or licensed by that brand. If not: Must fix.\n3. Flag \"style\", \"inspired by\", \"dupe\", \"replica\", \"1:1\" or \"same as [BRAND]\". Counterfeits are illegal and banned on every major platform, and using another brand's name for searches is against most platforms' rules. Suggest describing the item by its own features.\n4. \"Genuine\" or \"authentic\": if the brief gives proof (receipt, bought from the brand), state the proof plainly. If not, remove the word and rely on clear photos of labels.\n5. Handmade items with a character, crest or logo: I may need the rights holder's permission [CHECK: the platform's intellectual property rules].\n\nUK English. Never help a replica appear genuine. If the brief suggests it may be fake, tell me plainly not to list it as that brand. Not legal advice.\n\nMy Listing Brief (including how I know the brand):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy listing:\n[PASTE YOUR LISTING HERE]", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C10", "name": "UK consumer law wording check", "use": "Your listing or shop has returns, refunds or guarantee wording, or you are not sure whether you are a private seller or a business.", "prompt": "Check my returns, refunds and guarantee wording against UK consumer law basics. A practical check, not legal advice.\n\nI sell as a: [PRIVATE SELLER CLEARING MY OWN THINGS / I BUY TO RESELL / I MAKE ITEMS TO SELL / NOT SURE]\nPlatform: [PLATFORM]\nMy wording:\n[PASTE WORDING]\n\n1. Status: buying to resell or making to sell means I am likely a trader, even on a personal account. If NOT SURE, list the factors looked at (buying to resell, how often, profit motive) and tell me to check gov.uk. Do not decide for me.\n2. Trader: flag wording that limits buyers' rights (\"no refunds\", \"sold as seen\", \"buyer pays return costs even if faulty\"). Buyers from traders generally have goods of satisfactory quality, fit for purpose and as described; a short-term right to reject faulty goods, generally within 30 days; and for most online orders a 14-day right to cancel, with exceptions such as personalised items.\n3. Private seller: the item must still be as described, \"no returns\" covers change of mind only, and platform protection can still apply.\n4. Flag vague guarantees (\"guaranteed quality\").\n5. Suggest fair, clear replacement wording for my status.\n\nUK English. Never suggest wording that denies legal rights. Tell me to check gov.uk, Citizens Advice and the platform's help pages.", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "C11", "name": "Product safety and label details (makers)", "use": "You make and sell your own products (candles, ceramics, jewellery, textiles, toys, cosmetics) and want the safety text and label details gathered before you list.", "prompt": "I make and sell [PRODUCT] in the UK on [PLATFORM(S)]. Help me gather its safety and label details. A practical checklist, not legal advice.\n\nMaterials and components: [LIST]\nWho it is for: [ADULTS / COULD APPEAL TO CHILDREN / MADE FOR CHILDREN]\nWarnings and instructions from my suppliers (paste exactly): [TEXT OR \"NONE\"]\nWhat my label or packaging says now: [TEXT OR \"NO LABEL\"]\nMy business name and address on the product or packaging? [YES / NO]\nProduct or batch reference: [REFERENCE OR \"NONE\"]\nPost to Northern Ireland or the EU? [YES / NO]\n\nGive me:\n1. A \"Safety information\" block for my listing, using ONLY the supplier and label text above, word for word. Gaps become [CHECK: ...].\n2. A label checklist: what my label already has, and what is missing, as questions.\n3. Up to 6 questions to check on GOV.UK for this product type. If I post to Northern Ireland or the EU, include whether the EU General Product Safety Regulation (GPSR) applies to me.\n\nRules: UK English. State no law, standard or certification as fact. Never write \"safe\", \"non-toxic\", \"child-safe\", CE or UKCA unless my supplier text says so. If it could appeal to children but is not made for them, flag it.", "module": "Module 09: Rule checker", "file": "09-rule-checker.md"}, {"id": "W01", "name": "Build your reusable \"shop style\" instruction", "use": "You are fed up of re-explaining your shop to the AI. Do this once, save the result, and paste it at the start of every session.", "prompt": "Write me a short, reusable \"shop style instruction\" to paste at the start of any AI chat before I list items. UK English, no more than 12 numbered lines, starting \"You are my listing assistant for a UK shop.\"\n\nMy answers:\n- Platforms: [E.G. VINTED AND EBAY UK]\n- What I mostly sell: [E.G. WOMEN'S CLOTHING, SIZES 8 TO 18]\n- Private seller or business: [PRIVATE / BUSINESS]\n- Tone: [E.G. FRIENDLY AND PLAIN, NO EMOJI]\n- Condition words I use: [E.G. NEW WITH TAGS / VERY GOOD / GOOD / SATISFACTORY]\n- How I measure: [E.G. PIT TO PIT AND LENGTH IN CM, LAID FLAT]\n- Postage line: [E.G. \"POSTED WITHIN 2 WORKING DAYS\"; ADD SMOKE-FREE OR PET-FREE ONLY IF TRUE]\n- Words I never want: [E.G. \"STUNNING\", \"RARE\" UNLESS IT IS]\n\nIt must include these fixed rules: UK English, UK sizes and £. Only facts from each Listing Brief; never invent brand, size, material, measurements, age, condition or contents. Missing facts become [CHECK: what is missing]. eBay UK titles 80 characters or fewer. State flaws clearly. No hype, keyword stuffing, misleading or health claims, fake urgency, other platform names, or payment outside the platform.", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W02", "name": "Start a batch session (list up to 10 items in one chat)", "use": "You have a pile of items photographed and noted, and want to list them in one sitting.", "prompt": "[PASTE YOUR SHOP STYLE INSTRUCTION FROM W01]\n\nWe are going to list [NUMBER, UP TO 10] items in this chat. Platform for this batch: [EBAY UK / VINTED / DEPOP / ETSY].\n\nHow this works:\n- I will paste one Listing Brief at a time, each starting \"ITEM [NUMBER]\".\n- For each, reply with: Title, Description, Condition line, [ITEM SPECIFICS FOR EBAY / TAGS FOR ETSY / HASHTAGS FOR DEPOP / FIELDS FOR VINTED], and a list of [CHECK: ...] items.\n- Same layout every time so I can copy quickly on my phone.\n- Never carry facts from one item to another.\n- No price unless the brief includes one.\n- When I type \"DONE\", stop and wait.\n\nReply \"Ready for ITEM 1\" and nothing else.", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W03", "name": "Turn messy notes for 10 items into Listing Briefs in one go", "use": "You have quick notes for a stack of items and want proper briefs before you start W02.", "prompt": "Turn my rough notes for [NUMBER] items into Listing Briefs. UK English.\n\nHeadings for each: Item number | What it is | Brand | Size | Measurements | Colour | Material | Condition and flaws | Included | Platform | Postage | Price floor\n\nRules:\n- Only what is in my notes. Do not guess brand, size, material, age or value.\n- Empty headings get [CHECK: ...] with what to find (e.g. [CHECK: care label for material]).\n- Every flaw mentioned goes in \"Condition and flaws\".\n- One short block per item. At the end, one combined \"to find\" list grouped by item, so I can check everything in one trip to the pile.\n\nMy notes:\n[PASTE YOUR NOTES HERE]", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W04", "name": "Batch output as a table or CSV for bulk upload tools", "use": "You have finished a batch and want it in a spreadsheet, or a CSV to import into a bulk listing or cross-listing tool.", "prompt": "Put all the items we have written in this chat into one table.\n\nColumns, in this order: [PASTE YOUR TOOL'S COLUMN HEADERS, OR WRITE \"DEFAULT\"]\n(DEFAULT means: SKU, Title, Description, Condition, Brand, Size, Colour, Material, Category, Price, Quantity, Postage.)\n\nRules:\n- One row per item. Use the facts already agreed in this chat. Do not add or change anything.\n- Missing facts: [CHECK]. Do not guess.\n- For CSV: one code block, comma-separated, every cell in double quotes, line breaks inside cells replaced with a space, any double quote inside a cell doubled.\n- Price column: numbers only, e.g. 12.50.\n- Afterwards, list any rows that still contain [CHECK].\n\nOutput format: [TABLE / CSV]", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W05", "name": "Batch accuracy check before you post", "use": "You have a batch of listings ready and want a second pair of eyes to spot invented details, missing flaws and rule problems.", "prompt": "Act as a careful UK listings checker. For each item, compare the listing with its brief and report:\n1. Any detail NOT in the brief (possible invention).\n2. Any flaw in the brief that is missing or softened.\n3. Title length problems (eBay UK over 80 characters; other platforms [CHECK: current limit]).\n4. Hype, keyword stuffing, misleading or health claims, fake urgency or other platform names.\n5. American spellings or US sizes.\n\nOne short row per item: Item number | Problems found | Suggested fix. If fine, write \"No problems found\". Do not rewrite whole listings. UK English.\n\nBRIEFS:\n[PASTE BRIEFS]\n\nLISTINGS:\n[PASTE LISTINGS]", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W06", "name": "Weekly listing routine planner", "use": "You want a realistic weekly plan that fits your evenings and weekends, so listing does not pile up.", "prompt": "Help me plan a weekly listing routine. UK English. Realistic, not motivational.\n\n- Time I have: [E.G. MONDAY AND WEDNESDAY EVENINGS 1 HOUR, SATURDAY MORNING 2 HOURS]\n- Items I want to list each week: [NUMBER]\n- Platforms: [LIST]\n- What slows me down most: [E.G. PHOTOS, MEASURING, WRITING, POSTING]\n- Drop-off options near me: [E.G. LOCKER, 24 HOURS]\n\nGive me:\n1. A day-by-day table: Day, Time, Task, Roughly how many items, Prompts to use (by ID, e.g. W02, W05, R prompts, M prompts).\n2. Batch similar tasks: all photos in one go, all measuring in one go, all writing in one AI session.\n3. A 10-minute daily check for messages and dispatch.\n4. A weekly 20-minute review: what sold, what has had no interest, what to refresh or reprice.\n\nSimple enough to follow on a phone. Do not promise any sales results.", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W07", "name": "Repurpose one listing across platforms", "use": "You have a good listing for one platform and want versions for others without starting again.", "prompt": "[PASTE YOUR SHOP STYLE INSTRUCTION FROM W01, IF YOU HAVE ONE]\n\nHere is the listing I wrote for [PLATFORM]:\n[PASTE THE LISTING]\n\nRewrite it for: [TARGET PLATFORMS, E.G. VINTED, DEPOP]\n\nGive each platform what it needs:\n- eBay UK: title of 80 characters or fewer, description, item specifics.\n- Vinted: short plain title, description with measurements and condition, field values.\n- Depop: description starting with the key details, up to 5 relevant hashtags.\n- Etsy (handmade, vintage of 20 years or more, or craft supplies only): readable title under 140 characters, description, 13 tags of 20 characters or fewer.\n\nRules:\n- Same facts on every platform, from the brief only. Change format and tone, not facts.\n- Missing facts become [CHECK: ...].\n- No other platform named inside a listing. No hype, stuffing or misleading claims.\n- Tell me if the item does not suit a platform instead of forcing it.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}, {"id": "W08", "name": "Refresh a batch of quiet listings", "use": "Some listings have had little interest for a couple of weeks and you want to improve them honestly, without stuffing or fake price tricks.", "prompt": "Below are [NUMBER] listings that have had little interest. For each I have added the Listing Brief, current title and description, days listed, and any views, likes or watchers.\n\n[FOR EACH ITEM PASTE: BRIEF / TITLE / DESCRIPTION / DAYS LISTED / VIEWS, LIKES OR WATCHERS]\n\nFor each item suggest:\n1. A clearer title using words buyers search, most important first, within the platform's limit.\n2. The top 1 or 2 description fixes (missing measurements, unclear condition, missing brand or size).\n3. Photo fixes (daylight, plain background, label or flaw close-up).\n4. Whether a price check is worth doing, and what sold listings I should search for (describe the search, do not invent prices).\n\nUK English. Only facts from the brief; [CHECK: ...] for gaps. No stuffing, no \"rare\" or \"vintage\" unless the brief supports it, no fake discounts. Do not promise it will sell.", "module": "Module 10: Batch workflow", "file": "10-batch-workflow.md"}];let mod="";const q=document.getElementById('q'),list=document.getElementById('list'),cnt=document.getElementById('cnt');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){const t=q.value.toLowerCase().trim();const f=P.filter(p=>(!mod||p.module===mod)&&(!t||(p.id+' '+p.name+' '+p.use+' '+p.prompt).toLowerCase().includes(t)));
cnt.textContent=f.length+' prompt'+(f.length==1?'':'s');
list.innerHTML=f.map((p,i)=>`<div class="card"><div class="mod">${esc(p.module)}</div><h3><span class="id">${p.id}</span>${esc(p.name)}</h3>${p.use?`<p class="use">${esc(p.use)}</p>`:''}<pre><code>${esc(p.prompt)}</code></pre><button class="copy" data-i="${P.indexOf(p)}">Copy prompt</button><button class="more">Show full prompt</button></div>`).join('');}
list.addEventListener('click',e=>{const m=e.target.closest('.more');if(m){const c=m.closest('.card');c.classList.toggle('open');m.textContent=c.classList.contains('open')?'Show less':'Show full prompt';return}const b=e.target.closest('.copy');if(!b)return;const txt=P[+b.dataset.i].prompt;
const ok=()=>{b.textContent='Copied';b.classList.add('done');setTimeout(()=>{b.textContent='Copy prompt';b.classList.remove('done')},1500)};
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt,ok))}else fallback(txt,ok)});
function fallback(txt,ok){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){alert('Press and hold the prompt text to copy it.')}a.remove()}
document.getElementById('mods').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mod=b.dataset.m;document.querySelectorAll('#mods button').forEach(x=>x.classList.toggle('on',x===b));render()});
q.addEventListener('input',render);render();
</script></body></html>
