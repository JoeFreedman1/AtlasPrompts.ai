<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Well Listed Prompt Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
:root{--ink:#1F2A44;--cream:#FAF6EF;--kraft:#C9A27E;--green:#1E7F55;--yellow:#F2C84B;--red:#C4453B;--card:#fff;--muted:#5b6478;--line:#e6dccd}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:Archivo,Inter,sans-serif;line-height:1.2;color:var(--ink)}
h1{font-weight:800;font-size:2rem}h2{font-weight:800;font-size:1.5rem;margin-top:2.2rem;padding-bottom:.3rem;border-bottom:3px solid var(--kraft)}
h3{font-weight:700;font-size:1.15rem;margin-top:1.8rem}
a{color:var(--green)}
code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:#f1eadf;padding:.1em .3em;border-radius:4px}
pre{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:8px;padding:14px;overflow-x:auto;white-space:pre-wrap;word-wrap:break-word}
pre code{background:none;padding:0;font-size:.85rem;line-height:1.5}
blockquote{margin:1rem 0;padding:.6rem 1rem;background:#fff8e1;border-left:5px solid var(--yellow);border-radius:6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:1rem 0;background:#fff;font-size:.9rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--ink);color:var(--cream)}
hr{border:none;border-top:2px dashed var(--kraft);margin:2rem 0}

header{position:sticky;top:0;background:var(--ink);color:var(--cream);padding:12px 16px;z-index:5}
header h1{color:var(--cream);font-size:1.15rem;margin:0 0 8px}
header .tick{color:var(--yellow)}
#q{width:100%;padding:10px 12px;border-radius:8px;border:none;font-size:16px}
#mods{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#efe6d8}
#mods button{flex:none;border:1px solid var(--kraft);background:#fff;border-radius:20px;padding:6px 12px;font:600 .8rem Inter;color:var(--ink)}
#mods button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:820px;margin:0 auto;padding:12px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:1.02rem}.id{display:inline-block;background:var(--yellow);border-radius:5px;padding:0 6px;margin-right:6px;font:700 .8rem 'JetBrains Mono'}
.use{color:var(--muted);font-size:.9rem;margin:0 0 8px}.mod{font-size:.75rem;color:var(--muted)}
.copy{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 14px;font:600 .9rem Inter;cursor:pointer}
.copy.done{background:var(--ink)}
.count{font-size:.85rem;color:var(--muted)}
</style></head>
<body><header><h1>Well Listed<span class="tick"> &#10003;</span> Prompt Library</h1>
<input id="q" type="search" placeholder="Search prompts, e.g. lowball, eBay title, bundle" aria-label="Search prompts"></header>
<nav id="mods"><button class="on" data-m="">All</button><button data-m="Module 01: The Listing Brief">Module 01: The Listing Brief</button><button data-m="Module 02: Titles">Module 02: Titles</button><button data-m="Module 03: Descriptions and condition">Module 03: Descriptions and condition</button><button data-m="Module 04: Keywords, tags and item specifics">Module 04: Keywords, tags and item specifics</button><button data-m="05 Photos">Photos</button><button data-m="06 Pricing">Pricing</button><button data-m="07 Buyer messages">Buyer messages</button><button data-m="08 Video and TikTok Shop">Video and TikTok Shop</button><button data-m="09 Rule checker">Rule checker</button><button data-m="10 Batch workflow">Batch workflow</button></nav>
<main><p class="count" id="cnt"></p><div id="list"></div>
<p class="use">Tip: fill in the [SQUARE BRACKETS] before you send a prompt. Never paste a buyer's name, address or order details into an AI tool. Not affiliated with or endorsed by any marketplace. Version 1.0.</p></main>
<script>
const P=[{"id": "B01", "name": "Messy notes to Listing Brief", "use": "you have jotted down a few scrappy notes about an item and want them turned into a tidy brief.", "prompt": "You are helping a UK second-hand seller organise facts about one item. Turn my notes below into a Listing Brief using exactly these headings:\n\nPlatform(s), What it is, Brand / maker, Model or style, Category, Size (as on label), Measurements (cm), Colour, Material, Condition, Flaws, What is included, What is not included, Age or era, Postage, Price, Anything else.\n\nRules:\n1. Use UK English spelling and vocabulary (colour, jumper, trousers, postage).\n2. Use ONLY facts that are in my notes. Do not add, assume or improve anything.\n3. If a heading has no information, write [CHECK: what I need to find out]. Be specific, e.g. [CHECK: measure pit to pit in cm].\n4. Keep my flaw descriptions exactly as serious as I wrote them. Do not soften or remove any flaw.\n5. Convert inches to cm only if I gave inches, and show both (e.g. 21 in / 53 cm).\n6. No sales language. This is a fact sheet, not an advert.\n7. At the end, list the 3 most important [CHECK] items a buyer in this category would ask about.\n\nMy notes:\n[PASTE YOUR NOTES HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B02", "name": "Voice note transcript to Listing Brief", "use": "you talked about the item into your phone's voice recorder (quicker than typing) and have the transcript.", "prompt": "Below is a transcript of me talking about an item I am selling in the UK. It will be rambling, with \"um\", repeats and corrections. Turn it into a Listing Brief.\n\nHeadings: Platform(s), What it is, Brand / maker, Model or style, Size, Measurements (cm), Colour, Material, Condition, Flaws, What is included, What is not included, Tested (how), Postage, Price, Anything else.\n\nRules:\n1. UK English.\n2. Where I corrected myself (\"no wait, it's a 14\"), use the correction only.\n3. Use ONLY facts I actually said. Do not fill gaps with typical details for this type of item.\n4. If something is missing or unclear, write [CHECK: ...] and say what was unclear.\n5. Voice transcription often mishears brand names and numbers. If a brand, model number or measurement looks odd, keep it but add [CHECK: transcript said \"X\", confirm spelling].\n6. Keep every flaw I mentioned, at the same level of seriousness.\n7. No sales language.\n\nTranscript:\n[PASTE TRANSCRIPT HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B03", "name": "Photo description to Listing Brief", "use": "you want to describe what you can see in your photos (or on the item) and turn it into a brief. This prompt does not need the AI to see images, so it works in any free tool.", "prompt": "I am going to describe my item photo by photo, as if I am showing it to you. Build a UK Listing Brief from my descriptions only.\n\nHeadings: What it is, Brand / maker, Model or style, Size, Measurements (cm), Colour, Material, Condition, Flaws (with location), Labels and markings (copy exact wording), What is included, Postage, Price.\n\nRules:\n1. UK English.\n2. Use only what I describe. Do not guess brand, age, material or value from the type of item.\n3. For each flaw, record where it is and how big, if I said so. If I did not give a size, add [CHECK: size of flaw].\n4. After the brief, give me a list of any extra photos a buyer would expect to see that I have not described (for example care label, base stamp, flaw close-up).\n5. No sales language.\n\nMy photo descriptions:\nPhoto 1: [DESCRIBE]\nPhoto 2: [DESCRIBE]\nPhoto 3: [DESCRIBE]\nPrice: [PRICE]\nPostage: [POSTAGE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B04", "name": "Gap finder: what a buyer will ask", "use": "you have a brief and want to catch the questions buyers will message you about, before they ask.", "prompt": "Here is a Listing Brief for an item I am selling on [PLATFORM] in the UK. Act as a careful, fussy buyer in this category.\n\n1. List up to 8 questions a serious buyer would ask before buying, most important first.\n2. For each, say whether my brief already answers it (Yes / No / Partly).\n3. For every No or Partly, tell me exactly what to check or measure, in plain words, and how to do it quickly.\n4. Do not write the listing. Do not invent answers.\n5. UK English, short lines, suitable for reading on a phone.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B05", "name": "Build my own category brief", "use": "you sell a lot of one thing (bikes, prams, golf clubs, perfume, board games) and want a brief template tailored to it.", "prompt": "I sell second-hand [CATEGORY] in the UK on [PLATFORM(S)]. Create a reusable Listing Brief template for this category.\n\nInclude:\n1. The general fields: platform, what it is, brand, model, size or dimensions, colour, material, condition, flaws, what is included, postage, price, lowest I will accept (private).\n2. Up to 10 extra fields that buyers of this category specifically care about, with a short hint in brackets on how to find each fact (e.g. \"frame size (printed on the seat tube)\").\n3. A short \"safety and legal\" note listing anything I should check before selling this category in the UK, phrased as questions for me to check with the platform's help pages. Do not state rules as fact.\n\nRules: UK English, plain words, no sales language, formatted as a plain text block I can copy into my notes app.", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B06", "name": "Label or box text to Listing Brief", "use": "you have a new or boxed item (or a clear product label) and want to pull the facts off it accurately.", "prompt": "Below is text I have copied from the box, label or manual of an item I am selling in the UK. Extract a Listing Brief from it.\n\nHeadings: What it is, Brand, Model / product number, Specification (list), Colour, Material, Dimensions, What is in the box, Safety or age warnings (copied exactly), Condition, Flaws, Postage, Price.\n\nRules:\n1. UK English.\n2. Copy technical specifications exactly as written. Do not round, convert or \"tidy\" numbers.\n3. Do not include marketing claims from the box (e.g. \"best ever\", \"clinically proven\") as facts. Leave them out and list them separately under \"Box claims I have not included\" so I can decide.\n4. Condition, flaws, postage and price are not on the box: write [CHECK: ...] for them unless I add them below.\n5. Copy any safety warnings or age guidance word for word.\n\nBox or label text:\n[PASTE TEXT]\n\nMy extra details (condition, flaws, whether opened, postage, price):\n[ADD DETAILS]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "B07", "name": "Brief tidy-up and consistency check", "use": "your brief is filled in and you want a final sanity check before you run the title and description prompts.", "prompt": "Check my Listing Brief for a UK [PLATFORM] listing. Do not rewrite it into a listing.\n\nReport back, in this order:\n1. Contradictions (e.g. condition \"Excellent\" but flaws listed that sound like \"Good\").\n2. Vague wording a buyer could dispute (e.g. \"small mark\" with no location or size). Suggest a clearer version using only my facts.\n3. Missing facts buyers in this category expect, as [CHECK: ...] lines.\n4. Anything that could be a misleading or risky claim (e.g. \"rare\", \"genuine\", \"fully working\", \"vintage\" without an era, health claims). Explain why in one line each.\n5. US spellings or sizes to change to UK ones.\n\nUK English. Short bullet points. Do not invent facts to fix problems. Ask me instead.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 01: The Listing Brief", "file": "01-listing-brief.md"}, {"id": "T01", "name": "eBay UK title (80 characters)", "use": "you are listing on eBay UK and want a title that uses the space well without padding.", "prompt": "Write 3 eBay UK listing titles for the item in my Listing Brief below.\n\nHow to build them:\n- Put the words a UK buyer would search first: brand, then item type, then the most important details (model, size, colour, material).\n- Use this order unless the brief suggests a better one for this category: [FORMULA, OR WRITE \"YOUR CHOICE\"]\n- Aim for 70 to 80 characters. Never go over 80 characters including spaces.\n- After each title, show the exact character count.\n\nRules:\n1. UK English and UK sizes (e.g. \"UK 8\" for shoes, \"trousers\" not \"pants\").\n2. Use ONLY facts in my Listing Brief. If a key search word is missing (e.g. model number), write [CHECK: model number] in the title and tell me.\n3. No hype words (stunning, amazing, must have, wow, L@@K), no exclamation marks, no emoji, no capital letters for whole words.\n4. No misleading claims: do not use rare, vintage, genuine, new, limited edition, or a date unless the brief supports it.\n5. Do not mention any brand other than the item's actual brand.\n6. Do not repeat words.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T02", "name": "Vinted title", "use": "you are listing clothes, shoes, accessories or homeware on Vinted.", "prompt": "Write 3 Vinted titles for the item in my Listing Brief below.\n\nHow to build them:\n- Short and clear: brand, item type, colour, size, plus one style word buyers use if it is true (e.g. oversized, cropped, high waisted, wide leg).\n- Aim for about 40 to 60 characters so it is readable in the app. Keep under the limit shown on the Vinted listing form (check it when you list).\n- Show the character count after each.\n\nRules:\n1. UK English and UK sizes.\n2. Use ONLY facts in my Listing Brief. Write [CHECK: ...] if something important is missing.\n3. No hype words, no emoji, no exclamation marks, no \"bundle deal\" or pricing words in the title.\n4. No misleading claims (rare, vintage, genuine, new) unless the brief supports them.\n5. No other brand names (no \"Zara style\", \"not Nike\").\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T03", "name": "Depop opening line (acts as the title)", "use": "you are listing on Depop, where the first words of the description do the job of a title.", "prompt": "Write 3 options for the opening line of a Depop listing for the item in my Listing Brief below. This line works as the title, so it must say what the item is straight away.\n\nHow to build it:\n- Start with brand and item type, then colour, size and one or two style words buyers really search for (e.g. y2k, 90s, cottagecore, grunge) ONLY if they honestly fit the item and my brief.\n- Keep each option to one short line, under about 60 characters.\n- Plain text, no hashtags in this line (hashtags go at the end of the description, see Module 04).\n\nRules:\n1. UK English and UK sizes.\n2. Use ONLY facts from my brief. Write [CHECK: ...] for missing key facts.\n3. An era word (90s, y2k, 70s) must be backed up by the brief. If the brief does not support it, do not use it and tell me.\n4. No hype words, no emoji spam, no exclamation marks.\n5. No other brand names.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T04", "name": "Etsy title (140 characters)", "use": "you are listing a handmade, vintage or craft supply item on Etsy.", "prompt": "Write 3 Etsy titles for the item in my Listing Brief below.\n\nHow to build them:\n- Start with a clear, readable phrase that says exactly what the item is, as a person would say it. Then add the most important details: main material, key feature, size, colour, and personalisation if offered.\n- Keep under 140 characters including spaces, and ideally under 15 words.\n- Do not stuff: each phrase should add a new detail, not repeat the same idea in different words.\n- Show the character count and word count after each.\n\nRules:\n1. UK English (personalised, colour, jewellery).\n2. Use ONLY facts in my Listing Brief. Write [CHECK: ...] for anything missing.\n3. No hype words, no \"best\", no \"perfect gift\" unless the brief states who it is designed for.\n4. \"Vintage\" only if the brief says the item is at least 20 years old and I can support that. Check Etsy's current vintage rules.\n5. No health or wellbeing claims (e.g. calming, healing, anxiety relief).\n6. No other brand names or trademarked characters.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T05", "name": "Amazon UK title and Item Highlights", "use": "you are a brand or seller creating an Amazon UK product listing.", "prompt": "Write an Amazon UK product title and an Item Highlights line for the product in my Listing Brief below.\n\nTitle:\n- Order: Brand, product type, key feature, size or quantity, colour (unless my category style guide says otherwise).\n- 75 characters or fewer including spaces (the limit for all categories except media from 27 July 2026; I will check the current rule and my category style guide).\n- Capitalise the first letter of each word except short words (and, or, for, the, with, in, of).\n- Numbers as digits (2, not two). Units spelled clearly (cm, ml, kg).\n- Show the character count.\n\nItem Highlights (if my category has this field):\n- Up to 125 characters. Extra useful details (material, use, size range) that did not fit in the title. No repetition of the title.\n- Show the character count.\n\nRules:\n1. UK English.\n2. Use ONLY facts in my brief. Write [CHECK: ...] for anything missing.\n3. No special characters ! $ ? _ { } ^ ¬ ¦ (unless part of the brand name) and no emoji.\n4. Do not use the same word more than twice (short words like \"and\", \"with\", \"for\" excepted).\n5. No promotional or subjective words (best, top quality, hot item, free delivery, sale, 100% guaranteed).\n6. No health, medical or environmental claims unless my brief gives the evidence and I confirm it is allowed.\n7. No other brands.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T06", "name": "TikTok Shop UK product title", "use": "you are listing a product in TikTok Shop UK.", "prompt": "Write 3 TikTok Shop UK product titles for the product in my Listing Brief below.\n\nHow to build them:\n- Brand, product type, material, the one or two features that matter most, then size, colour or quantity.\n- Clear enough to understand at a glance on a phone. At least 15 characters. Aim for 60 to 100 characters, and stay within the current TikTok Shop limit (I will check it in Seller Center).\n- Show the character count.\n\nRules:\n1. UK English.\n2. Use ONLY facts in my brief. Write [CHECK: ...] for anything missing.\n3. No hype or trend words (viral, best seller, must have), no emoji, no symbols or special characters, no exclamation marks, no capital letters for whole words.\n4. Do not mention TikTok or any other platform, my shop name or any web address.\n5. No claims that the product cures, treats, prevents or relieves anything, and no weight loss claims.\n6. No price, discount or urgency words (sale, 20% off, only 2 left, today only).\n7. No other brands or trademarked names.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T07", "name": "Title tester: which version is clearest?", "use": "you have 2 to 5 title ideas and want an honest, buyer's-eye comparison.", "prompt": "I am choosing a title for a [PLATFORM] UK listing. Here are my options and my Listing Brief.\n\nFor each title:\n1. Count the characters including spaces. Say if it is over [LIMIT] characters.\n2. Say what a UK buyer would most likely type to find this item (give 3 short example searches). Tick which searches each title matches.\n3. Flag anything not supported by the brief, any hype, any repeated words, any US spellings or sizes.\n4. Say what a buyer sees in the first 40 characters (roughly what shows on a phone before it cuts off). Is it clear what the item is?\n\nThen recommend one and explain why in two lines. Do not invent new facts. If you suggest an improved version, use only facts from the brief.\n\nUK English.\n\nTitles:\n[PASTE TITLE 1]\n[PASTE TITLE 2]\n[PASTE TITLE 3]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "T08", "name": "Title fixer: too long, too vague or too spammy", "use": "you already have a title (maybe from an old listing or a generic AI tool) and it needs fixing.", "prompt": "Fix this [PLATFORM] UK listing title. The limit is [LIMIT] characters (I will double-check the current limit in the platform's help pages).\n\nMy current title:\n[PASTE TITLE]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nDo this:\n1. List what is wrong with it: over the limit, hype words, repeated words, US spellings or sizes, unsupported claims, other brand names, wasted words.\n2. Write 2 fixed versions, each within the limit, with character counts.\n3. Only use facts from the brief. If the old title claims something the brief does not support, remove it and tell me what you removed and why.\n\nUK English. No hype, no emoji, no exclamation marks.", "module": "Module 02: Titles", "file": "02-titles.md"}, {"id": "D01", "name": "eBay UK description", "use": "you have a title and want a clear, complete eBay UK description.", "prompt": "Write an eBay UK item description for the item in my Listing Brief below.\n\nStructure:\n1. One opening line: what it is (brand, item, key detail).\n2. Size and measurements (in cm, say \"measured flat\" for clothing).\n3. Condition: the grade, then every flaw as a separate line with location, size and the photo number if I gave one.\n4. Details: material, features, what is included, what is not included.\n5. Postage: only what is in my brief.\n\nRules:\n1. UK English (colour, jumper, trousers, postage, parcel).\n2. Use ONLY facts from my Listing Brief. For anything important that is missing, write [CHECK: ...]. Never invent measurements, materials, dates or test results.\n3. Include every flaw from the brief. Do not soften, shorten or leave any out.\n4. No hype words (stunning, amazing, gorgeous, perfect, must have), no exclamation marks, no emoji.\n5. No misleading claims: do not say rare, vintage, genuine, fully working, new, or smoke-free unless the brief says so.\n6. Do not reveal my lowest acceptable price.\n7. Do not write anything about returns, refunds or buyers' rights. I will set those in eBay's own settings.\n8. Short lines, easy to read on a phone. Under 200 words.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D02", "name": "Vinted description", "use": "you are listing on Vinted and want a short, friendly, accurate description.", "prompt": "Write a Vinted description for the item in my Listing Brief below.\n\nStyle: short, friendly and plain, like a considerate person selling from their own wardrobe. First person plural is fine (\"we\") or neutral wording. 50 to 120 words.\n\nInclude, in this order:\n1. What it is in one line.\n2. Size on the label and measurements in cm (measured flat).\n3. Condition, then every flaw with location and size.\n4. Material and any useful details (fit, pockets, lining).\n5. One line inviting questions, e.g. \"Happy to answer questions or send more photos.\"\n\nRules:\n1. UK English.\n2. Use ONLY facts from my Listing Brief. Write [CHECK: ...] for anything missing.\n3. Every flaw from the brief must be included, at the same level of seriousness.\n4. No hype words, no exclamation marks, no emoji strings.\n5. Do not mention payment, postage outside Vinted, or contact details. Everything stays in the app.\n6. No \"no returns\" or \"no refunds\" lines.\n7. No other brand names (no \"Zara style\", \"similar to\").\n8. Do not reveal my lowest price.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D03", "name": "Depop description", "use": "you are listing on Depop and want a description that works as both title and details.", "prompt": "Write a Depop description for the item in my Listing Brief below.\n\nStructure:\n1. First line: brand, item type, colour, size and one honest style word. This line acts as the title.\n2. Two or three short lines on fit and style, only from my brief.\n3. Measurements in cm (measured flat).\n4. Condition with every flaw, location and size.\n5. A final line with up to 5 hashtags (Depop's current limit, which I will check in the app), using only relevant words that honestly describe the item.\n\nKeep it within the Depop description limit (commonly quoted as 1,000 characters; I will check the current limit in the app). Aim for under 800 characters and show the character count.\n\nRules:\n1. UK English.\n2. Use ONLY facts from my Listing Brief. Write [CHECK: ...] for anything missing.\n3. Era words (y2k, 90s, vintage) only if the brief supports them. Otherwise use \"style\" (e.g. \"90s style\") or leave them out.\n4. No hype, no emoji spam, no exclamation marks.\n5. No other brand names in the text or hashtags.\n6. No off-app payment or contact details.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D04", "name": "Etsy description (handmade or vintage)", "use": "you sell handmade or vintage items on Etsy and need a description that is warm but factual.", "prompt": "Write an Etsy listing description for the item in my Listing Brief below.\n\nStructure:\n1. Opening two lines: what it is and what makes it distinctive, from facts in the brief only. These lines show first, so make them clear.\n2. Details: materials (all of them), size and dimensions, colours, weight if relevant.\n3. Personalisation: what can be personalised, how to request it, any character limits. (Skip if not offered.)\n4. Making and dispatch: made to order or ready to post, and making time, from my brief only.\n5. Care instructions.\n6. Safety notes from my brief (e.g. \"not a toy\", candle safety).\n7. For vintage items: era (only as supported by the brief) and full condition with every flaw.\n\nRules:\n1. UK English (personalised, colour, jewellery, organise).\n2. Use ONLY facts in my brief. Write [CHECK: ...] for missing facts.\n3. Warm, plain tone. No hype words, no \"perfect gift for everyone\", no exclamation marks.\n4. No health, wellbeing or medical claims (e.g. calming, healing, detox, relieves anxiety, hypoallergenic) unless the brief includes supplier evidence and I confirm it.\n5. Materials must be exactly as the brief says. Do not upgrade \"silver-plated\" to \"silver\" or \"cotton blend\" to \"cotton\".\n6. Short paragraphs, readable on a phone.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D05", "name": "Amazon UK bullet points and description", "use": "you are a brand or seller writing Amazon UK product bullets (\"About this item\") and the product description.", "prompt": "Write Amazon UK bullet points and a product description for the product in my Listing Brief below.\n\nBullet points:\n- Each bullet starts with a short capitalised label followed by a colon (e.g. \"MATERIAL:\"), then one or two plain sentences.\n- Cover, in order of what buyers need: what it is and size, material, key feature, how to use or care for it, what is included.\n- Up to 5 bullets. Keep each under about 250 characters (guidance is roughly 10 to 255), and I will check my category style guide in Seller Central for the current rule.\n\nProduct description:\n- 100 to 200 words, plain paragraphs, no HTML.\n\nRules:\n1. UK English.\n2. Use ONLY facts from my brief. Write [CHECK: ...] for missing facts.\n3. No promotional or subjective claims (best, number one, top rated, highest quality), no prices, no delivery or offer information, no references to reviews, and no refund or guarantee phrases (money back, 100% guaranteed).\n4. No health, medical, environmental or \"eco\" claims unless my brief includes the evidence and I confirm it is allowed in my category.\n5. No special characters or emoji. No other brands.\n6. Do not repeat the title word for word.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D06", "name": "Condition grader", "use": "you are not sure which condition grade to choose, or which platform option matches.", "prompt": "Help me choose an honest condition grade for an item I am selling on [PLATFORM] in the UK.\n\nUse this scale: New with tags, New without tags, Excellent, Very good, Good, Fair.\nRules for grading:\n- If the item sits between two grades, choose the lower one.\n- Base the grade only on the flaws and details I list. Do not assume flaws I have not mentioned, and do not ignore any I have.\n\nThen:\n1. Give the grade and a one-line reason.\n2. Tell me which option in [PLATFORM]'s condition list is the closest match, but remind me to read that platform's own definition before choosing, as the options change.\n3. Write a one or two line condition summary for the description, listing each flaw with location and size.\n4. List anything I should check or photograph to be sure of the grade.\n\nUK English. No softening words (barely, hardly, tiny) unless I used them, and never without a size.\n\nItem: [WHAT IT IS]\nFlaws and wear: [LIST EVERY FLAW]\nTags attached? [YES / NO]\nUsed or worn? [HOW OFTEN, IF KNOWN]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D07", "name": "Flaw disclosure rewriter", "use": "you have written your flaws in a hurry and want them clear, specific and protective.", "prompt": "Rewrite the flaws below so they are clear and specific for a UK [PLATFORM] listing. The goal is that a buyer knows exactly what to expect and there are no surprises.\n\nFor each flaw, write one line with:\n- What it is (mark, pull, chip, scratch, fading, stain, fault)\n- Where it is (use left and right as the wearer or user sees it, and say so)\n- How big (in mm or cm)\n- How visible (e.g. \"visible from arm's length\", \"only visible close up\", only if I said so)\n- Which photo shows it, if I gave photo numbers\n\nRules:\n1. UK English.\n2. Do not make any flaw sound smaller or less serious than I described it. Do not remove any flaw.\n3. If size, location or visibility is missing, write [CHECK: ...].\n4. Add one honest line of what I checked and found no problems with, only if I list it below.\n5. No hype or reassurance words (perfect otherwise, amazing condition apart from). Just facts.\n\nMy flaws, as I wrote them:\n[PASTE FLAWS]\n\nThings I checked and found fine:\n[E.G. NO HOLES, ZIP WORKS, NO ODOUR]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D08", "name": "Measurements block", "use": "you want a neat, consistent measurements section for clothing, bags or shoes, plus a reminder of what to measure.", "prompt": "I am listing [ITEM TYPE] on [PLATFORM] in the UK.\n\nStep 1: Tell me which measurements buyers most want for this type of item, and in one short line each, how to measure them flat with a tape measure. Keep it to the essentials (4 to 6 measurements).\n\nStep 2: When I reply with my numbers, format them as a neat measurements block:\n- Heading: \"Measurements (laid flat, in cm)\"\n- One measurement per line\n- If I give inches, convert to cm and round to the nearest 0.5 cm, showing inches in brackets\n- If I give a doubled figure, say \"doubled\"\n- Add the label size at the top\n\nRules: UK English. Never estimate or invent a measurement. If one is missing, write [CHECK: measure X]. Do not add fit advice unless I give it (e.g. \"fits like a UK 10 on me\").", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D09", "name": "Bundle and job lot description", "use": "you are selling several items together (a bundle of kids' clothes, a box of books, a job lot of mugs).", "prompt": "Write a [PLATFORM] UK listing description for a bundle or job lot. Use my list below.\n\nStructure:\n1. Opening line: what the bundle is, how many items, and the key shared details (e.g. \"Bundle of 8 girls' tops, age 7 to 8 years\").\n2. A numbered list: one line per item with brand, item, size and condition, plus any flaw with location and size.\n3. A line saying what the bundle does NOT include (only if I mention it).\n4. Total weight or parcel size if I give it.\n\nRules:\n1. UK English.\n2. Use ONLY facts in my list. If a line is missing brand, size or condition, write [CHECK: ...] on that line.\n3. Flaws must be listed against the right item. Do not merge them into one vague line like \"some wear\".\n4. Do not describe the bundle as better than its worst item. If items vary, say so: \"Condition varies from Very good to Fair, see each item\".\n5. No hype, no exclamation marks, no \"bargain\" or price talk.\n6. Do not reveal my lowest price.\n\nMy list:\n[ITEM 1: BRAND, ITEM, SIZE, CONDITION, FLAWS]\n[ITEM 2: ...]\n[ITEM 3: ...]\nParcel weight or size: [IF KNOWN]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "D10", "name": "De-hype and UK-ify an AI description", "use": "you have a description from a generic AI tool or an old listing that sounds American, gushing or over-promising.", "prompt": "Rewrite this listing description for a UK [PLATFORM] buyer.\n\nFix:\n1. US spelling and vocabulary to UK (color to colour, pants to trousers, sweater to jumper, sneakers to trainers, purse to handbag, zipper to zip, closet to wardrobe).\n2. US sizes to UK where the brief gives the UK size. If only a US size is given, keep it and label it \"US size\".\n3. Remove hype and filler (stunning, gorgeous, must have, elevate your wardrobe, timeless piece, you will love it, exclamation marks, emoji).\n4. Remove or flag any claim not supported by my Listing Brief (write [CHECK: ...] after it, or remove it and tell me).\n5. Keep every flaw, with location and size.\n6. Keep it short and readable on a phone.\n\nAfter the rewrite, list what you removed or flagged and why, in short bullet points.\n\nOld description:\n[PASTE OLD DESCRIPTION]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 03: Descriptions and condition", "file": "03-descriptions-condition.md"}, {"id": "K01", "name": "eBay UK item specifics", "use": "you are listing on eBay UK and want every relevant item specific filled in accurately.", "prompt": "I am listing on eBay UK in the category [CATEGORY, E.G. WOMEN'S JUMPERS AND CARDIGANS]. Below are the item specifics fields eBay shows me for this category, and my Listing Brief.\n\nFill in each item specific using ONLY facts from my Listing Brief.\n\nRules:\n1. UK English and UK sizes.\n2. If the brief does not give the answer, write [CHECK: ...] and tell me how to find it (e.g. \"on the care label\", \"on the base\", \"in the settings menu\").\n3. Never guess brand, material, model, year or country of manufacture.\n4. Use the simple, standard wording buyers filter by (e.g. \"Grey\", not \"dove grey heather\"; \"Crew Neck\", not \"rounded neckline\").\n5. Keep each value short (under 65 characters, and I will check the form's limit).\n6. Do not put other brand names, hype words or keywords that do not describe the item into any field.\n7. Output as a two-column table: Item specific | Value.\n8. After the table, list up to 3 extra item specifics that buyers in this category often filter by, if eBay allows custom ones, using only facts from the brief.\n\neBay's item specific fields for my category:\n[PASTE THE FIELD NAMES FROM THE EBAY LISTING FORM]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K02", "name": "Etsy 13 tags", "use": "you are listing on Etsy and want 13 honest, varied tags within the 20-character limit.", "prompt": "Write 13 Etsy tags for the item in my Listing Brief below.\n\nHow to build them:\n- Each tag up to 20 characters including spaces. Show the character count for each.\n- Use multi-word phrases a UK buyer would actually type (e.g. \"silver stacking ring\" not just \"ring\").\n- Cover different angles: what it is, material, style, colour, occasion or recipient (only if the brief supports it), and personalisation if offered.\n- Do not repeat the exact title phrase in every tag. Vary the wording.\n- Include UK spellings (personalised, jewellery, colour). If a US spelling is commonly searched too, you may use it in one tag at most.\n\nRules:\n1. Use ONLY facts from my brief. Do not tag a material, style or use the item does not have.\n2. No other brand names, trademarked characters or celebrity names.\n3. No health or wellbeing words (healing, calming, anxiety).\n4. \"Vintage\" only if the brief supports it and meets Etsy's current vintage rules.\n5. No hype words (best, perfect, amazing).\n6. Output as a numbered list. Then show the 13 tags as one comma-separated line so I can paste them quickly.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K03", "name": "Depop hashtags", "use": "you are listing on Depop and want 5 relevant hashtags.", "prompt": "Suggest 5 Depop hashtags for the item in my Listing Brief below, plus 3 spares.\n\nRules:\n1. Depop allows up to 5 hashtags and asks for relevant words, brands and tags only. I will check the current limit in the app.\n2. Each hashtag must honestly describe the item: its type, brand (only its own brand), colour, material, fit or a style the item really has.\n3. Style or era tags (y2k, 90s, grunge, cottagecore, gorpcore) only if the item honestly fits them and my brief supports it. If you are not sure, leave them out and tell me.\n4. No other brand names, no trend tags that do not fit, no hashtags about price or \"fast selling\".\n5. Lower case, no spaces, UK spelling where it matters (e.g. #jumper).\n6. For each, give a one-line reason so I can decide.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K04", "name": "Vinted fields and search words", "use": "you are listing on Vinted and want every field filled in and the right search words in your title and description.", "prompt": "I am listing on Vinted in the UK. Vinted uses structured fields rather than free tags, so help me get the fields and wording right.\n\nStep 1. From my Listing Brief, give me the value for each Vinted field: Category (suggest the most specific path, e.g. Women > Clothing > Jumpers and sweaters > Jumpers), Brand, Size, Condition, Colour (main colour, and a second colour only if clearly true), Material.\nStep 2. List 5 to 8 search words or short phrases UK buyers would type for this item. Tell me which already appear in my title or description, and suggest where the missing ones could go naturally (once each).\nStep 3. Flag any word in my current title or description that is not supported by the brief, or that is another brand.\n\nRules:\n1. UK English and UK sizes.\n2. Use ONLY facts in my brief. Write [CHECK: ...] if something is missing.\n3. Do not suggest repeating words or adding lists of keywords to the description.\n4. Category paths change in the app. Tell me to pick the closest match I can see.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy current title and description (if written):\n[PASTE HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K05", "name": "Amazon UK backend search terms", "use": "you are a brand or seller filling in the backend \"search terms\" field on Amazon UK.", "prompt": "Write backend search terms for my Amazon UK product listing.\n\nRules:\n1. The field is commonly quoted as 250 bytes (not characters). For plain letters and spaces, 1 character is 1 byte, but accented letters and some symbols use more. Stay under 240 bytes to be safe and show the count. I will check the current limit in Seller Central.\n2. Separate words with spaces. No commas, no punctuation.\n3. Do not repeat any word already in my title, Item Highlights or bullets (listed below).\n4. Do not repeat words within the field. No plurals of words already used unless they are genuinely different searches.\n5. Include: synonyms, UK and US variants (e.g. jumper sweater), common misspellings buyers really make, and uses or occasions only if my brief supports them.\n6. Do NOT include: other brand names, ASINs, temporary words (new, sale, on offer), subjective words (best, amazing), or offensive terms.\n7. Use ONLY facts from my Listing Brief. No uses or features the product does not have.\n8. Lower case.\n\nMy title, Item Highlights and bullets:\n[PASTE THEM HERE]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K06", "name": "Buyer search phrase finder (from what you see)", "use": "you want to know how buyers actually search for your item, using the suggestions the platform's own search bar shows you.", "prompt": "I am selling [ITEM] on [PLATFORM] in the UK. I typed the start of a search into the platform's search bar and copied the suggestions it showed me. I also noted the titles of a few sold listings for similar items that I looked up myself.\n\nUsing ONLY the suggestions and titles below:\n1. Group the search phrases into: what it is, brand and model, size, colour and material, style, condition.\n2. Tell me which phrases honestly describe MY item (using my Listing Brief). Ignore any that do not fit.\n3. Suggest where each fitting phrase should go: title, item specifics or fields, tags or hashtags, or description.\n4. Point out any US spellings or words, and give the UK version.\n\nRules: UK English. Do not invent search data or say how popular a phrase is. Do not suggest words that are not true of my item. No other brands.\n\nSearch bar suggestions I saw:\n[PASTE SUGGESTIONS]\n\nSold listing titles I looked up:\n[PASTE TITLES]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K07", "name": "Keyword stuffing checker", "use": "you want a quick check that your title, tags or hashtags are honest and will not look like spam.", "prompt": "Check my [PLATFORM] UK listing for keyword stuffing and misleading search words.\n\nCheck:\n1. Any brand, character or product name that is not the item's own (including \"style\", \"like\", \"similar to\", \"not X\", \"dupe\").\n2. Words repeated more than needed in the title, or repeated across title and backend fields where the platform advises against it.\n3. Style, era or trend words not supported by my Listing Brief (vintage, y2k, 90s, designer, luxury).\n4. Condition or authenticity words not supported by the brief (new, unworn, genuine, authentic, rare, limited).\n5. Tags, hashtags or item specifics that do not describe the item.\n6. Hidden lists of words in the description.\n\nFor each problem: quote it, say why it is a risk in one line, and give an honest replacement using only facts from my brief (or say \"remove\").\nThen give a short verdict: \"Ready to post\" or \"Fix first\".\n\nUK English. Do not invent facts.\n\nMy listing (title, description, tags or hashtags, item specifics):\n[PASTE LISTING]\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "K08", "name": "UK and US search word pairs for my category", "use": "you sell a category where UK and US words differ and want a reference list for your tags, specifics and backend fields.", "prompt": "I sell second-hand [CATEGORY] in the UK on [PLATFORM(S)]. Make me a reference table of search words for this category.\n\nColumns: UK word | US or other word buyers might also use | Notes (where UK and US meanings differ, and could confuse a buyer).\n\nRules:\n1. Up to 20 rows, most useful first.\n2. Flag any word that means something different in the UK (e.g. vest, pants, purse, jumper dress) so I do not mislead a UK buyer.\n3. Suggest where each word should go: title (UK word only), tags, hashtags or backend fields (either), or nowhere.\n4. UK English. Do not include brand names.\n5. Do not claim how popular any word is. I will check the platform's own search suggestions.", "module": "Module 04: Keywords, tags and item specifics", "file": "04-keywords-tags-specifics.md"}, {"id": "PH01", "name": "Shot list for my item", "use": "you have written the Listing Brief and want a numbered shot list before you pick up your phone.", "prompt": "You are an experienced UK marketplace seller helping me plan listing photos.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nI am listing on: [PLATFORM]\nMost photos this platform allows (check the app): [NUMBER OR \"NOT SURE\"]\n\nWrite a numbered shot list for this exact item. For each shot give:\n1. What to photograph.\n2. The angle or distance.\n3. Why a buyer needs it (one short line).\n\nRules:\n- Use UK English.\n- Base the list only on facts in my brief. If a shot depends on something the brief does not say (for example whether there is a box or a size label), write [CHECK: ...] instead of assuming.\n- Put the main (cover) photo first, then the back, then labels, then every flaw listed in my brief, then details.\n- Give every flaw in my brief its own shot.\n- If I have more shots than the platform allows, mark which ones to combine or drop, and never drop a flaw shot.\n- No filters, no editing that changes colour or hides wear. Say so at the end.\n- Keep it short enough to read on a phone.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH02", "name": "Flaw photo checklist", "use": "your item has any wear, marks or faults and you want to show them properly (this protects you as much as the buyer).", "prompt": "Help me photograph the flaws on my item honestly and clearly.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nAnything else I have noticed since writing the brief:\n[EXTRA FLAWS, OR \"NONE\"]\n\nDo the following:\n1. List every flaw mentioned above as a checklist.\n2. For each flaw, tell me how to photograph it so it is clearly visible: distance, angle, lighting, and what to put next to it for scale (a coin, a ruler or a tape measure).\n3. Suggest a short caption for each flaw photo that matches the wording in my brief exactly.\n4. List common places flaws hide on this type of item that my brief does not mention, as questions for me to check (for example \"Have you checked the armpits for bobbling?\"). Label these [CHECK: ...]. Do not assume they are flawed.\n\nRules: UK English. Do not describe any flaw as smaller or less noticeable than my brief says. No reassuring words like \"barely noticeable\" unless my brief uses them. Plain, factual wording only.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH03", "name": "Phone lighting and background plan", "use": "you are photographing at home with just a phone and want better, more accurate colour without buying kit.", "prompt": "I photograph listings on my phone at home. Help me set up for this item.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy set-up:\n- Phone: [PHONE MODEL, OR \"NOT SURE\"]\n- Time I usually shoot: [E.G. WEEKDAY EVENINGS]\n- Space I have: [E.G. SMALL BEDROOM, WINDOW FACING NORTH]\n- Things I own that could be a background: [E.G. WHITE DUVET COVER, GREY WALL, WOODEN FLOOR]\n\nGive me:\n1. The best place and time to shoot, using the window light I have.\n2. Which of my backgrounds suits this item's colour and why.\n3. Five phone camera tips in plain English (focus, exposure, lens cleaning, avoiding zoom, avoiding flash glare).\n4. How to check the colour in the photo matches the real item before I post.\n5. What to do if I must shoot after dark, using only ordinary household lamps.\n\nRules: UK English, no jargon, short numbered steps. Do not recommend buying anything. Do not suggest any editing that changes the item's colour or hides wear.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH04", "name": "Photo set audit", "use": "you have taken your photos and want a second pair of eyes to spot gaps before you post.", "prompt": "Check my photo set against my Listing Brief before I post.\n\nHere is my Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nHere is a plain description of each photo I have taken, in order:\n1. [DESCRIBE PHOTO 1, E.G. \"FRONT OF JUMPER, FLAT ON BED\"]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE LINES AS NEEDED]\n\n(If your AI tool accepts images, you can upload the photos instead. Only upload photos of the item, never anything showing addresses, faces or personal documents.)\n\nTell me:\n1. Missing shots: anything a buyer would expect for this item that is not in my set.\n2. Mismatches: anything in the photos that contradicts the brief (for example a flaw shown but not in the brief, or an item in shot that is not included in the sale).\n3. Order: the best order for these photos, with the cover photo first.\n4. Privacy: anything in the background I should crop out (post, family photos, house number, reflections).\n\nRules: UK English. Only comment on what I have described or shown. If you cannot tell something, write [CHECK: ...]. Be direct and brief.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH05", "name": "Photo captions", "use": "your platform lets you add a caption or short text to each photo, or you want matching lines to use in the description.", "prompt": "Write one short caption for each of my listing photos.\n\nListing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy photos, in order:\n1. [DESCRIBE PHOTO 1]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE AS NEEDED]\n\nRules:\n- UK English, 12 words or fewer per caption.\n- Plain and factual. Say what the photo shows, not how great it is.\n- Flaw captions must use the same wording as my brief and must not play the flaw down.\n- Only use facts from the brief. If a caption needs a fact I have not given, write [CHECK: ...].\n- No hype words (stunning, gorgeous, must-have, rare), no emojis, no exclamation marks.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH06", "name": "Alt text for listing photos", "use": "your platform or your own shop has an alt text box (a short written description of an image for people using screen readers). Etsy and most web shops have one.", "prompt": "Write alt text for each of my product photos.\n\nListing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nPhotos, in order:\n1. [DESCRIBE PHOTO 1]\n2. [DESCRIBE PHOTO 2]\n3. [ADD MORE AS NEEDED]\n\nCharacter limit for alt text on my platform (check the help pages): [NUMBER OR \"NOT SURE\"]\n\nRules:\n- UK English. Describe what is in the image plainly, as if to someone who cannot see it: item, colour, angle, and any flaw shown.\n- Do not start with \"Image of\" or \"Photo of\".\n- Do not stuff keywords or repeat the title. Alt text is for people, not search.\n- Only use facts from my brief. If you need a detail I have not given (such as the exact colour), write [CHECK: ...].\n- If I have not given a limit, keep each one under 125 characters.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH07", "name": "Is this edit OK?", "use": "you are tempted to use a background remover, a \"magic eraser\", an AI model or any AI photo tool, and want to check it will not misrepresent the item.", "prompt": "I want to edit a listing photo. Tell me whether the edit risks misrepresenting my item.\n\nListing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nPlatform: [PLATFORM]\nThe original photo shows: [DESCRIBE THE ORIGINAL]\nThe edit I want to make: [E.G. REPLACE MESSY BEDROOM BACKGROUND WITH PLAIN WHITE / REMOVE A HAIR / PUT JUMPER ON AI MODEL]\nThe tool I would use: [TOOL NAME OR TYPE]\n\nAnswer in three parts:\n1. **Risk:** low, medium or high that the edit changes how the item looks (colour, condition, size, shape, what is included). Explain in one or two lines.\n2. **Safer option:** a way to get a similar result without editing the item itself (for example reshooting on a plain sheet).\n3. **Platform rule:** remind me that I must check the current photo and AI rules in the [PLATFORM] help pages. Do not state specific rules as fact unless I have pasted them in below.\n\nPlatform rule text I have copied from the help pages (optional):\n[PASTE RULE TEXT, OR \"NONE\"]\n\nRules: UK English. Be honest, not reassuring. If the edit would hide or reduce any flaw in my brief, say plainly that I should not do it.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "PH08", "name": "Choose my cover photo", "use": "you have several decent shots and want to pick the first one buyers see in search.", "prompt": "Help me choose the cover (first) photo for my listing.\n\nListing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nPlatform: [PLATFORM]\nMy candidate photos:\nA. [DESCRIBE PHOTO A]\nB. [DESCRIBE PHOTO B]\nC. [DESCRIBE PHOTO C]\n\nPick one and explain why in two lines. Judge on: the whole item is visible, colour looks true, background is plain, the item fills most of the frame, and it would still be clear as a small square thumbnail on a phone.\nThen say what one change would make the winning photo better when I reshoot.\n\nRules: UK English. Do not suggest adding text, borders, stickers or badges to the photo (many platforms do not allow them). Do not suggest hiding flaws in the cover photo by angle alone if the flaw is major; say so if it is.", "module": "05 Photos", "file": "05-photos.md"}, {"id": "R01", "name": "Tidy my sold comps", "use": "you have copied a messy pile of sold listings into your notes and want them in a clean table before pricing.", "prompt": "I have copied some sold listings I found myself. Put them into a clean table so I can compare them with my item.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nSold listings I copied (paste exactly as copied, messy is fine):\n[PASTE YOUR SOLD LISTINGS HERE]\n\nMake a table with these columns: Title (shortened), Sold price £, Postage £ (or \"free\" or [CHECK]), Total paid £, Condition, Size or model, Date sold (or [CHECK]), Match to my item (Good, Partial, Poor) and a one-line reason.\n\nRules:\n- UK English, prices in pounds.\n- Only use numbers that appear in what I pasted. Never invent a price, date or condition. If a detail is missing, write [CHECK].\n- If something looks like an asking price rather than a sold price, flag it with [CHECK: sold or asking?].\n- Put Good matches first.\n- Below the table, list any comps I should drop and why, in one line each.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R02", "name": "Price from my sold comps", "use": "you have your tidied comps and want a list price, a realistic range and a floor.", "prompt": "Suggest a price for my item using only the sold listings I have found.\n\nMy Listing Brief (includes my price floor, the lowest I will accept):\n[PASTE YOUR LISTING BRIEF HERE]\n\nPlatform: [PLATFORM]\nDo buyers pay postage on top, or is it included in my price? [ON TOP / INCLUDED]\nMy sold comps (ideally the table from R1):\n[PASTE COMPS HERE]\n\nGive me:\n1. The sold price range from the Good matches only (lowest to highest), and the middle (median) value.\n2. How my item compares: better, same or worse condition than the Good matches, based only on my brief.\n3. A suggested list price, a likely accepted price, and my floor from the brief. If my floor is above what the comps support, say so plainly.\n4. Two or three lines of reasoning I could save in my notes.\n\nRules:\n- UK English, pounds, show your working in simple sums.\n- Use only the numbers I pasted. Do not use outside knowledge of prices.\n- If I have fewer than three Good matches, say the evidence is thin and tell me what to search for.\n- Do not promise the item will sell, or at what price. Say \"based on these comps\" not \"this will sell for\".\n- Write ranges as \"£10 to £14\", never with a dash.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R03", "name": "Adjust for condition and extras", "use": "your item is not quite like the comps (better or worse condition, missing box, extra accessories) and you want a fair adjustment.", "prompt": "My item is different from the comps I found. Help me adjust the price fairly.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy closest sold comps:\n[PASTE COMPS HERE]\n\nHow my item differs from these comps (in my own words):\n[E.G. \"NO ORIGINAL BOX, BUT COMES WITH A SPARE CHARGER\" / \"MINE HAS A SMALL CHIP, THEIRS DID NOT\"]\n\nDo the following:\n1. List each difference and whether it pushes the price up, down or makes no clear difference, with a one-line reason a buyer would recognise.\n2. If the comps themselves show the effect (for example boxed sold higher than unboxed), use those numbers and show the sum. If they do not, say \"the comps do not show this\" and give a cautious suggestion, clearly labelled as a judgement, not evidence.\n3. Give an adjusted list price and floor.\n\nRules: UK English, pounds. Only use numbers I have pasted. Never guess a \"collector's value\". Do not tell me to describe the item as better than my brief says.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R04", "name": "Bundle pricing", "use": "you want to sell several items together, or a buyer asks for a bundle price.", "prompt": "Help me price a bundle.\n\nItems in the bundle (one short Listing Brief or line each, with my individual list price and floor):\n[PASTE ITEMS HERE]\n\nPlatform: [PLATFORM]\nPostage for the bundle as one parcel: £[AMOUNT OR \"NOT SURE\"]\nPostage if sent separately (total): £[AMOUNT OR \"NOT SURE\"]\nDoes the platform have its own bundle discount tool I have switched on? [YES, WITH % / NO / NOT SURE]\n\nGive me:\n1. The total of individual list prices and the total of floors.\n2. The postage saving from sending one parcel (if I gave both figures).\n3. A suggested bundle price and the lowest bundle price I should accept, keeping every item at or above its floor in total.\n4. A one-line reason I can send the buyer, based on the postage saving and my time, without pressure.\n\nRules: UK English, pounds, show the sums. Use only my numbers. If postage is missing, write [CHECK: postage] and do the sum without it. Do not use pressure wording such as \"today only\" or \"last chance\".", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R05", "name": "Offer strategy", "use": "you want to decide in advance what offers to accept, counter or decline, so you are not deciding at 11pm with a lowballer waiting.", "prompt": "Help me set an offer plan for this listing.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]\n\nPlatform: [PLATFORM]\nMy list price: £[AMOUNT]\nMy reasoning from comps (optional, e.g. from R2): [PASTE OR \"NONE\"]\nDoes the platform let me set automatic accept or decline levels? [YES / NO / NOT SURE]\n\nGive me a simple plan:\n1. Accept straight away at or above: £...\n2. Counter-offer if between: £... and £..., with the counter price I should send.\n3. Politely decline below: £...\n4. If auto accept or decline is available, the levels I could set (and a reminder to check the settings in the app).\n5. One short, polite line for each case that I could send.\n\nRules: UK English, pounds. Never go below my floor. Do not suggest fake scarcity or pressure (\"someone else is interested\", \"ends tonight\") unless I tell you it is true. Keep replies friendly and brief.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R06", "name": "Planned price drop schedule", "use": "an item has not sold and you want a calm plan for reducing it, rather than panic-dropping or leaving it forever.", "prompt": "Make a price drop plan for an item that has not sold yet.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]\n\nPlatform: [PLATFORM]\nCurrent price: £[AMOUNT]\nListed for: [NUMBER] days\nViews, likes or watchers so far (if the app shows them): [NUMBERS OR \"NOT SURE\"]\nMy sold comps (optional): [PASTE OR \"NONE\"]\n\nGive me:\n1. First, a quick check of things other than price that could be holding it back (cover photo, title, missing measurements, postage cost). Base this only on my brief, and write [CHECK: ...] for anything you cannot see.\n2. A drop plan with dates in weeks from today, the price at each step, and the point where I stop at my floor.\n3. What to do if it still has not sold at the floor (bundle it, relist fresh with new photos, sell elsewhere, donate).\n\nRules: UK English, pounds. Never go below my floor. Keep drops simple (round numbers). Do not tell me any step will make it sell. If my platform lets me send offers to people who liked or watched the item, mention it as an option to check in the app, not as a guarantee.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R07", "name": "Fee and postage maths", "use": "you want to know what you actually keep after fees, postage and packaging, before you set a price or accept an offer.", "prompt": "Work out what I keep from a sale. I will give you the current fees myself.\n\nPlatform: [PLATFORM]\nSale price: £[AMOUNT]\nPostage the buyer pays: £[AMOUNT OR \"NONE, INCLUDED IN PRICE\"]\nMy actual postage cost: £[AMOUNT]\nPackaging cost: £[AMOUNT OR \"0\"]\nFees I copied from the platform's current fee page today (paste exactly, e.g. percentage, fixed fee per order, whether it applies to postage too, payment processing):\n[PASTE CURRENT FEE DETAILS HERE]\nWhat I paid for the item (optional): £[AMOUNT OR \"NOT SURE\"]\n\nShow me, as a simple table:\n1. Money in (sale plus postage paid by buyer).\n2. Each fee, with the sum shown.\n3. Postage and packaging out.\n4. What I keep.\n5. If I gave a cost price: what is left after that cost.\nThen tell me the lowest sale price at which I would still keep £[TARGET AMOUNT] after costs, using the same fees.\n\nRules:\n- UK English, pounds, round to the nearest penny.\n- Use ONLY the fee details I pasted. Do not use fees from your own knowledge, they may be out of date. If my fee details are unclear, write [CHECK: ...] and explain what is unclear.\n- This is a sum, not advice. Do not call the result \"profit\" unless I gave a cost price, and do not promise any outcome.\n- Remind me that fees and rules change, so I should check the platform's current fee page each time.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "R08", "name": "Is it worth listing on its own?", "use": "you have a low-value item and are not sure whether to list it alone, bundle it, or let it go.", "prompt": "Help me decide whether this item is worth listing on its own.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nSold comps I found (optional): [PASTE OR \"NONE\"]\nWhat I keep from a sale at that price (from R7, optional): £[AMOUNT OR \"NOT SURE\"]\nRoughly how long listing, messaging and packing takes me per item: [MINUTES]\nOther similar items I have that could go with it: [LIST OR \"NONE\"]\n\nCompare four options in a short table: list alone, bundle with similar items, list as part of a job lot, or donate or recycle. For each, give: effort, likely money kept (only from my numbers, otherwise [CHECK]), and one line on when it makes sense.\nThen give a one-line recommendation.\n\nRules: UK English, pounds. Only use my numbers. Do not promise anything will sell. Be practical, not preachy.", "module": "06 Pricing", "file": "06-pricing.md"}, {"id": "M01", "name": "Reply to any buyer message", "use": "you have a message that does not fit the other prompts, or you just want a quick, polite reply.", "prompt": "Help me reply to a buyer on [PLATFORM]. I have removed their name and personal details.\n\nMy Listing Brief (for facts about the item):\n[PASTE YOUR LISTING BRIEF HERE]\n\nI sell as a: [PRIVATE SELLER / BUSINESS]\nBuyer's message:\n[PASTE MESSAGE, WITH NAMES AND DETAILS REPLACED BY [BUYER]]\n\nWhat I want to say in my own words (rough is fine):\n[E.G. \"YES I CAN POST TOMORROW BUT NOT BEFORE\"]\n\nWrite one reply.\n\nRules:\n- UK English, friendly and brief (under 60 words unless the situation needs more). No emojis unless I ask.\n- Only state facts from my brief or my notes. If the buyer asks something I have not answered, write [CHECK: ...] instead of guessing.\n- Keep everything on the platform. Never suggest paying, messaging or meeting off the platform.\n- Do not promise delivery dates I have not given.\n- Do not refuse any legal right or platform protection. If the message is about returns, refunds or a problem with the item, say so and suggest I use the specific prompt for it.\n- Do not mention feedback or reviews.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M02", "name": "\"Is this still available?\"", "use": "you get the classic question, and want a reply that answers it and gently moves things along.", "prompt": "A buyer on [PLATFORM] has asked if my item is still available. Write a short, friendly reply.\n\nMy Listing Brief:\n[PASTE YOUR LISTING BRIEF HERE]\n\nIs it still available? [YES / NO, SOLD / ON HOLD FOR SOMEONE ELSE]\nWhen I can post: [E.G. \"NEXT WORKING DAY\"]\nAnything useful to add: [E.G. \"HAPPY TO SEND MORE PHOTOS\" / \"NONE\"]\n\nRules:\n- UK English, under 40 words, one clear sentence answering the question first.\n- If available, add one useful fact (posting time or one key detail from the brief) and an easy next step using the platform's tools (buy now, make an offer).\n- No pressure or fake urgency (\"lots of interest\", \"going fast\") unless I have told you it is true.\n- Only use facts from my brief.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M03", "name": "Lowball offer", "use": "someone offers far below your price and you want to stay polite without giving the item away.", "prompt": "A buyer on [PLATFORM] has made an offer much lower than my price. Help me reply.\n\nMy Listing Brief (includes my floor):\n[PASTE YOUR LISTING BRIEF HERE]\n\nMy list price: £[AMOUNT]\nTheir offer: £[AMOUNT]\nWhat I want to do: [COUNTER AT £... / DECLINE POLITELY / ASK WHAT THEY HAD IN MIND]\nAny true reason that supports my price (optional): [E.G. \"SOLD COMPS AROUND £25\", \"HEAVY TO POST\"]\n\nWrite two versions: one friendly counter-offer and one polite decline. Each under 50 words.\n\nRules:\n- UK English, warm and calm. Never sarcastic, never lecture the buyer about value.\n- Never go below my floor.\n- Only give reasons I have supplied. Do not invent other buyers or deadlines.\n- Suggest using the platform's offer button for any counter, so the deal stays on the platform.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M04", "name": "Bundle request", "use": "a buyer wants several of your items and asks for a deal.", "prompt": "A buyer on [PLATFORM] wants to buy several of my items together. Help me reply with a bundle price.\n\nThe items (title, list price and floor for each):\n[PASTE ITEMS HERE]\n\nPostage as one parcel: £[AMOUNT OR \"NOT SURE\"]\nBundle price I am happy with (or ask the AI to use prompt R4 first): £[AMOUNT]\nHow the platform handles bundles: [E.G. \"BUYER ADDS ITEMS TO A BUNDLE AND I SEND AN OFFER\" / \"NOT SURE\"]\n\nWrite a reply under 60 words that:\n1. Confirms which items (by short name).\n2. Gives the bundle price and says whether postage is included.\n3. Tells them how to buy using the platform's bundle or offer tool.\n\nRules: UK English, friendly. Keep it on the platform. Never go below the total of my floors. If the platform process is \"NOT SURE\", write [CHECK: how bundles work on this app] rather than guessing.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M05", "name": "Postage questions", "use": "a buyer asks about postage cost, speed, tracking, collection or sending abroad.", "prompt": "A buyer on [PLATFORM] has asked about postage. Help me reply.\n\nMy Listing Brief (includes postage details):\n[PASTE YOUR LISTING BRIEF HERE]\n\nBuyer's question (personal details removed):\n[PASTE QUESTION]\n\nMy postage facts:\n- Service I use: [E.G. \"TRACKED 48\"]\n- Cost to buyer: £[AMOUNT OR \"SET BY THE APP\"]\n- How soon I post after payment: [E.G. \"NEXT WORKING DAY\"]\n- Do I post outside the UK? [YES / NO]\n- Do I allow collection? [YES, AND HOW THE PLATFORM HANDLES IT / NO]\n\nWrite a reply under 60 words.\n\nRules:\n- UK English. Only give postage facts I have listed. If the answer is not in my facts, write [CHECK: ...].\n- Never promise a delivery date. Say when I will post it and the service's usual time, \"usually\" not \"guaranteed\".\n- If the buyer asks for collection, only offer it if I said yes, and keep payment on the platform.\n- Do not suggest undervaluing, mislabelling or marking anything as a gift on customs forms.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M06", "name": "Delay: late dispatch or parcel stuck in transit", "use": "you are going to post late, or the tracking has stalled and the buyer is asking where their parcel is.", "prompt": "Help me update a buyer on [PLATFORM] about a delay.\n\nType of delay: [I WILL POST LATE / PARCEL STUCK IN TRANSIT / TRACKING SAYS DELIVERED BUT BUYER HAS NOT GOT IT]\nFacts:\n- Date of sale: [DATE]\n- Date posted (if posted): [DATE OR \"NOT YET\"]\n- Service and whether tracked: [E.G. \"TRACKED 48, YES\"]\n- What tracking shows now: [PASTE STATUS, NO TRACKING NUMBER NEEDED]\n- What I can do next: [E.G. \"POST TOMORROW MORNING\" / \"OPEN A CARRIER ENQUIRY\"]\nBuyer's message (personal details removed): [PASTE OR \"NONE, I AM MESSAGING FIRST\"]\n\nWrite a reply under 80 words that:\n1. Says sorry once, plainly, without over-explaining.\n2. Gives the facts (what has happened, what I am doing next and when).\n3. Tells the buyer they are still covered by the platform's buyer protection, without quoting specific time limits.\n\nRules: UK English. Do not blame the buyer. Do not promise a delivery date. Do not suggest cancelling outside the platform or refunding by another method. If a fact is missing, write [CHECK: ...].", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M07", "name": "Return request", "use": "a buyer asks to return an item, for any reason.", "prompt": "A buyer on [PLATFORM] has asked to return an item. Help me work out my position and reply.\n\nI sell as a: [PRIVATE SELLER / TRADER (BUSINESS)]\nMy listing's return policy: [E.G. \"NO RETURNS\" / \"30 DAY RETURNS, BUYER PAYS POSTAGE\"]\nPlatform return or buyer protection rules I have checked today (paste from help pages, or \"NOT CHECKED\"):\n[PASTE RULE TEXT]\nMy Listing Brief (what I described):\n[PASTE YOUR LISTING BRIEF HERE]\nDate delivered: [DATE]\nBuyer's reason (personal details removed):\n[PASTE MESSAGE]\n\nDo two things.\n\nPart 1, my position (short bullet points):\n- Is the reason change of mind, or a claim that the item is faulty, damaged or not as described?\n- If I am a trader: remind me that UK buyers generally have a 14-day right to cancel most online purchases, plus the short-term right to reject faulty goods, and that \"no returns\" cannot remove these. Flag any exceptions only as [CHECK: ...].\n- If I am a private seller: explain that change-of-mind returns are up to me and my listing policy, but claims of \"not as described\", faulty or damaged may be covered by platform buyer protection whatever my policy says.\n- Base anything about platform rules only on the text I pasted. If I pasted nothing, tell me to check the platform's help pages before replying.\n\nPart 2, a reply to the buyer (under 80 words): polite, clear on next steps, and using the platform's own return or refund process.\n\nRules: UK English. This is not legal advice, say so in one line at the end of Part 1. Never tell the buyer they have no rights. Never suggest refunding off the platform. Do not argue about the buyer's reason in the reply.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M08", "name": "\"Item not as described\"", "use": "a buyer says the item is different from the listing, faulty, or has a flaw you did not mention.", "prompt": "A buyer on [PLATFORM] says my item is not as described. Help me respond fairly.\n\nI sell as a: [PRIVATE SELLER / TRADER]\nMy original listing text (title and description):\n[PASTE LISTING TEXT]\nWhat my photos showed: [DESCRIBE, E.G. \"FLAW ON LEFT CUFF SHOWN IN PHOTO 4\"]\nBuyer's complaint (personal details removed), and any photos they describe:\n[PASTE MESSAGE]\nPlatform rules I have checked today (optional): [PASTE OR \"NOT CHECKED\"]\n\nDo three things:\n1. Compare the complaint with my listing, point by point, and say honestly whether the listing covered it, did not cover it, or it is unclear. Do not take my side automatically.\n2. Suggest fair options: ask for photos, return for a full refund through the platform, a partial refund through the platform if the buyer wants to keep it, or let the platform decide. Say which fits best.\n3. Write a calm reply under 90 words.\n\nRules: UK English. If the listing did not mention the problem, say so plainly. Never accuse the buyer of lying, even if I suspect it; if I suspect a swapped or damaged return, tell me to keep records and use the platform's process. Never refund or pay outside the platform. Never ask the buyer to change or remove feedback as part of any deal. Not legal advice.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M09", "name": "Damaged in the post", "use": "the buyer says the item arrived broken, crushed or wet.", "prompt": "A buyer on [PLATFORM] says the item arrived damaged. Help me handle it.\n\nItem and how I packed it: [E.G. \"GLASS VASE, BUBBLE WRAP, DOUBLE-WALLED BOX\"]\nPostage service: [E.G. \"PLATFORM LABEL\" / \"MY OWN TRACKED SERVICE, COMPENSATION UP TO £...\"]\nBuyer's message and what they say their photos show (personal details removed):\n[PASTE MESSAGE]\nPlatform rules I have checked today (optional): [PASTE OR \"NOT CHECKED\"]\n\nGive me:\n1. A short checklist of what to ask the buyer for (photos of the item, the packaging and the label) and what to keep myself (proof of postage, photos of packing if I took any).\n2. Who is likely to handle the claim: the platform (for example if I used a platform label) or me with the carrier. Base this on what I told you, and if unsure write [CHECK: ...] and tell me to check the platform's help pages.\n3. A calm reply to the buyer under 80 words that asks for photos and explains the next step through the platform.\n\nRules: UK English. Do not blame the buyer or the carrier in the reply. Do not refuse a refund in the reply. Do not suggest settling off the platform. Not legal advice.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M10", "name": "Asking for feedback, without pressure", "use": "a sale has gone smoothly and you want to send a thank-you that mentions feedback, fairly.", "prompt": "Write a short thank-you message to a buyer on [PLATFORM] after delivery.\n\nItem: [SHORT NAME]\nAnything nice and true to mention: [E.G. \"HOPE IT FITS WELL\" / \"NONE\"]\nShould the message mention feedback? [YES, ONE NEUTRAL LINE / NO]\n\nRules:\n- UK English, under 40 words, warm and simple.\n- If feedback is mentioned, one neutral line only, such as inviting them to leave feedback if they have a moment. Never ask for \"positive\" or \"5 star\" feedback.\n- Never offer or hint at any discount, refund, freebie or reward in exchange for feedback or a review. That is against platform rules (eBay's feedback policy, for example) and UK law on fake and incentivised reviews.\n- Never ask the buyer to contact me first \"before leaving feedback\" in a way that suggests they should not leave honest feedback.\n- No emojis unless I ask.", "module": "07 Buyer messages", "file": "07-buyer-messages.md"}, {"id": "M11", "name": "Difficult or abusive buyer", "use": "a buyer is rude, threatening, demanding things not in the listing, or threatening bad feedback to get a discount.", "prompt": "A buyer on [PLATFORM] is being difficult. Help me respond calmly and protect myself.\n\nWhat has happened (personal details removed):\n[DESCRIBE OR PASTE MESSAGES]\nWhat the listing actually said about the relevant point: [PASTE OR \"NOT RELEVANT\"]\nHas a sale happened? [YES / NO]\n\nGive me:\n1. A one-line read of the situation: is this a genuine problem said rudely, a demand for something not in the listing, a threat linked to feedback, or abuse?\n2. What to do: reply, reply once then stop, or do not reply. Include using the platform's report and block tools where relevant, and keeping all messages on the platform as a record.\n3. If a reply is sensible, one calm reply under 60 words.\n\nRules:\n- UK English. Calm, neutral, never sarcastic. Never insult or threaten the buyer back.\n- If the buyer has a genuine complaint about the item, the reply must still offer the platform's proper route (return or ref
